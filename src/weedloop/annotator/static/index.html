function schedulePointer() {
  if (!pointerFrame) pointerFrame = requestAnimationFrame(drawPointer);
}

function setLine(node, show, st, x1, y1, x2, y2) {
  if (!show) { node.setAttribute("visibility", "hidden"); return; }
  const d = dashOf(st);
  node.setAttribute("visibility", "visible");
  node.setAttribute("x1", x1); node.setAttribute("y1", y1);
  node.setAttribute("x2", x2); node.setAttribute("y2", y2);
  node.style.stroke = st.color;
  node.style.strokeWidth = st.width + "px";
  node.style.strokeOpacity = st.opacity;
  node.style.strokeDasharray = d.dash;
  node.style.strokeLinecap = d.cap;
}

function drawPointer() {
  pointerFrame = 0;
  const on = view === "editor" && !!natW && !!pointerAt && !el.keysDialog.open;
  const ch = styleOf("crosshair"), cu = styleOf("cursor");
  const W = el.viewport.clientWidth, H = el.viewport.clientHeight;
  // A 1 px line on a whole pixel is smeared over two; centre odd widths on .5.
  const snap = (v, w) => (Math.round(w) % 2 ? Math.floor(v) + 0.5 : Math.round(v));
  const x = on ? snap(pointerAt.x, ch.width) : 0, y = on ? snap(pointerAt.y, ch.width) : 0;
  setLine(el.chV, on && ch.show, ch, x, 0, x, H);
  setLine(el.chH, on && ch.show, ch, 0, y, W, y);
  const showCursor = on && cu.show && !overBox;
  const cx = on ? snap(pointerAt.x, cu.width) : 0, cy = on ? snap(pointerAt.y, cu.width) : 0;
  const r = cu.size / 2;
  setLine(el.curV, showCursor, cu, cx, cy - r, cx, cy + r);
  setLine(el.curH, showCursor, cu, cx - r, cy, cx + r, cy);
}

window.addEventListener("mousemove", (e) => {
  if (view !== "editor") return;
  const r = el.viewport.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const inside = x >= 0 && y >= 0 && x < r.width && y < r.height;
  // Over the minimap there is nothing to aim at: no lines through it.
  const overMap = !!(e.target.closest && e.target.closest(".minimap")) || !!mmDrag || mmNav;
  pointerAt = !overMap && (inside || drag || draft || panning) ? { x, y } : null;
  schedulePointer();
}, { passive: true });

el.viewport.addEventListener("mouseleave", () => {
  if (drag || draft || panning) return;
  pointerAt = null;
  schedulePointer();
});
window.addEventListener("resize", schedulePointer);

// ---------------------------------------------------------------- legend

/** A small picture of a style: a box, or for the cursor and the lines, the
    lines themselves, over a patch of grass-coloured background. */
function stylePreview(kind, st, w = 58, hgt = 36) {
  // A legend swatch only has to show colour and pattern; a 6 px border in an
  // 18 x 12 swatch would leave no box at all.
  const small = hgt < 20;
  if (small) st = { ...st, width: Math.min(st.width, 2) };
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("width", w);
  svg.setAttribute("height", hgt);
  svg.setAttribute("class", "preview");
  svg.setAttribute("aria-hidden", "true");
  const bg = document.createElementNS(SVG_NS, "rect");
  bg.setAttribute("width", w); bg.setAttribute("height", hgt);
  bg.setAttribute("fill", "#3a5a2e");
  svg.appendChild(bg);
  const line = (x1, y1, x2, y2) => {
    const l = document.createElementNS(SVG_NS, "line");
    setLine(l, true, st, x1, y1, x2, y2);
    svg.appendChild(l);
  };
  if (kind === "box") {
    const m = small ? 2 : Math.min(Math.max(5, st.width + 3), hgt / 2 - 4);
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("x", m); r.setAttribute("y", m);
    r.setAttribute("width", w - 2 * m); r.setAttribute("height", hgt - 2 * m);
    svg.appendChild(paint(r, st));
  } else if (kind === "cursor") {
    const r = Math.min(st.size, hgt - 4) / 2;
    line(w / 2, hgt / 2 - r, w / 2, hgt / 2 + r);
    line(w / 2 - r, hgt / 2, w / 2 + r, hgt / 2);
  } else {
    line(w * 0.62, 0, w * 0.62, hgt);
    line(0, hgt * 0.4, w, hgt * 0.4);
  }
  return svg;
}

function renderLegend() {
  const frag = document.createDocumentFragment();
  const item = (st, text) => {
    const span = h("span", "legend-item");
    span.append(stylePreview("box", st, 18, 12), " " + text);
    frag.appendChild(span);
  };
  for (const name of classList()) item(classStyle(name), name);
  item(styleOf("prediction"), "sam3");
  item(styleOf("approved"), "sam3 approved");
  item(styleOf("exemplar"), "exemplar");
  el.helpLegend.replaceChildren(frag);
}

// ---------------------------------------------------------------- project settings

async function loadProjectSettings() {
  projectPrefs = { version: 2, classes: [] };
  seenClasses = new Set();
  classCounts = null;
  activeClass = "";
  try {
    const r = await fetch(q("api/project-settings"));
    if (!r.ok) throw new Error(`api/project-settings returned ${r.status}`);
    const data = await r.json();
    projectPrefs = { version: 2, classes: data.classes || [], stages: data.stages || null };
    projectPrefsPath = data.path || "";
    for (const name of data.seen || []) seenClasses.add(name);
    if (data.warning) { console.warn(data.warning); keyStatus(data.warning, true); }
    if (data.note) { console.info(data.note); status(data.note); }
  } catch (err) {
    console.warn("class list unavailable:", err.message);
  }
  ensureActiveClass();
  applyAppearance();
  renderClassChip();
  fillBulkStage();
}

let projectSaves = Promise.resolve();
function saveProjectSettings() {
  applyAppearance();
  renderKeys();
  const p = project;
  const body = JSON.stringify(projectPrefs);
  projectSaves = projectSaves.then(async () => {
    try {
      const r = await fetch(BASE + "api/project-settings?" + new URLSearchParams({ project: p }), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body,
      });
      if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
      projectPrefsPath = (await r.json()).path || projectPrefsPath;
      keyStatus(`Project settings saved to ${projectPrefsPath}`);
    } catch (err) {
      keyStatus(`Project settings not saved (${err.message}). They work in this tab until you reload.`, true);
    }
  });
}

/** Put a class on the list if it is not there yet, and set or clear its
    style - kept only while it differs from the palette default. */
function setClass(name, patch) {
  let e = classEntry(name);
  if (!e) { e = { name }; projectPrefs.classes.push(e); }
  if ("style" in patch) {
    if (patch.style && !sameStyle(patch.style, classDefault(name))) e.style = patch.style;
    else delete e.style;
  }
}

async function loadClassCounts() {
  if (!project || loadClassCounts.busy) return;
  loadClassCounts.busy = true;
  try {
    const r = await fetch(q("api/classes/counts"));
    if (r.ok) classCounts = (await r.json()).counts || {};
  } catch (err) {
    console.warn("class counts unavailable:", err.message);
  }
  loadClassCounts.busy = false;
  renderKeys();
}

/** Rename a class in every annotation file (the server keeps a backup of the
    folder first), or merge it into another one. The image on screen is saved
    before, so its boxes are in the files that get rewritten. */
async function renameClass(old, next, input) {
  const undo = () => { if (input) input.value = old; };
  if (next === old) return;
  if (!validClassName(next)) {
    keyStatus("A class name is one word - no spaces - of at most 64 characters.", true);
    undo();
    return;
  }
  const merge = classList().includes(next);
  const n = classCounts ? classCounts[old] || 0 : null;
  const boxesText = n === null ? "its boxes" : plural(n, "box", "boxes");
  const ask = merge
    ? `Merge \u201c${old}\u201d into \u201c${next}\u201d? ${n === null ? "All" : "All " + n} boxes of ${old} become ${next}, and ${old} leaves the list.`
    : `Rename \u201c${old}\u201d to \u201c${next}\u201d in ${boxesText}?`;
  if (!window.confirm(`${ask}\n\nThe annotation files are rewritten; a copy of the annotations folder is kept in backups/ first.`)) {
    undo();
    return;
  }
  if (!(await flush())) { undo(); return; }
  try {
    const r = await fetch(BASE + "api/classes/rename?" + new URLSearchParams({ project }), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ old, new: next, merge }),
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const data = await r.json();
    projectPrefs = { version: 2, classes: data.classes || [], stages: projectPrefs.stages };
    seenClasses.delete(old);
    if (data.boxes) seenClasses.add(next);
    for (const b of boxes) if (b.cls === old) b.cls = next;
    if (clipboard) for (const it of clipboard.items) if (it.cls === old) it.cls = next;
    if (activeClass === old) { activeClass = next; localStorage.setItem(K_ACTIVE_CLASS(project), next); }
    // Undo snapshots still hold the old name, and restoring one would write it
    // back into a file: histories go, as on a run switch.
    clearHistories();
    classCounts = null;
    keyStatus(`${merge ? "Merged" : "Renamed"}: ${plural(data.boxes, "box", "boxes")} in `
      + `${plural(data.files, "file", "files")}. Backup: ${data.backup || "none needed"}`);
  } catch (err) {
    keyStatus(`Not renamed (${err.message}).`, true);
    undo();
  }
  applyAppearance();
  renderClassChip();
  renderKeys();
}

function setPersonalStyle(key, st) {
  if (sameStyle(st, STYLE_DEFAULTS[key])) delete prefs.styles[key];
  else prefs.styles[key] = st;
}

// ---------------------------------------------------------------- appearance tab

const pct = (v) => `${Math.round(v * 100)} %`;
const px = (v) => `${Number(v).toFixed(1).replace(/\.0$/, "")} px`;

/** One style, with its controls. Changes apply live while a slider moves and
    are saved when it is let go.
      o.key       id for focus bookkeeping
      o.kind      "box" | "line" | "cursor"
      o.style     the style as it is now; o.defaults, what reset returns to
      o.head      node(s) for the title
      o.showLabel label of the on/off switch, for styles that have one
      o.apply(st) live; o.save(st) on commit; o.reset() */
function styleRow(o) {
  const st = { ...o.style };
  const changed = !sameStyle(st, o.defaults);
  const row = h("div", "stylerow" + (changed ? " changed" : ""));

  const head = h("div", "stylehead");
  const pv = h("span", "pvwrap");
  pv.appendChild(stylePreview(o.kind, st));
  head.append(pv, ...[].concat(o.head));
  if (changed) head.appendChild(h("span", "tag changed", "changed"));
  head.appendChild(h("span", "dialog-spacer"));
  if (changed) {
    const reset = h("button", "badge", "reset");
    reset.type = "button";
    reset.dataset.f = `${o.key}:reset`;
    reset.addEventListener("click", () => o.reset());
    head.appendChild(reset);
  }

  const redraw = () => pv.replaceChildren(stylePreview(o.kind, st));
  const live = () => { redraw(); o.apply({ ...st }); };
  const commit = () => o.save({ ...st });

  const ctl = h("div", "stylectl");
  const field = (label, input, out) => {
    const lab = h("label", "stylefield");
    lab.append(h("span", "", label), input);
    if (out) lab.appendChild(out);
    ctl.appendChild(lab);
  };
  const slider = (prop, label, min, max, step, fmt) => {
    const r = h("input");
    r.type = "range"; r.min = min; r.max = max; r.step = step;
    r.value = String(st[prop]);
    r.dataset.f = `${o.key}:${prop}`;
    const out = h("output", "styleval", fmt(st[prop]));
    r.addEventListener("input", () => {
      st[prop] = Math.round(Number(r.value) * 100) / 100;
      out.textContent = fmt(st[prop]);
      live();
    });
    r.addEventListener("change", commit);
    field(label, r, out);
  };

  if ("show" in st) {
    const c = h("input");
    c.type = "checkbox";
    c.checked = st.show;
    c.dataset.f = `${o.key}:show`;
    c.addEventListener("change", () => { st.show = c.checked; live(); commit(); });
    const lab = h("label", "stylefield toggle");
    lab.append(c, h("span", "", o.showLabel));
    ctl.appendChild(lab);
  }
  const color = h("input");
  color.type = "color";
  color.value = st.color;
  color.dataset.f = `${o.key}:color`;
  color.addEventListener("input", () => { st.color = color.value; live(); });
  color.addEventListener("change", commit);
  field("Colour", color);

  if (o.kind === "box") slider("fill", "Fill", 0, 1, 0.05, pct);
  slider("width", o.kind === "box" ? "Border" : "Thickness", 0.5, 8, 0.5, px);
  slider("opacity", o.kind === "box" ? "Border opacity" : "Opacity", 0.05, 1, 0.05, pct);
  if (o.kind === "cursor") slider("size", "Size", 6, 60, 1, px);

  const sel = h("select", "picker");
  for (const v of ["solid", "dashed", "dotted"]) {
    const opt = h("option", "", v);
    opt.value = v;
    sel.appendChild(opt);
  }
  sel.value = st.line;
  sel.dataset.f = `${o.key}:line`;
  sel.addEventListener("change", () => { st.line = sel.value; live(); commit(); });
  field("Line", sel);

  row.append(head, ctl);
  return row;
}

function renderAppearance() {
  const frag = document.createDocumentFragment();

  const classes = h("section", "keys-screen");
  classes.appendChild(h("h3", "", "Classes"));
  if (!project) {
    classes.appendChild(h("p", "keyhint", "Open a project to set its classes."));
  } else {
    if (classCounts === null) loadClassCounts();
    classes.appendChild(h("p", "keyhint",
      `The classes of ${project}, in order: 1 to 9 pick the first nine. A class's name is `
      + "what the annotation files say, so renaming one rewrites every box of it (a copy of "
      + "the annotations is kept in backups/ first). Names are one word. The style is for "
      + "boxes you drew; sam3 boxes keep their own below."));
    const list = classList();
    const defined = projectPrefs.classes.length;
    list.forEach((name, i) => classes.appendChild(classRow(name, i, i < defined, defined)));
    classes.appendChild(addClassRow());
  }
  frag.appendChild(classes);

  const personal = (key, kind, title, extra = {}) => styleRow({
    key, kind, style: styleOf(key), defaults: STYLE_DEFAULTS[key],
    head: h("span", "keylabel", title), ...extra,
    apply: (st) => { setPersonalStyle(key, st); applyAppearance(); },
    save: (st) => { setPersonalStyle(key, st); saveSettings(); },
    reset: () => { delete prefs.styles[key]; saveSettings(); },
  });

  const others = h("section", "keys-screen");
  others.append(h("h3", "", "Other boxes"),
    h("p", "keyhint", "Styles of their own, so where a box came from stays visible "
                      + "whatever the class colours are. These are yours, in every project."),
    personal("prediction", "box", "SAM3 predictions"),
    personal("approved", "box", "Approved sam3 boxes"),
    personal("exemplar", "box", "Exemplars"));
  frag.appendChild(others);

  const pointer = h("section", "keys-screen");
  pointer.append(h("h3", "", "Cursor and crosshair"),
    h("p", "keyhint", "Over a box or a corner the system cursor comes back, since its "
                      + "shape says whether a drag moves or resizes. The lines stay."),
    personal("cursor", "cursor", "Cursor", { showLabel: "Draw this cursor over the image" }),
    personal("crosshair", "line", "Crosshair lines", { showLabel: "Show lines through the cursor" }));
  frag.appendChild(pointer);
  frag.appendChild(minimapSection());
  frag.appendChild(stripSection());

  el.keysList.replaceChildren(frag);
}

function classRow(name, i, defined, definedCount) {
  const count = classCounts ? (classCounts[name] || 0) : null;
  const input = h("input", "field classname");
  input.type = "text";
  input.maxLength = 64;
  input.spellcheck = false;
  input.value = name;
  input.dataset.f = `class:${name}:name`;
  input.setAttribute("aria-label", `Name of class ${name}`);
  input.addEventListener("change", () => renameClass(name, input.value.trim(), input));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { e.preventDefault(); input.value = name; input.blur(); }
  });
  const head = [h("span", "classkey", i < 9 ? String(i + 1) : ""), input,
                h("span", "classid", count === null ? "counting\u2026" : plural(count, "box", "boxes"))];
  if (!defined) head.push(h("span", "tag", "in the files, not on the list"));
  const small = (text, label, f, fn) => {
    const b = h("button", "badge", text);
    b.type = "button";
    b.title = label;
    b.setAttribute("aria-label", `${label}: ${name}`);
    b.dataset.f = f;
    b.addEventListener("click", fn);
    head.push(b);
  };
  const move = (by) => {
    const a = projectPrefs.classes, k = a.findIndex((c) => c.name === name);
    [a[k], a[k + by]] = [a[k + by], a[k]];
    saveProjectSettings();
  };
  if (defined && i > 0) small("\u2191", "Move up", `class:${name}:up`, () => move(-1));
  if (defined && i < definedCount - 1) small("\u2193", "Move down", `class:${name}:down`, () => move(1));
  if (count === 0) {
    small("remove", "Remove from the list (no box uses it)", `class:${name}:remove`, () => {
      projectPrefs.classes = projectPrefs.classes.filter((c) => c.name !== name);
      seenClasses.delete(name);
      ensureActiveClass();
      renderClassChip();
      saveProjectSettings();
    });
  }
  return styleRow({
    key: `class:${name}`, kind: "box",
    style: classStyle(name), defaults: classDefault(name), head,
    apply: (st) => { setClass(name, { style: st }); applyAppearance(); },
    save: (st) => { setClass(name, { style: st }); saveProjectSettings(); },
    reset: () => { setClass(name, { style: undefined }); saveProjectSettings(); },
  });
}

function addClassRow() {
  const row = h("div", "keyrow addclass");
  const input = h("input", "field classname");
  input.type = "text";
  input.maxLength = 64;
  input.spellcheck = false;
  input.placeholder = "new class name";
  input.dataset.f = "class:add:name";
  input.setAttribute("aria-label", "Name of a new class");
  const add = h("button", "badge", "add class");
  add.type = "button";
  add.dataset.f = "class:add";
  const go = () => {
    const name = input.value.trim();
    if (!name) return;
    if (!validClassName(name)) { keyStatus("A class name is one word - no spaces - of at most 64 characters.", true); return; }
    if (classList().includes(name)) { keyStatus(`${name} is already a class.`, true); return; }
    projectPrefs.classes.push({ name });
    saveProjectSettings();
    renderClassChip();
    keyStatus(`Added ${name}: it is class ${projectPrefs.classes.length}.`);
    focusKey("class:add:name");
  };
  add.addEventListener("click", go);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  row.append(input, add);
  return row;
}

/** Style changes on this tab, for the footer: personal styles, plus this
    project's class styles (names are not "changes from the defaults"). */
function appearanceChangeCount() {
  return Object.keys(STYLE_DEFAULTS).filter((k) => prefs.styles[k]).length
    + projectPrefs.classes.filter((c) => c.style).length
    + minimapChangeCount()
    + stripChangeCount();
}

// ---------------------------------------------------------------- minimap
//
// The whole image in a small window over the view: a rectangle for the part
// on screen, a colour for how long each part has been looked at, and a dot
// for each of your boxes in its class colour. Drag it by its top-right
// corner; press or drag on it to move the view there.
//
// "Looked at" is counted on a coarse grid, per cell, while the cell's centre
// is on screen, the view is zoomed in at least min_zoom times the fit zoom,
// and the annotator is active by the same rule as the timer (tab visible,
// input within IDLE_MS). Counts are kept on the server, so a pass can span
// several visits.

const COVERAGE_CELLS = 40;           // cells along the image's longer side
const COVERAGE_TICK_MS = 250;

let coverage = null;                 // {project, image, gw, gh, ms} on screen
const coveragePending = new Map();   // project + "\0" + image -> unsent delta
let coverageInFlight = [];
let coverageFlushing = null;

let mmFrame = 0;
let mmBase = null;                   // the image, drawn once at minimap size
let mmDrag = null;                   // moving the minimap by its grip
let mmNav = false;                   // moving the view by pressing on the map

function coverageDims(w, h) {
  const long = Math.max(w, h);
  return { gw: Math.max(1, Math.round(COVERAGE_CELLS * w / long)),
           gh: Math.max(1, Math.round(COVERAGE_CELLS * h / long)) };
}
const coverageKey = (p, name) => p + "\u0000" + name;

/** Coverage for the image just loaded: what the server has, plus what this
    tab has counted but not yet sent (or sent without an answer yet). */
function startCoverage(name, stored) {
  const { gw, gh } = coverageDims(natW, natH);
  const ms = new Float64Array(gw * gh);
  const add = (src) => {
    if (src && src.gw === gw && src.gh === gh && src.ms.length === ms.length) {
      for (let i = 0; i < ms.length; i++) ms[i] += src.ms[i];
    }
  };
  add(stored);
  const key = coverageKey(project, name);
  add(coveragePending.get(key));
  for (const d of coverageInFlight) if (coverageKey(d.project, d.image) === key) add(d);
  coverage = { project, image: name, gw, gh, ms };
  scheduleMinimap();
}

function pendingDelta(cov) {
  const key = coverageKey(cov.project, cov.image);
  let d = coveragePending.get(key);
  if (!d || d.gw !== cov.gw || d.gh !== cov.gh) {
    d = { project: cov.project, image: cov.image, gw: cov.gw, gh: cov.gh,
          ms: new Float64Array(cov.gw * cov.gh) };
    coveragePending.set(key, d);
  }
  return d;
}

/** The part of the image on screen, in image pixels, or null. */
function visibleRect() {
  const s = scale();
  const W = el.viewport.clientWidth, H = el.viewport.clientHeight;
  const x1 = Math.max(0, -panX / s), y1 = Math.max(0, -panY / s);
  const x2 = Math.min(natW, (W - panX) / s), y2 = Math.min(natH, (H - panY) / s);
  return x2 > x1 && y2 > y1 ? { x1, y1, x2, y2 } : null;
}

const counting = () => zoom >= prefs.minimap.min_zoom;

let coverageLast = Date.now();
setInterval(() => {
  const t = Date.now();
  const dt = Math.min(t - coverageLast, 2 * COVERAGE_TICK_MS);  // a throttled tab banks nothing
  coverageLast = t;
  if (!coverage || view !== "editor" || !natW || el.keysDialog.open
      || document.visibilityState !== "visible"
      || (t - lastInput >= IDLE_MS && !scanRunning())) return;
  if (!counting()) return;
  const r = visibleRect();
  if (!r) return;
  const { gw, gh, ms } = coverage;
  const cw = natW / gw, ch = natH / gh;
  // Cells whose centre is on screen: centre = (i + .5) * cw.
  const i0 = Math.max(0, Math.ceil(r.x1 / cw - 0.5)), i1 = Math.min(gw - 1, Math.floor(r.x2 / cw - 0.5));
  const j0 = Math.max(0, Math.ceil(r.y1 / ch - 0.5)), j1 = Math.min(gh - 1, Math.floor(r.y2 / ch - 0.5));
  if (i1 < i0 || j1 < j0) return;
  const d = pendingDelta(coverage);
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      ms[j * gw + i] += dt;
      d.ms[j * gw + i] += dt;
    }
  }
  scheduleMinimap();
}, COVERAGE_TICK_MS);

const coverageUrl = (d) =>
  BASE + `api/coverage/${encodeURIComponent(d.image)}?` + new URLSearchParams({ project: d.project });
const coverageBody = (d) =>
  JSON.stringify({ gw: d.gw, gh: d.gh, ms: Array.from(d.ms, (v) => Math.round(v)) });

/** Send what has been counted. Same rules as the event log: a delta the
    server refuses is dropped, one that got no answer goes back in the queue. */
function flushCoverage() {
  if (coverageFlushing || !coveragePending.size) return coverageFlushing || Promise.resolve();
  coverageInFlight = [...coveragePending.values()];
  coveragePending.clear();
  coverageFlushing = (async () => {
    for (const d of coverageInFlight) {
      try {
        const r = await fetch(coverageUrl(d), {
          method: "POST", headers: { "Content-Type": "application/json" }, body: coverageBody(d),
        });
        if (r.status >= 400 && r.status < 500) {
          console.warn(`coverage for ${d.image} refused (${r.status}):`, await r.text());
        } else if (!r.ok) {
          throw new Error(String(r.status));
        }
      } catch (err) {
        const back = pendingDelta({ ...d });
        for (let i = 0; i < back.ms.length; i++) back.ms[i] += d.ms[i];
      }
    }
    coverageInFlight = [];
  })().finally(() => { coverageFlushing = null; });
  return coverageFlushing;
}

setInterval(flushCoverage, EVENT_FLUSH_MS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushCoverage();
});
window.addEventListener("pagehide", () => {
  for (const d of coveragePending.values()) {
    navigator.sendBeacon(coverageUrl(d), new Blob([coverageBody(d)], { type: "application/json" }));
  }
  coveragePending.clear();
});

// ---------------------------------------------------------------- drawing

function scheduleMinimap() {
  if (!mmFrame) mmFrame = requestAnimationFrame(drawMinimap);
}

/** Width from the size setting, height from the image; a tall image must not
    make the minimap taller than the view. */
function mmSize() {
  const w = prefs.minimap.size;
  const h = Math.round(w * natH / natW);
  const maxH = Math.max(60, el.viewport.clientHeight - 60);
  return h > maxH ? { w: Math.round(w * maxH / h), h: maxH } : { w, h };
}

function buildMinimapBase() {
  mmBase = null;
  if (!natW || !el.photo.complete || !el.photo.naturalWidth) return;
  const { w, h } = mmSize();
  const dpr = window.devicePixelRatio || 1;
  const c = document.createElement("canvas");
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  c.getContext("2d").drawImage(el.photo, 0, 0, c.width, c.height);
  mmBase = c;
}
el.photo.addEventListener("load", () => { buildMinimapBase(); scheduleMinimap(); });

/** Never looked at: a dark veil, so what is left stands out. Everything else
    goes from amber to green with t, its share of the time spent on the part
    of this image looked at longest - a picture of where the time went, with
    no line drawn for "enough". */
function heat(t) {
  const a = [255, 176, 31], b = [75, 214, 164];
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, 0.45)`;
}

function placeMinimap() {
  const W = el.viewport.clientWidth, H = el.viewport.clientHeight;
  const m = prefs.minimap;
  const right = clamp(m.right, 0, Math.max(0, W - el.minimap.offsetWidth));
  const top = clamp(m.top, 0, Math.max(0, H - el.minimap.offsetHeight));
  el.minimap.style.right = right + "px";
  el.minimap.style.top = top + "px";
  return { right, top };
}

function drawMinimap() {
  mmFrame = 0;
  const m = prefs.minimap;
  const show = m.show && view === "editor" && !!natW;
  el.minimap.hidden = !show;
  if (!show) return;

  const { w, h } = mmSize();
  const dpr = window.devicePixelRatio || 1;
  const c = el.mmCanvas;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    c.style.width = w + "px";
    c.style.height = h + "px";
  }
  // The footer is exactly as wide as the picture, set here rather than left
  // to the text: a long note must be trimmed, never widen the minimap and
  // leave a dark band beside the picture.
  el.mmFoot.style.width = w + "px";
  el.minimap.style.opacity = m.opacity;
  placeMinimap();

  if (!mmBase || mmBase.width !== c.width || mmBase.height !== c.height) buildMinimapBase();
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (mmBase) g.drawImage(mmBase, 0, 0, w, h);
  else { g.fillStyle = "#1b1f25"; g.fillRect(0, 0, w, h); }

  if (coverage) {
    const { gw, gh, ms } = coverage;
    let most = 0;
    for (const v of ms) if (v > most) most = v;
    for (let j = 0; j < gh; j++) {
      const y0 = Math.floor(j * h / gh), y1 = Math.floor((j + 1) * h / gh);
      for (let i = 0; i < gw; i++) {
        const v = ms[j * gw + i];
        const x0 = Math.floor(i * w / gw), x1 = Math.floor((i + 1) * w / gw);
        // Square root, so a part looked at a quarter as long as the most-looked-at
        // one is already halfway to green instead of barely off amber.
        g.fillStyle = v > 0 ? heat(Math.sqrt(v / most)) : "rgba(8, 10, 12, 0.5)";
        g.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  }

  // Your boxes, one dot each, in the colour of their class.
  const sx = w / natW, sy = h / natH;
  for (const b of boxes) {
    g.beginPath();
    g.arc((b.x1 + b.x2) / 2 * sx, (b.y1 + b.y2) / 2 * sy, 2.6, 0, 2 * Math.PI);
    g.fillStyle = classStyle(b.cls).color;
    g.fill();
    g.lineWidth = 1;
    g.strokeStyle = "rgba(8, 10, 12, 0.85)";
    g.stroke();
  }

  drawScanOverlay(g, sx, sy);

  // Where the view is: a light frame with a dark rim, to read on any image.
  const r = visibleRect();
  if (r) {
    const x = r.x1 * sx, y = r.y1 * sy, rw = (r.x2 - r.x1) * sx, rh = (r.y2 - r.y1) * sy;
    g.lineWidth = 3;
    g.strokeStyle = "rgba(8, 10, 12, 0.7)";
    g.strokeRect(x, y, rw, rh);
    g.lineWidth = 1.5;
    g.strokeStyle = "#ffffff";
    g.strokeRect(x, y, rw, rh);
  }

  el.mmZoom.textContent = `${Math.round(scale() * 100)} %`;
  el.mmZoom.title = `${Math.round(scale() * 100)} % of the image's pixels, ${zoom.toFixed(1)}\u00d7 the fit-to-screen zoom`;
  // Beside the zoom; on a narrow minimap trimmed with an ellipsis, since the
  // footer is held to the picture's width.
  el.mmNote.textContent = coverage && !counting() ? "zoom in to count" : "";
  el.mmNote.title = `Time only counts from ${m.min_zoom}\u00d7 the fit-to-screen zoom.`;
}

window.addEventListener("resize", () => { mmBase = null; scheduleMinimap(); });

// ---------------------------------------------------------------- moving it, and moving the view with it

el.mmGrip.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  const { right, top } = placeMinimap();
  mmDrag = { x: e.clientX, y: e.clientY, right, top };
  el.minimap.classList.add("moving");
});

/** Centre the view on the image point under the pointer. */
function mmJump(e) {
  const r = el.mmCanvas.getBoundingClientRect();
  const ix = clamp((e.clientX - r.left) / r.width, 0, 1) * natW;
  const iy = clamp((e.clientY - r.top) / r.height, 0, 1) * natH;
  const s = scale();
  panX = el.viewport.clientWidth / 2 - ix * s;
  panY = el.viewport.clientHeight / 2 - iy * s;
  applyTransform();
  render();
}

el.mmCanvas.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  scanTouch("view");           // taking the view over by hand
  mmNav = true;
  mmJump(e);
});

// The minimap is not the image: no wheel zoom of the page through it either.
el.minimap.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });

window.addEventListener("mousemove", (e) => {
  if (mmDrag) {
    prefs.minimap.right = Math.max(0, mmDrag.right - (e.clientX - mmDrag.x));
    prefs.minimap.top = Math.max(0, mmDrag.top + (e.clientY - mmDrag.y));
    const { right, top } = placeMinimap();
    prefs.minimap.right = right;
    prefs.minimap.top = top;
  } else if (mmNav) {
    mmJump(e);
  }
});

window.addEventListener("mouseup", (e) => {
  if (e.button !== 0) return;
  if (mmDrag) {
    mmDrag = null;
    el.minimap.classList.remove("moving");
    saveSettings();              // the place is personal, and kept
  }
  mmNav = false;
});

function toggleMinimap() {
  prefs.minimap.show = !prefs.minimap.show;
  saveSettings();
  flash(prefs.minimap.show ? "Minimap shown" : "Minimap hidden: m shows it");
}

// ---------------------------------------------------------------- settings section

function minimapSection() {
  const m = prefs.minimap;
  const sec = h("section", "keys-screen");
  sec.append(h("h3", "", "Minimap"),
    h("p", "keyhint", "Drag it by its top-right corner; press or drag on it to move the view. "
      + "Dark parts have not been looked at yet; the rest go from amber to green the longer "
      + "they have been looked at, compared with the part looked at longest. Dots are your "
      + "boxes, in their class colour. m shows or hides it."));

  const toggle = h("label", "stylefield toggle mmtoggle");
  const c = h("input");
  c.type = "checkbox";
  c.checked = m.show;
  c.dataset.f = "mm:show";
  c.addEventListener("change", () => { m.show = c.checked; saveSettings(); });
  toggle.append(c, h("span", "", "Show the minimap"));
  sec.appendChild(toggle);

  const row = (key, label, hint, min, max, step, fmt) => {
    const changed = m[key] !== MINIMAP_DEFAULTS[key];
    const r = h("div", "keyrow speed" + (changed ? " changed" : ""));
    const lab = h("label", "keylabel");
    lab.htmlFor = `mm-${key}`;
    lab.append(label, h("span", "sub", hint));
    const wrap = h("span", "chips");
    const input = h("input");
    input.type = "range"; input.id = `mm-${key}`;
    input.min = min; input.max = max; input.step = step;
    input.value = String(m[key]);
    input.dataset.f = `mm:${key}`;
    const out = h("output", "speedval", fmt(m[key]));
    input.addEventListener("input", () => {
      m[key] = Math.round(Number(input.value) * 100) / 100;
      out.textContent = fmt(m[key]);
      if (key === "size") mmBase = null;
      scheduleMinimap();
    });
    input.addEventListener("change", () => saveSettings());
    wrap.append(input, out);
    const actions = h("span", "keyactions");
    if (changed) {
      const reset = h("button", "badge", "reset");
      reset.type = "button";
      reset.dataset.f = `mm:${key}:reset`;
      reset.addEventListener("click", () => {
        m[key] = MINIMAP_DEFAULTS[key];
        if (key === "size") mmBase = null;
        saveSettings();
      });
      actions.appendChild(reset);
    }
    r.append(lab, wrap, actions);
    return r;
  };
  sec.append(
    row("size", "Size", "Width on screen.", 100, 480, 10, (v) => `${v} px`),
    row("opacity", "Opacity", "Of the whole minimap.", 0.2, 1, 0.05, (v) => `${Math.round(v * 100)} %`),
    row("min_zoom", "Counted from zoom",
        "Looking at the whole image at once is not scanning it, so time only counts "
        + "from this much zoom, in times the fit-to-screen zoom.",
        1, 8, 0.5, (v) => `${v}\u00d7`));

  const moved = m.right !== MINIMAP_DEFAULTS.right || m.top !== MINIMAP_DEFAULTS.top;
  if (moved) {
    const put = h("button", "badge", "put it back in the top-right corner");
    put.type = "button";
    put.dataset.f = "mm:place";
    put.addEventListener("click", () => {
      m.right = MINIMAP_DEFAULTS.right;
      m.top = MINIMAP_DEFAULTS.top;
      saveSettings();
    });
    const p = h("p", "keyhint");
    p.appendChild(put);
    sec.appendChild(p);
  }
  return sec;
}

const minimapChangeCount = () =>
  Object.keys(MINIMAP_DEFAULTS).filter((k) => prefs.minimap[k] !== MINIMAP_DEFAULTS[k]).length;

// ---------------------------------------------------------------- scanning
//
// An automatic pass over the image: the view slides along rows, like mowing
// a field. Rows overlap by scan.overlap of the view height so nothing falls
// between two of them.
//
// s starts a pass from the view on screen, at its zoom, towards the end of
// the image - or, when the whole image is on screen, a full pass from the
// first view. The zoom is raised to at least the minimap's "counted from
// zoom", so scanning time counts as coverage. There is no "continue where I
// left off": every start is a new pass from where the view is.
//
// Two kinds of interruption:
//   annotating (a press on the image, an editing key) pauses it, and it goes
//     on by itself once no box is being drawn or dragged and nothing has
//     been touched for resume_s seconds - from the view as it is then;
//   moving the view by hand (pan, zoom, fit, the minimap) holds it until s,
//     which starts a new pass from the new view, in the direction it was
//     going. Only moving the mouse interrupts nothing.
//
// Speed is one of a few fixed levels, stepped through with . (faster) and ,
// (slower) while a scan is on - round and round: after the fastest comes the
// slowest. Bars show the level for a moment after each press. A scan starts
// at the level last used. The first and the last
// view of the image are held for edge_s seconds.
//
// A running scan counts as activity for the timer and for coverage; with no
// input at all for SCAN_IDLE_STOP_MS it stops itself rather than run on to
// an empty chair.

const SCAN_LEVELS = [
  { name: "slowest", px: 40 },
  { name: "slow", px: 60 },
  { name: "not so slow", px: 90 },
  { name: "normal", px: 130 },
  { name: "a bit faster", px: 180 },
  { name: "fast", px: 250 },
  { name: "fastest", px: 350 },
];                                  // speeds in screen px per second
const SCAN_GLIDE_MS = 400;
const SCAN_LEVEL_SHOW_MS = 1500;
const SCAN_IDLE_STOP_MS = 3 * 60 * 1000;

const scan = {
  on: false,
  // "gliding" (into place) | "dwell-start" | "running" | "dwell-end" |
  // "paused" (annotating, resumes by itself) | "held" (view moved, waits for s) |
  // "loading" (the next image) | "off"
  state: "off",
  path: null,                // {pts, cum, total}, in image px, for the view centre
  d: 0,                      // how far along the path
  zoom: 1,                   // the zoom of this pass, in times the fit zoom
  dir: 1,                    // +1 rightwards, -1 leftwards, for the next pass
  firstFrame: false,         // this pass starts at the image's first view
  atEnd: false,              // reached the last view, holding it
  fresh: false,              // a new image: the next pass is a full one
  lastTouch: 0,
  dwellUntil: 0,
  glide: null,
  raf: 0,
  last: 0,
};

const scanRunning = () => scan.on
  && ["running", "gliding", "dwell-start", "dwell-end"].includes(scan.state);

function speedLevel() {
  let best = 0;
  SCAN_LEVELS.forEach((l, k) => {
    if (Math.abs(l.px - prefs.scan.speed) < Math.abs(SCAN_LEVELS[best].px - prefs.scan.speed)) best = k;
  });
  return best;
}

function viewCentre() {
  const s = scale();
  return { x: (el.viewport.clientWidth / 2 - panX) / s, y: (el.viewport.clientHeight / 2 - panY) / s };
}

function setViewCentre(p, z) {
  zoom = z;
  const s = scale();
  panX = el.viewport.clientWidth / 2 - p.x * s;
  panY = el.viewport.clientHeight / 2 - p.y * s;
  applyTransform();
}

/** The rows ahead, as a polyline of view centres. From `from` ({x, y, dir})
    it runs along the current row in `dir`, then down and back and forth to
    the bottom; without it, the whole image from its first view, top-left.
    Centres stay half a view from the edges, so the edges are on screen
    without the view running past them. */
function buildScanPath(z, from) {
  const s = fit * z;
  const vw = el.viewport.clientWidth / s, vh = el.viewport.clientHeight / s;
  const xL = Math.min(vw / 2, natW / 2), xR = Math.max(natW - vw / 2, natW / 2);
  const yT = Math.min(vh / 2, natH / 2), yB = Math.max(natH - vh / 2, natH / 2);
  const step = Math.max(1, vh * (1 - prefs.scan.overlap));
  const y0 = from ? clamp(from.y, yT, yB) : yT;
  const x0 = from ? clamp(from.x, xL, xR) : xL;
  let dir = from && from.dir ? from.dir : 1;
  const ys = [y0];
  for (let y = y0 + step; y < yB - 1; y += step) ys.push(y);
  if (yB - ys[ys.length - 1] > 1) ys.push(yB);
  const pts = [{ x: x0, y: y0 }, { x: dir > 0 ? xR : xL, y: y0 }];
  for (let k = 1; k < ys.length; k++) {
    dir = -dir;                      // each row starts where the last one ended
    pts.push({ x: dir > 0 ? xL : xR, y: ys[k] }, { x: dir > 0 ? xR : xL, y: ys[k] });
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) {
    cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  }
  return { pts, cum, total: cum[cum.length - 1] || 0 };
}

function pointAt(path, d) {
  const { pts, cum } = path;
  for (let i = 1; i < pts.length; i++) {
    if (d <= cum[i]) {
      const len = cum[i] - cum[i - 1];
      const t = len ? (d - cum[i - 1]) / len : 0;
      return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t,
               y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t };
    }
  }
  return { ...pts[pts.length - 1] };
}

/** Which way the scan is going at d: along a row, that row's way; on a step
    down between rows, the way of the row it is stepping to. */
function dirAt(path, d) {
  const { pts, cum } = path;
  for (let i = 1; i < pts.length; i++) {
    if (d <= cum[i] || i === pts.length - 1) {
      for (let k = i; k < pts.length; k++) {
        const dx = pts[k].x - pts[k - 1].x;
        if (Math.abs(dx) > 0.5) return Math.sign(dx);
      }
      return scan.dir;
    }
  }
  return scan.dir;
}

/** A new pass at zoom z, from `from` or from the first view. With nothing
    left to scan from `from` (it is at the end already), a full pass. */
function plan(from, z) {
  scan.zoom = z;
  scan.path = buildScanPath(z, from);
  scan.d = 0;
  scan.atEnd = false;
  scan.firstFrame = !from;
  if (scan.path.total < 1) {
    if (from) return plan(null, z);
    flash("The whole image fits on screen at this zoom: zoom in to scan it");
    return false;
  }
  scan.dir = dirAt(scan.path, 0);
  return true;
}

/** Where a pass starts: the view on screen, at its zoom - or the first view,
    for a new image or when the whole image is on screen. */
function planFromHere() {
  const minZoom = Math.max(1, prefs.minimap.min_zoom);
  if (scan.fresh) {
    scan.fresh = false;
    return plan(null, Math.max(scan.zoom, minZoom));
  }
  if (zoom <= 1.001) return plan(null, minZoom);
  const c = viewCentre();
  return plan({ x: c.x, y: c.y, dir: scan.dir }, Math.max(zoom, minZoom));
}

function ensureScanLoop() {
  if (!scan.raf) { scan.last = 0; scan.raf = requestAnimationFrame(scanFrame); }
}

function startScan() {
  if (view !== "editor" || !natW) return;
  scan.on = true;
  if (!planFromHere()) { scan.on = false; return; }
  beginGlide();
  showScanLevel();
  flash("Scanning: . and , set the speed, s stops");
  ensureScanLoop();
}

function stopScan(message) {
  if (!scan.on) return;
  scan.on = false;
  scan.state = "off";
  scan.path = null;
  scan.fresh = false;
  cancelAnimationFrame(scan.raf);
  scan.raf = 0;
  el.scanBar.hidden = true;
  hideScanLevel();
  scheduleMinimap();
  if (message) flash(message);
}

/** Held at the last view when interrupted: go back to holding it. Otherwise
    a new pass from the view as it is now. */
function resumeScan() {
  if (scan.atEnd) {
    scan.state = "dwell-end";
    scan.dwellUntil = performance.now() + prefs.scan.edge_s * 1000;
    return;
  }
  if (!planFromHere()) { stopScan(); return; }
  beginGlide();
}

/** s: start; go on from here after an interruption; or stop. */
function toggleScan() {
  if (!scan.on) { startScan(); return; }
  if (scan.state === "held" || scan.state === "paused") { resumeScan(); return; }
  if (scan.state === "loading") return;
  stopScan("Scanning stopped");
}

/** An interruption. "annotate" pauses, and the scan goes on by itself;
    "view" - the view moved by hand - holds it until s. */
function scanTouch(kind = "annotate") {
  if (!scan.on || scan.state === "loading") return;
  if (scan.path && scanRunning()) scan.dir = dirAt(scan.path, scan.d);
  scan.lastTouch = performance.now();
  if (kind === "view") {
    scan.state = "held";
    scan.atEnd = false;
    scan.fresh = false;              // the view is now the user's, even on a new image
  } else if (scan.state !== "held") {
    scan.state = "paused";
  }
}

function scanBlocked() {
  return !!(draft || drag || panning || mmNav || mmDrag || el.keysDialog.open
            || commentPlacing || !el.cpop.hidden);
}

function beginGlide() {
  const c = viewCentre();
  const to = pointAt(scan.path, scan.d);
  scan.glide = { t: 0, z0: zoom, z1: scan.zoom, x0: c.x, y0: c.y, x1: to.x, y1: to.y };
  scan.state = "gliding";
}

function scanFrame(t) {
  scan.raf = 0;
  if (!scan.on) return;
  const dt = scan.last ? Math.min(t - scan.last, 50) : 0;
  scan.last = t;
  if (view !== "editor" || !natW) { stopScan(); return; }
  if (Date.now() - lastInput > SCAN_IDLE_STOP_MS) {
    stopScan("Scanning stopped: no input for 3 minutes");
    return;
  }
  const dialog = el.keysDialog.open;
  if (dialog && (scan.state === "dwell-start" || scan.state === "dwell-end")) scan.dwellUntil += dt;

  if (scan.state === "paused") {
    if (!scanBlocked() && t - scan.lastTouch >= prefs.scan.resume_s * 1000) resumeScan();
  } else if (scan.state === "gliding") {
    const g = scan.glide;
    g.t = Math.min(1, g.t + dt / SCAN_GLIDE_MS);
    const e = g.t < 0.5 ? 2 * g.t * g.t : 1 - Math.pow(-2 * g.t + 2, 2) / 2;
    setViewCentre({ x: g.x0 + (g.x1 - g.x0) * e, y: g.y0 + (g.y1 - g.y0) * e },
                  g.z0 * Math.pow(g.z1 / g.z0, e));
    if (g.t >= 1) {
      render();
      if (scan.firstFrame && prefs.scan.edge_s > 0) {
        scan.state = "dwell-start";
        scan.dwellUntil = t + prefs.scan.edge_s * 1000;
      } else {
        scan.state = "running";
      }
    }
  } else if (scan.state === "dwell-start") {
    if (t >= scan.dwellUntil) scan.state = "running";
  } else if (scan.state === "running" && !dialog) {
    scan.d += prefs.scan.speed * dt / 1000 / scale();
    if (scan.d >= scan.path.total) {
      scan.d = scan.path.total;
      setViewCentre(pointAt(scan.path, scan.d), scan.zoom);
      scan.atEnd = true;
      scan.state = "dwell-end";
      scan.dwellUntil = t + prefs.scan.edge_s * 1000;
    } else {
      setViewCentre(pointAt(scan.path, scan.d), scan.zoom);
    }
  } else if (scan.state === "dwell-end") {
    if (t >= scan.dwellUntil) { finishScan(); return; }
  }
  showScanPill(t);
  scan.raf = requestAnimationFrame(scanFrame);
}

function finishScan() {
  scan.atEnd = false;
  if (prefs.scan.next_image && idx < images.length - 1) {
    flash("Scan finished: on to the next image");
    scan.state = "loading";          // until load() has set up the next image
    scan.raf = requestAnimationFrame(scanFrame);
    const from = idx;
    go(idx + 1).then(() => {
      if (scan.state === "loading" && idx === from) {
        stopScan("Scanning stopped: this image could not be saved");
      }
    });
    return;
  }
  stopScan(idx < images.length - 1 || !prefs.scan.next_image
    ? "Scan of this image finished"
    : "Scan finished: that was the last image");
}

/** Called by load() for each new image while scanning is on: a full pass,
    at the zoom of the last one, after the usual resume pause - a moment to
    look before it moves. */
function scanNewImage() {
  if (!scan.on) return;
  scan.fresh = true;
  scan.atEnd = false;
  scan.path = null;
  scan.state = "paused";
  scan.lastTouch = performance.now();
}

let scanPillText = "";
function showScanPill(t) {
  let text, cls = "wait";
  const secs = (until) => Math.max(0, (until - t) / 1000).toFixed(1);
  if (scan.state === "loading") {
    text = "Scan: opening the next image";
  } else if (scan.state === "running") {
    text = `Scanning ${SCAN_LEVELS[speedLevel()].name}  ${Math.round(100 * scan.d / scan.path.total)} %`;
    cls = "run";
  } else if (scan.state === "gliding") {
    text = "Scan: moving into place";
    cls = "run";
  } else if (scan.state === "dwell-start") {
    text = `Scan: first view, ${secs(scan.dwellUntil)} s`;
    cls = "run";
  } else if (scan.state === "dwell-end") {
    text = `Scan: last view, ${secs(scan.dwellUntil)} s`;
    cls = "run";
  } else if (scan.state === "held") {
    text = "Scan held: s goes on from here";
  } else if (scanBlocked()) {
    text = el.keysDialog.open ? "Scan paused" : "Scan paused while you annotate";
  } else {
    text = `Scan goes on in ${secs(scan.lastTouch + prefs.scan.resume_s * 1000)} s`;
  }
  el.scanBar.hidden = false;
  if (text !== scanPillText) { el.scanText.textContent = text; scanPillText = text; }
  el.scanPill.dataset.state = cls;
  if (document.activeElement !== el.scanEdge && Number(el.scanEdge.value) !== prefs.scan.edge_s) {
    el.scanEdge.value = String(prefs.scan.edge_s);
  }
}

for (let k = 0; k < SCAN_LEVELS.length; k++) {

let scanLevelTimer = 0;

let scanSaveTimer = 0;
/** . and , - only while a scan is on; otherwise the keys do nothing. They go
    round: past the fastest is the slowest, and the other way. */
function scanSpeed(dir) {
  if (!scan.on) return;
  const n = SCAN_LEVELS.length;
  const j = (speedLevel() + dir + n) % n;
  prefs.scan.speed = SCAN_LEVELS[j].px;

/** Another view size (a resized window, the image strip shown or hidden)
    means another path: a new pass from the scan's place, at its zoom, in
    its direction. Held at the last view, there is nothing to re-plan. */
function replanScan() {
  if (!scan.on || !scan.path || !natW || scan.atEnd) return;
  const here = pointAt(scan.path, scan.d);
  const dir = dirAt(scan.path, scan.d);
  const moving = scanRunning();
  if (!plan({ ...here, dir }, scan.zoom)) { stopScan(); return; }
  if (moving) {
    setViewCentre(pointAt(scan.path, 0), scan.zoom);
    render();
  }
}
window.addEventListener("resize", replanScan);

/** The planned path on the minimap, faint, so it is clear where the scan
    goes next and how much is left. */
function drawScanOverlay(g, sx, sy) {
  if (!scan.on || !scan.path || scan.path.pts.length < 2) return;
  g.save();
  g.setLineDash([3, 3]);
  g.lineWidth = 1;
  g.strokeStyle = "rgba(255, 255, 255, 0.55)";
  g.beginPath();
  scan.path.pts.forEach((p, i) => (i ? g.lineTo(p.x * sx, p.y * sy) : g.moveTo(p.x * sx, p.y * sy)));
  g.stroke();
  g.restore();
}

// ---------------------------------------------------------------- image strip
//
// The images that come next, as thumbnails along the bottom: the one being
// annotated at the left edge, the next ones after it. Near the end of the
// project the last image stays at the right edge instead, and the current
// one moves along towards it - the strip never runs out into empty space. Drag it (or scroll over
// it) to look further ahead or back; a click without a drag opens the image
// clicked. Moving to another image slides the strip so the new one is at the
// left again.
//
// Only the tiles on screen exist, so a project of thousands of images costs
// the same as one of ten.

const STRIP_PAD = 8;               // px before the first tile
const STRIP_GAP = 6;
const STRIP_CLICK_PX = 5;          // more movement than this is a drag, not a click

const strip = {
  offset: 0,                       // px; 0 puts the current image at the left edge
  laidOut: null,                   // the show/height last applied, see applyStripLayout
  tiles: new Map(),                // project + "\0" + index -> element
  press: null,                     // {x, offset, moved, t, v}
  anim: 0,
  frame: 0,
};

const stripTileW = () => Math.round(prefs.strip.height * 16 / 9);   // 16:9, like a wide frame
const stripPitch = () => stripTileW() + STRIP_GAP;

/** How far the strip may go: from image 1 at the left edge to the last image
    at the right edge. A project that fits entirely stays with image 1 at the
    left, since there is nothing to scroll. */
function stripBounds() {
  const p = stripPitch();
  const max = idx * p;
  const lastAtRight = el.strip.clientWidth - 2 * STRIP_PAD - stripTileW()
                      - (images.length - 1 - idx) * p;
  return [Math.min(max, lastAtRight), max];
}
function stripClamp(o) {
  const [lo, hi] = stripBounds();
  return clamp(o, lo, hi);
}

/** Where the strip rests: the current image at the left edge, as far as the
    bounds allow - so at the end of the project the last image holds the
    right edge and the current one sits wherever it falls. */
const stripHome = () => stripClamp(0);

function scheduleStrip() {
  if (!strip.frame) strip.frame = requestAnimationFrame(renderStrip);
}

function stripTile(i) {
  const im = images[i];
  const t = h("div", "stile");
  const img = h("img");
  img.alt = "";
  img.draggable = false;
  img.decoding = "async";
  // The thumbnail must cover the tile's longer side, which is now its width.
  img.src = thumbUrl(project, im.name, stripTileW() * (window.devicePixelRatio || 1) > 250 ? 512 : 256);
  t.append(img, h("span", "sidx", String(i + 1)), h("span", "sbar"));
  t.title = im.name;
  return t;
}

function renderStrip() {
  strip.frame = 0;
  if (!prefs.strip.show || view !== "editor" || !images.length) return;
  const W = el.strip.clientWidth, p = stripPitch();
  strip.offset = stripClamp(strip.offset);
  const first = Math.max(0, idx + Math.floor((-strip.offset - STRIP_PAD) / p) - 1);
  const last = Math.min(images.length - 1, idx + Math.ceil((W - strip.offset) / p) + 1);
  const keep = new Set();
  for (let i = first; i <= last; i++) {
    const key = project + "\u0000" + i;
    keep.add(key);
    let t = strip.tiles.get(key);
    if (!t) {
      t = stripTile(i);
      strip.tiles.set(key, t);
      el.stripTrack.appendChild(t);
    }
    t.style.transform = `translateX(${STRIP_PAD + (i - idx) * p + strip.offset}px)`;
    const cls = "stile" + (i === idx ? " current" : "");
    if (t.className !== cls) t.className = cls;
    t.style.setProperty("--c", stageOf(images[i].stage).color);   // the stage's colour
  }
  for (const [key, t] of strip.tiles) {
    if (!keep.has(key)) { t.remove(); strip.tiles.delete(key); }
  }
}

function stripAnimateTo(target, ms = 220) {
  cancelAnimationFrame(strip.anim);
  const from = strip.offset, t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    strip.offset = from + (target - from) * e;
    renderStrip();
    if (k < 1) strip.anim = requestAnimationFrame(step);
  };
  strip.anim = requestAnimationFrame(step);
}

/** Called by load() when the image changes: keep every tile where it is for
    a moment, then slide so the new current image ends up at the left. A jump
    across the whole project just redraws. */
function stripFollow(prev) {
  const home = stripHome();
  const shifted = strip.offset + (idx - prev) * stripPitch();
  if (prev >= 0 && Math.abs(shifted - home) < 4 * el.strip.clientWidth) {
    strip.offset = shifted;
    stripAnimateTo(home);
  } else {
    strip.offset = home;
    scheduleStrip();
  }
}

// Dragging, with a little momentum on release, so a flick carries on.
el.strip.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  cancelAnimationFrame(strip.anim);
  strip.press = { x: e.clientX, offset: strip.offset, moved: 0, t: e.timeStamp, v: 0, lastX: e.clientX };
  el.strip.setPointerCapture(e.pointerId);
});
el.strip.addEventListener("pointermove", (e) => {
  const pr = strip.press;
  if (!pr) return;
  pr.moved = Math.max(pr.moved, Math.abs(e.clientX - pr.x));
  if (pr.moved > STRIP_CLICK_PX) el.strip.classList.add("dragging");
  const dt = Math.max(1, e.timeStamp - pr.t);
  pr.v = 0.8 * ((e.clientX - pr.lastX) / dt) + 0.2 * pr.v;   // px per ms, smoothed
  pr.t = e.timeStamp;
  pr.lastX = e.clientX;
  strip.offset = stripClamp(pr.offset + e.clientX - pr.x);
  scheduleStrip();
});
el.strip.addEventListener("pointerup", (e) => {
  const pr = strip.press;
  strip.press = null;
  el.strip.classList.remove("dragging");
  if (!pr) return;
  if (pr.moved <= STRIP_CLICK_PX) {
    // A click: the tile under the pointer, not a gap between two.
    const x = e.clientX - el.strip.getBoundingClientRect().left - STRIP_PAD - strip.offset;
    const k = Math.floor(x / stripPitch());
    if (x - k * stripPitch() <= stripTileW()) {
      const i = idx + k;
      if (i >= 0 && i < images.length && i !== idx) go(i);
    }
    return;
  }
  // Momentum only for a release while still moving: stop, then let go, and
  // the strip stays where it was put.
  let v = e.timeStamp - pr.t > 80 ? 0 : pr.v;
  if (Math.abs(v) < 0.05) return;
  let last = performance.now();
  const coast = (t) => {
    const dt = t - last;
    last = t;
    v *= Math.pow(0.994, dt);                 // friction
    const before = strip.offset;
    strip.offset = stripClamp(strip.offset + v * dt);
    renderStrip();
    if (Math.abs(v) > 0.02 && strip.offset !== before) strip.anim = requestAnimationFrame(coast);
  };
  strip.anim = requestAnimationFrame(coast);
});
el.strip.addEventListener("pointercancel", () => {
  strip.press = null;
  el.strip.classList.remove("dragging");
});
el.strip.addEventListener("wheel", (e) => {
  e.preventDefault();
  cancelAnimationFrame(strip.anim);
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  strip.offset = stripClamp(strip.offset - d * (e.deltaMode === 1 ? 33 : 1));
  scheduleStrip();
}, { passive: false });

/** Show, hide or resize the strip without re-fitting the image: whatever was
    in the middle of the view stays there, and a running scan re-plans for the
    new view size. */
function applyStripLayout() {
  // Called with every settings change; only a change to the strip itself
  // re-lays it out, so a strip dragged aside stays put when, say, the
  // minimap is toggled.
  const key = `${prefs.strip.show}:${prefs.strip.height}`;
  if (key === strip.laidOut) { scheduleStrip(); return; }
  strip.laidOut = key;
  const c = natW && view === "editor" ? viewCentre() : null;
  el.strip.hidden = !prefs.strip.show;
  el.strip.style.setProperty("--strip-h", prefs.strip.height + "px");
  el.strip.style.setProperty("--strip-w", stripTileW() + "px");
  if (c) {
    setViewCentre(c, zoom);
    render();
  }
  replanScan();
  schedulePointer();
  strip.offset = stripHome();
  scheduleStrip();
}

function toggleStrip() {
  prefs.strip.show = !prefs.strip.show;
  saveSettings();
  flash(prefs.strip.show ? "Image strip shown" : "Image strip hidden: t shows it");
}
