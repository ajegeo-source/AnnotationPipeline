  if (e.key === "Escape") { e.preventDefault(); closeFilterPanel(); el.filterBtn.focus(); }
});

// ---------------------------------------------------------------- sorting the grid
//
// The sort reorders the image list itself, so the editor follows it too: d and
// a, the image strip and a scan's "on to the next image" go in the order the
// grid shows. Ties fall back to the name, so the order is always the same for
// the same data. Remembered per project.

const SORT_KEYS = [
  ["name", "name"],
  ["bytes", "file size"],
  ["boxes", "boxes"],
  ["exems", "exemplars"],
  ["preds", "sam3 boxes"],
];
const K_SORT = (p) => `al.sort:${p}`;
let gridSort = { key: "name", dir: 1 };

function loadGridSort() {
  gridSort = { key: "name", dir: 1 };
  try {
    const saved = JSON.parse(localStorage.getItem(K_SORT(project)) || "null");
    if (saved && SORT_KEYS.some(([k]) => k === saved.key)) gridSort = { key: saved.key, dir: saved.dir < 0 ? -1 : 1 };
  } catch (err) { /* a damaged entry is just the default */ }
  renderSortControls();
}

const byName = (a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);

/** Only between editor visits: the editor's place in the list is by index. */
function sortImages() {
  const { key, dir } = gridSort;
  images.sort(key === "name"
    ? (a, b) => byName(a, b) * dir
    : (a, b) => ((a[key] || 0) - (b[key] || 0)) * dir || byName(a, b));
  // The image strip caches its tiles by position, which just changed.
  for (const t of strip.tiles.values()) t.remove();
  strip.tiles.clear();
  gridAnchor = -1;
}

function renderSortControls() {
  if (!el.sortSel.options.length) {
    el.sortSel.replaceChildren(...SORT_KEYS.map(([k, label]) => new Option(label, k)));
  }
  el.sortSel.value = gridSort.key;
  el.sortDir.textContent = gridSort.dir > 0 ? "\u2191 asc" : "\u2193 desc";
  el.sortDir.title = gridSort.dir > 0 ? "Ascending: smallest first (A to Z for names)" : "Descending: largest first (Z to A for names)";
}

function gridSortChanged() {
  if (project) localStorage.setItem(K_SORT(project), JSON.stringify(gridSort));
  renderSortControls();
  sortImages();
  renderGrid();
}
el.sortSel.addEventListener("change", () => {
  gridSort.key = el.sortSel.value;
  el.sortSel.blur();
  gridSortChanged();
});
el.sortDir.addEventListener("click", () => { gridSort.dir = -gridSort.dir; gridSortChanged(); });

// ---------------------------------------------------------------- the projects page: filter and sort
//
// "Signed off" is the share of a project's images in the last stage of its
// workflow.

const PROJECT_SORTS = [
  ["name", "name"],
  ["images", "images"],
  ["boxes", "boxes"],
  ["done", "% signed off"],
];
const K_PROJSORT = "al.projsort";
let projectSort = { key: "name", dir: 1 };
try {
  const saved = JSON.parse(localStorage.getItem(K_PROJSORT) || "null");
  if (saved && PROJECT_SORTS.some(([k]) => k === saved.key)) projectSort = { key: saved.key, dir: saved.dir < 0 ? -1 : 1 };
} catch (err) { /* the default */ }

/** The share of a project's images in its last stage, 0 to 1. */
function signedOffShare(p) {
  const stages = p.stages || [];
  const last = stages[stages.length - 1];
  return last && p.images ? ((p.stage_counts || {})[last.id] || 0) / p.images : 0;
}

function visibleProjects() {
  const needle = el.projSearch.value.trim().toLowerCase();
  const list = projects.filter((p) => !needle || p.name.toLowerCase().includes(needle));
  const value = { images: (p) => p.images, boxes: (p) => p.boxes || 0, done: signedOffShare }[projectSort.key];
  const { dir } = projectSort;
  list.sort(value ? (a, b) => (value(a) - value(b)) * dir || byName(a, b) : (a, b) => byName(a, b) * dir);
  return list;
}

function renderProjectControls() {
  if (!el.projSort.options.length) {
    el.projSort.replaceChildren(...PROJECT_SORTS.map(([k, label]) => new Option(label, k)));
  }
  el.projSort.value = projectSort.key;
  el.projSortDir.textContent = projectSort.dir > 0 ? "\u2191 asc" : "\u2193 desc";
}
function projectSortChanged() {
  localStorage.setItem(K_PROJSORT, JSON.stringify(projectSort));
  renderProjectControls();
  renderProjects();
}
el.projSort.addEventListener("change", () => {
  projectSort.key = el.projSort.value;
  el.projSort.blur();
  projectSortChanged();
});
el.projSortDir.addEventListener("click", () => { projectSort.dir = -projectSort.dir; projectSortChanged(); });
el.projSearch.addEventListener("input", () => renderProjects());
el.projSearch.addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Escape") { el.projSearch.value = ""; renderProjects(); el.projSearch.blur(); }
});

// ---------------------------------------------------------------- image flags
//
// What is wrong with an image, beside where it is in the workflow: any number
// of a fixed set of flags, and for "Other" a few words saying what. Set from
// the flags chip in the header (or keys you bind to each flag), saved with
// the image like its stage, undoable, logged. The grid filter can require or
// exclude each one. No colours of their own: they are notes, not categories.

const IMAGE_FLAGS = [
  ["motion_blur", "Motion blur"],
  ["out_of_focus", "Out of focus"],
  ["occluded", "Occluded"],
  ["no_object", "No object"],
  ["not_qualified", "Not qualified"],
  ["other", "Other"],
];
const flagLabel = (id) => (IMAGE_FLAGS.find(([k]) => k === id) || [id, id])[1];

let imageFlags = [];          // the open image's flags, in the order above
let flagNote = "";            // what "Other" is

function describeFlags(flags, note) {
  return flags.map((f) => (f === "other" && note ? `Other: ${note}` : flagLabel(f))).join(", ");
}

function renderFlagChip() {
  const n = imageFlags.length;
  el.flagChipName.textContent = !n ? "no flags" : n === 1 ? flagLabel(imageFlags[0]) : `${n} flags`;
  el.flagChip.classList.toggle("on", n > 0);
  el.flagChip.title = n ? `Image flags: ${describeFlags(imageFlags, flagNote)}` : "Flag a problem with this image";
}

/** Set the open image's flags. Undoable; saved with the image. */
function setImageFlags(flags, note) {
  if (view !== "editor" || !images[idx]) return;
  const ordered = IMAGE_FLAGS.map(([k]) => k).filter((k) => flags.includes(k));
  const n = ordered.includes("other") ? (note || "").trim() : "";
  if (String(ordered) === String(imageFlags) && n === flagNote) return;
  const before = snapshot();
  imageFlags = ordered;
  flagNote = n;
  record("image flags", before, []);
  touch();
  render();
}

function toggleFlag(id) {
  const on = imageFlags.includes(id);
  setImageFlags(on ? imageFlags.filter((f) => f !== id) : [...imageFlags, id], flagNote);
  flash(`${flagLabel(id)}: ${on ? "off" : "on"}`);
  if (!el.flagMenu.hidden) {
    renderFlagMenu();
    // Other just ticked: straight to saying what it is, so the typing goes
    // there and not to the editor's shortcuts.
    const note = el.flagMenu.querySelector(".flagnote");
    if (id === "other" && !on && note) note.focus();
    else focusFlagItem(id);
  }
}

function focusFlagItem(id) {
  const b = el.flagMenu.querySelector(`[data-f="flag:${id}"]`);
  if (b) b.focus();
}

function renderFlagMenu() {
  const frag = document.createDocumentFragment();
  for (const [id, label] of IMAGE_FLAGS) {
    const on = imageFlags.includes(id);
    const b = h("button", "classitem flagitem" + (on ? " on" : ""));
    b.type = "button";
    b.setAttribute("role", "menuitemcheckbox");
    b.setAttribute("aria-checked", String(on));
    b.dataset.f = `flag:${id}`;
    b.append(h("span", "k", on ? "\u2713" : ""), h("span", "n", label));
    b.addEventListener("click", () => toggleFlag(id));
    frag.appendChild(b);
  }
  if (imageFlags.includes("other")) {
    const note = h("input", "field flagnote");
    note.type = "text";
    note.maxLength = 500;
    note.placeholder = "what is it?";
    note.value = flagNote;
    note.dataset.f = "flag:note";
    note.setAttribute("aria-label", "What the Other flag means");
    note.addEventListener("change", () => setImageFlags(imageFlags, note.value));
    note.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); setImageFlags(imageFlags, note.value); closeFlagMenu(); }
      if (e.key === "Escape") { e.preventDefault(); closeFlagMenu(); }
    });
    frag.appendChild(note);
  }
  el.flagMenu.replaceChildren(frag);
}

function openFlagMenu() {
  renderFlagMenu();
  const r = el.flagChip.getBoundingClientRect();
  el.flagMenu.style.left = `${Math.round(Math.min(r.left, innerWidth - 240))}px`;
  el.flagMenu.style.top = `${Math.round(r.bottom + 4)}px`;
  el.flagMenu.hidden = false;
  el.flagChip.setAttribute("aria-expanded", "true");
  const note = el.flagMenu.querySelector(".flagnote");
  if (note && !note.value) note.focus();
}
function closeFlagMenu() {
  // A note being typed is kept, as if it had been confirmed.
  const note = el.flagMenu.querySelector(".flagnote");
  if (note && !el.flagMenu.hidden && note.value.trim() !== flagNote) setImageFlags(imageFlags, note.value);
  el.flagMenu.hidden = true;
  el.flagChip.setAttribute("aria-expanded", "false");
}
el.flagChip.addEventListener("click", () => (el.flagMenu.hidden ? openFlagMenu() : closeFlagMenu()));
window.addEventListener("mousedown", (e) => {
  if (!el.flagMenu.hidden && !e.target.closest("#flagMenu, #flagChip")) closeFlagMenu();
}, true);
el.flagMenu.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); closeFlagMenu(); el.flagChip.focus(); }
});

// ---------------------------------------------------------------- the run's exemplars
//
// The exemplar counter in the header ("7 in predtest") opens a window with
// the run's exemplars: every one picked for it, cut out of its image as the
// SAM 3 script pastes it (with a quarter of its size around it), in pick
// order with its image and class - and, once the run has been made, which
// of them it used. A run that sampled gt/ boxes instead shows those. A click
// on an exemplar opens its image with the exemplar selected.

function cropUrl(image, e, size = 160) {
  return BASE + "api/crop/" + encodeURIComponent(image) + "?"
    + new URLSearchParams({ project, cx: e.cx, cy: e.cy, w: e.w, h: e.h, pad: 0.25, size });
}

const sameExemplar = (a, b) => a.image === b.image
  && ["cx", "cy", "w", "h"].every((k) => Math.abs(a[k] - b[k]) < 0.002);

function exemCard(e, caption, badge, onOpen) {
  const card = h("button", "ex-card" + (badge ? " " + badge.cls : ""));
  card.type = "button";
  card.title = `${e.image} \u2013 open it`;
  const img = h("img");
  img.alt = "";
  img.loading = "lazy";
  img.src = cropUrl(e.image, e);
  card.append(img, h("span", "ex-cap", caption));
  if (badge) card.appendChild(h("span", "ex-badge", badge.text));
  card.addEventListener("click", onOpen);
  return card;
}

function renderExemPanel(d) {
  const frag = document.createDocumentFragment();
  frag.appendChild(h("div", "fp-title", `Exemplars of ${d.run}`));
  const last = d.last_run;
  const fromManifest = last && last.source === "manifest";
  let summary;
  if (!last) {
    summary = "Not run yet: these prompt the run's next start.";
  } else {
    const when = new Date(last.when).toLocaleString();
    const where = fromManifest ? "from this list" : `drawn at random from gt/ (source: ${last.source})`;
    summary = `Last run ${when}: ${plural(last.used.length, "exemplar", "exemplars")} used, ${where}`
      + (last.class_name ? `, class ${last.class_name}` : "") + ".";
  }
  frag.appendChild(h("p", "fp-note", summary));

  if (!d.picked.length) {
    frag.appendChild(h("p", "fp-note", "None picked for this run yet: e, then draw a box, picks one."));
  } else {
    frag.appendChild(h("div", "ex-head", plural(d.picked.length, "exemplar picked", "exemplars picked")));
    const grid = h("div", "ex-grid");
    d.picked.forEach((e, k) => {
      let badge = null;
      if (fromManifest) {
        badge = last.used.some((u) => sameExemplar(e, u))
          ? { cls: "used", text: "used" }
          : { cls: "unused", text: e.cls && last.class_name && e.cls !== last.class_name ? "other class" : "not used" };
      }
      const name = e.image.replace(/\.[^.]+$/, "");
      grid.appendChild(exemCard(e, `${k + 1} \u00b7 ${name}${e.cls ? " \u00b7 " + e.cls : ""}`, badge, () => openExemplar(e)));
    });
    frag.appendChild(grid);
  }
  if (last && !fromManifest && last.used.length) {
    frag.appendChild(h("div", "ex-head", "Used in the last run, from gt/"));
    const grid = h("div", "ex-grid");
    last.used.forEach((u, k) => {
      grid.appendChild(exemCard(u, `${k + 1} \u00b7 ${u.image.replace(/\.[^.]+$/, "")}`,
                                { cls: "used", text: "used" }, () => openExemplar(u)));
    });
    frag.appendChild(grid);
  }
  el.exemPanel.replaceChildren(frag);
}

async function openExemPanel() {
  if (!run) { flash("Select a run to see its exemplars"); return; }
  el.exemPanel.replaceChildren(h("p", "fp-note", "loading\u2026"));
  el.exemPanel.hidden = false;
  el.exemcount.setAttribute("aria-expanded", "true");
  const r = el.exemcount.getBoundingClientRect();
  el.exemPanel.style.top = `${Math.round(r.bottom + 6)}px`;
  el.exemPanel.style.left = `${Math.round(Math.max(8, Math.min(r.left, innerWidth - 480)))}px`;
  try {
    const res = await fetch(q("api/run-exemplars"));
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    if (!el.exemPanel.hidden) renderExemPanel(await res.json());
  } catch (err) {
    el.exemPanel.replaceChildren(h("p", "fp-note", `Could not load the exemplars: ${err.message}`));
  }
}

function closeExemPanel() {
  el.exemPanel.hidden = true;
  el.exemcount.setAttribute("aria-expanded", "false");
}

/** Open an exemplar's image and select it there, if it is a picked one. */
async function openExemplar(e) {
  closeExemPanel();
  const i = images.findIndex((im) => im.name === e.image);
  if (i < 0) { flash(`${e.image} is not in this project`); return; }
  if (i !== idx || view !== "editor") await go(i);
  if (e.id != null) {
    const k = exems.findIndex((x) => x.id === e.id);
    if (k >= 0) {
      sel = { kind: "exem", i: k, picked: true };
      multi = [];
      render();
    }
  }
}

el.exemcount.addEventListener("click", () => (el.exemPanel.hidden ? openExemPanel() : closeExemPanel()));
window.addEventListener("mousedown", (e) => {
  if (!el.exemPanel.hidden && !e.target.closest("#exemPanel, #exemcount")) closeExemPanel();
}, true);
el.exemPanel.addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Escape") { e.preventDefault(); closeExemPanel(); el.exemcount.focus(); }
});

// ---------------------------------------------------------------- small commands

/** Zoom about a point in viewport pixels; the centre when none is given. */
function zoomBy(factor, cx, cy) {
  if (!natW) return;
  if (cx === undefined) { cx = el.viewport.clientWidth / 2; cy = el.viewport.clientHeight / 2; }
  const before = scale();
  zoom = Math.min(20, Math.max(1, zoom * factor));
  const after = scale();
  panX = cx - (cx - panX) * (after / before);
  panY = cy - (cy - panY) * (after / before);
  applyTransform();
  render();
  followPointer();
}

let boxesHidden = false;
function toggleBoxes() {
  boxesHidden = !boxesHidden;
  if (boxesHidden) { sel = null; drag = null; }
  el.viewport.classList.toggle("boxes-hidden", boxesHidden);
  flash(boxesHidden ? "Boxes hidden: h shows them" : "Boxes shown");
  render();
}

/** The held twin of toggleBoxes: boxes disappear for as long as the key is
    down, to see what is underneath, and come back on release. */
let peeking = false;
function peek(down) {
  if (down && (drag || draft)) return;       // not in the middle of an edit
  peeking = down;
  render();
}

function toggleMode() {
  setMode(mode === "exemplar" ? "annotate" : "exemplar");
}

function escapeKey() {
  if (!el.exemPanel.hidden) { closeExemPanel(); return; }
  if (!el.classMenu.hidden) { closeClassMenu(); return; }
  if (!el.stageMenu.hidden) { closeStageMenu(); return; }
  if (!el.flagMenu.hidden) { closeFlagMenu(); return; }
  if (commentPlacing) { cancelCommentPlacement(); flash("No comment placed"); return; }
  if (openComment) { closeCommentPopup(); return; }
  if (marqueeArmed || marquee) { disarmMarquee(); render(); flash("Area select off"); return; }
  if (draft) { draft = null; render(); flash("Box cancelled"); return; }
  if (multi.length) { multi = []; render(); return; }
  if (sel) { sel = null; render(); return; }
  if (scan.on) { stopScan("Scanning stopped"); return; }
  backToGrid();
}

function focusSearch() {
  el.search.focus();
  el.search.select();
}

let flashTimer = null;
/** A short-lived message over the image, for things that need no answer. */
function flash(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add("on");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.toast.classList.remove("on"), 1600);
}

// ---------------------------------------------------------------- threshold

function markPending() {
  const parsed = parseFloat(el.thresh.value);
  const valid = Number.isFinite(parsed) && parsed >= 0 && parsed <= 1;
  el.thresh.classList.toggle("bad", !valid);
  el.applyThresh.classList.toggle("pending", valid && parsed !== threshold);
}

function applyThreshold() {
  const parsed = parseFloat(el.thresh.value);
  if (!Number.isFinite(parsed) || parsed < 0 || parsed > 1) {
    el.thresh.classList.add("bad");
    return;
  }
  threshold = parsed;
  imageStatsChanged();               // the grid counts sam3 boxes at this threshold
  el.thresh.value = parsed.toFixed(2);
  el.thresh.classList.remove("bad");
  el.applyThresh.classList.remove("pending");
  if (sel && sel.kind === "pred" && preds[sel.i].score < threshold) sel = null;
  render();
}

el.applyThresh.addEventListener("click", applyThreshold);
el.thresh.addEventListener("input", markPending);
el.thresh.addEventListener("keydown", (e) => {
  // Enter applies. stopPropagation keeps a/d/f/0 from navigating while typing.
  if (e.key === "Enter") { e.preventDefault(); applyThreshold(); }
  e.stopPropagation();
});

window.addEventListener("resize", () => {
  if (view !== "editor") return;   // a hidden viewport measures 0 x 0
  if (natW) fitToViewport();
  strip.offset = stripHome();      // another width, another resting place
  scheduleStrip();
});
window.addEventListener("beforeunload", (e) => {
  if (!dirty) return;
  save();
  e.preventDefault();
  e.returnValue = "";
});

/** Messages go to the status slot of whichever screen is showing. */
function status(msg, bad) {
  const node = (el[view + "View"] || el.projectsView).querySelector(".status");
  node.textContent = msg;
  node.style.color = bad ? "#ff6b6b" : "";
  node.style.maxWidth = bad ? "80vw" : "40vw";
}

window.addEventListener("error", (e) => status("script error: " + e.message, true));
el.photo.addEventListener("error", () => status("image failed to load", true));

/** Fetch the project list without touching the current selection.
    Called on boot and again after a run is created. */
async function fetchProjects() {
  const r = await fetch(BASE + "api/projects");
  if (!r.ok) throw new Error(`api/projects returned ${r.status}`);
  const data = await r.json();
  projects = data.projects;
  defaultProject = data.default_project || "";
  if (!projects.length) throw new Error(`no projects under ${data.root}`);
  return data;
}

/** Adopt the single-key layout this replaced, once, so upgrading does not
    dump you back on the default dataset. A stored "" meant "no run", which is
    no longer a choice, so it is dropped rather than carried over. */
function migrateStorage() {
  const oldProject = localStorage.getItem("project");
  const oldRun = localStorage.getItem("run");
  if (oldProject !== null) {
    if (localStorage.getItem(K_PROJECT) === null)
      localStorage.setItem(K_PROJECT, oldProject);
    localStorage.removeItem("project");
  }
  if (oldRun !== null) {
    const owner = oldProject || defaultProject;
    if (oldRun && owner && localStorage.getItem(K_RUN(owner)) === null)
      localStorage.setItem(K_RUN(owner), oldRun);
    localStorage.removeItem("run");
  }
}

/** Drop per-project keys for projects that no longer exist, so renaming a
    folder does not leave a key behind for every rename ever made. */
function pruneStorage() {
  const live = new Set(projects.map((p) => p.name));
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.startsWith("al.run.") && !live.has(k.slice("al.run.".length)))
      localStorage.removeItem(k);
  }
}

// ---------------------------------------------------------------- routing
//
//   #/                      all projects
//   #/<project>             that project's images as a grid
//   #/<project>/<image>     the editor, on that image
//
// The hash is the only navigation state, so Back, reload and a pasted link
// all land where you expect. It lives after the '#', which means BASE (derived
// from the path) is unaffected behind the Open OnDemand proxy.

const K_CELL = "al.cell";

let filter = "all";       // grid tab: all, or a stage id
let lastOpened = null;    // image to ring and scroll to when back on the grid

const hashFor = (p, name) =>
  "#/" + (p ? encodeURIComponent(p) : "")
       + (name ? "/" + encodeURIComponent(name) : "");

function parseHash() {
  let parts;
  try {
    parts = location.hash.replace(/^#\/?/, "").split("/")
      .filter(Boolean).map(decodeURIComponent);
  } catch (err) {
    parts = [];               // malformed escape in a hand-edited URL
  }
  return { project: parts[0] || null, image: parts[1] || null };
}

function showView(name) {
  releaseAll();
  if (name !== "editor") stopScan();
  // Settings belong to the project open; they have no business on the list.
  if (name === "projects" && el.keysDialog.open) el.keysDialog.close();
  if (view === "editor" && name !== "editor") endVisit();
  view = name;
  for (const v of ["projects", "dataset", "editor"]) el[v + "View"].hidden = v !== name;
  // One run dropdown, moved to whichever header needs it, so there is never a
  // second copy to fall out of step.
  if (name === "dataset") el.dsRunSlot.appendChild(el.runControls);
  if (name === "editor") el.edRunSlot.appendChild(el.runControls);
  status("");
}

/** Hash changes are queued, so a fast double-click cannot interleave two
    routes and leave the editor on one image with the list of another. */
let routing = Promise.resolve();
window.addEventListener("hashchange", () => { routing = routing.then(route, route); });

async function route() {
  const want = parseHash();

  // Leaving (or moving within) the editor: the work on screen gets written
  // first. If that fails, put the URL back and stay; the error is showing.
  if (view === "editor" && dirty && !(await flush())) {
    history.replaceState(null, "", hashFor(project, images[idx] && images[idx].name));
    return;
  }

  if (!want.project) return showProjects();

  if (!projects.some((p) => p.name === want.project)) {
    try { await fetchProjects(); } catch (err) { /* reported below */ }
  }
  if (!projects.some((p) => p.name === want.project)) {
    history.replaceState(null, "", "#/");
    await showProjects();
    status(`no project named ${want.project}`, true);
    return;
  }

  if (want.project !== project || !images.length) {
    if (!(await openProject(want.project))) return;
  }

  if (!want.image) return showDataset();

  const i = images.findIndex((im) => im.name === want.image);
  if (i < 0) {
    history.replaceState(null, "", hashFor(project));
    showDataset();
    status(`no image named ${want.image} in ${project}`, true);
    return;
  }
  showEditor();
  await load(i);
}

function backToGrid() {
  location.hash = hashFor(project);   // route() saves before leaving
}

// ---------------------------------------------------------------- dom helpers

function h(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // never innerHTML: names are user data
  return n;
}

/** Thumbnails deliberately leave `run` off the URL: a thumbnail does not
    depend on it, and including it would refetch every tile on a run switch. */
const thumbUrl = (p, name, size) =>
  BASE + "api/thumb/" + encodeURIComponent(name) + "?"
  + new URLSearchParams({ project: p, size });

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// ---------------------------------------------------------------- projects

async function showProjects() {
  showView("projects");
  document.title = "annotator";
  try {
    const data = await fetchProjects();   // fresh: progress changes as you work
    el.rootPath.textContent = data.root;
  } catch (err) {
    el.projectCards.replaceChildren();
    status("cannot list projects: " + err.message, true);
    return;
  }
  renderProjectControls();
  renderProjects();
}

function renderProjects() {
  const last = localStorage.getItem(K_PROJECT);
  const frag = document.createDocumentFragment();

  const shown = visibleProjects();
  if (!shown.length && projects.length) {
    el.projectCards.replaceChildren(h("p", "empty", `No project name contains \u201c${el.projSearch.value.trim()}\u201d.`));
    return;
  }
  for (const p of shown) {
    const card = h("a", "card");
    card.href = hashFor(p.name);
    if (p.name === last) card.classList.add("last");

    const cover = h("div", "cover");
    const names = p.covers || [];
    for (let k = 0; k < 3; k++) {
      const cell = h("span", "cover-cell");     // an empty cell when there are fewer
      if (names[k]) {
        const img = h("img");
        img.alt = ""; img.loading = "lazy"; img.decoding = "async";
        img.src = thumbUrl(p.name, names[k], 256);
        img.title = names[k];
        cell.appendChild(img);
      }
      cover.appendChild(cell);
    }

    const body = h("div", "body");

    const title = h("div", "title");
    title.appendChild(h("h2", "", p.name));
    if (p.name === last) title.appendChild(h("span", "tag last", "last opened"));
    if (p.name === defaultProject) title.appendChild(h("span", "tag", "in config"));
    title.appendChild(h("span", "total", `${plural(p.images, "image", "images")} \u00b7 ${plural(p.boxes || 0, "box", "boxes")}`));

    // One segment per stage, in the project's order and colours; the stats
    // name every stage with images in it.
    const stages = p.stages || [], counts = p.stage_counts || {};
    const pct = (n) => (p.images ? (100 * n) / p.images : 0) + "%";
    const meter = h("div", "meter");
    const stats = h("div", "stats");
    const lastStage = stages[stages.length - 1];
    for (const st of stages) {
      const n = counts[st.id] || 0;
      if (!n && st !== lastStage) continue;           // signed off is always shown
      const seg = h("span");
      seg.style.width = pct(n);
      seg.style.background = st.color;
      meter.appendChild(seg);
      const line = h("span");
      const b = h("b", "", String(n));
      b.style.color = st.color;
      line.append(b, " " + st.name.toLowerCase());
      if (st === lastStage) line.append(` (${Math.round(100 * signedOffShare(p))} %)`);
      stats.appendChild(line);
    }
    meter.title = stages.map((st) => `${counts[st.id] || 0} ${st.name.toLowerCase()}`).join(", ");

    const runs = h("div", "runs");
    if (p.runs.length) {
      runs.append(plural(p.runs.length, "run", "runs") + ", latest ",
                  h("code", "", p.runs[0].name));
    } else {
      runs.textContent = "No SAM 3 runs yet";
    }

    body.append(title, meter, stats, runs);
    card.append(cover, body);
    frag.appendChild(card);
  }
  el.projectCards.replaceChildren(frag);
}

// ---------------------------------------------------------------- one project

/** Switch the whole page to a project: run dropdown, image list, exemplar
    set. Everything per-image is reset first - an index into the old list
    means nothing in the new one. Returns false if the list could not load. */
async function openProject(name) {
  endVisit();                  // logged against the project it happened in
  project = name;
  localStorage.setItem(K_PROJECT, project);
  fillRuns();

  images = [];
  boxes = []; preds = []; exems = []; exemSet = null;
  sel = null; dirty = false; idx = 0; natW = 0; lastOpened = null;
  clearTimeout(saveTimer);
  el.search.value = "";
  gridSel.clear();
  gridAnchor = -1;
  filter = "all";              // stage ids are the project's own
  loadContentFilter();
  renderFilterButton();
  closeFilterPanel();
  statsStale = false;
  status("scanning image folder\u2026");

  try {
    const r = await fetch(q("api/images", { min_score: threshold }));
    if (!r.ok) throw new Error(`api/images returned ${r.status}`);
    images = await r.json();
    loadGridSort();
    sortImages();
  } catch (err) {
    history.replaceState(null, "", "#/");
    await showProjects();
    status(`cannot open ${name}: ${err.message}`, true);
    return false;
  }
  await refreshExemplarSet();
  await loadProjectSettings();
  return true;
}

async function refreshExemplarSet() {
  exemSet = null;
  try {
    const r = await fetch(q("api/exemplars"));
    if (r.ok) exemSet = await r.json();
  } catch (err) {
    // Not fatal: annotating works without ever touching the manifest.
    console.warn("exemplar set unavailable:", err.message);
  }
  showSet();
}


function showDataset() {
  showView("dataset");
  sortImages();                      // counts may have changed in the editor
  if (statsStale) refreshImageStats();
  document.title = `${project} \u2014 annotator`;
  el.dsTitle.textContent = project;
  renderGrid();

  // Coming back from the editor: put the image you just left in view, ringed
  // in the "you are here" colour, and give it focus so Enter reopens it.
  const t = lastOpened && [...el.grid.children].find((c) => c.dataset.name === lastOpened);
  if (t) {
    t.scrollIntoView({ block: "center" });
    t.focus({ preventScroll: true });
  } else {
    el.gridScroll.scrollTop = 0;
  }
  if (!images.length) status(`no images in ${project}/images`, true);
}

function thumbTier() {
  const px = Number(el.cellSize.value) * (window.devicePixelRatio || 1);
  return px > 300 ? 512 : 256;
}

function renderGrid() {
  renderFilterButton();              // the class list may have loaded since
  const needle = el.search.value.trim().toLowerCase();
  const stages = stageList();
  if (filter !== "all" && !stages.some((st) => st.id === filter)) filter = "all";
  const counts = { all: 0 };
  const size = thumbTier();
  const frag = document.createDocumentFragment();

  images.forEach((im, i) => {
    if (needle && !im.name.toLowerCase().includes(needle)) return;
    if (!matchesContent(im)) return;
    const st = stageOf(im.stage);
    counts.all++;
    counts[st.id] = (counts[st.id] || 0) + 1;
    if (filter !== "all" && filter !== st.id) return;
    frag.appendChild(tile(im, i, st, size));
  });
  el.grid.replaceChildren(frag);

  // One tab per stage, in the project's order, counted under the name filter.
  const tabs = [{ id: "all", name: "All" }, ...stages].map((st) => {
    const b = h("button", "tab");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.dataset.f = st.id;
    b.setAttribute("aria-selected", String(st.id === filter));
    if (st.color) {
      const sw = h("i");
      sw.style.setProperty("--c", st.color);
      b.appendChild(sw);
    }
    b.append(st.name + " ", h("span", "n", String(counts[st.id] || 0)));
    return b;
  });
  el.tabs.replaceChildren(...tabs);
  renderGridSelection();

  const shown = el.grid.childElementCount;
  el.gridEmpty.hidden = shown > 0 || !images.length;
  if (!shown && images.length) {
    el.gridEmpty.textContent = contentFilterCount()
      ? "No image here matches the content filter. Change it, or pick another tab."
      : needle
        ? `No image names contain \u201c${el.search.value.trim()}\u201d here. Clear the filter or pick another tab.`
        : "No image is in this stage.";
  }
}

function tile(im, i, st, size) {
  const a = h("a", "tile" + (isFinal(st) ? " done" : ""));
  a.href = hashFor(project, im.name);
  a.title = `${im.name} \u2013 ${st.name}\n${contentSummary(im)}`;
  a.dataset.name = im.name;
  a.style.setProperty("--c", st.color);
  if (im.name === lastOpened) a.classList.add("last");

  const th = h("div", "thumb");
  const img = h("img");
  img.alt = ""; img.loading = "lazy"; img.decoding = "async";
  img.src = thumbUrl(project, im.name, size);
  const box = h("span", "tsel");
  box.setAttribute("role", "checkbox");
  box.setAttribute("aria-checked", "false");
  box.setAttribute("aria-label", `Select ${im.name}`);
  box.title = "select (shift: the run from the last one; ctrl click on a tile also selects)";
  th.append(img, box, h("span", "idx", String(i + 1)));

  // Done with no boxes is a confirmed negative, which is worth saying out
  // loud: it is a training example, not a forgotten image.
  let chip = "";
  if (isFinal(st)) chip = im.boxes ? "\u2713 " + plural(im.boxes, "box", "boxes") : "\u2713 negative";
  else if (im.boxes) chip = plural(im.boxes, "box", "boxes");
  if (chip) th.appendChild(h("span", "chip", chip));
  if (im.flags && im.flags.length) {
    th.appendChild(h("span", "fl", "\u2691 " + (im.flags.length === 1 ? flagLabel(im.flags[0]) : im.flags.length)));
  }

  a.append(th, h("div", "bar"), h("div", "cap", im.name));
  return a;
}

// A cover that cannot be decoded leaves the dark panel, not a broken-image icon.
el.projectCards.addEventListener("error", (e) => {
  if (e.target.tagName === "IMG") e.target.style.visibility = "hidden";
}, true);

// Thumbnail failures bubble as capture-phase error events on the grid.
el.grid.addEventListener("error", (e) => {
  if (e.target.tagName === "IMG") e.target.closest(".tile")?.classList.add("broken");
}, true);

el.tabs.addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  filter = b.dataset.f;
  renderGrid();
});

el.search.addEventListener("input", renderGrid);
el.search.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { el.search.value = ""; renderGrid(); el.search.blur(); }
  e.stopPropagation();
});

function applyCell() {
  el.grid.style.setProperty("--cell", el.cellSize.value + "px");
}
el.cellSize.addEventListener("input", () => {
  const before = thumbTier.last;
  applyCell();
  localStorage.setItem(K_CELL, el.cellSize.value);
  // Only re-render when the tile size crosses a thumbnail tier; otherwise
  // the CSS variable alone resizes everything.
  thumbTier.last = thumbTier();
  if (before !== thumbTier.last) renderGrid();
});

// ---------------------------------------------------------------- editor

function showEditor() {
  showView("editor");
  el.backName.textContent = project;
  el.back.href = hashFor(project);
}

// ---------------------------------------------------------------- runs

/** Fill the run dropdown for the current project and resolve the selection.

    Every entry is a run that exists on disk. The YAML's run.name is not
    consulted: it says where the next batch job writes, which is unrelated to
    what you are looking at now.

    There is no "(no run)" entry: whether predictions are SHOWN is a view
    question, while which run is selected decides where exemplars are written -
    two different things that should not share one control. A project with no
    runs still leaves `run` null, because annotating needs no run at all;
    that is an empty state, not something the user picked. */
function fillRuns() {
  const p = projects.find((x) => x.name === project);
  const runs = p ? p.runs : [];              // already newest-first
  const existing = runs.map((r) => r.name);

  el.runSel.innerHTML = "";
  for (const r of runs) {
    const o = document.createElement("option");
    o.value = r.name;
    o.textContent = r.predictions
      ? `${r.name} \u2014 ${r.predictions} predictions`
      : `${r.name} \u2014 no predictions yet`;
    el.runSel.appendChild(o);
  }
  if (!existing.length) {
    const o = document.createElement("option");
    o.value = "";
    o.textContent = "(no runs yet)";
    o.disabled = true;
    el.runSel.appendChild(o);
  }
  const mk = document.createElement("option");
  mk.value = NEW_RUN;
  mk.textContent = "\uFF0B New run\u2026";
  el.runSel.appendChild(mk);

  const stored = localStorage.getItem(K_RUN(project));
  run = existing.includes(stored) ? stored
      : existing.length ? existing[0]         // most recently modified
      : null;
  el.runSel.value = run || "";
  el.delRun.disabled = !run;                  // empty state has nothing to delete
  if (run) localStorage.setItem(K_RUN(project), run);
  else localStorage.removeItem(K_RUN(project));
}

/** A run only changes predictions and exemplars, never the image list, so
    the editor stays on the image you were looking at instead of jumping back
    to the first one. */
async function runChanged() {
  closeExemPanel();
  clearHistories();
  await refreshExemplarSet();
  imageStatsChanged();               // sam3 and exemplar counts are per run
  if (view === "editor" && images[idx]) await load(idx);
}

/** Name and create a run, then select it.

    Validated client-side with the same rule the server enforces, so an obvious
    mistake does not cost a round trip - but the server check is the real one. */
async function createRun() {
  const restore = () => { el.runSel.value = run || ""; };
  const name = (window.prompt("Name for the new run:") || "").trim();
  if (!name) return restore();
  if (name === "." || name === ".." || /[/\\\u0000]/.test(name)) {
    status("invalid run name: no / or \\", true);
    return restore();
  }
  if (!(await flush())) return restore();

  let created;
  try {
    const r = await fetch(
      BASE + "api/run?" + new URLSearchParams({ project, run: name }),
      { method: "POST" });
    if (!r.ok) {
      const detail = await r.text();
      status(`could not create run: ${r.status} ${detail}`, true);
      return restore();
    }
    created = await r.json();
  } catch (err) {
    status("could not create run: " + err.message, true);
    return restore();
  }

  localStorage.setItem(K_RUN(project), created.run);
  await fetchProjects();      // the new run has to appear in the list
  fillRuns();
  await runChanged();
}

/** Delete the selected run and everything in it.

    The prompt is scaled to what is actually at risk. Predictions, overlays and
    composites are regenerable - a confirm is enough. Picked exemplars are hand
    work that no rerun brings back, so a set with picks in it makes you type the
    run name. Annotations and flags are project-scoped and cannot be touched
    from here at all, which the message says explicitly so nobody has to guess. */
async function deleteRun() {
  if (!run) return;
  const name = run;

  const meta = (projects.find((x) => x.name === project) || { runs: [] })
    .runs.find((r) => r.name === name);
  let picked = 0;
  try {
    const r = await fetch(q("api/exemplars"));
    if (r.ok) picked = (await r.json()).count || 0;
  } catch (err) {
    // Advisory only: a manifest we cannot read still deserves the strict path.
    picked = -1;
  }

  const what = `run "${name}"\n\n`
    + `${meta ? meta.predictions : 0} prediction file(s)\n`
    + `${picked < 0 ? "an unreadable" : picked} exemplar manifest entr`
    + `${picked === 1 ? "y" : "ies"}\n\n`
    + `Annotations and flags are NOT affected.`;

  if (picked !== 0) {
    const typed = window.prompt(
      `This permanently deletes ${what}\n\nType the run name to confirm:`);
    if ((typed || "").trim() !== name) { status("delete cancelled"); return; }
  } else if (!window.confirm(`Permanently delete ${what}`)) {
    return;
  }

  if (!(await flush())) return;
  let done;
  try {
    const r = await fetch(
      BASE + "api/run?" + new URLSearchParams(
        { project, run: name, confirm: name }),
      { method: "DELETE" });
    if (!r.ok) {
      status(`could not delete run: ${r.status} ${await r.text()}`, true);
      return;
    }
    done = await r.json();
  } catch (err) {
    status("could not delete run: " + err.message, true);
    return;
  }

  // Forget the selection before refilling, or the fallback would try to
  // reselect a run that no longer exists.
  localStorage.removeItem(K_RUN(project));
  await fetchProjects();
  fillRuns();
  await runChanged();
  status(`deleted ${name} (${done.files} files)`);
}

/** Save before tearing anything down; a failed save aborts the switch.
    save() reports failure by returning false, not by throwing, so its result
    has to be passed on rather than assumed. */
async function flush() {
  if (!dirty) return true;
  try { return await save(); }
  catch (err) {
    status("not switching - save failed: " + err.message, true);
    return false;
  }
}

async function switchRun(next) {
  if (next === NEW_RUN) return createRun();
  if (!(await flush())) { el.runSel.value = run || ""; return; }
  run = next || null;
  el.delRun.disabled = !run;
  if (run) localStorage.setItem(K_RUN(project), run);
  else localStorage.removeItem(K_RUN(project));
  await runChanged();
}

el.runSel.addEventListener("change", () => {
  // Hand the keyboard back to the editor; a focused <select> would otherwise
  // swallow every shortcut until you click the image.
  el.runSel.blur();
  switchRun(el.runSel.value);
});
el.delRun.addEventListener("click", deleteRun);

// ---------------------------------------------------------------- boot

(async function main() {
  const t0 = parseFloat(el.thresh.value);
  if (Number.isFinite(t0)) threshold = t0;
  setMode("annotate");
  toggleHelp(localStorage.getItem(K_HELP) !== "0");
  await loadSettings();

  const cell = Number(localStorage.getItem(K_CELL));
  if (cell >= Number(el.cellSize.min) && cell <= Number(el.cellSize.max))
    el.cellSize.value = String(cell);
  applyCell();
  thumbTier.last = thumbTier();

  try {
    await fetchProjects();
  } catch (err) {
    showView("projects");
    status("cannot list projects: " + err.message, true);
    return;
  }
  migrateStorage();
  pruneStorage();
  await route();
})();
</script>
</body>
</html>
