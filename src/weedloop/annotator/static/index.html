    if (swallow && e.button === swallow.button && performance.now() < swallow.until
        && !(type === "click" && e.detail === 0)) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    if (type === "mouseup") release("button" + e.button);
    if ((e.button === 3 || e.button === 4) && (boundButtons.has(e.button) || el.keysDialog.open)) {
      e.preventDefault();
    }
    if (type === "contextmenu" && boundButtons.has(2) && overImage(e)) e.preventDefault();
  }, true);
}

let wheelState = { input: null, acc: 0, quietUntil: 0 };
window.addEventListener("wheel", (e) => {
  if (el.keysDialog.open) { captureWheel(e); return; }
  if (!overImage(e)) return;                 // lists and pages scroll as always
  e.preventDefault();                        // the image owns its wheel: no page zoom
  const input = wheelInputOf(e);
  const id = input && commandFor(input);
  if (!id) return;
  const cmd = COMMANDS[id];
  const unit = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1;
  const px = Math.abs(e.deltaY || e.deltaX) * unit;
  if (cmd.kind === "amount") { cmd.run({ amount: px, ...pointerCtx(e) }); return; }
  // A trackpad sends a stream of small deltas where a mouse sends one per
  // notch, so for ordinary commands the distance is summed into steps.
  if (wheelState.input !== input) wheelState = { input, acc: 0, quietUntil: 0 };
  wheelState.acc += px;
  if (wheelState.acc < WHEEL_NOTCH / 2) return;
  wheelState.acc = 0;
  const t = performance.now();
  if (!cmd.repeat && t < wheelState.quietUntil) return;
  wheelState.quietUntil = t + 300;
  cmd.run(pointerCtx(e));
}, { capture: true, passive: false });

// ---------------------------------------------------------------- pointer speeds

/** Zoom by a scroll distance, or by one notch's worth for a key press. The
    distance is turned into a factor continuously - exp, not steps - so a
    trackpad's many small deltas add up to the same zoom as one notch. */
function zoomStep(direction, ctx = {}) {
  const amount = ctx.amount === undefined ? WHEEL_NOTCH : ctx.amount;
  const perPx = Math.log(ZOOM_PER_NOTCH) / WHEEL_NOTCH;
  zoomBy(Math.exp(direction * amount * perPx * prefs.pointer.zoom_speed), ctx.x, ctx.y);
}

// ---------------------------------------------------------------- help

function renderHelp() {
  const frag = document.createDocumentFragment();
  for (const id of Object.keys(COMMANDS)) {
    const c = COMMANDS[id];
    if (c.screen !== "editor" && c.screen !== "project") continue;
    const inputs = [...tables[c.screen]].filter(([, v]) => v === id).map(([k]) => k);
    if (!inputs.length) continue;
    const keys = h("span", "keys");
    inputs.forEach((k, i) => {
      if (i) keys.append(" ");
      keys.appendChild(h("kbd", "", keyLabel(k)));
    });
    frag.append(keys, h("span", "", c.label + (c.kind === "hold" ? " (hold)" : "")));
  }
  el.helpKeys.replaceChildren(frag);
  el.helpMouse.textContent = prefs.pointer.draw === "drag"
    ? "Drawing: drag on empty space for a new box, on a box to move it, on a corner to resize."
    : "Drawing: click on empty space to start a box and click again to finish it (esc cancels). "
      + "Drag a box to move it, a corner to resize it.";
}

const K_HELP = "al.help";
function toggleHelp(force) {
  const show = force !== undefined ? force : el.hint.hidden;
  el.hint.hidden = !show;
  localStorage.setItem(K_HELP, show ? "1" : "0");
}

// ---------------------------------------------------------------- settings dialog
//
// Pointer speeds, then every command with its inputs. + listens for the next
// input of any kind - key, any mouse button, the wheel - until something is
// pressed; only the "cancel" button next to it and Esc are left alone. An
// input that already belongs to another command is not taken without asking.
// Every change is saved at once to the user's own settings file.

const K_TAB = "al.settingsTab";
let settingsTab = localStorage.getItem(K_TAB) === "input" ? "input" : "appearance";

let capture = null;          // {id, conflict?: {input, owner}, error?: string}
let swallowKeyUp = null;     // the key that just finished a capture
let escapeHandled = false;   // an Escape that cancelled a capture, not the dialog
let wheelCaptureQuiet = 0;   // the rest of a scroll that was just captured
let keysReturnFocus = null;

function toggleKeys() {
  if (el.keysDialog.open) { el.keysDialog.close(); return; }
  if (view !== "dataset" && view !== "editor") return;   // settings live in a project
  keysReturnFocus = document.activeElement;
  releaseAll();
  capture = null;
  el.keysDialog.showModal();
  drawPointer();                             // the crosshair hides behind a dialog
  renderKeys();
  (settingsTab === "input" ? el.keysFilter : el.setTabs.querySelector('[aria-selected="true"]')).focus();
}

function focusKey(f) {
  if (!f) return;
  const n = el.keysList.querySelector(`[data-f="${CSS.escape(f)}"]`);
  if (n) n.focus();
}

function startCapture(id) {
  capture = { id };
  renderKeys();
  focusKey(`cap:${id}`);
}

function cancelCapture() {
  const id = capture && capture.id;
  capture = null;
  renderKeys();
  focusKey(`add:${id}`);
}

function captureInput(input) {
  const id = capture.id;
  const why = refusal(id, input);
  if (why) {
    capture = { id, error: `Not ${keyLabel(input)}: ${why}` };
    renderKeys();
    focusKey(`cap:${id}`);
    return;
  }
  const owner = ownerOf(COMMANDS[id].screen, input);
  if (owner === id) {
    capture = null;
    renderKeys();
    focusKey(`add:${id}`);
    keyStatus(`${keyLabel(input)} already does this.`);
    return;
  }
  if (owner) {
    capture = { id, conflict: { input, owner } };
    renderKeys();
    focusKey(`take:${id}`);
    return;
  }
  assign(id, input);
}

/** Give `input` to `id`, taking it from `from` first when there is a clash. */
function assign(id, input, from) {
  if (from) {
    setKeys(from, keysOf(from).filter((k) => k !== input));
    buildTables();              // so `input` no longer counts as taken
  }
  setKeys(id, [...keysOf(id), input]);
  capture = null;
  saveSettings();
  focusKey(`add:${id}`);
}

/** While listening, every press of every mouse button is the answer -
    wherever the pointer is, on a button or not - except on "cancel". */
function captureMouse(e) {
  if (!capture || capture.conflict) return;  // clicking around the dialog as usual
  if (e.target.closest && e.target.closest("[data-exempt]")) return;
  const input = mouseInputOf(e);
  if (!input) return;
  e.preventDefault();
  e.stopPropagation();
  swallow = { button: e.button, until: performance.now() + 2000 };
  captureInput(input);
}

function captureWheel(e) {
  const t = performance.now();
  if (t < wheelCaptureQuiet) {               // the tail of a scroll just captured
    e.preventDefault();
    wheelCaptureQuiet = t + 400;
    return;
  }
  if (!capture || capture.conflict) return;  // scrolling the list, as usual
  const input = wheelInputOf(e);
  if (!input) return;
  e.preventDefault();
  e.stopPropagation();
  wheelCaptureQuiet = t + 400;
  captureInput(input);
}

el.keysDialog.addEventListener("keydown", (e) => {
  if (!capture) return;                      // typing in the filter, tabbing
  if (e.key === "Escape") {
    e.preventDefault();
    e.stopPropagation();
    escapeHandled = true;
    setTimeout(() => { escapeHandled = false; });
    cancelCapture();
    return;
  }
  if (capture.conflict) return;              // Tab and Enter work the two buttons
  e.preventDefault();
  e.stopPropagation();
  const combo = comboOf(e);
  if (!combo) return;                        // a modifier alone: wait for the rest
  swallowKeyUp = e.code || e.key;
  captureInput(combo);
}, true);

// The keyup of a captured Space or Enter would otherwise click whatever
// button has focus by then - usually "+", which starts listening again.
el.keysDialog.addEventListener("keyup", (e) => {
  if (swallowKeyUp && (e.code || e.key) === swallowKeyUp) {
    e.preventDefault();
    e.stopPropagation();
    swallowKeyUp = null;
  }
}, true);

el.keysDialog.addEventListener("cancel", (e) => {
  // Escape closes the dialog, except when it is cancelling a capture.
  if (capture || escapeHandled) {
    e.preventDefault();
    if (capture) cancelCapture();
  }
});

el.keysDialog.addEventListener("close", () => {
  capture = null;
  el.keysFilter.value = "";
  schedulePointer();
  if (keysReturnFocus && keysReturnFocus.isConnected) keysReturnFocus.focus();
});

el.keysClose.addEventListener("click", () => el.keysDialog.close());
el.setTabs.addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b || b.dataset.tab === settingsTab) return;
  settingsTab = b.dataset.tab;
  localStorage.setItem(K_TAB, settingsTab);
  capture = null;
  el.keysList.scrollTop = 0;
  renderKeys();
});
el.keysFilter.addEventListener("input", () => { capture = null; renderKeys(); });
el.keysResetAll.addEventListener("click", () => {
  if (settingsTab === "appearance") {
    if (!window.confirm("Reset every box, cursor, crosshair and minimap setting to the "
                        + "defaults? Class names are kept.")) return;
    prefs.styles = {};
    prefs.minimap = { ...MINIMAP_DEFAULTS };
    mmBase = null;
    for (const id of Object.keys(projectPrefs.classes)) setClass(Number(id), { style: undefined });
    saveSettings();
    if (project) saveProjectSettings();
    return;
  }
  if (!window.confirm("Reset every shortcut and both speeds to the defaults?")) return;
  prefs.bindings = {};
  prefs.pointer = { ...POINTER_DEFAULTS };
  capture = null;
  saveSettings();
});
for (const b of document.querySelectorAll(".open-keys")) {
  b.addEventListener("click", () => toggleKeys());
}

function keyMatches(id, needle) {
  if (!needle) return true;
  const c = COMMANDS[id];
  return [c.label, c.group || "", SCREENS[c.screen]]
      .some((s) => s.toLowerCase().includes(needle))
    || keysOf(id).some((k) => keyLabel(k).toLowerCase().includes(needle)
                             || k.toLowerCase() === needle);
}

function changeCount() {
  return Object.keys(prefs.bindings).filter((id) => COMMANDS[id]).length
    + Object.keys(POINTER_DEFAULTS).filter((k) => prefs.pointer[k] !== POINTER_DEFAULTS[k]).length;
}

function renderKeys() {
  if (!el.keysDialog.open) return;
  const active = document.activeElement && document.activeElement.dataset
    ? document.activeElement.dataset.f : null;
  for (const b of el.setTabs.querySelectorAll(".tab")) {
    b.setAttribute("aria-selected", String(b.dataset.tab === settingsTab));
  }
  el.keysFilter.hidden = settingsTab !== "input";
  if (settingsTab === "appearance") {
    renderAppearance();
    const n = appearanceChangeCount();
    el.keysChanged.textContent = n ? `${plural(n, "style", "styles")} changed` : "All default styles";
    el.keysResetAll.disabled = !n;
    if (active) focusKey(active);
    return;
  }
  const needle = el.keysFilter.value.trim().toLowerCase();
  const frag = document.createDocumentFragment();

  if (!needle || "mouse pointer speed pan zoom wheel".includes(needle)) {
    frag.appendChild(speedSection());
  }
  for (const [screen, title] of Object.entries(SCREENS)) {
    const ids = Object.keys(COMMANDS)
      .filter((id) => COMMANDS[id].screen === screen && keyMatches(id, needle));
    if (!ids.length) continue;
    const sec = h("section", "keys-screen");
    sec.appendChild(h("h3", "", `Shortcuts: ${title.toLowerCase()}`));
    let group = null;
    for (const id of ids) {
      const g = COMMANDS[id].group;
      if (g && g !== group) sec.appendChild(h("h4", "", (group = g)));
      sec.appendChild(keyRow(id));
    }
    frag.appendChild(sec);
  }
  el.keysList.replaceChildren(frag);
  if (!el.keysList.childElementCount) {
    el.keysList.appendChild(h("p", "empty",
      `No setting or shortcut matches \u201c${el.keysFilter.value.trim()}\u201d.`));
  }

  const n = changeCount();
  el.keysChanged.textContent = n ? `${plural(n, "change", "changes")} from the defaults`
                                 : "All defaults";
  el.keysResetAll.disabled = !n;
  if (active) focusKey(active);
}

function keyRow(id) {
  const c = COMMANDS[id];
  const row = h("div", "keyrow" + (isChanged(id) ? " changed" : ""));

  const label = h("span", "keylabel", c.label);
  if (c.kind === "hold") label.appendChild(h("span", "tag", "while held"));
  if (c.kind === "drag") label.appendChild(h("span", "tag", "drag"));
  if (isChanged(id)) label.appendChild(h("span", "tag changed", "changed"));

  const chips = h("span", "chips");
  for (const input of keysOf(id)) {
    const lost = shadowed.find((s) => s.id === id && s.input === input);
    const chip = h("span", "chip-key" + (lost ? " shadowed" : ""));
    chip.appendChild(h("kbd", "", keyLabel(input)));
    if (lost) chip.title = `Not active: ${keyLabel(input)} ${lost.why}`;
    const x = h("button", "", "\u00d7");
    x.type = "button";
    x.dataset.f = `rm:${id}:${input}`;
    x.setAttribute("aria-label", `Remove ${keyLabel(input)} from ${c.label}`);
    x.addEventListener("click", () => {
      setKeys(id, keysOf(id).filter((k) => k !== input));
      capture = null;
      saveSettings();
      focusKey(`add:${id}`);
    });
    chip.appendChild(x);
    chips.appendChild(chip);
  }
  if (capture && capture.id === id && !capture.conflict) {
    const cap = h("span", "chip-key capturing");
    cap.tabIndex = -1;
    cap.dataset.f = `cap:${id}`;
    cap.appendChild(h("span", "", c.kind === "drag"
      ? "Press the mouse button to drag with\u2026"
      : "Press a key, click any button, or scroll\u2026"));
    const stop = h("button", "", "cancel");
    stop.type = "button";
    stop.dataset.exempt = "";
    stop.addEventListener("click", () => cancelCapture());
    cap.appendChild(stop);
    chips.appendChild(cap);
  } else {
    const add = h("button", "add-key", "+");
    add.type = "button";
    add.dataset.f = `add:${id}`;
    add.title = "Add a shortcut";
    add.setAttribute("aria-label", `Add a shortcut for ${c.label}`);
    add.addEventListener("click", () => startCapture(id));
    chips.appendChild(add);
  }

  const actions = h("span", "keyactions");
  if (isChanged(id)) {
    const d = defaultsOf(id);
    const reset = h("button", "badge", "reset");
    reset.type = "button";
    reset.dataset.f = `reset:${id}`;
    reset.title = d.length ? `Back to the default: ${d.map(keyLabel).join(", ")}`
                           : "Back to the default: no shortcut";
    reset.addEventListener("click", () => {
      delete prefs.bindings[id];
      capture = null;
      saveSettings();
      focusKey(`add:${id}`);
    });
    actions.appendChild(reset);
  }

  row.append(label, chips, actions);
  if (capture && capture.id === id && (capture.conflict || capture.error)) {
    row.appendChild(captureNote(id));
  } else if (c.essential && !activeKeys(id).length) {
    row.appendChild(h("div", "keynote bad", `Nothing is bound, so ${c.essential}.`));
  }
  return row;
}

function captureNote(id) {
  const note = h("div", "keynote");
  if (capture.error) { note.textContent = capture.error; return note; }
  const { input, owner } = capture.conflict;
  const o = COMMANDS[owner];
  const where = o.screen === COMMANDS[id].screen ? "" : ` (${SCREENS[o.screen].toLowerCase()})`;
  const msg = h("span", "msg");
  msg.append(h("kbd", "", keyLabel(input)),
             ` already runs \u201c${o.label}\u201d${where}.`);
  if (o.essential && activeKeys(owner).length === 1) {
    msg.append(` Moving it leaves that with nothing, so ${o.essential} until you give it another.`);
  }
  note.appendChild(msg);
  const take = h("button", "badge", "move it here");
  take.type = "button";
  take.dataset.f = `take:${id}`;
  take.addEventListener("click", () => assign(id, input, owner));
  const keep = h("button", "badge", "cancel");
  keep.type = "button";
  keep.dataset.f = `keep:${id}`;
  keep.addEventListener("click", () => cancelCapture());
  note.append(take, keep);
  return note;
}

const fmtSpeed = (v) => `${Number(v).toFixed(1)}\u00d7`;

function speedSection() {
  const sec = h("section", "keys-screen");
  sec.appendChild(h("h3", "", "Mouse"));
  sec.append(
    speedRow("pan_gain", "Pan speed",
             "How far the image moves when you drag it. At 1\u00d7 it stays under the cursor."),
    speedRow("zoom_speed", "Zoom speed",
             "How much one wheel notch, or one zoom key press, zooms in or out."),
    drawModeRow());
  return sec;
}

function drawModeRow() {
  const changed = prefs.pointer.draw !== POINTER_DEFAULTS.draw;
  const row = h("div", "keyrow speed" + (changed ? " changed" : ""));
  const lab = h("span", "keylabel");
  lab.append("Drawing a new box",
             h("span", "sub", "Either way, panning and zooming in the middle of a box leave it open."));
  const opts = h("span", "chips");
  for (const [value, text] of [["clicks", "two clicks"], ["drag", "press, drag, release"]]) {
    const l = h("label", "radio");
    const r = h("input");
    r.type = "radio";
    r.name = "drawmode";
    r.value = value;
    r.checked = prefs.pointer.draw === value;
    r.dataset.f = `draw:${value}`;
    r.addEventListener("change", () => {
      prefs.pointer.draw = value;
      draft = null;              // a box half-drawn the other way is abandoned
      saveSettings();
    });
    l.append(r, " " + text);
    opts.appendChild(l);
  }
  row.append(lab, opts, h("span", "keyactions"));
  return row;
}

function speedRow(key, label, hint) {
  const row = h("div", "keyrow speed" + (prefs.pointer[key] !== POINTER_DEFAULTS[key] ? " changed" : ""));
  const lab = h("label", "keylabel");
  lab.htmlFor = `speed-${key}`;
  lab.append(label, h("span", "sub", hint));

  const wrap = h("span", "chips");
  const r = h("input");
  r.type = "range";
  r.id = `speed-${key}`;
  r.min = "0.1";
  r.max = "3";
  r.step = "0.1";
  r.value = String(prefs.pointer[key]);
  r.dataset.f = `speed:${key}`;
  const out = h("output", "speedval", fmtSpeed(prefs.pointer[key]));
  out.htmlFor = r.id;
  // Applied while dragging the slider, so it can be tried on the image right
  // away; saved when the slider is let go.
  r.addEventListener("input", () => {
    prefs.pointer[key] = Math.round(Number(r.value) * 10) / 10;
    out.textContent = fmtSpeed(prefs.pointer[key]);
  });
  r.addEventListener("change", () => saveSettings());
  wrap.append(r, out);

  const actions = h("span", "keyactions");
  if (prefs.pointer[key] !== POINTER_DEFAULTS[key]) {
    const reset = h("button", "badge", "reset");
    reset.type = "button";
    reset.dataset.f = `speedreset:${key}`;
    reset.title = `Back to ${fmtSpeed(POINTER_DEFAULTS[key])}`;
    reset.addEventListener("click", () => {
      prefs.pointer[key] = POINTER_DEFAULTS[key];
      saveSettings();
      focusKey(`speed:${key}`);
    });
    actions.appendChild(reset);
  }
  row.append(lab, wrap, actions);
  return row;
}

function keyStatus(msg, bad) {
  el.keysStatus.textContent = msg;
  el.keysStatus.classList.toggle("bad", !!bad);
}

/** Apply at once, then save. Saves go out one at a time and in order, each
    carrying the state at the moment of the change. */
let settingsSaves = Promise.resolve();
function saveSettings() {
  buildTables();
  renderKeys();
  renderHelp();
  applyAppearance();
  const body = JSON.stringify(prefs);
  settingsSaves = settingsSaves.then(async () => {
    try {
      const r = await fetch(BASE + "api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body,
      });
      if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
      prefsPath = (await r.json()).path || prefsPath;
      keyStatus(`Saved to ${prefsPath}`);
    } catch (err) {
      keyStatus(`Not saved (${err.message}). The change works in this tab until you reload.`, true);
    }
  });
}

async function loadSettings() {
  try {
    const r = await fetch(BASE + "api/settings");
    if (!r.ok) throw new Error(`api/settings returned ${r.status}`);
    const data = await r.json();
    prefs = {
      version: data.version || 1,
      bindings: data.bindings || {},
      pointer: { ...POINTER_DEFAULTS, ...(data.pointer || {}) },
      styles: data.styles || {},
      minimap: { ...MINIMAP_DEFAULTS, ...(data.minimap || {}) },
    };
    prefsPath = data.path || "";
    const msg = data.warning || data.note || (prefsPath ? `Saved to ${prefsPath}` : "");
    keyStatus(msg, !!data.warning);
    if (data.warning) console.warn(data.warning);
  } catch (err) {
    keyStatus(`Using the default settings: ${err.message}`, true);
  }
  buildTables();
  renderHelp();
  applyAppearance();
}

// ---------------------------------------------------------------- appearance
//
// How boxes, the cursor and the crosshair look. Your own boxes are drawn in
// the style of their class; sam3 predictions, approved sam3 boxes and
// exemplars keep a style of their own, so where a box came from stays
// visible whatever the class colours are. Class styles belong to the project
// (class ids mean different things in different projects); everything else
// is personal. Defaults live here; the files hold only what you changed.
//
// All widths are screen pixels: boxes use non-scaling strokes, and the
// cursor and crosshair are drawn in a layer that is not zoomed at all.

const PALETTE = ["#a855f7", "#22c55e", "#f472b6", "#14b8a6",
                 "#818cf8", "#a3e635", "#e879f9", "#94a3b8"];

const STYLE_DEFAULTS = {
  prediction: { color: "#ff2d2d", fill: 0, width: 2, opacity: 1, line: "solid" },
  approved:   { color: "#5cc8ff", fill: 0, width: 2, opacity: 1, line: "dotted" },
  exemplar:   { color: "#ffb01f", fill: 0.1, width: 2, opacity: 1, line: "solid" },
  cursor:     { show: true, color: "#ffffff", width: 1.5, opacity: 1, line: "solid", size: 22 },
  crosshair:  { show: true, color: "#ffffff", width: 1, opacity: 0.5, line: "dashed" },
};
function classDefault(id) {
  return { color: PALETTE[id % PALETTE.length], fill: 0, width: 2, opacity: 1, line: "solid" };
}

const STYLE_KEYS = ["show", "color", "fill", "width", "opacity", "line", "size"];
const sameStyle = (a, b) => STYLE_KEYS.every((k) => a[k] === b[k]);

let projectPrefs = { version: 1, classes: {} };
let projectPrefsPath = "";
let seenClasses = new Set([0]);
let activeClass = 0;         // the class new boxes get; switching comes later

function styleOf(key) { return { ...STYLE_DEFAULTS[key], ...(prefs.styles[key] || {}) }; }
function classStyle(id) {
  const entry = projectPrefs.classes[String(id)];
  return entry && entry.style ? { ...entry.style } : classDefault(id);
}
function className(id) {
  const entry = projectPrefs.classes[String(id)];
  return entry && entry.name ? entry.name : `class ${id}`;
}
function classIds() {
  return [...new Set([...seenClasses, ...Object.keys(projectPrefs.classes).map(Number)])]
    .sort((a, b) => a - b);
}

/** The style a box is drawn with, by where it came from and, for your own
    boxes, by class. */
function styleFor(kind, b) {
  if (kind === "pred") return styleOf("prediction");
  if (kind === "exem") return styleOf("exemplar");
  return fromSam3(b) ? styleOf("approved") : classStyle(b.cls || 0);
}

/** Dash pattern in screen px, scaled with the width so a thick dotted line
    is still dotted rather than a row of touching blobs. */
function dashOf(st) {
  const w = st.width;
  if (st.line === "dashed") return { dash: `${Math.max(4, 3 * w)} ${Math.max(3, 2 * w)}`, cap: "butt" };
  if (st.line === "dotted") return { dash: `1 ${Math.max(6, 4.5 * w)}`, cap: "round" };
  return { dash: "none", cap: "butt" };
}

/** Selection is a wash of the box's own colour; it never touches the
    stroke, which is what says where a box came from. */
const selectedFill = (f) => Math.min(1, Math.max(0.16, f + 0.12));

function paint(r, st, opts = {}) {
  const d = dashOf(opts.draft ? { ...st, line: "dashed" } : st);
  r.style.stroke = st.color;
  r.style.strokeWidth = st.width + "px";
  r.style.strokeOpacity = st.opacity;
  r.style.strokeDasharray = d.dash;
  r.style.strokeLinecap = d.cap;
  r.style.fill = st.color;
  r.style.fillOpacity = opts.draft ? 0 : opts.selected ? selectedFill(st.fill) : st.fill;
  return r;
}

/** Everything that depends on styles, after any of them changes. */
function applyAppearance() {
  el.viewport.classList.toggle("custom-cursor", styleOf("cursor").show);
  render();
  renderLegend();
  drawPointer();
  scheduleMinimap();
}

// ---------------------------------------------------------------- cursor and crosshair
//
// Drawn in their own layer over the image, in screen pixels, following the
// pointer. Over a box or a corner the system cursor comes back, because its
// move and resize shapes say what a drag there will do; the crosshair lines
// stay. While panning, the system "grabbing" cursor shows instead.

let pointerAt = null;        // {x, y} in viewport px, or null when outside
let overBox = false;
let pointerFrame = 0;

function schedulePointer() {
  if (!pointerFrame) pointerFrame = requestAnimationFrame(drawPointer);
}

function setLine(node, show, st, x1, y1, x2, y2) {
  if (!show) { node.setAttribute("visibility", "hidden"); return; }
  const d = dashOf(st);
  node.setAttribute("visibility", "visible");
  node.setAttribute("x1", x1); node.setAttribute("y1", y1);
  node.setAttribute("x2", x2); node.setAttribute("y2", y2);
  node.style.stroke = st.color;
  node.style.strokeWidth = st.width + "px";
  node.style.strokeOpacity = st.opacity;
  node.style.strokeDasharray = d.dash;
  node.style.strokeLinecap = d.cap;
}

function drawPointer() {
  pointerFrame = 0;
  const on = view === "editor" && !!natW && !!pointerAt && !el.keysDialog.open;
  const ch = styleOf("crosshair"), cu = styleOf("cursor");
  const W = el.viewport.clientWidth, H = el.viewport.clientHeight;
  // A 1 px line on a whole pixel is smeared over two; centre odd widths on .5.
  const snap = (v, w) => (Math.round(w) % 2 ? Math.floor(v) + 0.5 : Math.round(v));
  const x = on ? snap(pointerAt.x, ch.width) : 0, y = on ? snap(pointerAt.y, ch.width) : 0;
  setLine(el.chV, on && ch.show, ch, x, 0, x, H);
  setLine(el.chH, on && ch.show, ch, 0, y, W, y);
  const showCursor = on && cu.show && !overBox;
  const cx = on ? snap(pointerAt.x, cu.width) : 0, cy = on ? snap(pointerAt.y, cu.width) : 0;
  const r = cu.size / 2;
  setLine(el.curV, showCursor, cu, cx, cy - r, cx, cy + r);
  setLine(el.curH, showCursor, cu, cx - r, cy, cx + r, cy);
}

window.addEventListener("mousemove", (e) => {
  if (view !== "editor") return;
  const r = el.viewport.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const inside = x >= 0 && y >= 0 && x < r.width && y < r.height;
  // Over the minimap there is nothing to aim at: no lines through it.
  const overMap = !!(e.target.closest && e.target.closest(".minimap")) || !!mmDrag || mmNav;
  pointerAt = !overMap && (inside || drag || draft || panning) ? { x, y } : null;
  schedulePointer();
}, { passive: true });

el.viewport.addEventListener("mouseleave", () => {
  if (drag || draft || panning) return;
  pointerAt = null;
  schedulePointer();
});
window.addEventListener("resize", schedulePointer);

// ---------------------------------------------------------------- legend

/** A small picture of a style: a box, or for the cursor and the lines, the
    lines themselves, over a patch of grass-coloured background. */
function stylePreview(kind, st, w = 58, hgt = 36) {
  // A legend swatch only has to show colour and pattern; a 6 px border in an
  // 18 x 12 swatch would leave no box at all.
  const small = hgt < 20;
  if (small) st = { ...st, width: Math.min(st.width, 2) };
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("width", w);
  svg.setAttribute("height", hgt);
  svg.setAttribute("class", "preview");
  svg.setAttribute("aria-hidden", "true");
  const bg = document.createElementNS(SVG_NS, "rect");
  bg.setAttribute("width", w); bg.setAttribute("height", hgt);
  bg.setAttribute("fill", "#3a5a2e");
  svg.appendChild(bg);
  const line = (x1, y1, x2, y2) => {
    const l = document.createElementNS(SVG_NS, "line");
    setLine(l, true, st, x1, y1, x2, y2);
    svg.appendChild(l);
  };
  if (kind === "box") {
    const m = small ? 2 : Math.min(Math.max(5, st.width + 3), hgt / 2 - 4);
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("x", m); r.setAttribute("y", m);
    r.setAttribute("width", w - 2 * m); r.setAttribute("height", hgt - 2 * m);
    svg.appendChild(paint(r, st));
  } else if (kind === "cursor") {
    const r = Math.min(st.size, hgt - 4) / 2;
    line(w / 2, hgt / 2 - r, w / 2, hgt / 2 + r);
    line(w / 2 - r, hgt / 2, w / 2 + r, hgt / 2);
  } else {
    line(w * 0.62, 0, w * 0.62, hgt);
    line(0, hgt * 0.4, w, hgt * 0.4);
  }
  return svg;
}

function renderLegend() {
  const frag = document.createDocumentFragment();
  const item = (st, text) => {
    const span = h("span", "legend-item");
    span.append(stylePreview("box", st, 18, 12), " " + text);
    frag.appendChild(span);
  };
  for (const id of classIds()) item(classStyle(id), className(id));
  item(styleOf("prediction"), "sam3");
  item(styleOf("approved"), "sam3 approved");
  item(styleOf("exemplar"), "exemplar");
  el.helpLegend.replaceChildren(frag);
}

// ---------------------------------------------------------------- project settings

async function loadProjectSettings() {
  projectPrefs = { version: 1, classes: {} };
  seenClasses = new Set([0]);
  try {
    const r = await fetch(q("api/project-settings"));
    if (!r.ok) throw new Error(`api/project-settings returned ${r.status}`);
    const data = await r.json();
    projectPrefs = { version: data.version || 1, classes: data.classes || {} };
    projectPrefsPath = data.path || "";
    for (const id of data.seen || []) seenClasses.add(id);
    if (data.warning) { console.warn(data.warning); keyStatus(data.warning, true); }
  } catch (err) {
    console.warn("class styles unavailable:", err.message);
  }
  applyAppearance();
}

let projectSaves = Promise.resolve();
function saveProjectSettings() {
  applyAppearance();
  renderKeys();
  const p = project;
  const body = JSON.stringify(projectPrefs);
  projectSaves = projectSaves.then(async () => {
    try {
      const r = await fetch(BASE + "api/project-settings?" + new URLSearchParams({ project: p }), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body,
      });
      if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
      projectPrefsPath = (await r.json()).path || projectPrefsPath;
      keyStatus(`Class styles saved to ${projectPrefsPath}`);
    } catch (err) {
      keyStatus(`Class styles not saved (${err.message}). They work in this tab until you reload.`, true);
    }
  });
}

/** Keep a class entry only while it says something: a name, or a style that
    differs from the palette default. */
function setClass(id, patch) {
  const key = String(id);
  const entry = { ...(projectPrefs.classes[key] || {}), ...patch };
  if (entry.style && sameStyle(entry.style, classDefault(id))) delete entry.style;
  if (!entry.name) delete entry.name;
  if (entry.style || entry.name) projectPrefs.classes[key] = entry;
  else delete projectPrefs.classes[key];
}

function setPersonalStyle(key, st) {
  if (sameStyle(st, STYLE_DEFAULTS[key])) delete prefs.styles[key];
  else prefs.styles[key] = st;
}

// ---------------------------------------------------------------- appearance tab

const pct = (v) => `${Math.round(v * 100)} %`;
const px = (v) => `${Number(v).toFixed(1).replace(/\.0$/, "")} px`;

/** One style, with its controls. Changes apply live while a slider moves and
    are saved when it is let go.
      o.key       id for focus bookkeeping
      o.kind      "box" | "line" | "cursor"
      o.style     the style as it is now; o.defaults, what reset returns to
      o.head      node(s) for the title
      o.showLabel label of the on/off switch, for styles that have one
      o.apply(st) live; o.save(st) on commit; o.reset() */
function styleRow(o) {
  const st = { ...o.style };
  const changed = !sameStyle(st, o.defaults);
  const row = h("div", "stylerow" + (changed ? " changed" : ""));

  const head = h("div", "stylehead");
  const pv = h("span", "pvwrap");
  pv.appendChild(stylePreview(o.kind, st));
  head.append(pv, ...[].concat(o.head));
  if (changed) head.appendChild(h("span", "tag changed", "changed"));
  head.appendChild(h("span", "dialog-spacer"));
  if (changed) {
    const reset = h("button", "badge", "reset");
    reset.type = "button";
    reset.dataset.f = `${o.key}:reset`;
    reset.addEventListener("click", () => o.reset());
    head.appendChild(reset);
  }

  const redraw = () => pv.replaceChildren(stylePreview(o.kind, st));
  const live = () => { redraw(); o.apply({ ...st }); };
  const commit = () => o.save({ ...st });

  const ctl = h("div", "stylectl");
  const field = (label, input, out) => {
    const lab = h("label", "stylefield");
    lab.append(h("span", "", label), input);
    if (out) lab.appendChild(out);
    ctl.appendChild(lab);
  };
  const slider = (prop, label, min, max, step, fmt) => {
    const r = h("input");
    r.type = "range"; r.min = min; r.max = max; r.step = step;
    r.value = String(st[prop]);
    r.dataset.f = `${o.key}:${prop}`;
    const out = h("output", "styleval", fmt(st[prop]));
    r.addEventListener("input", () => {
      st[prop] = Math.round(Number(r.value) * 100) / 100;
      out.textContent = fmt(st[prop]);
      live();
    });
    r.addEventListener("change", commit);
    field(label, r, out);
  };

  if ("show" in st) {
    const c = h("input");
    c.type = "checkbox";
    c.checked = st.show;
    c.dataset.f = `${o.key}:show`;
    c.addEventListener("change", () => { st.show = c.checked; live(); commit(); });
    const lab = h("label", "stylefield toggle");
    lab.append(c, h("span", "", o.showLabel));
    ctl.appendChild(lab);
  }
  const color = h("input");
  color.type = "color";
  color.value = st.color;
  color.dataset.f = `${o.key}:color`;
  color.addEventListener("input", () => { st.color = color.value; live(); });
  color.addEventListener("change", commit);
  field("Colour", color);

  if (o.kind === "box") slider("fill", "Fill", 0, 1, 0.05, pct);
  slider("width", o.kind === "box" ? "Border" : "Thickness", 0.5, 8, 0.5, px);
  slider("opacity", o.kind === "box" ? "Border opacity" : "Opacity", 0.05, 1, 0.05, pct);
  if (o.kind === "cursor") slider("size", "Size", 6, 60, 1, px);

  const sel = h("select", "picker");
  for (const v of ["solid", "dashed", "dotted"]) {
    const opt = h("option", "", v);
    opt.value = v;
    sel.appendChild(opt);
  }
  sel.value = st.line;
  sel.dataset.f = `${o.key}:line`;
  sel.addEventListener("change", () => { st.line = sel.value; live(); commit(); });
  field("Line", sel);

  row.append(head, ctl);
  return row;
}

function renderAppearance() {
  const frag = document.createDocumentFragment();

  const classes = h("section", "keys-screen");
  classes.appendChild(h("h3", "", "Your boxes, by class"));
  if (!project) {
    classes.appendChild(h("p", "keyhint", "Open a project to name and style its classes."));
  } else {
    classes.appendChild(h("p", "keyhint",
      `Saved with the project ${project}: class ids mean something different in each project. `
      + "Every class its annotations use is listed."));
    for (const id of classIds()) {
      const name = h("input", "field classname");
      name.type = "text";
      name.maxLength = 64;
      name.placeholder = `class ${id}`;
      name.value = (projectPrefs.classes[String(id)] || {}).name || "";
      name.dataset.f = `class${id}:name`;
      name.setAttribute("aria-label", `Name of class ${id}`);
      name.addEventListener("change", () => {
        setClass(id, { name: name.value.trim() });
        saveProjectSettings();
      });
      classes.appendChild(styleRow({
        key: `class${id}`, kind: "box",
        style: classStyle(id), defaults: classDefault(id),
        head: [name, h("span", "classid", `id ${id}`)],
        apply: (st) => { setClass(id, { style: st }); applyAppearance(); },
        save: (st) => { setClass(id, { style: st }); saveProjectSettings(); },
        reset: () => { setClass(id, { style: undefined }); saveProjectSettings(); },
      }));
    }
  }
  frag.appendChild(classes);

  const personal = (key, kind, title, extra = {}) => styleRow({
    key, kind, style: styleOf(key), defaults: STYLE_DEFAULTS[key],
    head: h("span", "keylabel", title), ...extra,
    apply: (st) => { setPersonalStyle(key, st); applyAppearance(); },
    save: (st) => { setPersonalStyle(key, st); saveSettings(); },
    reset: () => { delete prefs.styles[key]; saveSettings(); },
  });

  const others = h("section", "keys-screen");
  others.append(h("h3", "", "Other boxes"),
    h("p", "keyhint", "Styles of their own, so where a box came from stays visible "
                      + "whatever the class colours are. These are yours, in every project."),
    personal("prediction", "box", "SAM3 predictions"),
    personal("approved", "box", "Approved sam3 boxes"),
    personal("exemplar", "box", "Exemplars"));
  frag.appendChild(others);

  const pointer = h("section", "keys-screen");
  pointer.append(h("h3", "", "Cursor and crosshair"),
    h("p", "keyhint", "Over a box or a corner the system cursor comes back, since its "
                      + "shape says whether a drag moves or resizes. The lines stay."),
    personal("cursor", "cursor", "Cursor", { showLabel: "Draw this cursor over the image" }),
    personal("crosshair", "line", "Crosshair lines", { showLabel: "Show lines through the cursor" }));
  frag.appendChild(pointer);
  frag.appendChild(minimapSection());

  el.keysList.replaceChildren(frag);
}

/** Style changes on this tab, for the footer: personal styles, plus this
    project's class styles (names are not "changes from the defaults"). */
function appearanceChangeCount() {
  return Object.keys(STYLE_DEFAULTS).filter((k) => prefs.styles[k]).length
    + Object.values(projectPrefs.classes).filter((c) => c.style).length
    + minimapChangeCount();
}

// ---------------------------------------------------------------- minimap
//
// The whole image in a small window over the view: a rectangle for the part
// on screen, a colour for how long each part has been looked at, and a dot
// for each of your boxes in its class colour. Drag it by its top-right
// corner; press or drag on it to move the view there.
//
// "Looked at" is counted on a coarse grid, per cell, while the cell's centre
// is on screen, the view is zoomed in at least min_zoom times the fit zoom,
// and the annotator is active by the same rule as the timer (tab visible,
// input within IDLE_MS). A cell counts as seen after seen_s seconds in total.
// Counts are kept on the server, so a pass can span several visits.

const COVERAGE_CELLS = 40;           // cells along the image's longer side
const COVERAGE_TICK_MS = 250;

let coverage = null;                 // {project, image, gw, gh, ms} on screen
const coveragePending = new Map();   // project + "\0" + image -> unsent delta
let coverageInFlight = [];
let coverageFlushing = null;

let mmFrame = 0;
let mmBase = null;                   // the image, drawn once at minimap size
let mmDrag = null;                   // moving the minimap by its grip
let mmNav = false;                   // moving the view by pressing on the map

function coverageDims(w, h) {
  const long = Math.max(w, h);
  return { gw: Math.max(1, Math.round(COVERAGE_CELLS * w / long)),
           gh: Math.max(1, Math.round(COVERAGE_CELLS * h / long)) };
}
const coverageKey = (p, name) => p + "\u0000" + name;

/** Coverage for the image just loaded: what the server has, plus what this
    tab has counted but not yet sent (or sent without an answer yet). */
function startCoverage(name, stored) {
  const { gw, gh } = coverageDims(natW, natH);
  const ms = new Float64Array(gw * gh);
  const add = (src) => {
    if (src && src.gw === gw && src.gh === gh && src.ms.length === ms.length) {
      for (let i = 0; i < ms.length; i++) ms[i] += src.ms[i];
    }
  };
  add(stored);
  const key = coverageKey(project, name);
  add(coveragePending.get(key));
  for (const d of coverageInFlight) if (coverageKey(d.project, d.image) === key) add(d);
  coverage = { project, image: name, gw, gh, ms };
  scheduleMinimap();
}

function pendingDelta(cov) {
  const key = coverageKey(cov.project, cov.image);
  let d = coveragePending.get(key);
  if (!d || d.gw !== cov.gw || d.gh !== cov.gh) {
    d = { project: cov.project, image: cov.image, gw: cov.gw, gh: cov.gh,
          ms: new Float64Array(cov.gw * cov.gh) };
    coveragePending.set(key, d);
  }
  return d;
}

/** The part of the image on screen, in image pixels, or null. */
function visibleRect() {
  const s = scale();
  const W = el.viewport.clientWidth, H = el.viewport.clientHeight;
  const x1 = Math.max(0, -panX / s), y1 = Math.max(0, -panY / s);
  const x2 = Math.min(natW, (W - panX) / s), y2 = Math.min(natH, (H - panY) / s);
  return x2 > x1 && y2 > y1 ? { x1, y1, x2, y2 } : null;
}

const counting = () => zoom >= prefs.minimap.min_zoom;

let coverageLast = Date.now();
setInterval(() => {
  const t = Date.now();
  const dt = Math.min(t - coverageLast, 2 * COVERAGE_TICK_MS);  // a throttled tab banks nothing
  coverageLast = t;
  if (!coverage || view !== "editor" || !natW || el.keysDialog.open
      || document.visibilityState !== "visible" || t - lastInput >= IDLE_MS) return;
  if (!counting()) return;
  const r = visibleRect();
  if (!r) return;
  const { gw, gh, ms } = coverage;
  const cw = natW / gw, ch = natH / gh;
  // Cells whose centre is on screen: centre = (i + .5) * cw.
  const i0 = Math.max(0, Math.ceil(r.x1 / cw - 0.5)), i1 = Math.min(gw - 1, Math.floor(r.x2 / cw - 0.5));
  const j0 = Math.max(0, Math.ceil(r.y1 / ch - 0.5)), j1 = Math.min(gh - 1, Math.floor(r.y2 / ch - 0.5));
  if (i1 < i0 || j1 < j0) return;
  const d = pendingDelta(coverage);
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      ms[j * gw + i] += dt;
      d.ms[j * gw + i] += dt;
    }
  }
  scheduleMinimap();
}, COVERAGE_TICK_MS);

function seenFraction(cov = coverage) {
  if (!cov) return 0;
  const need = prefs.minimap.seen_s * 1000;
  let n = 0;
  for (const v of cov.ms) if (v >= need) n++;
  return n / cov.ms.length;
}

const coverageUrl = (d) =>
  BASE + `api/coverage/${encodeURIComponent(d.image)}?` + new URLSearchParams({ project: d.project });
const coverageBody = (d) =>
  JSON.stringify({ gw: d.gw, gh: d.gh, ms: Array.from(d.ms, (v) => Math.round(v)) });

/** Send what has been counted. Same rules as the event log: a delta the
    server refuses is dropped, one that got no answer goes back in the queue. */
function flushCoverage() {
  if (coverageFlushing || !coveragePending.size) return coverageFlushing || Promise.resolve();
  coverageInFlight = [...coveragePending.values()];
  coveragePending.clear();
  coverageFlushing = (async () => {
    for (const d of coverageInFlight) {
      try {
        const r = await fetch(coverageUrl(d), {
          method: "POST", headers: { "Content-Type": "application/json" }, body: coverageBody(d),
        });
        if (r.status >= 400 && r.status < 500) {
          console.warn(`coverage for ${d.image} refused (${r.status}):`, await r.text());
        } else if (!r.ok) {
          throw new Error(String(r.status));
        }
      } catch (err) {
        const back = pendingDelta({ ...d });
        for (let i = 0; i < back.ms.length; i++) back.ms[i] += d.ms[i];
      }
    }
    coverageInFlight = [];
  })().finally(() => { coverageFlushing = null; });
  return coverageFlushing;
}

setInterval(flushCoverage, EVENT_FLUSH_MS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushCoverage();
});
window.addEventListener("pagehide", () => {
  for (const d of coveragePending.values()) {
    navigator.sendBeacon(coverageUrl(d), new Blob([coverageBody(d)], { type: "application/json" }));
  }
  coveragePending.clear();
});

// ---------------------------------------------------------------- drawing

function scheduleMinimap() {
  if (!mmFrame) mmFrame = requestAnimationFrame(drawMinimap);
}

/** Width from the size setting, height from the image; a tall image must not
    make the minimap taller than the view. */
function mmSize() {
  const w = prefs.minimap.size;
  const h = Math.round(w * natH / natW);
  const maxH = Math.max(60, el.viewport.clientHeight - 60);
  return h > maxH ? { w: Math.round(w * maxH / h), h: maxH } : { w, h };
}

function buildMinimapBase() {
  mmBase = null;
  if (!natW || !el.photo.complete || !el.photo.naturalWidth) return;
  const { w, h } = mmSize();
  const dpr = window.devicePixelRatio || 1;
  const c = document.createElement("canvas");
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  c.getContext("2d").drawImage(el.photo, 0, 0, c.width, c.height);
  mmBase = c;
}
el.photo.addEventListener("load", () => { buildMinimapBase(); scheduleMinimap(); });

/** Never seen: a dark veil, so what is left stands out. Then amber, turning
    green as the time approaches "seen" - the ribbon's colour for done. */
function heat(t) {
  const a = [255, 176, 31], b = [75, 214, 164];
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${t >= 1 ? 0.38 : 0.5})`;
}

function placeMinimap() {
  const W = el.viewport.clientWidth, H = el.viewport.clientHeight;
  const m = prefs.minimap;
  const right = clamp(m.right, 0, Math.max(0, W - el.minimap.offsetWidth));
  const top = clamp(m.top, 0, Math.max(0, H - el.minimap.offsetHeight));
  el.minimap.style.right = right + "px";
  el.minimap.style.top = top + "px";
  return { right, top };
}

function drawMinimap() {
  mmFrame = 0;
  const m = prefs.minimap;
  const show = m.show && view === "editor" && !!natW;
  el.minimap.hidden = !show;
  if (!show) return;

  const { w, h } = mmSize();
  const dpr = window.devicePixelRatio || 1;
  const c = el.mmCanvas;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    c.style.width = w + "px";
    c.style.height = h + "px";
  }
  el.minimap.style.opacity = m.opacity;
  placeMinimap();

  if (!mmBase || mmBase.width !== c.width || mmBase.height !== c.height) buildMinimapBase();
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (mmBase) g.drawImage(mmBase, 0, 0, w, h);
  else { g.fillStyle = "#1b1f25"; g.fillRect(0, 0, w, h); }

  if (coverage) {
    const need = m.seen_s * 1000;
    const { gw, gh, ms } = coverage;
    for (let j = 0; j < gh; j++) {
      const y0 = Math.floor(j * h / gh), y1 = Math.floor((j + 1) * h / gh);
      for (let i = 0; i < gw; i++) {
        const v = ms[j * gw + i];
        const x0 = Math.floor(i * w / gw), x1 = Math.floor((i + 1) * w / gw);
        g.fillStyle = v > 0 ? heat(Math.min(1, v / need)) : "rgba(8, 10, 12, 0.5)";
        g.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  }

  // Your boxes, one dot each, in the colour of their class.
  const sx = w / natW, sy = h / natH;
  for (const b of boxes) {
    g.beginPath();
    g.arc((b.x1 + b.x2) / 2 * sx, (b.y1 + b.y2) / 2 * sy, 2.6, 0, 2 * Math.PI);
    g.fillStyle = classStyle(b.cls || 0).color;
    g.fill();
    g.lineWidth = 1;
    g.strokeStyle = "rgba(8, 10, 12, 0.85)";
    g.stroke();
  }

  // Where the view is: a light frame with a dark rim, to read on any image.
  const r = visibleRect();
  if (r) {
    const x = r.x1 * sx, y = r.y1 * sy, rw = (r.x2 - r.x1) * sx, rh = (r.y2 - r.y1) * sy;
    g.lineWidth = 3;
    g.strokeStyle = "rgba(8, 10, 12, 0.7)";
    g.strokeRect(x, y, rw, rh);
    g.lineWidth = 1.5;
    g.strokeStyle = "#ffffff";
    g.strokeRect(x, y, rw, rh);
  }

  el.mmZoom.textContent = `${Math.round(scale() * 100)} %`;
  el.mmZoom.title = `${Math.round(scale() * 100)} % of the image's pixels, ${zoom.toFixed(1)}\u00d7 the fit-to-screen zoom`;
  if (coverage) {
    const pctSeen = Math.round(seenFraction() * 100);
    el.mmSeen.textContent = counting() ? `${pctSeen} % seen` : `${pctSeen} % seen, zoom in to count`;
    el.mmSeen.classList.toggle("paused", !counting());
    el.mmSeen.title = `Parts looked at for ${m.seen_s} s or more, counted from `
      + `${m.min_zoom}\u00d7 the fit zoom. Dark: not looked at yet.`;
  } else {
    el.mmSeen.textContent = "";
  }
}

window.addEventListener("resize", () => { mmBase = null; scheduleMinimap(); });

// ---------------------------------------------------------------- moving it, and moving the view with it

el.mmGrip.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  const { right, top } = placeMinimap();
  mmDrag = { x: e.clientX, y: e.clientY, right, top };
  el.minimap.classList.add("moving");
});

/** Centre the view on the image point under the pointer. */
function mmJump(e) {
  const r = el.mmCanvas.getBoundingClientRect();
  const ix = clamp((e.clientX - r.left) / r.width, 0, 1) * natW;
  const iy = clamp((e.clientY - r.top) / r.height, 0, 1) * natH;
  const s = scale();
  panX = el.viewport.clientWidth / 2 - ix * s;
  panY = el.viewport.clientHeight / 2 - iy * s;
  applyTransform();
  render();
}

el.mmCanvas.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  mmNav = true;
  mmJump(e);
});

// The minimap is not the image: no wheel zoom of the page through it either.
el.minimap.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });

window.addEventListener("mousemove", (e) => {
  if (mmDrag) {
    prefs.minimap.right = Math.max(0, mmDrag.right - (e.clientX - mmDrag.x));
    prefs.minimap.top = Math.max(0, mmDrag.top + (e.clientY - mmDrag.y));
    const { right, top } = placeMinimap();
    prefs.minimap.right = right;
    prefs.minimap.top = top;
  } else if (mmNav) {
    mmJump(e);
  }
});

window.addEventListener("mouseup", (e) => {
  if (e.button !== 0) return;
  if (mmDrag) {
    mmDrag = null;
    el.minimap.classList.remove("moving");
    saveSettings();              // the place is personal, and kept
  }
  mmNav = false;
});

function toggleMinimap() {
  prefs.minimap.show = !prefs.minimap.show;
  saveSettings();
  flash(prefs.minimap.show ? "Minimap shown" : "Minimap hidden: m shows it");
}

// ---------------------------------------------------------------- settings section

function minimapSection() {
  const m = prefs.minimap;
  const sec = h("section", "keys-screen");
  sec.append(h("h3", "", "Minimap"),
    h("p", "keyhint", "Drag it by its top-right corner; press or drag on it to move the view. "
      + "Dark parts have not been looked at yet; amber turns green as they get looked at "
      + "for long enough. Dots are your boxes, in their class colour. m shows or hides it."));

  const toggle = h("label", "stylefield toggle mmtoggle");
  const c = h("input");
  c.type = "checkbox";
  c.checked = m.show;
  c.dataset.f = "mm:show";
  c.addEventListener("change", () => { m.show = c.checked; saveSettings(); });
  toggle.append(c, h("span", "", "Show the minimap"));
  sec.appendChild(toggle);

  const row = (key, label, hint, min, max, step, fmt) => {
    const changed = m[key] !== MINIMAP_DEFAULTS[key];
    const r = h("div", "keyrow speed" + (changed ? " changed" : ""));
    const lab = h("label", "keylabel");
    lab.htmlFor = `mm-${key}`;
    lab.append(label, h("span", "sub", hint));
    const wrap = h("span", "chips");
    const input = h("input");
    input.type = "range"; input.id = `mm-${key}`;
    input.min = min; input.max = max; input.step = step;
    input.value = String(m[key]);
    input.dataset.f = `mm:${key}`;
    const out = h("output", "speedval", fmt(m[key]));
    input.addEventListener("input", () => {
      m[key] = Math.round(Number(input.value) * 100) / 100;
      out.textContent = fmt(m[key]);
      if (key === "size") mmBase = null;
      scheduleMinimap();
    });
    input.addEventListener("change", () => saveSettings());
    wrap.append(input, out);
    const actions = h("span", "keyactions");
    if (changed) {
      const reset = h("button", "badge", "reset");
      reset.type = "button";
      reset.dataset.f = `mm:${key}:reset`;
      reset.addEventListener("click", () => {
        m[key] = MINIMAP_DEFAULTS[key];
        if (key === "size") mmBase = null;
        saveSettings();
      });
      actions.appendChild(reset);
    }
    r.append(lab, wrap, actions);
    return r;
  };
  sec.append(
    row("size", "Size", "Width on screen.", 100, 480, 10, (v) => `${v} px`),
    row("opacity", "Opacity", "Of the whole minimap.", 0.2, 1, 0.05, (v) => `${Math.round(v * 100)} %`),
    row("seen_s", "Seen after", "Time a part must be on screen, in total, to count as seen.",
        0.5, 10, 0.5, (v) => `${v} s`),
    row("min_zoom", "Counted from zoom",
        "Looking at the whole image at once is not scanning it, so time only counts "
        + "from this much zoom, in times the fit-to-screen zoom.",
        1, 8, 0.5, (v) => `${v}\u00d7`));

  const moved = m.right !== MINIMAP_DEFAULTS.right || m.top !== MINIMAP_DEFAULTS.top;
  if (moved) {
    const put = h("button", "badge", "put it back in the top-right corner");
    put.type = "button";
    put.dataset.f = "mm:place";
    put.addEventListener("click", () => {
      m.right = MINIMAP_DEFAULTS.right;
      m.top = MINIMAP_DEFAULTS.top;
      saveSettings();
    });
    const p = h("p", "keyhint");
    p.appendChild(put);
    sec.appendChild(p);
  }
  return sec;
}

const minimapChangeCount = () =>
  Object.keys(MINIMAP_DEFAULTS).filter((k) => prefs.minimap[k] !== MINIMAP_DEFAULTS[k]).length;

// ---------------------------------------------------------------- small commands

/** Zoom about a point in viewport pixels; the centre when none is given. */
function zoomBy(factor, cx, cy) {
  if (!natW) return;
  if (cx === undefined) { cx = el.viewport.clientWidth / 2; cy = el.viewport.clientHeight / 2; }
  const before = scale();
  zoom = Math.min(20, Math.max(1, zoom * factor));
  const after = scale();
  panX = cx - (cx - panX) * (after / before);
  panY = cy - (cy - panY) * (after / before);
  applyTransform();
  render();
  followPointer();
}

let boxesHidden = false;
function toggleBoxes() {
  boxesHidden = !boxesHidden;
  if (boxesHidden) { sel = null; drag = null; }
  el.viewport.classList.toggle("boxes-hidden", boxesHidden);
  flash(boxesHidden ? "Boxes hidden: h shows them" : "Boxes shown");
  render();
}

/** The held twin of toggleBoxes: boxes disappear for as long as the key is
    down, to see what is underneath, and come back on release. */
let peeking = false;
function peek(down) {
  if (down && (drag || draft)) return;       // not in the middle of an edit
  peeking = down;
  render();
}

function toggleMode() {
  setMode(mode === "exemplar" ? "annotate" : "exemplar");
}

function escapeKey() {
  if (draft) { draft = null; render(); flash("Box cancelled"); return; }
  if (sel) { sel = null; render(); } else backToGrid();
}

function focusSearch() {
  el.search.focus();
  el.search.select();
}

let flashTimer = null;
/** A short-lived message over the image, for things that need no answer. */
function flash(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add("on");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.toast.classList.remove("on"), 1600);
}

// ---------------------------------------------------------------- threshold

function markPending() {
  const parsed = parseFloat(el.thresh.value);
  const valid = Number.isFinite(parsed) && parsed >= 0 && parsed <= 1;
  el.thresh.classList.toggle("bad", !valid);
  el.applyThresh.classList.toggle("pending", valid && parsed !== threshold);
}

function applyThreshold() {
  const parsed = parseFloat(el.thresh.value);
  if (!Number.isFinite(parsed) || parsed < 0 || parsed > 1) {
    el.thresh.classList.add("bad");
    return;
  }
  threshold = parsed;
  el.thresh.value = parsed.toFixed(2);
  el.thresh.classList.remove("bad");
  el.applyThresh.classList.remove("pending");
  if (sel && sel.kind === "pred" && preds[sel.i].score < threshold) sel = null;
  render();
}

el.applyThresh.addEventListener("click", applyThreshold);
el.thresh.addEventListener("input", markPending);
el.thresh.addEventListener("keydown", (e) => {
  // Enter applies. stopPropagation keeps a/d/f/0 from navigating while typing.
  if (e.key === "Enter") { e.preventDefault(); applyThreshold(); }
  e.stopPropagation();
});

el.flag.addEventListener("click", () => toggleComplete());
window.addEventListener("resize", () => {
  if (view !== "editor") return;   // a hidden viewport measures 0 x 0
  if (natW) fitToViewport();
  drawRibbon();
});
window.addEventListener("beforeunload", (e) => {
  if (!dirty) return;
  save();
  e.preventDefault();
  e.returnValue = "";
});

/** Messages go to the status slot of whichever screen is showing. */
function status(msg, bad) {
  const node = (el[view + "View"] || el.projectsView).querySelector(".status");
  node.textContent = msg;
  node.style.color = bad ? "#ff6b6b" : "";
  node.style.maxWidth = bad ? "80vw" : "40vw";
}

window.addEventListener("error", (e) => status("script error: " + e.message, true));
el.photo.addEventListener("error", () => status("image failed to load", true));

/** Fetch the project list without touching the current selection.
    Called on boot and again after a run is created. */
async function fetchProjects() {
  const r = await fetch(BASE + "api/projects");
  if (!r.ok) throw new Error(`api/projects returned ${r.status}`);
  const data = await r.json();
  projects = data.projects;
  defaultProject = data.default_project || "";
  if (!projects.length) throw new Error(`no projects under ${data.root}`);
  return data;
}

/** Adopt the single-key layout this replaced, once, so upgrading does not
    dump you back on the default dataset. A stored "" meant "no run", which is
    no longer a choice, so it is dropped rather than carried over. */
function migrateStorage() {
  const oldProject = localStorage.getItem("project");
  const oldRun = localStorage.getItem("run");
  if (oldProject !== null) {
    if (localStorage.getItem(K_PROJECT) === null)
      localStorage.setItem(K_PROJECT, oldProject);
    localStorage.removeItem("project");
  }
  if (oldRun !== null) {
    const owner = oldProject || defaultProject;
    if (oldRun && owner && localStorage.getItem(K_RUN(owner)) === null)
      localStorage.setItem(K_RUN(owner), oldRun);
    localStorage.removeItem("run");
  }
}

/** Drop per-project keys for projects that no longer exist, so renaming a
    folder does not leave a key behind for every rename ever made. */
function pruneStorage() {
  const live = new Set(projects.map((p) => p.name));
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.startsWith("al.run.") && !live.has(k.slice("al.run.".length)))
      localStorage.removeItem(k);
  }
}

// ---------------------------------------------------------------- routing
//
//   #/                      all projects
//   #/<project>             that project's images as a grid
//   #/<project>/<image>     the editor, on that image
//
// The hash is the only navigation state, so Back, reload and a pasted link
// all land where you expect. It lives after the '#', which means BASE (derived
// from the path) is unaffected behind the Open OnDemand proxy.

const K_CELL = "al.cell";

let filter = "all";       // grid tab: all | todo | progress | done
let lastOpened = null;    // image to ring and scroll to when back on the grid

const hashFor = (p, name) =>
  "#/" + (p ? encodeURIComponent(p) : "")
       + (name ? "/" + encodeURIComponent(name) : "");

function parseHash() {
  let parts;
  try {
    parts = location.hash.replace(/^#\/?/, "").split("/")
      .filter(Boolean).map(decodeURIComponent);
  } catch (err) {
    parts = [];               // malformed escape in a hand-edited URL
  }
  return { project: parts[0] || null, image: parts[1] || null };
}

function showView(name) {
  releaseAll();
  // Settings belong to the project open; they have no business on the list.
  if (name === "projects" && el.keysDialog.open) el.keysDialog.close();
  if (view === "editor" && name !== "editor") endVisit();
  view = name;
  for (const v of ["projects", "dataset", "editor"]) el[v + "View"].hidden = v !== name;
  // One run dropdown, moved to whichever header needs it, so there is never a
  // second copy to fall out of step.
  if (name === "dataset") el.dsRunSlot.appendChild(el.runControls);
  if (name === "editor") el.edRunSlot.appendChild(el.runControls);
  status("");
}

/** Hash changes are queued, so a fast double-click cannot interleave two
    routes and leave the editor on one image with the list of another. */
let routing = Promise.resolve();
window.addEventListener("hashchange", () => { routing = routing.then(route, route); });

async function route() {
  const want = parseHash();

  // Leaving (or moving within) the editor: the work on screen gets written
  // first. If that fails, put the URL back and stay; the error is showing.
  if (view === "editor" && dirty && !(await flush())) {
    history.replaceState(null, "", hashFor(project, images[idx] && images[idx].name));
    return;
  }

  if (!want.project) return showProjects();

  if (!projects.some((p) => p.name === want.project)) {
    try { await fetchProjects(); } catch (err) { /* reported below */ }
  }
  if (!projects.some((p) => p.name === want.project)) {
    history.replaceState(null, "", "#/");
    await showProjects();
    status(`no project named ${want.project}`, true);
    return;
  }

  if (want.project !== project || !images.length) {
    if (!(await openProject(want.project))) return;
  }

  if (!want.image) return showDataset();

  const i = images.findIndex((im) => im.name === want.image);
  if (i < 0) {
    history.replaceState(null, "", hashFor(project));
    showDataset();
    status(`no image named ${want.image} in ${project}`, true);
    return;
  }
  showEditor();
  await load(i);
}

function backToGrid() {
  location.hash = hashFor(project);   // route() saves before leaving
}

// ---------------------------------------------------------------- dom helpers

function h(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // never innerHTML: names are user data
  return n;
}

/** Thumbnails deliberately leave `run` off the URL: a thumbnail does not
    depend on it, and including it would refetch every tile on a run switch. */
const thumbUrl = (p, name, size) =>
  BASE + "api/thumb/" + encodeURIComponent(name) + "?"
  + new URLSearchParams({ project: p, size });

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// ---------------------------------------------------------------- projects

async function showProjects() {
  showView("projects");
  document.title = "annotator";
  try {
    const data = await fetchProjects();   // fresh: progress changes as you work
    el.rootPath.textContent = data.root;
  } catch (err) {
    el.projectCards.replaceChildren();
    status("cannot list projects: " + err.message, true);
    return;
  }
  renderProjects();
}

function renderProjects() {
  const last = localStorage.getItem(K_PROJECT);
  const frag = document.createDocumentFragment();

  for (const p of projects) {
    const card = h("a", "card");
    card.href = hashFor(p.name);
    if (p.name === last) card.classList.add("last");

    const cover = h("div", "cover");
    if (p.cover) {
      const img = h("img");
      img.alt = ""; img.loading = "lazy"; img.decoding = "async";
      img.src = thumbUrl(p.name, p.cover, 512);
      cover.appendChild(img);
    }

    const body = h("div", "body");

    const title = h("div", "title");
    title.appendChild(h("h2", "", p.name));
    if (p.name === last) title.appendChild(h("span", "tag last", "last opened"));
    if (p.name === defaultProject) title.appendChild(h("span", "tag", "in config"));
    title.appendChild(h("span", "total", plural(p.images, "image", "images")));

    const done = p.signed_off || 0, started = p.in_progress || 0;
    const todo = Math.max(0, p.images - done - started);
    const pct = (n) => (p.images ? (100 * n) / p.images : 0) + "%";
    const meter = h("div", "meter");
    const md = h("span", "d"); md.style.width = pct(done);
    const mp = h("span", "p"); mp.style.width = pct(started);
    meter.append(md, mp);
    meter.title = `${done} signed off, ${started} in progress, ${todo} not started`;

    const stats = h("div", "stats");
    for (const [cls, n, label] of [["d", done, "signed off"],
                                   ["p", started, "in progress"],
                                   ["t", todo, "not started"]]) {
      const s = h("span", cls);
      s.append(h("b", "", String(n)), " " + label);
      stats.appendChild(s);
    }

    const runs = h("div", "runs");
    if (p.runs.length) {
      runs.append(plural(p.runs.length, "run", "runs") + ", latest ",
                  h("code", "", p.runs[0].name));
    } else {
      runs.textContent = "No SAM 3 runs yet";
    }

    body.append(title, meter, stats, runs);
    card.append(cover, body);
    frag.appendChild(card);
  }
  el.projectCards.replaceChildren(frag);
}

// ---------------------------------------------------------------- one project

/** Switch the whole page to a project: run dropdown, image list, exemplar
    set. Everything per-image is reset first - an index into the old list
    means nothing in the new one. Returns false if the list could not load. */
async function openProject(name) {
  endVisit();                  // logged against the project it happened in
  project = name;
  localStorage.setItem(K_PROJECT, project);
  fillRuns();

  images = [];
  boxes = []; preds = []; exems = []; exemSet = null;
  sel = null; dirty = false; idx = 0; natW = 0; lastOpened = null;
  clearTimeout(saveTimer);
  el.search.value = "";
  status("scanning image folder\u2026");

  try {
    const r = await fetch(q("api/images"));
    if (!r.ok) throw new Error(`api/images returned ${r.status}`);
    images = await r.json();
  } catch (err) {
    history.replaceState(null, "", "#/");
    await showProjects();
    status(`cannot open ${name}: ${err.message}`, true);
    return false;
  }
  await refreshExemplarSet();
  await loadProjectSettings();
  return true;
}

async function refreshExemplarSet() {
  exemSet = null;
  try {
    const r = await fetch(q("api/exemplars"));
    if (r.ok) exemSet = await r.json();
  } catch (err) {
    // Not fatal: annotating works without ever touching the manifest.
    console.warn("exemplar set unavailable:", err.message);
  }
  showSet();
}

const stateOf = (im) => (im.complete ? "done" : im.boxes > 0 ? "progress" : "todo");

function showDataset() {
  showView("dataset");
  document.title = `${project} \u2014 annotator`;
  el.dsTitle.textContent = project;
  renderGrid();

  // Coming back from the editor: put the image you just left in view, ringed
  // in the ribbon's cursor colour, and give it focus so Enter reopens it.
  const t = lastOpened && [...el.grid.children].find((c) => c.dataset.name === lastOpened);
  if (t) {
    t.scrollIntoView({ block: "center" });
    t.focus({ preventScroll: true });
  } else {
    el.gridScroll.scrollTop = 0;
  }
  if (!images.length) status(`no images in ${project}/images`, true);
}

function thumbTier() {
  const px = Number(el.cellSize.value) * (window.devicePixelRatio || 1);
  return px > 300 ? 512 : 256;
}

function renderGrid() {
  const needle = el.search.value.trim().toLowerCase();
  const counts = { all: 0, todo: 0, progress: 0, done: 0 };
  const size = thumbTier();
  const frag = document.createDocumentFragment();

  images.forEach((im, i) => {
    if (needle && !im.name.toLowerCase().includes(needle)) return;
    const st = stateOf(im);
    counts.all++; counts[st]++;
    if (filter !== "all" && filter !== st) return;
    frag.appendChild(tile(im, i, st, size));
  });
  el.grid.replaceChildren(frag);

  for (const b of el.tabs.querySelectorAll(".tab")) {
    b.setAttribute("aria-selected", String(b.dataset.f === filter));
    b.querySelector(".n").textContent = counts[b.dataset.f];
  }

  const shown = el.grid.childElementCount;
  el.gridEmpty.hidden = shown > 0 || !images.length;
  if (!shown && images.length) {
    el.gridEmpty.textContent = needle
      ? `No image names contain \u201c${el.search.value.trim()}\u201d here. Clear the filter or pick another tab.`
      : "Nothing in this tab yet.";
  }
}

function tile(im, i, st, size) {
  const a = h("a", "tile " + st);
  a.href = hashFor(project, im.name);
  a.title = im.name;
  a.dataset.name = im.name;
  if (im.name === lastOpened) a.classList.add("last");

  const th = h("div", "thumb");
  const img = h("img");
  img.alt = ""; img.loading = "lazy"; img.decoding = "async";
  img.src = thumbUrl(project, im.name, size);
  th.append(img, h("span", "idx", String(i + 1)));

  // Signed off with no boxes is a confirmed negative, which is worth saying
  // out loud: it is a training example, not a forgotten image.
  let chip = "";
  if (im.complete) chip = im.boxes ? "\u2713 " + plural(im.boxes, "box", "boxes") : "\u2713 negative";
  else if (im.boxes) chip = plural(im.boxes, "box", "boxes");
  if (chip) th.appendChild(h("span", "chip", chip));

  a.append(th, h("div", "bar"), h("div", "cap", im.name));
  return a;
}

// A cover that cannot be decoded leaves the dark panel, not a broken-image icon.
el.projectCards.addEventListener("error", (e) => {
  if (e.target.tagName === "IMG") e.target.style.visibility = "hidden";
}, true);

// Thumbnail failures bubble as capture-phase error events on the grid.
el.grid.addEventListener("error", (e) => {
  if (e.target.tagName === "IMG") e.target.closest(".tile")?.classList.add("broken");
}, true);

el.tabs.addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  filter = b.dataset.f;
  renderGrid();
});

el.search.addEventListener("input", renderGrid);
el.search.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { el.search.value = ""; renderGrid(); el.search.blur(); }
  e.stopPropagation();
});

function applyCell() {
  el.grid.style.setProperty("--cell", el.cellSize.value + "px");
}
el.cellSize.addEventListener("input", () => {
  const before = thumbTier.last;
  applyCell();
  localStorage.setItem(K_CELL, el.cellSize.value);
  // Only re-render when the tile size crosses a thumbnail tier; otherwise
  // the CSS variable alone resizes everything.
  thumbTier.last = thumbTier();
  if (before !== thumbTier.last) renderGrid();
});

// ---------------------------------------------------------------- editor

function showEditor() {
  showView("editor");
  el.backName.textContent = project;
  el.back.href = hashFor(project);
}

// ---------------------------------------------------------------- runs

/** Fill the run dropdown for the current project and resolve the selection.

    Every entry is a run that exists on disk. The YAML's run.name is not
    consulted: it says where the next batch job writes, which is unrelated to
    what you are looking at now.

    There is no "(no run)" entry: whether predictions are SHOWN is a view
    question, while which run is selected decides where exemplars are written -
    two different things that should not share one control. A project with no
    runs still leaves `run` null, because annotating needs no run at all;
    that is an empty state, not something the user picked. */
function fillRuns() {
  const p = projects.find((x) => x.name === project);
  const runs = p ? p.runs : [];              // already newest-first
  const existing = runs.map((r) => r.name);

  el.runSel.innerHTML = "";
  for (const r of runs) {
    const o = document.createElement("option");
    o.value = r.name;
    o.textContent = r.predictions
      ? `${r.name} \u2014 ${r.predictions} predictions`
      : `${r.name} \u2014 no predictions yet`;
    el.runSel.appendChild(o);
  }
  if (!existing.length) {
    const o = document.createElement("option");
    o.value = "";
    o.textContent = "(no runs yet)";
    o.disabled = true;
    el.runSel.appendChild(o);
  }
  const mk = document.createElement("option");
  mk.value = NEW_RUN;
  mk.textContent = "\uFF0B New run\u2026";
  el.runSel.appendChild(mk);

  const stored = localStorage.getItem(K_RUN(project));
  run = existing.includes(stored) ? stored
      : existing.length ? existing[0]         // most recently modified
      : null;
  el.runSel.value = run || "";
  el.delRun.disabled = !run;                  // empty state has nothing to delete
  if (run) localStorage.setItem(K_RUN(project), run);
  else localStorage.removeItem(K_RUN(project));
}

/** A run only changes predictions and exemplars, never the image list, so
    the editor stays on the image you were looking at instead of jumping back
    to the first one. */
async function runChanged() {
  clearHistories();
  await refreshExemplarSet();
  if (view === "editor" && images[idx]) await load(idx);
}

/** Name and create a run, then select it.

    Validated client-side with the same rule the server enforces, so an obvious
    mistake does not cost a round trip - but the server check is the real one. */
async function createRun() {
  const restore = () => { el.runSel.value = run || ""; };
  const name = (window.prompt("Name for the new run:") || "").trim();
  if (!name) return restore();
  if (name === "." || name === ".." || /[/\\\u0000]/.test(name)) {
    status("invalid run name: no / or \\", true);
    return restore();
  }
  if (!(await flush())) return restore();

  let created;
  try {
    const r = await fetch(
      BASE + "api/run?" + new URLSearchParams({ project, run: name }),
      { method: "POST" });
    if (!r.ok) {
      const detail = await r.text();
      status(`could not create run: ${r.status} ${detail}`, true);
      return restore();
    }
    created = await r.json();
  } catch (err) {
    status("could not create run: " + err.message, true);
    return restore();
  }

  localStorage.setItem(K_RUN(project), created.run);
  await fetchProjects();      // the new run has to appear in the list
  fillRuns();
  await runChanged();
}

/** Delete the selected run and everything in it.

    The prompt is scaled to what is actually at risk. Predictions, overlays and
    composites are regenerable - a confirm is enough. Picked exemplars are hand
    work that no rerun brings back, so a set with picks in it makes you type the
    run name. Annotations and flags are project-scoped and cannot be touched
    from here at all, which the message says explicitly so nobody has to guess. */
async function deleteRun() {
  if (!run) return;
  const name = run;

  const meta = (projects.find((x) => x.name === project) || { runs: [] })
    .runs.find((r) => r.name === name);
  let picked = 0;
  try {
    const r = await fetch(q("api/exemplars"));
    if (r.ok) picked = (await r.json()).count || 0;
  } catch (err) {
    // Advisory only: a manifest we cannot read still deserves the strict path.
    picked = -1;
  }

  const what = `run "${name}"\n\n`
    + `${meta ? meta.predictions : 0} prediction file(s)\n`
    + `${picked < 0 ? "an unreadable" : picked} exemplar manifest entr`
    + `${picked === 1 ? "y" : "ies"}\n\n`
    + `Annotations and flags are NOT affected.`;

  if (picked !== 0) {
    const typed = window.prompt(
      `This permanently deletes ${what}\n\nType the run name to confirm:`);
    if ((typed || "").trim() !== name) { status("delete cancelled"); return; }
  } else if (!window.confirm(`Permanently delete ${what}`)) {
    return;
  }

  if (!(await flush())) return;
  let done;
  try {
    const r = await fetch(
      BASE + "api/run?" + new URLSearchParams(
        { project, run: name, confirm: name }),
      { method: "DELETE" });
    if (!r.ok) {
      status(`could not delete run: ${r.status} ${await r.text()}`, true);
      return;
    }
    done = await r.json();
  } catch (err) {
    status("could not delete run: " + err.message, true);
    return;
  }

  // Forget the selection before refilling, or the fallback would try to
  // reselect a run that no longer exists.
  localStorage.removeItem(K_RUN(project));
  await fetchProjects();
  fillRuns();
  await runChanged();
  status(`deleted ${name} (${done.files} files)`);
}

/** Save before tearing anything down; a failed save aborts the switch.
    save() reports failure by returning false, not by throwing, so its result
    has to be passed on rather than assumed. */
async function flush() {
  if (!dirty) return true;
  try { return await save(); }
  catch (err) {
    status("not switching - save failed: " + err.message, true);
    return false;
  }
}

async function switchRun(next) {
  if (next === NEW_RUN) return createRun();
  if (!(await flush())) { el.runSel.value = run || ""; return; }
  run = next || null;
  el.delRun.disabled = !run;
  if (run) localStorage.setItem(K_RUN(project), run);
  else localStorage.removeItem(K_RUN(project));
  await runChanged();
}

el.runSel.addEventListener("change", () => {
  // Hand the keyboard back to the editor; a focused <select> would otherwise
  // swallow every shortcut until you click the image.
  el.runSel.blur();
  switchRun(el.runSel.value);
});
el.delRun.addEventListener("click", deleteRun);

// ---------------------------------------------------------------- boot

(async function main() {
  const t0 = parseFloat(el.thresh.value);
  if (Number.isFinite(t0)) threshold = t0;
  setMode("annotate");
  toggleHelp(localStorage.getItem(K_HELP) !== "0");
  await loadSettings();

  const cell = Number(localStorage.getItem(K_CELL));
  if (cell >= Number(el.cellSize.min) && cell <= Number(el.cellSize.max))
    el.cellSize.value = String(cell);
  applyCell();
  thumbTier.last = thumbTier();

  try {
    await fetchProjects();
  } catch (err) {
    showView("projects");
    status("cannot list projects: " + err.message, true);
    return;
  }
  migrateStorage();
  pruneStorage();
  await route();
})();
</script>
</body>
</html>
