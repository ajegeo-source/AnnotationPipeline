<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>annotator</title>
<style>
  :root {
    --bg:      #14161a;
    --panel:   #1b1f25;
    --line:    #2b323b;
    --text:    #d9dfe7;
    --dim:     #7c8794;
    --human:   #a855f7;   /* violet     - drawn here, owned by ANNOTATION_DIR */
    --pred:    #ff2d2d;   /* red        - read from PREDICTION_DIR, never written */
    --accept:  #5cc8ff;   /* light blue - a prediction a human approved */
    --exem:    #ffb01f;   /* amber      - picked as a SAM3 prompt */
    --done:    #4bd6a4;
    --pending: #4a5460;
    --started: #8a7fd4;   /* boxes but no sign-off; same as the ribbon */
    --todo:    #2b323b;
    --cursor:  #ff2d78;   /* the ribbon's "you are here" */
    --mono:    ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Three screens, one page. Only one is ever visible; [hidden] has to win
     over the per-view grid templates below, hence the !important. */
  .view { height: 100%; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .view[hidden] { display: none !important; }
  #datasetView { grid-template-rows: auto auto 1fr; }
  #editorView  { grid-template-rows: auto 1fr auto; }
  .scroll { overflow: auto; min-height: 0; }

  header {
    display: flex; align-items: center; gap: 18px;
    padding: 0 14px; height: 40px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .name {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 40vw;
  }
  .counter {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .spacer { flex: 1; }
  .badge {
    font-family: ui-monospace, monospace; font-size: 11px;
    padding: 3px 9px; border: 1px solid var(--line); border-radius: 2px;
    color: var(--dim); letter-spacing: .04em; text-transform: uppercase;
    cursor: pointer; user-select: none; background: none;
  }
  .badge:hover { border-color: var(--dim); }
  .badge.on { color: #0d1114; background: var(--done); border-color: var(--done); }
  .badge:focus-visible { outline: 2px solid var(--human); outline-offset: 2px; }

  .thresh { display: flex; align-items: center; gap: 6px; }
  .thresh label {
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim);
    letter-spacing: .04em; text-transform: uppercase;
  }
  .thresh input {
    width: 62px; padding: 3px 6px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 2px;
    font-family: ui-monospace, monospace; font-size: 11px; text-align: right;
  }
  .thresh input:focus { outline: none; border-color: var(--human); }
  .thresh input.bad { border-color: var(--pred); }
  .thresh .badge.pending { border-color: var(--human); color: var(--human); }
  .predcount {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--pred); font-variant-numeric: tabular-nums;
  }
  .exemcount {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--exem); font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .badge.mode-on {
    color: #0d1114; background: var(--exem); border-color: var(--exem);
  }

  /* The approve button wears the colour of the boxes it produces. */
  .badge.approve { border-color: var(--accept); color: var(--accept); }
  .badge.approve:hover { background: var(--accept); color: #0d1114; }
  .badge:disabled {
    opacity: .35; cursor: default;
    border-color: var(--line); color: var(--dim); background: none;
  }

  .viewport {
    position: relative; overflow: hidden;
    background: #0d0f12; cursor: crosshair;
  }
  .viewport.panning { cursor: grabbing; }
  /* Mode errors are expensive here - a stray exemplar ends up prompting a run -
     so the whole viewport carries the mode, not just a button in the corner. */
  .viewport.exemplar::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 2px solid var(--exem);
  }
  .stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .stage img { display: block; width: 100%; height: 100%; user-select: none; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Hit testing is done in image coordinates against the box list, not by
     asking the DOM what was clicked, so nothing here needs pointer events. */
  .stage rect {
    fill: transparent; stroke-width: 2px; pointer-events: none;
    vector-effect: non-scaling-stroke;
  }
  .stage rect.human  { stroke: var(--human); }
  .stage rect.pred   { stroke: var(--pred); }
  .stage rect.accept {
    stroke: var(--accept); stroke-dasharray: 1 9; stroke-linecap: round;
  }
  .stage rect.draft  { stroke: var(--human); stroke-dasharray: 3 3; }
  .stage rect.exem {
    stroke: var(--exem); fill: rgba(255, 176, 31, .10);
  }
  .stage rect.draft.exem { stroke: var(--exem); fill: transparent; }

  /* Selection is a wash of the box's own colour - the stroke pattern is what
     tells you where a box came from, so selection must not touch it. */
  .stage rect.human.sel  { fill: rgba(168, 85, 247, .16); }
  .stage rect.pred.sel   { fill: rgba(255, 45,  45, .14); }
  .stage rect.accept.sel { fill: rgba( 92, 200, 255, .14); }
  .stage rect.exem.sel   { fill: rgba(255, 176,  31, .26); }

  .stage rect.handle { stroke: #0d0f12; stroke-width: 1px; }
  .stage rect.handle.human  { fill: var(--human); }
  .stage rect.handle.pred   { fill: var(--pred); }
  .stage rect.handle.accept { fill: var(--accept); }

  .hint {
    position: absolute; left: 12px; bottom: 12px;
    font-size: 11px; color: var(--dim);
    background: rgba(13,15,18,.88); border: 1px solid var(--line);
    border-radius: 2px; padding: 8px 11px; line-height: 1.5;
    /* Click-through: it sits on top of the image, and a box drawn in the
       bottom-left corner must reach the image, not the help. */
    pointer-events: none;
  }
  .hint[hidden] { display: none; }
  /* Generated from the binding table, so it is always what the keys do. */
  .help-keys { display: grid; grid-template-columns: auto auto; gap: 2px 14px; }
  .help-keys .keys { text-align: right; white-space: nowrap; }
  .hint kbd {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    border: 1px solid var(--line); border-radius: 2px; padding: 0 4px;
  }
  .hint .mouse, .hint .legend {
    margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line);
  }
  .hint b { color: var(--text); font-weight: 500; }

  /* One message at a time, over the image, gone on its own. */
  .toast {
    position: absolute; top: 12px; left: 50%; transform: translate(-50%, -6px);
    padding: 5px 12px; border-radius: 2px; font-size: 12px; pointer-events: none;
    background: rgba(13,15,18,.9); border: 1px solid var(--line); color: var(--text);
    opacity: 0; transition: opacity .15s, transform .15s;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  /* ------------------------------------------------ binding editor */
  dialog.keys {
    width: min(780px, 94vw); max-height: 88vh; padding: 0;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  dialog.keys[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  dialog.keys::backdrop { background: rgba(5, 6, 8, .62); }
  .keys-head, .keys-foot {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  }
  .keys-head { border-bottom: 1px solid var(--line); }
  .keys-foot { border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .keys-head h2 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .keys-head .field { flex: 1; width: auto; min-width: 0; }
  .keys-body { overflow: auto; padding: 0 16px 16px; }
  .keys-body h3 { margin: 18px 0 4px; font-size: 12px; font-weight: 600; }
  .keys-body h4 { margin: 10px 0 2px 8px; font-size: 11px; font-weight: 500; color: var(--dim); }
  .keyrow {
    display: grid; grid-template-columns: minmax(0, 1fr) auto 64px;
    align-items: center; gap: 6px 12px; padding: 5px 8px; border-radius: 2px;
  }
  .keyrow:hover { background: rgba(255, 255, 255, .03); }
  .keylabel { min-width: 0; }
  .keylabel .tag { margin-left: 8px; font-size: 11px; }
  .keylabel .tag.changed { color: var(--human); border-color: var(--human); }
  .chips { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; }
  .chip-key {
    display: inline-flex; align-items: stretch; border: 1px solid var(--line);
    border-radius: 2px; font: 11px/1.8 var(--mono);
  }
  .chip-key kbd { padding: 0 7px; font: inherit; color: var(--text); }
  .chip-key button {
    border: 0; border-left: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--dim); font: inherit; padding: 0 6px;
  }
  .chip-key button:hover, .chip-key button:focus-visible { color: #ff6b6b; }
  .chip-key.shadowed kbd { text-decoration: line-through; color: var(--dim); }
  .chip-key.capturing { padding: 0 9px; color: var(--human); border-color: var(--human); }
  .chip-key.capturing:focus { outline: none; }
  .add-key {
    min-width: 26px; background: none; color: var(--dim); cursor: pointer;
    border: 1px dashed var(--line); border-radius: 2px; font: 12px/1.6 var(--mono);
  }
  .add-key:hover, .add-key:focus-visible { color: var(--text); border-color: var(--dim); }
  .keyactions { display: flex; justify-content: flex-end; }
  .keynote {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font-size: 12px; color: var(--exem); padding: 2px 0 4px;
  }
  .keynote kbd {
    font: 11px/1.8 var(--mono); color: var(--text); padding: 0 6px;
    border: 1px solid var(--line); border-radius: 2px;
  }
  .radio { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px;
           color: var(--dim); cursor: pointer; white-space: nowrap; }
  .radio:has(input:checked) { color: var(--text); }
  .keyhint { margin: 6px 8px 0; font-size: 12px; color: var(--dim); max-width: 64ch; }
  .keys-status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keys-status.bad { color: #ff6b6b; white-space: normal; }
  .dialog-spacer { flex: 1; }
  .keys-body .empty { padding: 30px 0; }
  .badge:focus-visible, .chip-key button:focus-visible, .add-key:focus-visible,
  .radio input:focus-visible { outline: 2px solid var(--human); outline-offset: 2px; }

  .timer { font-family: var(--mono); font-size: 12px; color: var(--dim);
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .timer.idle { opacity: .45; }
  .viewport.boxes-hidden { cursor: default; }

  footer { background: var(--panel); border-top: 1px solid var(--line); }
  #ribbon { display: block; width: 100%; height: 26px; cursor: pointer; }
  .badge.danger { color: #ff6b6b; }
  .badge.danger:disabled { color: var(--line); cursor: default; }
  .picker { background: var(--panel); color: inherit; border: 1px solid var(--line);
            border-radius: 4px; padding: 2px 4px; font: inherit; max-width: 22vw; }
  #runControls { display: inline-flex; align-items: center; gap: 8px; }

  /* ------------------------------------------------ navigation */
  a { color: inherit; }
  .wordmark { font-weight: 600; letter-spacing: .01em; }
  .crumbs { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; min-width: 0; }
  .crumbs a { color: var(--dim); text-decoration: none; }
  .crumbs a:hover { color: var(--text); }
  .crumbs .sep { color: var(--line); }
  .crumbs .here { font-family: var(--mono); font-size: 12px;
                  overflow: hidden; text-overflow: ellipsis; }
  .back {
    font-family: var(--mono); font-size: 12px; color: var(--dim);
    text-decoration: none; white-space: nowrap; padding: 3px 8px 3px 4px;
    border: 1px solid transparent; border-radius: 2px;
    max-width: 18vw; overflow: hidden; text-overflow: ellipsis;
  }
  .back:hover { color: var(--text); border-color: var(--line); }
  a:focus-visible, .tab:focus-visible, .field:focus-visible {
    outline: 2px solid var(--human); outline-offset: 2px;
  }

  /* ------------------------------------------------ project cards */
  .cards {
    display: grid; gap: 16px; padding: 20px;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  }
  .card {
    display: grid; text-decoration: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    overflow: hidden;
  }
  .card:hover { border-color: var(--dim); }
  .card.last { border-color: var(--cursor); }
  .cover { aspect-ratio: 16 / 9; background: #0d0f12; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { display: grid; gap: 9px; padding: 12px 14px 14px; }
  .card .title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .card h2 {
    margin: 0; font: 600 13px/1.3 var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .total { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums;
                 white-space: nowrap; }
  .tag {
    font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 2px; padding: 0 6px; white-space: nowrap;
  }
  .card.last .tag.last { color: var(--cursor); border-color: var(--cursor); }
  /* The meter is the ribbon folded into one bar: same colours, same order. */
  .meter { display: flex; height: 6px; background: var(--todo); border-radius: 1px; overflow: hidden; }
  .meter .d { background: var(--done); }
  .meter .p { background: var(--started); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px;
           color: var(--dim); font-variant-numeric: tabular-nums; }
  .stats .d b { color: var(--done); font-weight: 500; }
  .stats .p b { color: var(--started); font-weight: 500; }
  .stats .t b { color: var(--text); font-weight: 500; }
  .runs { font-size: 12px; color: var(--dim); overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .runs code { font-family: var(--mono); font-size: 11px; color: var(--text); }

  /* ------------------------------------------------ image grid */
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    background: none; color: var(--dim); font: inherit; cursor: pointer;
    padding: 4px 10px; border: 1px solid transparent; border-radius: 2px;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel); border-color: var(--line); }
  .tab i { width: 8px; height: 8px; border-radius: 1px; background: var(--c); }
  .tab .n { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--dim); }
  .field {
    width: 220px; padding: 4px 8px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 2px; font: inherit;
  }
  .field:focus { outline: none; border-color: var(--human); }
  .sizer { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .sizer input { width: 90px; accent-color: var(--dim); }

  .grid {
    --cell: 190px;
    display: grid; gap: 10px; padding: 14px;
    grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr));
  }
  .tile {
    --c: var(--todo);
    display: block; text-decoration: none; position: relative;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    overflow: hidden;
  }
  .tile.progress { --c: var(--started); }
  .tile.done     { --c: var(--done); }
  .tile:hover { border-color: var(--dim); }
  .tile.last  { border-color: var(--cursor); box-shadow: 0 0 0 1px var(--cursor); }
  .thumb { position: relative; aspect-ratio: 4 / 3; background: #0d0f12; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.broken .thumb img { visibility: hidden; }
  .tile.broken .thumb::after {
    content: "no preview"; position: absolute; inset: 0;
    display: grid; place-items: center; color: var(--dim); font-size: 12px;
  }
  .tile .bar { height: 3px; background: var(--c); }
  .tile .cap {
    padding: 5px 8px 6px; font: 11px/1.4 var(--mono); color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile:hover .cap { color: var(--text); }
  .tile .idx, .tile .chip {
    position: absolute; top: 6px; font: 11px/1.5 var(--mono); padding: 0 6px;
    border-radius: 2px; background: rgba(13, 15, 18, .82); font-variant-numeric: tabular-nums;
  }
  .tile .idx  { left: 6px; color: var(--dim); }
  .tile .chip { right: 6px; color: var(--text); border: 1px solid var(--c); }
  .tile.done .chip { color: #0d1114; background: var(--done); }
  .empty { color: var(--dim); padding: 40px 20px; text-align: center; }
</style>
</head>
<body>

<!-- ============================================================ projects -->
<section class="view" id="projectsView" hidden>
  <header>
    <span class="wordmark">annotator</span>
    <span class="counter" id="rootPath"></span>
    <span class="spacer"></span>
    <span class="name status"></span>
    <button class="badge open-keys" type="button" title="keyboard and mouse shortcuts (k)">keys</button>
  </header>
  <div class="scroll">
    <div class="cards" id="projectCards"></div>
  </div>
</section>

<!-- ============================================================ one project -->
<section class="view" id="datasetView" hidden>
  <header>
    <nav class="crumbs">
      <a href="#/">Projects</a><span class="sep">/</span>
      <span class="here" id="dsTitle"></span>
    </nav>
    <span id="dsRunSlot"></span>
    <span class="spacer"></span>
    <span class="name status"></span>
    <button class="badge open-keys" type="button" title="keyboard and mouse shortcuts (k)">keys</button>
  </header>
  <div class="toolbar">
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" data-f="all">All <span class="n"></span></button>
      <button class="tab" role="tab" data-f="todo"><i style="--c: var(--pending)"></i>Not started <span class="n"></span></button>
      <button class="tab" role="tab" data-f="progress"><i style="--c: var(--started)"></i>In progress <span class="n"></span></button>
      <button class="tab" role="tab" data-f="done"><i style="--c: var(--done)"></i>Signed off <span class="n"></span></button>
    </div>
    <span class="spacer"></span>
    <input id="search" class="field" type="search" placeholder="Filter by file name  ( / )"
           autocomplete="off" spellcheck="false" aria-label="Filter by file name">
    <label class="sizer">Size
      <input id="cellSize" type="range" min="110" max="360" step="10" value="190">
    </label>
  </div>
  <div class="scroll" id="gridScroll">
    <div class="grid" id="grid"></div>
    <p class="empty" id="gridEmpty" hidden></p>
  </div>
</section>

<!-- ============================================================ editor -->
<section class="view" id="editorView" hidden>
<header>
  <a class="back" id="back" href="#/" title="back to the image grid (g)">&lsaquo; <span id="backName"></span></a>
  <span id="edRunSlot">
    <span id="runControls">
      <select id="runSel" class="picker" title="run &mdash; drives predictions and exemplars"></select>
      <button class="badge danger" id="delRun"
              title="delete the selected run and everything in it">&#10005;</button>
    </span>
  </span>
  <span class="name status" id="name">&mdash;</span>
  <span class="counter" id="counter"></span>
  <span class="timer" id="timer"
        title="active time on this image: this visit / all visits. Pauses after a minute without input, or while the tab is hidden."></span>
  <span class="counter" id="boxcount"></span>
  <span class="predcount" id="predcount"></span>
  <span class="exemcount" id="exemcount"></span>
  <span class="spacer"></span>
  <button class="badge" id="mode"
          title="e &mdash; draw annotations, or pick exemplars for the SAM3 prompt">annotating</button>
  <span class="thresh">
    <label for="thresh">conf &ge;</label>
    <input id="thresh" type="text" inputmode="decimal" value="0.20" size="5">
    <button class="badge" id="applyThresh">apply</button>
    <button class="badge approve" id="approve"
            title="copy every shown sam3 box into your annotations">approve</button>
  </span>
  <button class="badge" id="flag">not signed off</button>
  <button class="badge open-keys" type="button" title="keyboard and mouse shortcuts (k)">keys</button>
</header>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <img id="photo" alt="">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="hint" id="hint">
    <div class="help-keys" id="helpKeys"></div>
    <div class="mouse" id="helpMouse"></div>
    <div class="legend">
      <span style="color:#a855f7">violet</span> yours &nbsp;
      <span style="color:#ff2d2d">red</span> sam3 &nbsp;
      <span style="color:#5cc8ff">blue dots</span> sam3 approved &nbsp;
      <span style="color:#ffb01f">amber</span> exemplar
    </div>
  </div>
</div>

<footer><canvas id="ribbon"></canvas></footer>
</section>

<dialog class="keys" id="keysDialog" aria-labelledby="keysTitle">
  <div class="keys-head">
    <h2 id="keysTitle">Keyboard and mouse</h2>
    <input id="keysFilter" class="field" type="search" autocomplete="off" spellcheck="false"
           placeholder="Filter by command or shortcut" aria-label="Filter by command or shortcut">
    <button class="badge" id="keysClose" type="button">done</button>
  </div>
  <div class="keys-body" id="keysList"></div>
  <div class="keys-foot">
    <span class="keys-status" id="keysStatus" role="status" aria-live="polite"></span>
    <span class="dialog-spacer"></span>
    <span id="keysChanged"></span>
    <button class="badge" id="keysResetAll" type="button">reset all</button>
  </div>
</dialog>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";

/** Every request below is made relative to the directory this page was served
    from. Served straight off the node that is "/", so nothing changes; served
    behind the Open OnDemand proxy it is "/node/<host>/<port>/", where an
    absolute "/api/..." would resolve against the dashboard root and 404.
    Derived from location rather than hardcoded, so one file works in both. */
const BASE = window.location.pathname.replace(/[^/]*$/, "");

const HANDLE_PX = 9;       // screen px: corner grab radius, and handle size
const MIN_BOX = 3;         // image px: a drag that ends smaller than this reverts
const ACCEPTED_IOU = 0.5;  // prediction vs. existing sam3_* annotation: see load()
const EXEMPLAR_IOU = 0.9;  // exemplar vs. the annotation it created: near-identical only

// Must match WRITABLE_PROVENANCE in annotator.py. The server rejects the PUT
// outright if anything else turns up, so these are not decorative.
const PROV_HUMAN = "human";
const PROV_SAM3_ASIS = "sam3_asis";
const PROV_SAM3_ADJUSTED = "sam3_adjusted";

/** `project` decides where annotations and flags are read
    and written; `run` decides which predictions and which exemplar manifest
    are shown. They ride on every request rather than living on the server, so
    two tabs can sit on two different datasets at once. */
let project = null;
let run = null;
let projects = [];        // [{name, runs: [{name, modified, predictions}], images}]
let defaultProject = "";  // paths.dataset from the YAML

/** localStorage keys.

    Prefixed because Open OnDemand proxies every app through one origin, so an
    unprefixed "project" key shares a namespace with the dashboard and with
    anything else ever run on a node.

    One key per project rather than one blob: two tabs on two datasets write
    independently, where a blob would need read-modify-write and would lose the
    other tab's choice. */
const K_PROJECT = "al.project";
const K_RUN = (p) => "al.run." + p;

/** Sentinel for the "+ New run" entry. Contains a NUL, which _safe_name on the
    server rejects, so it can never collide with a real run name. */
const NEW_RUN = "\u0000new";

/** Append the current selection to a path. Every api call goes through this. */
const q = (path, extra) => {
  const u = new URLSearchParams();
  if (project) u.set("project", project);
  if (run) u.set("run", run);
  for (const k in (extra || {})) u.set(k, extra[k]);
  return BASE + path + "?" + u.toString();
};

let images = [];        // [{name, boxes, complete}]
let idx = 0;
let boxes = [];         // human-owned, editable, PUT back to ANNOTATION_DIR
let preds = [];         // sam3, read only; edits here live until you approve
let threshold = 0.20;   // applied to preds only; a view filter, not a rerun
let complete = false;
let natW = 0, natH = 0;
let exems = [];         // this image's picked exemplars, mirrored from the manifest
let exemSet = null;     // {name, count} for the whole set, kept in step locally
let mode = "annotate";  // or "exemplar": what a freshly drawn box becomes
let sel = null;         // {kind: "box" | "pred" | "exem", i} or null
let dirty = false;
let saveTimer = null;

const el = {
  name: document.getElementById("name"),
  counter: document.getElementById("counter"),
  boxcount: document.getElementById("boxcount"),
  predcount: document.getElementById("predcount"),
  thresh: document.getElementById("thresh"),
  applyThresh: document.getElementById("applyThresh"),
  exemcount: document.getElementById("exemcount"),
  mode: document.getElementById("mode"),
  approve: document.getElementById("approve"),
  flag: document.getElementById("flag"),
  viewport: document.getElementById("viewport"),
  stage: document.getElementById("stage"),
  photo: document.getElementById("photo"),
  svg: document.getElementById("svg"),
  ribbon: document.getElementById("ribbon"),
  runSel: document.getElementById("runSel"),
  delRun: document.getElementById("delRun"),
  runControls: document.getElementById("runControls"),
  projectsView: document.getElementById("projectsView"),
  datasetView: document.getElementById("datasetView"),
  editorView: document.getElementById("editorView"),
  projectCards: document.getElementById("projectCards"),
  rootPath: document.getElementById("rootPath"),
  dsTitle: document.getElementById("dsTitle"),
  dsRunSlot: document.getElementById("dsRunSlot"),
  edRunSlot: document.getElementById("edRunSlot"),
  back: document.getElementById("back"),
  backName: document.getElementById("backName"),
  tabs: document.getElementById("tabs"),
  search: document.getElementById("search"),
  cellSize: document.getElementById("cellSize"),
  grid: document.getElementById("grid"),
  gridScroll: document.getElementById("gridScroll"),
  gridEmpty: document.getElementById("gridEmpty"),
  timer: document.getElementById("timer"),
  toast: document.getElementById("toast"),
  hint: document.getElementById("hint"),
  helpKeys: document.getElementById("helpKeys"),
  helpMouse: document.getElementById("helpMouse"),
  keysDialog: document.getElementById("keysDialog"),
  keysFilter: document.getElementById("keysFilter"),
  keysList: document.getElementById("keysList"),
  keysStatus: document.getElementById("keysStatus"),
  keysChanged: document.getElementById("keysChanged"),
  keysResetAll: document.getElementById("keysResetAll"),
  keysClose: document.getElementById("keysClose"),
};

/** Which screen is showing: "projects", "dataset" or "editor". The editor's
    key bindings and resize handling only act while this is "editor". */
let view = null;

// ---------------------------------------------------------------- view

let fit = 1, zoom = 1, panX = 0, panY = 0;

const scale = () => fit * zoom;

function applyTransform() {
  el.stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scale()})`;
}

function fitToViewport() {
  const vw = el.viewport.clientWidth, vh = el.viewport.clientHeight;
  fit = Math.min(vw / natW, vh / natH);
  zoom = 1;
  panX = (vw - natW * fit) / 2;
  panY = (vh - natH * fit) / 2;
  applyTransform();
  render();   // handles are sized in image units, so they depend on the scale
}

el.viewport.addEventListener("wheel", (e) => {
  if (!natW) return;
  e.preventDefault();
  const r = el.viewport.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

let panning = null;
el.viewport.addEventListener("mousedown", (e) => {
  if (!PAN_BUTTONS[keyPrefs.pan].includes(e.button)) return;
  e.preventDefault();
  panning = { x: e.clientX - panX, y: e.clientY - panY };
  el.viewport.classList.add("panning");
});
window.addEventListener("mousemove", (e) => {
  if (!panning) return;
  panX = e.clientX - panning.x;
  panY = e.clientY - panning.y;
  applyTransform();
});
window.addEventListener("mouseup", () => {
  panning = null;
  el.viewport.classList.remove("panning");
});
// A right-button pan must not end in the browser's context menu.
el.viewport.addEventListener("contextmenu", (e) => {
  if (PAN_BUTTONS[keyPrefs.pan].includes(2)) e.preventDefault();
});

// ---------------------------------------------------------------- geometry

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function normalise(b) {
  const x1 = Math.min(b.x1, b.x2), x2 = Math.max(b.x1, b.x2);
  const y1 = Math.min(b.y1, b.y2), y2 = Math.max(b.y1, b.y2);
  b.x1 = x1; b.x2 = x2; b.y1 = y1; b.y2 = y2;
  return b;
}

function iou(a, b) {
  const w = Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1);
  const h = Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1);
  if (w <= 0 || h <= 0) return 0;
  const inter = w * h;
  const union = (a.x2 - a.x1) * (a.y2 - a.y1)
              + (b.x2 - b.x1) * (b.y2 - b.y1) - inter;
  return union > 0 ? inter / union : 0;
}

const listOf = (kind) =>
  kind === "pred" ? preds : kind === "exem" ? exems : boxes;
const at = (s) => (s ? listOf(s.kind)[s.i] : null);
const isSel = (kind, i) => !!sel && sel.kind === kind && sel.i === i;
const shownPreds = () => preds.filter((b) => b.score >= threshold);
const fromSam3 = (b) => b.provenance !== PROV_HUMAN;

function classOf(kind, b) {
  if (kind === "pred") return "pred";
  if (kind === "exem") return "exem";
  return fromSam3(b) ? "accept" : "human";
}

/** An exemplar has a twin in `boxes` - picking one writes an annotation too -
    so the twin is not drawn. The threshold is tight because the two are the
    same rectangle; a merely overlapping neighbour must stay visible. */
const twinOfExemplar = (b) => exems.some((e) => iou(e, b) >= EXEMPLAR_IOU);

// ---------------------------------------------------------------- hit testing

function toImage(e) {
  const p = el.svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  const m = el.svg.getScreenCTM();
  return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 };
}

/** Every grabbable box, topmost first: yours over sam3, later over earlier. */
function candidates() {
  const out = [];
  if (boxesHidden || peeking) return out;   // what you cannot see, you cannot grab
  for (let i = exems.length - 1; i >= 0; i--) out.push({ kind: "exem", i, b: exems[i] });
  for (let i = boxes.length - 1; i >= 0; i--) {
    if (twinOfExemplar(boxes[i])) continue;
    out.push({ kind: "box", i, b: boxes[i] });
  }
  for (let i = preds.length - 1; i >= 0; i--) {
    if (preds[i].score >= threshold) out.push({ kind: "pred", i, b: preds[i] });
  }
  return out;
}

function cornerAt(b, p, grab) {
  const west  = Math.abs(p.x - b.x1) <= grab;
  const east  = Math.abs(p.x - b.x2) <= grab;
  const north = Math.abs(p.y - b.y1) <= grab;
  const south = Math.abs(p.y - b.y2) <= grab;
  if (north && west) return "nw";
  if (north && east) return "ne";
  if (south && west) return "sw";
  if (south && east) return "se";
  return null;
}

/** Corners beat interiors everywhere, or a corner inside another box would be
    unreachable. The grab radius is in screen px, so it does not shrink as you
    zoom in to place an edge precisely. */
function hitTest(p) {
  const grab = HANDLE_PX / scale();
  const list = candidates();
  for (const c of list) {
    // Exemplars have no corners: the manifest is a picked set, not a canvas.
    // Wrong shape? del it, fix the annotation, pick it again.
    if (c.kind === "exem") continue;
    const mode = cornerAt(normalise(c.b), p, grab);
    if (mode) return { kind: c.kind, i: c.i, mode };
  }
  for (const c of list) {
    const b = c.b;
    if (p.x >= b.x1 && p.x <= b.x2 && p.y >= b.y1 && p.y <= b.y2) {
      return { kind: c.kind, i: c.i, mode: c.kind === "exem" ? "pick" : "move" };
    }
  }
  return null;
}

const CURSOR = {
  move: "move", pick: "pointer",
  nw: "nwse-resize", se: "nwse-resize",
  ne: "nesw-resize", sw: "nesw-resize",
};

// ---------------------------------------------------------------- drag & draw

let draft = null;   // a new box being dragged out
let drag = null;    // an existing box being moved or resized

el.svg.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  if (peeking) return;
  if (boxesHidden) { flash("Boxes hidden: h shows them"); return; }
  const p = toImage(e);
  const hit = hitTest(p);
  if (hit) {
    sel = { kind: hit.kind, i: hit.i };
    if (hit.mode !== "pick") {
      const b = at(sel);
      drag = {
        kind: hit.kind, i: hit.i, mode: hit.mode, p0: p,
        start: { x1: b.x1, y1: b.y1, x2: b.x2, y2: b.y2 },
        before: snapshot(),          // for undo, if the drag changes anything
      };
    }
    render();
    return;
  }
  draft = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
  sel = null;
  render();
});

el.svg.addEventListener("mousemove", (e) => {
  if (drag || draft || panning) return;
  const hit = hitTest(toImage(e));
  el.svg.style.cursor = hit ? CURSOR[hit.mode] : "crosshair";
});

// On window, not on the svg: a drag that leaves the image should keep tracking.
window.addEventListener("mousemove", (e) => {
  if (drag) { dragTo(toImage(e)); return; }
  if (draft) {
    const p = toImage(e);
    draft.x1 = p.x; draft.y1 = p.y;
    render();
  }
});

function dragTo(p) {
  const b = at(drag);
  if (!b) { drag = null; return; }
  const s = drag.start;
  const dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
  if (drag.mode === "move") {
    const w = s.x2 - s.x1, h = s.y2 - s.y1;
    const x = clamp(s.x1 + dx, 0, natW - w);
    const y = clamp(s.y1 + dy, 0, natH - h);
    b.x1 = x; b.y1 = y; b.x2 = x + w; b.y2 = y + h;
  } else {
    const west = drag.mode[1] === "w", north = drag.mode[0] === "n";
    b.x1 = west  ? clamp(s.x1 + dx, 0, natW) : s.x1;
    b.x2 = west  ? s.x2 : clamp(s.x2 + dx, 0, natW);
    b.y1 = north ? clamp(s.y1 + dy, 0, natH) : s.y1;
    b.y2 = north ? s.y2 : clamp(s.y2 + dy, 0, natH);
  }
  render();
}

function endDrag() {
  const b = at(drag), s = drag.start;
  if (b) {
    normalise(b);
    if (b.x2 - b.x1 < MIN_BOX || b.y2 - b.y1 < MIN_BOX) Object.assign(b, s);
    const changed = ["x1", "y1", "x2", "y2"].some((k) => Math.abs(b[k] - s[k]) > 0.5);
    if (changed) {
      const kind = drag.mode === "move" ? "move" : "resize";
      if (drag.kind === "pred") {
        // Nothing is written: this only decides which token the box gets if
        // and when it is approved.
        b.edited = true;
        const ev = logEvent("pred.adjust", { kind, from: nb(s), to: nb(b), score: b.score });
        record(`${kind} sam3 box`, drag.before, [ev]);
      } else {
        // An already-approved box that gets nudged is no longer "as is".
        if (b.provenance === PROV_SAM3_ASIS) b.provenance = PROV_SAM3_ADJUSTED;
        const ev = logEvent("box.edit",
                            { kind, from: nb(s), to: nb(b), provenance: b.provenance });
        record(`${kind} box`, drag.before, [ev]);
        touch();
      }
    }
  }
  drag = null;
  render();
}

/** A drawn box always becomes a human annotation. In exemplar mode it is also
    appended to the manifest - and that write goes first, because it is the one
    that can be refused. If the server says no, nothing has been created
    anywhere and the drag simply evaporates. */
async function endDraft() {
  const x1 = Math.min(draft.x0, draft.x1), x2 = Math.max(draft.x0, draft.x1);
  const y1 = Math.min(draft.y0, draft.y1), y2 = Math.max(draft.y0, draft.y1);
  const picking = mode === "exemplar";
  draft = null;
  if (x2 - x1 < MIN_BOX || y2 - y1 < MIN_BOX) { render(); return; }
  const before = snapshot();

  const box = {
    x1: clamp(x1, 0, natW), y1: clamp(y1, 0, natH),
    x2: clamp(x2, 0, natW), y2: clamp(y2, 0, natH),
  };
  let id = null;
  if (picking) {
    render();                       // clear the draft while the POST is in flight
    id = await postExemplar(box);
    if (id === null) return;
    exems.push({ id, ...box });
    sel = { kind: "exem", i: exems.length - 1 };
  }
  boxes.push({ ...box, provenance: PROV_HUMAN, quality: "verified", score: 1.0 });
  if (!picking) sel = { kind: "box", i: boxes.length - 1 };
  const events = [logEvent("box.draw", { box: nb(box), provenance: PROV_HUMAN })];
  if (picking) {
    events.push(logEvent("exemplar.pick", { id, box: nb(box) }));
    record("exemplar pick", before, events, { exemplar: { kind: "pick", id, box } });
  } else {
    record("new box", before, events);
  }
  touch();
  render();
}

window.addEventListener("mouseup", () => {
  if (drag) { endDrag(); return; }
  if (draft) endDraft();
});

// ---------------------------------------------------------------- approving

/** Move one prediction into the annotation list.

    The geometry is copied verbatim - whatever is on screen, adjusted or not -
    and the score keeps SAM3's confidence rather than becoming 1.0, so the
    annotation file records at which confidence a human was willing to sign
    off. The prediction leaves `preds` so it cannot be approved twice; the file
    in PREDICTION_DIR is untouched. */
function approve(i, bulk) {
  const p = preds[i];
  if (!p) return null;
  const provenance = p.edited ? PROV_SAM3_ADJUSTED : PROV_SAM3_ASIS;
  boxes.push({
    x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2,
    provenance,
    quality: "verified",
    score: p.score,
  });
  preds.splice(i, 1);
  return logEvent("pred.approve", { box: nb(p), score: p.score, provenance, bulk });
}

function approveSelected() {
  if (!sel || sel.kind !== "pred") return;
  const before = snapshot();
  const ev = approve(sel.i, false);
  sel = null;
  record("approval", before, [ev]);
  touch();
  render();
}

/** Everything currently above the threshold. Predictions you hid with del are
    already gone from `preds`, so the threshold plus your deletions are exactly
    what this approves. */
function approveShown() {
  const before = snapshot();
  const events = [];
  for (let i = preds.length - 1; i >= 0; i--) {
    if (preds[i].score >= threshold) events.push(approve(i, true));
  }
  if (!events.length) return;
  sel = null;
  record(`approval of ${plural(events.length, "box", "boxes")}`, before, events);
  touch();
  render();
}

/** Delete means something different for each kind of box, which is why it is
    one command: your box is removed, a prediction is rejected, an exemplar is
    un-picked. A rejection only hides the box on screen - predictions are read
    only - but it is now logged, so it counts in any acceptance statistic. */
function deleteSelected() {
  if (!sel) return;
  if (sel.kind === "exem") { dropExemplar(sel.i); return; }
  const before = snapshot();
  if (sel.kind === "pred") {
    const p = preds[sel.i];
    const ev = logEvent("pred.reject", { box: nb(p), score: p.score, edited: !!p.edited });
    preds.splice(sel.i, 1);
    record("rejection", before, [ev]);
  } else {
    const b = boxes[sel.i];
    const ev = logEvent("box.delete",
                        { box: nb(b), provenance: b.provenance, score: b.score });
    boxes.splice(sel.i, 1);
    record("deletion", before, [ev]);
    touch();
  }
  sel = null;
  render();
}

function toggleComplete() {
  const before = snapshot();
  complete = !complete;
  const ev = logEvent("image.signoff", { complete });
  record(complete ? "sign-off" : "reopening", before, [ev]);
  touch();
  render();
}

el.approve.addEventListener("click", () => approveShown());

// ---------------------------------------------------------------- exemplars

function showSet() {
  if (!exemSet || !exemSet.name) { el.exemcount.textContent = ""; return; }
  el.exemcount.textContent = `${exemSet.count} in ${exemSet.name}`;
}

async function postExemplar(box) {
  try {
    const r = await fetch(q(`api/exemplar/${encodeURIComponent(images[idx].name)}`), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(box),
    });
    const body = await r.json();
    if (!r.ok) {
      status(`exemplar refused: ${body.detail || r.status}`, true);
      return null;
    }
    exemSet = { name: body.set, count: body.count };
    showSet();
    return body.id;
  } catch (err) {
    status(`exemplar not saved: ${err.message}`, true);
    return null;
  }
}

/** Remove one exemplar from the run's manifest. True if it is gone. */
async function deleteExemplar(id) {
  try {
    const r = await fetch(q(`api/exemplar/${id}`), { method: "DELETE" });
    if (!r.ok) { status(`exemplar ${id} not removed (${r.status})`, true); return false; }
    const body = await r.json();
    exemSet = { name: body.set, count: body.count };
    showSet();
    return true;
  } catch (err) {
    status(`exemplar ${id} not removed: ${err.message}`, true);
    return false;
  }
}

/** Un-pick. The annotation it created stays behind and reappears in violet -
    it is still a plant somebody verified, it just no longer prompts the run. */
async function dropExemplar(i) {
  const e = exems[i];
  const before = snapshot();
  if (!(await deleteExemplar(e.id))) return;
  exems.splice(i, 1);
  sel = null;
  const box = { x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2 };
  const ev = logEvent("exemplar.drop", { id: e.id, box: nb(box) });
  record("exemplar un-pick", before, [ev], { exemplar: { kind: "drop", id: e.id, box } });
  render();
}

function setMode(next) {
  mode = next;
  el.mode.textContent = mode === "exemplar" ? "picking exemplars" : "annotating";
  el.mode.classList.toggle("mode-on", mode === "exemplar");
  el.viewport.classList.toggle("exemplar", mode === "exemplar");
}

el.mode.addEventListener("click", () => toggleMode());

// ---------------------------------------------------------------- render

function rect(b, cls) {
  const r = document.createElementNS(SVG_NS, "rect");
  r.setAttribute("x", Math.min(b.x1, b.x2));
  r.setAttribute("y", Math.min(b.y1, b.y2));
  r.setAttribute("width", Math.abs(b.x2 - b.x1));
  r.setAttribute("height", Math.abs(b.y2 - b.y1));
  r.setAttribute("class", cls);
  return r;
}

/** Corner squares on the selected box: sized in image units from a screen-px
    constant, so they stay the same size on screen at any zoom. */
function handles(b, base) {
  const s = HANDLE_PX / scale();
  for (const [x, y] of [[b.x1, b.y1], [b.x2, b.y1], [b.x1, b.y2], [b.x2, b.y2]]) {
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("x", x - s / 2);
    r.setAttribute("y", y - s / 2);
    r.setAttribute("width", s);
    r.setAttribute("height", s);
    r.setAttribute("class", `handle ${base}`);
    el.svg.appendChild(r);
  }
}

function render() {
  while (el.svg.firstChild) el.svg.removeChild(el.svg.firstChild);
  if (boxesHidden || peeking) { renderCounts(0); return; }

  // Predictions first, so approved and hand-drawn boxes draw on top of them.
  let shown = 0;
  preds.forEach((b, i) => {
    if (b.score < threshold) return;
    shown++;
    el.svg.appendChild(rect(b, isSel("pred", i) ? "pred sel" : "pred"));
  });
  boxes.forEach((b, i) => {
    if (twinOfExemplar(b)) return;
    const base = classOf("box", b);
    el.svg.appendChild(rect(b, isSel("box", i) ? `${base} sel` : base));
  });
  exems.forEach((b, i) => {
    el.svg.appendChild(rect(b, isSel("exem", i) ? "exem sel" : "exem"));
  });
  if (draft) {
    el.svg.appendChild(rect(
      { x1: draft.x0, y1: draft.y0, x2: draft.x1, y2: draft.y1 },
      mode === "exemplar" ? "draft exem" : "draft"));
  }
  // No handles on an exemplar: it cannot be dragged, and offering a grip that
  // does nothing is worse than offering none.
  const active = at(sel);
  if (active && sel.kind !== "exem") handles(active, classOf(sel.kind, active));

  renderCounts(shown);
}

function renderCounts(shown) {
  const derived = boxes.filter(fromSam3).length;
  el.boxcount.textContent =
    `${boxes.length} ${boxes.length === 1 ? "box" : "boxes"}`
    + (derived ? ` (${derived} sam3)` : "");
  el.predcount.textContent = preds.length ? `${shown}/${preds.length} sam3` : "";
  el.approve.textContent = shown ? `approve ${shown}` : "approve";
  el.approve.disabled = shown === 0;
  el.flag.textContent = complete ? "signed off" : "not signed off";
  el.flag.classList.toggle("on", complete);
}

// ---------------------------------------------------------------- ribbon

function drawRibbon() {
  const c = el.ribbon;
  const w = c.clientWidth, h = 26, dpr = window.devicePixelRatio || 1;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);
  const n = images.length;
  const step = w / n;
  for (let i = 0; i < n; i++) {
    const im = images[i];
    g.fillStyle = im.complete ? "#4bd6a4" : (im.boxes > 0 ? "#8a7fd4" : "#2b323b");
    g.fillRect(i * step, 7, Math.max(step, 1), 12);
  }
  g.fillStyle = "#ff2d78";
  g.fillRect(Math.max(0, idx * step - 1), 2, Math.max(step, 2) + 2, 22);
}

el.ribbon.addEventListener("click", (e) => {
  const r = el.ribbon.getBoundingClientRect();
  go(Math.floor(((e.clientX - r.left) / r.width) * images.length));
});

// ---------------------------------------------------------------- io

function touch() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

/** Returns false if the annotation file was not written, so the caller can
    refuse to navigate away from work that only exists in this tab. */
async function save() {
  if (!dirty) return true;
  const name = images[idx].name;
  clearTimeout(saveTimer);
  dirty = false;
  let r;
  try {
    r = await fetch(q(`api/annotation/${encodeURIComponent(name)}`), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ boxes, complete }),
    });
  } catch (err) {
    dirty = true;
    status(`${name} not saved: ${err.message}`, true);
    return false;
  }
  if (!r.ok) {
    dirty = true;
    status(`${name} rejected by the server (${r.status}); nothing written`, true);
    return false;
  }
  images[idx].boxes = boxes.length;
  images[idx].complete = complete;
  drawRibbon();
  return true;
}

async function load(i) {
  endVisit();                  // the image being left gets its visit logged
  idx = i;
  const name = images[idx].name;
  const data = await (await fetch(q(`api/annotation/${encodeURIComponent(name)}`))).json();
  natW = data.width; natH = data.height;
  boxes = data.boxes.map(normalise);

  // A prediction that has already been approved is still sitting in
  // PREDICTION_DIR, which is read only - so recognise it by overlap with an
  // existing sam3_* annotation and drop it, rather than drawing the same
  // object twice in two colours.
  const approved = boxes.filter(fromSam3);
  preds = (data.predictions || [])
    .map(normalise)
    .filter((p) => !approved.some((b) => iou(p, b) >= ACCEPTED_IOU));

  exems = (data.exemplars || []).map(normalise);
  complete = data.complete;
  sel = null;
  draft = null;
  drag = null;

  el.stage.style.width = natW + "px";
  el.stage.style.height = natH + "px";
  el.svg.setAttribute("viewBox", `0 0 ${natW} ${natH}`);
  el.photo.src = q(`api/image/${encodeURIComponent(name)}`);

  status(name);
  lastOpened = name;
  document.title = `${name} \u2014 ${project}`;
  el.counter.textContent = `${idx + 1} / ${images.length}`;
  startVisit(name, (data.active_ms || 0) + pendingActive(project, name));
  fitToViewport();
  drawRibbon();

  const next = images[idx + 1];
  if (next) new Image().src = q(`api/image/${encodeURIComponent(next.name)}`);
}

async function go(i) {
  if (i < 0 || i >= images.length || i === idx) return;
  if (!await save()) return;   // keep the failure on screen
  // replaceState, not a new history entry: a/d through 300 images should not
  // take 300 presses of Back to get to the grid.
  history.replaceState(null, "", hashFor(project, images[i].name));
  load(i);
}

// ---------------------------------------------------------------- event log
//
// Every decision made here is sent to the project's append-only log on the
// server (see the module docstring in app.py). Events queue locally and go out
// in batches; nothing in the editor waits for them.

const newId = () =>
  (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);

const SESSION = newId();            // one per page load: groups a sitting
const EVENT_FLUSH_MS = 3000;
const EVENT_QUEUE_CAP = 5000;       // server gone for hours: drop the oldest

let eventQueue = [];                // [{project, ev}]
let eventsInFlight = [];            // sent, not yet acknowledged
let flushing = null;

/** Box as normalised [x1, y1, x2, y2], like the annotation files: an event
    must still mean something if the image is ever resized. */
const nb = (b) => [b.x1 / natW, b.y1 / natH, b.x2 / natW, b.y2 / natH]
  .map((v) => Math.round(v * 1e6) / 1e6);

/** Queue one event and return its id, which history entries keep so that an
    undo can name exactly the events it reverses. `where` overrides the
    current project/image, for events that outlive the view they describe. */
function logEvent(type, data = {}, where = {}) {
  const p = where.project || project;
  if (!p) return null;
  const ev = {
    id: newId(), type, ct: Date.now(), session: SESSION,
    image: where.image !== undefined ? where.image : (images[idx] ? images[idx].name : null),
    run: run || null,
    data,
  };
  eventQueue.push({ project: p, ev });
  if (eventQueue.length > EVENT_QUEUE_CAP) {
    eventQueue.splice(0, eventQueue.length - EVENT_QUEUE_CAP);
  }
  return ev.id;
}

function byProject(entries) {
  const groups = new Map();
  for (const { project: p, ev } of entries) {
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(ev);
  }
  return groups;
}

/** Send what is queued. A batch the server refuses (4xx) is dropped - sending
    it again would be refused again - while one that never got an answer goes
    back to the front of the queue, in order. */
function flushEvents() {
  if (flushing || !eventQueue.length) return flushing || Promise.resolve();
  eventsInFlight = eventQueue.splice(0, 500);
  flushing = (async () => {
    const retry = [];
    for (const [p, evs] of byProject(eventsInFlight)) {
      try {
        const r = await fetch(BASE + "api/events?" + new URLSearchParams({ project: p }), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ events: evs }),
        });
        if (r.status >= 400 && r.status < 500) {
          console.warn(`event batch refused (${r.status}):`, await r.text());
        } else if (!r.ok) {
          throw new Error(String(r.status));
        }
      } catch (err) {
        for (const ev of evs) retry.push({ project: p, ev });
      }
    }
    eventQueue = retry.concat(eventQueue);
    eventsInFlight = [];
  })().finally(() => { flushing = null; });
  return flushing;
}

setInterval(flushEvents, EVENT_FLUSH_MS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushEvents();
});

/** Last chance on close: sendBeacon survives the page going away, fetch does
    not. Whatever is in flight at that moment may be lost; the queue is not. */
window.addEventListener("pagehide", () => {
  endVisit();
  for (const [p, evs] of byProject(eventQueue)) {
    navigator.sendBeacon(
      BASE + "api/events?" + new URLSearchParams({ project: p }),
      new Blob([JSON.stringify({ events: evs })], { type: "application/json" }));
  }
  eventQueue = [];
});

// ---------------------------------------------------------------- visit timer
//
// Active time, not wall time: a second counts only while the editor is showing,
// the tab is visible, and there has been input within IDLE_MS. Looking at an
// image without touching anything is real work, hence the generous window.

const IDLE_MS = 60_000;
let lastInput = Date.now();
let visit = null;   // {project, image, started, lastTick, active, prior}

for (const t of ["pointerdown", "pointermove", "keydown", "wheel"]) {
  window.addEventListener(t, () => { lastInput = Date.now(); },
                          { capture: true, passive: true });
}

/** Visit time that exists locally but not yet on the server, so reopening an
    image straight away does not show a total missing the last visit. */
function pendingActive(p, name) {
  let ms = 0;
  for (const { project: q2, ev } of eventsInFlight.concat(eventQueue)) {
    if (q2 === p && ev.image === name && ev.type === "image.visit") ms += ev.data.active_ms;
  }
  return ms;
}

function startVisit(name, priorMs) {
  endVisit();
  const t = Date.now();
  visit = { project, image: name, started: t, lastTick: t, active: 0, prior: priorMs || 0 };
  showTimer();
}

function tickVisit() {
  if (!visit) return;
  const t = Date.now(), dt = t - visit.lastTick;
  visit.lastTick = t;
  if (view === "editor" && document.visibilityState === "visible"
      && t - lastInput < IDLE_MS) {
    visit.active += Math.min(dt, 2000);   // a throttled timer must not bank a burst
  }
  showTimer();
}

function endVisit() {
  if (!visit) return;
  tickVisit();
  const v = visit;
  visit = null;
  logEvent("image.visit",
           { active_ms: Math.round(v.active), wall_ms: Date.now() - v.started },
           { project: v.project, image: v.image });
}

setInterval(tickVisit, 1000);

function fmtMs(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  const mm = h ? String(m).padStart(2, "0") : String(m);
  return (h ? h + ":" : "") + mm + ":" + String(r).padStart(2, "0");
}

function showTimer() {
  if (!visit) { el.timer.textContent = ""; return; }
  const total = visit.prior + visit.active;
  el.timer.textContent = visit.prior
    ? `${fmtMs(visit.active)} / ${fmtMs(total)}`
    : fmtMs(visit.active);
  el.timer.classList.toggle("idle", Date.now() - lastInput >= IDLE_MS);
}

// ---------------------------------------------------------------- history
//
// Undo and redo per image, for the whole session: come back to an image and
// its history is still there. Each entry keeps the state before and after the
// edit, so undo and redo are both a plain restore - no per-command inverse to
// get wrong. The one edit with a side effect outside this tab is an exemplar
// pick or drop, which writes the run's manifest; those entries replay that
// write too (see exemplarSide).

const HISTORY_CAP = 200;
const histories = new Map();        // project + "\0" + image -> {undo, redo}

function hist() {
  const key = project + "\u0000" + images[idx].name;
  if (!histories.has(key)) histories.set(key, { undo: [], redo: [] });
  return histories.get(key);
}

const clone = (list) => list.map((b) => ({ ...b }));
const snapshot = () =>
  ({ boxes: clone(boxes), preds: clone(preds), exems: clone(exems), complete });

function restore(s) {
  boxes = clone(s.boxes);
  preds = clone(s.preds);
  exems = clone(s.exems);
  complete = s.complete;
  sel = null;
}

/** Push one finished edit. `before` was taken before the mutation; the state
    right now is the "after". A new edit clears the redo stack, as usual. */
function record(label, before, events, extra = {}) {
  const h = hist();
  const after = snapshot();
  const saves = before.complete !== after.complete
    || JSON.stringify(before.boxes) !== JSON.stringify(after.boxes);
  h.undo.push({ label, before, after, saves, run,
                events: events.filter(Boolean), ...extra });
  if (h.undo.length > HISTORY_CAP) h.undo.shift();
  h.redo.length = 0;
}

/** Undo and redo run one at a time, even when the key is held: an exemplar
    step waits on the server, and two interleaved restores would corrupt it. */
let historyChain = Promise.resolve();
const queueHistory = (dir) => {
  historyChain = historyChain.then(() => stepHistory(dir), () => stepHistory(dir));
};

async function stepHistory(dir) {
  if (view !== "editor" || !images[idx] || drag || draft) return;
  const h = hist();
  const [from, to] = dir === "undo" ? [h.undo, h.redo] : [h.redo, h.undo];
  const e = from.pop();
  if (!e) { flash(`nothing to ${dir}`); return; }
  if (e.exemplar && !(await exemplarSide(e, dir))) { from.push(e); return; }
  restore(dir === "undo" ? e.before : e.after);
  to.push(e);
  logEvent("history." + dir, { of: e.events, label: e.label });
  if (e.saves) touch();
  render();
  flash(`${dir === "undo" ? "Undid" : "Redid"} ${e.label}`);
}

/** Replay an exemplar entry's manifest write. Undoing a pick or redoing a drop
    removes the exemplar; the other two add it back - under a new id, since the
    server hands out ids, so every entry that mentions the old one is updated.
    A re-added exemplar goes to the END of the pick order. */
async function exemplarSide(e, dir) {
  const add = (e.exemplar.kind === "pick") === (dir === "redo");
  if (add) {
    const id = await postExemplar(e.exemplar.box);
    if (id === null) return false;
    retagExemplar(e, e.exemplar.id, id);
    return true;
  }
  return deleteExemplar(e.exemplar.id);
}

function retagExemplar(current, oldId, newId) {
  const h = hist();
  for (const entry of [current, ...h.undo, ...h.redo]) {
    for (const s of [entry.before, entry.after]) {
      for (const x of s.exems) if (x.id === oldId) x.id = newId;
    }
    if (entry.exemplar && entry.exemplar.id === oldId) entry.exemplar.id = newId;
  }
}

/** Predictions in a snapshot belong to the run that was selected when it was
    taken. Restoring one under another run would show run A's boxes as if
    they were run B's, so a run switch clears every history. */
function clearHistories() {
  histories.clear();
}

// ---------------------------------------------------------------- commands
//
// Every action an input can trigger is a named command, and each command
// carries its own default shortcuts. What you change is stored separately, as
// overrides (see loadKeys). The dispatcher, the help overlay and the binding
// editor all read the same resolved tables, so none of them can disagree.
//
// `screen` is where a command is active: one of the views, or "global" for
// every screen. `hold` commands run with true on press and false on release.

const SCREENS = { global: "Everywhere", dataset: "Image grid", editor: "Editor" };

const COMMANDS = {
  "keys.open":         { screen: "global", label: "Keyboard and mouse shortcuts",
                         keys: ["k"], run: () => toggleKeys() },

  "grid.search":       { screen: "dataset", label: "Filter by file name",
                         keys: ["/"], run: () => focusSearch() },

  "image.prev":        { screen: "editor", group: "Navigate", label: "Previous image",
                         keys: ["a"], repeat: true, run: () => go(idx - 1) },
  "image.next":        { screen: "editor", group: "Navigate", label: "Next image",
                         keys: ["d"], repeat: true, run: () => go(idx + 1) },
  "nav.grid":          { screen: "editor", group: "Navigate", label: "Back to the grid",
                         keys: ["g"], run: () => backToGrid() },
  "nav.escape":        { screen: "editor", group: "Navigate", label: "Deselect, then back to the grid",
                         keys: ["Escape"], run: () => escapeKey() },

  "edit.undo":         { screen: "editor", group: "Edit", label: "Undo",
                         keys: ["Ctrl+z"], repeat: true, run: () => queueHistory("undo") },
  "edit.redo":         { screen: "editor", group: "Edit", label: "Redo",
                         keys: ["Ctrl+y", "Ctrl+Shift+z"], repeat: true, run: () => queueHistory("redo") },
  "edit.delete":       { screen: "editor", group: "Edit", label: "Delete yours, reject sam3, unpick exemplar",
                         keys: ["Delete", "Backspace"], run: () => deleteSelected() },
  "image.signoff":     { screen: "editor", group: "Edit", label: "Sign off, or reopen",
                         keys: ["f"], run: () => toggleComplete() },

  "pred.approve":      { screen: "editor", group: "SAM3 predictions", label: "Approve the selected sam3 box",
                         keys: ["Enter"], run: () => approveSelected() },
  "pred.approveShown": { screen: "editor", group: "SAM3 predictions", label: "Approve every shown sam3 box",
                         keys: ["Shift+Enter"], run: () => approveShown() },

  "mode.exemplar":     { screen: "editor", group: "Exemplars", label: "Switch between annotating and picking exemplars",
                         keys: ["e"], run: () => toggleMode() },

  "view.fit":          { screen: "editor", group: "View", label: "Fit the image to the screen",
                         keys: ["0"], run: () => fitToViewport() },
  "view.zoomIn":       { screen: "editor", group: "View", label: "Zoom in",
                         keys: ["+", "="], repeat: true, run: () => zoomBy(ZOOM_STEP) },
  "view.zoomOut":      { screen: "editor", group: "View", label: "Zoom out",
                         keys: ["-"], repeat: true, run: () => zoomBy(1 / ZOOM_STEP) },
  "view.boxes":        { screen: "editor", group: "View", label: "Show or hide all boxes",
                         keys: ["h"], run: () => toggleBoxes() },
  "view.peek":         { screen: "editor", group: "View", label: "Hide all boxes while held",
                         keys: [], hold: true, run: (down) => peek(down) },
  "view.help":         { screen: "editor", group: "View", label: "Show or hide the help",
                         keys: ["?"], run: () => toggleHelp() },
};

// ---------------------------------------------------------------- bindings

const PAN_BUTTONS = { middle: [1], right: [2], either: [1, 2] };

let keyPrefs = { version: 1, overrides: {}, pan: "middle" };
let keyPath = "";            // where the server keeps them, for display
let tables = {};             // screen -> Map(input -> command id)
let shadowed = [];           // [{id, input, by}]: shortcuts that lost a clash
let boundButtons = new Set();

const defaultsOf = (id) => COMMANDS[id].keys || [];
const isChanged = (id) => Object.prototype.hasOwnProperty.call(keyPrefs.overrides, id);
const keysOf = (id) => (isChanged(id) ? keyPrefs.overrides[id] : defaultsOf(id));
const isWheel = (input) => /Wheel(Up|Down)$/.test(input);
const isMouse = (input) => /Mouse(Back|Forward)$/.test(input);

/** The screens an input on `screen` competes with: its own and the global
    one. A global input competes with every screen. */
const rivals = (screen) => (screen === "global" ? Object.keys(SCREENS) : [screen, "global"]);

function ownerOf(screen, input) {
  for (const s of rivals(screen)) {
    const id = tables[s] && tables[s].get(input);
    if (id) return id;
  }
  return null;
}

/** Resolve defaults plus overrides into one lookup table per screen.

    Commands you changed are placed first. If a later version gives some
    command a default you already use elsewhere, your binding keeps working
    and the default is the one that yields - it shows struck through in the
    binding editor rather than silently stealing your key. */
function buildTables() {
  tables = Object.fromEntries(Object.keys(SCREENS).map((s) => [s, new Map()]));
  shadowed = [];
  boundButtons = new Set();
  const ids = Object.keys(COMMANDS);
  for (const id of [...ids.filter(isChanged), ...ids.filter((x) => !isChanged(x))]) {
    const { screen, hold } = COMMANDS[id];
    for (const input of keysOf(id)) {
      if (hold && isWheel(input)) continue;        // a wheel cannot be held
      const by = ownerOf(screen, input);
      if (by) { if (by !== id) shadowed.push({ id, input, by }); continue; }
      tables[screen].set(input, id);
      if (isMouse(input)) boundButtons.add(input.endsWith("MouseBack") ? 3 : 4);
    }
  }
}

function commandFor(input) {
  return (tables[view] && tables[view].get(input)) || tables.global.get(input) || null;
}

/** Store a command's shortcuts as an override - or drop the override when
    the list is back to the default, so the file only holds real changes.

    Shortcuts shown struck through (lost to another command) are left out:
    editing a command must never quietly re-activate a key the editor said
    was not active. Otherwise adding a side button to a command whose default
    had lost its key would win that key back, simply because the command is
    now "changed" too and happens to come first in the table. */
function setKeys(id, list) {
  const lost = new Set(shadowed.filter((s) => s.id === id).map((s) => s.input));
  const keys = [...new Set(list)].filter((k) => !lost.has(k));
  const d = defaultsOf(id);
  if (keys.length === d.length && keys.every((k) => d.includes(k))) {
    delete keyPrefs.overrides[id];
  } else {
    keyPrefs.overrides[id] = keys;
  }
}

buildTables();

// ---------------------------------------------------------------- input names

const MODIFIER_KEYS = ["Control", "Shift", "Alt", "Meta", "AltGraph", "Dead",
                       "CapsLock", "Fn", "OS", "Hyper", "Super"];

function modsOf(e) {
  const m = [];
  if (e.ctrlKey || e.metaKey) m.push("Ctrl");
  if (e.altKey) m.push("Alt");
  if (e.shiftKey) m.push("Shift");
  return m;
}

/** Canonical name of a key press, or null for a bare modifier.

    Built from e.key, not e.code, so bindings follow the printed key: on a
    Swiss or German keyboard Ctrl+Z is the key labelled Z. Shift is spelled
    out for letters and named keys only; for other characters it is already
    in the character ("?" is Shift+/ on one layout and something else on
    another, and the binding should not care which). Cmd counts as Ctrl. */
function comboOf(e) {
  let k = e.key;
  if (!k || MODIFIER_KEYS.includes(k)) return null;
  const letter = k.length === 1 && k.toLowerCase() !== k.toUpperCase();
  const mods = [];
  if (e.ctrlKey || e.metaKey) mods.push("Ctrl");
  if (e.altKey) mods.push("Alt");
  if (e.shiftKey && (letter || k.length > 1)) mods.push("Shift");
  if (letter) k = k.toLowerCase();
  if (k === " ") k = "Space";
  return mods.concat(k).join("+");
}

/** Only the side buttons are bindable: left, middle and right are drag
    gestures (draw, pan), and a click bound to a command would fight them. */
function mouseInputOf(e) {
  const name = e.button === 3 ? "MouseBack" : e.button === 4 ? "MouseForward" : null;
  return name ? modsOf(e).concat(name).join("+") : null;
}

/** Only the wheel with a modifier held is bindable; the bare wheel zooms.
    Shift+wheel arrives as horizontal scrolling on some systems. */
function wheelInputOf(e) {
  const mods = modsOf(e);
  const d = e.deltaY || e.deltaX;
  if (!mods.length || !d) return null;
  return mods.concat(d < 0 ? "WheelUp" : "WheelDown").join("+");
}

const KEY_NAMES = {
  Escape: "esc", Delete: "del", Backspace: "backspace", Enter: "enter",
  Space: "space", Tab: "tab", Ctrl: "ctrl", Shift: "shift", Alt: "alt",
  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  PageUp: "page up", PageDown: "page down", Home: "home", End: "end",
  MouseBack: "mouse back", MouseForward: "mouse forward",
  WheelUp: "wheel up", WheelDown: "wheel down",
};

/** "+" is both the separator and a key, so a trailing "+" is the key. */
function keyLabel(combo) {
  const parts = combo.endsWith("+")
    ? [...combo.slice(0, -1).split("+").filter(Boolean), "+"]
    : combo.split("+");
  return parts.map((p) => KEY_NAMES[p] || p).join(" ");
}

// ---------------------------------------------------------------- dispatch

const held = new Map();      // physical key or mouse button -> hold command

function release(key) {
  const id = held.get(key);
  if (!id) return;
  held.delete(key);
  COMMANDS[id].run(false);
}

/** Also on blur: a key released while another window has focus never sends
    its keyup here, and a held command would otherwise stay on. */
function releaseAll() {
  for (const key of [...held.keys()]) release(key);
}

window.addEventListener("keydown", (e) => {
  if (el.keysDialog.open) return;            // the binding editor owns the keys
  const t = e.target;
  if (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT"
      || t.isContentEditable) return;
  const combo = comboOf(e);
  const id = combo && commandFor(combo);
  if (!id) return;
  e.preventDefault();                        // Ctrl+Z must not reach the browser too
  const cmd = COMMANDS[id];
  if (cmd.hold) {
    // Tracked by physical key: if Shift is let go before the key itself, the
    // keyup no longer spells the same combo, but it is the same key.
    const key = e.code || e.key;
    if (!held.has(key)) { held.set(key, id); cmd.run(true); }
    return;
  }
  if (e.repeat && !cmd.repeat) return;
  cmd.run();
});

window.addEventListener("keyup", (e) => release(e.code || e.key));
window.addEventListener("blur", releaseAll);

window.addEventListener("mousedown", (e) => {
  const input = mouseInputOf(e);
  if (!input) return;
  if (el.keysDialog.open) {
    if (capture && !capture.conflict) { e.preventDefault(); captureInput(input); }
    return;
  }
  const id = commandFor(input);
  if (!id) return;
  e.preventDefault();
  const cmd = COMMANDS[id];
  if (cmd.hold) { held.set("button" + e.button, id); cmd.run(true); }
  else cmd.run();
}, true);

// Browsers go Back or Forward when a side button is released. That is
// suppressed for any side button a binding uses, and while the binding editor
// is open, or a button bound to "next image" would also leave the editor.
for (const type of ["mouseup", "auxclick"]) {
  window.addEventListener(type, (e) => {
    if (e.button !== 3 && e.button !== 4) return;
    if (type === "mouseup") release("button" + e.button);
    if (boundButtons.has(e.button) || el.keysDialog.open) e.preventDefault();
  }, true);
}

const WHEEL_STEP = 50;       // px of scrolling per command; a mouse notch is ~100
let wheelState = { input: null, acc: 0, quietUntil: 0 };

window.addEventListener("wheel", (e) => {
  const input = wheelInputOf(e);
  if (!input) return;                        // the bare wheel zooms, as before
  if (el.keysDialog.open) {
    if (capture && !capture.conflict) { e.preventDefault(); captureInput(input); }
    return;
  }
  const id = commandFor(input);
  if (!id) return;
  e.preventDefault();
  e.stopPropagation();                       // the viewport must not zoom as well
  // A trackpad sends a stream of small deltas where a mouse sends one per
  // notch, so scroll distance is accumulated into steps before anything runs.
  if (wheelState.input !== input) wheelState = { input, acc: 0, quietUntil: 0 };
  const unit = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1;
  wheelState.acc += Math.abs(e.deltaY || e.deltaX) * unit;
  if (wheelState.acc < WHEEL_STEP) return;
  wheelState.acc = 0;
  const cmd = COMMANDS[id];
  const t = performance.now();
  if (!cmd.repeat && t < wheelState.quietUntil) return;
  wheelState.quietUntil = t + 300;
  cmd.run();
}, { capture: true, passive: false });

// ---------------------------------------------------------------- help

const PAN_TEXT = {
  middle: "middle-drag to pan", right: "right-drag to pan",
  either: "middle- or right-drag to pan",
};

function renderHelp() {
  const frag = document.createDocumentFragment();
  for (const id of Object.keys(COMMANDS)) {
    const c = COMMANDS[id];
    if (c.screen !== "editor" && c.screen !== "global") continue;
    const inputs = [...tables[c.screen]].filter(([, v]) => v === id).map(([k]) => k);
    if (!inputs.length) continue;
    const keys = h("span", "keys");
    inputs.forEach((k, i) => {
      if (i) keys.append(" ");
      keys.appendChild(h("kbd", "", keyLabel(k)));
    });
    frag.append(keys, h("span", "", c.label + (c.hold ? " (hold)" : "")));
  }
  el.helpKeys.replaceChildren(frag);
  el.helpMouse.replaceChildren(
    "drag empty space to draw \u00a0 drag a box to move \u00a0 drag a corner to resize",
    h("br"),
    `wheel to zoom \u00a0 ${PAN_TEXT[keyPrefs.pan]}`);
}

const K_HELP = "al.help";
function toggleHelp(force) {
  const show = force !== undefined ? force : el.hint.hidden;
  el.hint.hidden = !show;
  localStorage.setItem(K_HELP, show ? "1" : "0");
}

// ---------------------------------------------------------------- binding editor
//
// A list of every command with its shortcuts. + listens for the next key,
// side button or modifier + wheel; a shortcut that already belongs to
// another command is not taken without asking. Every change is saved at once
// to the user's own settings file (see api/keybindings in app.py).

let capture = null;          // {id, conflict?: {input, owner}, error?: string}
let swallowKeyUp = null;     // the key that just finished a capture
let escapeHandled = false;   // an Escape that cancelled a capture, not the dialog
let keysReturnFocus = null;

function toggleKeys() {
  if (el.keysDialog.open) { el.keysDialog.close(); return; }
  keysReturnFocus = document.activeElement;
  releaseAll();
  capture = null;
  el.keysDialog.showModal();
  renderKeys();
  el.keysFilter.focus();
}

function focusKey(f) {
  if (!f) return;
  const n = el.keysList.querySelector(`[data-f="${CSS.escape(f)}"]`);
  if (n) n.focus();
}

function startCapture(id) {
  capture = { id };
  renderKeys();
  focusKey(`cap:${id}`);
}

function cancelCapture() {
  const id = capture && capture.id;
  capture = null;
  renderKeys();
  focusKey(`add:${id}`);
}

function captureInput(input) {
  const id = capture.id;
  const cmd = COMMANDS[id];
  if (cmd.hold && isWheel(input)) {
    capture = { id, error: "A wheel cannot be held. Press a key or a side button instead." };
    renderKeys();
    focusKey(`cap:${id}`);
    return;
  }
  const owner = ownerOf(cmd.screen, input);
  if (owner === id) {
    capture = null;
    renderKeys();
    focusKey(`add:${id}`);
    keyStatus(`${keyLabel(input)} already does this.`);
    return;
  }
  if (owner) {
    capture = { id, conflict: { input, owner } };
    renderKeys();
    focusKey(`take:${id}`);
    return;
  }
  assign(id, input);
}

/** Give `input` to `id`, taking it from `from` first when there is a clash. */
function assign(id, input, from) {
  if (from) {
    setKeys(from, keysOf(from).filter((k) => k !== input));
    buildTables();              // so `input` no longer counts as taken
  }
  setKeys(id, [...keysOf(id), input]);
  capture = null;
  saveKeys();
  focusKey(`add:${id}`);
}

el.keysDialog.addEventListener("keydown", (e) => {
  if (!capture) return;                      // typing in the filter, tabbing
  if (e.key === "Escape") {
    e.preventDefault();
    e.stopPropagation();
    escapeHandled = true;
    setTimeout(() => { escapeHandled = false; });
    cancelCapture();
    return;
  }
  if (capture.conflict) return;              // Tab and Enter work the two buttons
  e.preventDefault();
  e.stopPropagation();
  const combo = comboOf(e);
  if (!combo) return;                        // a modifier alone: wait for the rest
  swallowKeyUp = e.code || e.key;
  captureInput(combo);
}, true);

// The keyup of a captured Space or Enter would otherwise click whatever
// button has focus by then - usually "+", which starts listening again.
el.keysDialog.addEventListener("keyup", (e) => {
  if (swallowKeyUp && (e.code || e.key) === swallowKeyUp) {
    e.preventDefault();
    e.stopPropagation();
    swallowKeyUp = null;
  }
}, true);

el.keysDialog.addEventListener("cancel", (e) => {
  // Escape closes the dialog, except when it is cancelling a capture.
  if (capture || escapeHandled) {
    e.preventDefault();
    if (capture) cancelCapture();
  }
});

el.keysDialog.addEventListener("close", () => {
  capture = null;
  el.keysFilter.value = "";
  if (keysReturnFocus && keysReturnFocus.isConnected) keysReturnFocus.focus();
});

el.keysClose.addEventListener("click", () => el.keysDialog.close());
el.keysFilter.addEventListener("input", () => { capture = null; renderKeys(); });
el.keysResetAll.addEventListener("click", () => {
  if (!window.confirm("Reset every shortcut, and the pan button, to the defaults?")) return;
  keyPrefs.overrides = {};
  keyPrefs.pan = "middle";
  capture = null;
  saveKeys();
});
for (const b of document.querySelectorAll(".open-keys")) {
  b.addEventListener("click", () => toggleKeys());
}

function keyMatches(id, needle) {
  if (!needle) return true;
  const c = COMMANDS[id];
  return [c.label, c.group || "", SCREENS[c.screen]]
      .some((s) => s.toLowerCase().includes(needle))
