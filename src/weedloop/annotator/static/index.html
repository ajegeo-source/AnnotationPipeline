// ---------------------------------------------------------------- copy and paste
//
// The clipboard keeps boxes in normalised coordinates with their class, so it
// works across images of any size. A paste lands in the same place on the
// image - the usual case, consecutive shots of one plot - or, with shift, at
// the pointer. Pasted boxes are ordinary boxes of yours: pasting them is a
// decision about this image.

let clipboard = null;            // {from, items: [{cls, x1, y1, x2, y2}]}, normalised

function copyBoxes() {
  if (!natW) return;
  const src = multi.length ? multi.filter((s) => s.kind === "box").map((s) => boxes[s.i]).filter(Boolean)
    : sel && sel.kind === "box" && boxes[sel.i] ? [boxes[sel.i]] : boxes;
  if (!src.length) { flash("Nothing to copy"); return; }
  clipboard = {
    from: project + "\u0000" + images[idx].name,
    items: src.map((b) => ({ cls: b.cls, x1: b.x1 / natW, y1: b.y1 / natH, x2: b.x2 / natW, y2: b.y2 / natH })),
  };
  flash(`Copied ${plural(src.length, "box", "boxes")}`);
}

/** Keep a box of its size inside the image, sliding it back in at an edge. */
function fitInImage(x1, y1, x2, y2) {
  const w = Math.min(x2 - x1, natW), hh = Math.min(y2 - y1, natH);
  const nx = clamp(x1, 0, natW - w), ny = clamp(y1, 0, natH - hh);
  return { x1: nx, y1: ny, x2: nx + w, y2: ny + hh };
}

function pasteBoxes(atPointer) {
  if (!natW) return;
  if (!clipboard) { flash("Nothing copied yet: ctrl c copies"); return; }
  const items = clipboard.items;
  let dx = 0, dy = 0;                                   // normalised shift
  if (atPointer) {
    if (!lastClient) { flash("Point at the image first"); return; }
    const p = toImage(lastClient);
    const cx = (Math.min(...items.map((i) => i.x1)) + Math.max(...items.map((i) => i.x2))) / 2;
    const cy = (Math.min(...items.map((i) => i.y1)) + Math.max(...items.map((i) => i.y2))) / 2;
    dx = p.x / natW - cx;
    dy = p.y / natH - cy;
  } else if (clipboard.from === project + "\u0000" + images[idx].name) {
    // Onto the image it came from: offset a little, or the copy hides exactly
    // under its original and looks like nothing happened.
    dx = 16 / scale() / natW;
    dy = 16 / scale() / natH;
  }
  const before = snapshot();
  const events = [];
  for (const it of items) {
    const box = fitInImage((it.x1 + dx) * natW, (it.y1 + dy) * natH, (it.x2 + dx) * natW, (it.y2 + dy) * natH);
    boxes.push({ ...box, cls: it.cls, provenance: PROV_HUMAN, quality: "verified", score: 1.0 });
    seenClasses.add(it.cls);
    events.push(logEvent("box.paste", { box: nb(box), cls: it.cls }));
  }
  sel = items.length === 1 ? { kind: "box", i: boxes.length - 1 } : null;
  record(`paste of ${plural(items.length, "box", "boxes")}`, before, events);
  touch();
  render();
  flash(`Pasted ${plural(items.length, "box", "boxes")}`);
}

// ---------------------------------------------------------------- comments
//
// Notes on an image, saved on the server at once (<project>/comments/) with
// author and time - like messages rather than edits, so not part of undo.
// c (or the comment button) makes one:
//   with a box, sam3 box or exemplar selected - a comment on that box, its
//     pin on the box's corner; it follows the box when the box is moved;
//   otherwise - draw a box, as for an annotation: a comment box, dashed and
//     labelled, that is never written to the annotation file. A click
//     without dragging gives a comment on that point.
// A click on a pin opens it to read, edit, resolve or delete.

let comments = [];               // the image's, from the server
let commentPlacing = false;
let openComment = null;          // the comment in the popup; {id: null} for a new one
let pinFrame = 0;

function startCommentPlacement() {
  if (view !== "editor" || !natW) return;
  if (boxesHidden) { flash("Boxes hidden: h shows them"); return; }
  closeCommentPopup();
  if (multi.length) { flash("Select one box to comment on it"); return; }
  if (sel && at(sel)) { commentOnSelection(); return; }
  draft = null;
  commentPlacing = true;
  el.viewport.classList.add("placing");
  el.commentBtn.classList.add("on");
  render();
  flash("Draw the comment's box, or click a point; esc cancels");
}

function cancelCommentPlacement() {
  commentPlacing = false;
  if (draft && draft.comment) draft = null;
  el.viewport.classList.remove("placing");
  el.commentBtn.classList.remove("on");
}

/** Called by pointerEditStart for the first press while placing: the comment's
    box is drawn like any box, in the drawing mode set (two clicks or a drag). */
function startCommentDraft(e, p) {
  draft = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, button: e.button,
            open: prefs.pointer.draw !== "drag", comment: true };
  sel = null;
  render();
}

/** Called by endDraft for a comment's box: big enough, a comment box; a
    click without a drag, a comment on that point. */
function finishCommentDraft() {
  const d = draft;
  draft = null;
  cancelCommentPlacement();
  const x1 = clamp(Math.min(d.x0, d.x1), 0, natW), x2 = clamp(Math.max(d.x0, d.x1), 0, natW);
  const y1 = clamp(Math.min(d.y0, d.y1), 0, natH), y2 = clamp(Math.max(d.y0, d.y1), 0, natH);
  if (x2 - x1 < MIN_BOX || y2 - y1 < MIN_BOX) {
    openCommentPopup({ id: null, kind: "point", x: clamp(d.x0 / natW, 0, 1), y: clamp(d.y0 / natH, 0, 1), text: "" });
    return;
  }
  const box = [x1 / natW, y1 / natH, x2 / natW, y2 / natH];
  openCommentPopup({ id: null, kind: "region", box, x: box[0], y: box[1], text: "" });
  render();
}

/** c with one box selected: a comment on that box. */
function commentOnSelection() {
  const b = at(sel);
  const box = [b.x1 / natW, b.y1 / natH, b.x2 / natW, b.y2 / natH];
  openCommentPopup({ id: null, kind: sel.kind, box, cls: b.cls || null, x: box[2], y: box[1], text: "" });
}

const COMMENT_ON = { point: "on this spot", region: "on this area", box: "on a box of yours",
                     pred: "on a sam3 box", exem: "on an exemplar" };

/** Where a comment's pin goes, in image px: the point; a comment box's top
    left corner; for a comment on a box, the top right corner of the box that
    is there now - the one overlapping most with where it was, so the comment
    follows a box that is moved - or of where it was, if none is left. */
function commentAnchor(c) {
  if (!c.box || !c.kind || c.kind === "point") return { x: c.x * natW, y: c.y * natH };
  const r = { x1: c.box[0] * natW, y1: c.box[1] * natH, x2: c.box[2] * natW, y2: c.box[3] * natH };
  if (c.kind === "region") return { x: r.x1, y: r.y1 };
  const list = c.kind === "box" ? boxes : c.kind === "pred" ? preds : exems;
  let best = r, most = 0.3;
  for (const b of list) {
    const v = iou(b, r);
    if (v >= most) { most = v; best = b; }
  }
  return { x: best.x2, y: best.y1 };
}

function commentScreen(c) {
  const s = scale(), a = commentAnchor(c);
  return { x: panX + a.x * s, y: panY + a.y * s };
}

/** A box was moved or resized: the comments on it go with it, saved at once,
    so they stay on their box however far it moved. */
async function commentsFollow(kind, from, to) {
  const name = images[idx] && images[idx].name;
  if (!name) return;
  const box = [to.x1 / natW, to.y1 / natH, to.x2 / natW, to.y2 / natH];
  for (const c of comments) {
    if (c.kind !== kind || !c.box) continue;
    const r = { x1: c.box[0] * natW, y1: c.box[1] * natH, x2: c.box[2] * natW, y2: c.box[3] * natH };
    if (iou(r, from) < 0.5) continue;
    c.box = box;                                    // at once, so the pin moves now
    try {
      Object.assign(c, await commentRequest("PATCH",
        `api/comments/${encodeURIComponent(name)}/${c.id}`, { box }));
    } catch (err) {
      flash(`A comment could not follow its box: ${err.message}`);
    }
  }
  schedulePins();
}

/** Comment boxes, with the annotations: dashed, never filled. Hidden with the
    boxes (h). A new one shows while its text is being written. */
function renderCommentBoxes() {
  const list = comments.filter((c) => c.kind === "region" && c.box);
  if (openComment && !openComment.id && openComment.kind === "region") list.push(openComment);
  for (const c of list) {
    const r = rect({ x1: c.box[0] * natW, y1: c.box[1] * natH, x2: c.box[2] * natW, y2: c.box[3] * natH },
                   "cbox" + (c.resolved ? " resolved" : "") + (openComment === c || (openComment && openComment.id && openComment.id === c.id) ? " open" : ""));
    el.svg.appendChild(r);
  }
}

function schedulePins() {
  if (!pinFrame) pinFrame = requestAnimationFrame(renderPins);
}

function renderPins() {
  pinFrame = 0;
  const show = view === "editor" && !!natW && !boxesHidden && !peeking;
  const frag = document.createDocumentFragment();
  if (show) {
    comments.forEach((c, k) => {
      const p = commentScreen(c);
      const region = c.kind === "region";
      const b = h("button", "pin" + (region ? " region" : "") + (c.resolved ? " resolved" : "")
        + (openComment && openComment.id === c.id ? " open" : ""), region ? `${k + 1} comment` : String(k + 1));
      b.type = "button";
      b.style.left = `${p.x}px`;
      b.style.top = `${p.y}px`;
      b.title = `${c.resolved ? "Resolved: " : ""}${c.text}\n(${COMMENT_ON[c.kind || "point"]}${c.cls ? ", " + c.cls : ""})`;
      b.setAttribute("aria-label", `Comment ${k + 1}${c.resolved ? ", resolved" : ""}: ${c.text}`);
      b.addEventListener("click", () => openCommentPopup(c));
      frag.appendChild(b);
    });
  }
  el.pins.replaceChildren(frag);
  if (openComment) placePopup();
}

function placePopup() {
  const p = commentScreen(openComment);
  const W = el.viewport.clientWidth, H = el.viewport.clientHeight;
  const pw = el.cpop.offsetWidth || 280, ph = el.cpop.offsetHeight || 150;
  el.cpop.style.left = `${clamp(p.x + 16, 8, Math.max(8, W - pw - 8))}px`;
  el.cpop.style.top = `${clamp(p.y + 8, 8, Math.max(8, H - ph - 8))}px`;
}

function openCommentPopup(c) {
  openComment = c;
  const isNew = !c.id;
  el.cpopText.value = c.text || "";
  const on = COMMENT_ON[c.kind || "point"] + (c.cls ? ` (${c.cls})` : "");
  el.cpopMeta.textContent = isNew ? `New comment ${on}`
    : `${c.author || "someone"}, ${new Date(c.updated || c.created).toLocaleString()}, ${on}`
      + (c.resolved ? " \u2013 resolved" : "");
  el.cpopResolve.hidden = isNew;
  el.cpopDelete.hidden = isNew;
  el.cpopResolve.textContent = c.resolved ? "reopen" : "resolve";
  el.cpop.hidden = false;
  placePopup();
  schedulePins();
  el.cpopText.focus();
}

function closeCommentPopup() {
  const pending = openComment && !openComment.id && openComment.kind === "region";
  openComment = null;
  el.cpop.hidden = true;
  schedulePins();
  if (pending && view === "editor") render();      // a comment box never saved goes
}

async function commentRequest(method, path, body) {
  const r = await fetch(BASE + path + "?" + new URLSearchParams({ project }), {
    method, headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function saveComment() {
  const c = openComment;
  if (!c) return;
  const text = el.cpopText.value.trim();
  if (!text) { if (!c.id) closeCommentPopup(); return; }
  const name = encodeURIComponent(images[idx].name);
  try {
    if (!c.id) {
      comments.push(await commentRequest("POST", `api/comments/${name}`,
        { x: c.x, y: c.y, text, kind: c.kind || "point", box: c.box || null, cls: c.cls || null }));
    } else if (text !== c.text) {
      const upd = await commentRequest("PATCH", `api/comments/${name}/${c.id}`, { text });
      comments = comments.map((x) => (x.id === upd.id ? upd : x));
    }
    closeCommentPopup();
  } catch (err) {
    flash(`Comment not saved: ${err.message}`);
  }
}

el.cpopSave.addEventListener("click", saveComment);
el.cpopClose.addEventListener("click", closeCommentPopup);
el.cpopResolve.addEventListener("click", async () => {
  const c = openComment;
  if (!c || !c.id) return;
  try {
    const upd = await commentRequest("PATCH",
      `api/comments/${encodeURIComponent(images[idx].name)}/${c.id}`, { resolved: !c.resolved });
    comments = comments.map((x) => (x.id === upd.id ? upd : x));
    closeCommentPopup();
  } catch (err) {
    flash(`Not changed: ${err.message}`);
  }
});
el.cpopDelete.addEventListener("click", async () => {
  const c = openComment;
  if (!c || !c.id || !window.confirm("Delete this comment?")) return;
  try {
    await commentRequest("DELETE", `api/comments/${encodeURIComponent(images[idx].name)}/${c.id}`);
    comments = comments.filter((x) => x.id !== c.id);
    closeCommentPopup();
  } catch (err) {
    flash(`Not deleted: ${err.message}`);
  }
});
el.cpopText.addEventListener("keydown", (e) => {
  // Enter saves, shift enter is a new line, esc closes without saving.
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveComment(); }
  if (e.key === "Escape") { e.preventDefault(); closeCommentPopup(); }
});

// ---------------------------------------------------------------- keyboard panning
//
// Arrow keys move the view while held, smoothly: frame by frame at
// key_pan screen px per second, easing in over the first moments so a tap is
// a small step, and 2.5 times as fast with shift. Two keys held pan
// diagonally. An open box keeps following the pointer, as with the mouse.

const keyPan = { held: new Set(), since: 0, last: 0, raf: 0 };
let shiftHeld = false;
window.addEventListener("keydown", (e) => { shiftHeld = e.shiftKey; }, true);
window.addEventListener("keyup", (e) => { shiftHeld = e.shiftKey; }, true);

function keyPanHold(dir, down) {
  if (down) {
    if (!keyPan.held.size) keyPan.since = performance.now();
    keyPan.held.add(dir);
    if (!keyPan.raf) { keyPan.last = 0; keyPan.raf = requestAnimationFrame(keyPanFrame); }
  } else {
    keyPan.held.delete(dir);
  }
}

function keyPanFrame(t) {
  keyPan.raf = 0;
  if (!keyPan.held.size || view !== "editor" || !natW) return;
  const dt = keyPan.last ? Math.min(t - keyPan.last, 50) : 0;
  keyPan.last = t;
  const vx = keyPan.held.has("right") - keyPan.held.has("left");
  const vy = keyPan.held.has("down") - keyPan.held.has("up");
  const len = Math.hypot(vx, vy);
  if (len) {
    const ease = 0.3 + 0.7 * Math.min(1, (t - keyPan.since) / 250);
    const speed = prefs.pointer.key_pan * (shiftHeld ? 2.5 : 1) * ease;
    // The view moves the way the arrow points, so the image moves the other.
    panX -= (vx / len) * speed * dt / 1000;
    panY -= (vy / len) * speed * dt / 1000;
    applyTransform();
    followPointer();
  }
  keyPan.raf = requestAnimationFrame(keyPanFrame);
}

function keyPanRow() {
  const key = "key_pan";
  const changed = prefs.pointer[key] !== POINTER_DEFAULTS[key];
  const row = h("div", "keyrow speed" + (changed ? " changed" : ""));
  const lab = h("label", "keylabel");
  lab.htmlFor = "speed-key_pan";
  lab.append("Arrow-key pan speed", h("span", "sub", "How fast the arrow keys move the view, on screen; shift makes it 2.5 times as fast."));
  const wrap = h("span", "chips");
  const r = h("input");
  r.type = "range"; r.id = "speed-key_pan";
  r.min = "100"; r.max = "4000"; r.step = "100";
  r.value = String(prefs.pointer[key]);
  r.dataset.f = "speed:key_pan";
  const out = h("output", "speedval", `${prefs.pointer[key]} px/s`);
  r.addEventListener("input", () => { prefs.pointer[key] = Number(r.value); out.textContent = `${r.value} px/s`; });
  r.addEventListener("change", () => saveSettings());
  wrap.append(r, out);
  const actions = h("span", "keyactions");
  if (changed) {
    const reset = h("button", "badge", "reset");
    reset.type = "button";
    reset.dataset.f = "speedreset:key_pan";
    reset.addEventListener("click", () => { prefs.pointer[key] = POINTER_DEFAULTS[key]; saveSettings(); });
    actions.appendChild(reset);
  }
  row.append(lab, wrap, actions);
  return row;
}


el.commentBtn.addEventListener("click", () => {
  if (commentPlacing) { cancelCommentPlacement(); render(); return; }
  startCommentPlacement();
});
// ---------------------------------------------------------------- selecting several boxes
//
// `sel` is one box, with handles to move and resize it. `multi` is several at
// once - chosen by dragging a rectangle (area select), by Ctrl+A, or by kind
// or class - drawn with the selection wash but without handles. The two never
// hold something at the same time; a single hit becomes `sel`.
//
// What acts on a selection acts on all of it: Delete removes your boxes,
// rejects sam3 boxes and un-picks exemplars, as one undo step; 1-9 move your
// boxes to a class; Enter approves sam3 boxes; Ctrl+C copies your boxes.

let multi = [];               // [{kind, i}]
let marquee = null;           // {x0, y0, x1, y1, button, add} in image px, while dragging
let marqueeArmed = false;     // the next drag selects instead of drawing

const inMulti = (kind, i) => multi.some((s) => s.kind === kind && s.i === i);

/** Everything on the image that can be selected: what is drawn. An exemplar's
    twin box is drawn as the exemplar, so it is the exemplar that counts. */
function selectable() {
  const out = [];
  boxes.forEach((b, i) => { if (!twinOfExemplar(b)) out.push({ kind: "box", i, b }); });
  preds.forEach((b, i) => { if (b.score >= threshold) out.push({ kind: "pred", i, b }); });
  exems.forEach((b, i) => out.push({ kind: "exem", i, b }));
  return out;
}

function describe(list) {
  const n = (k) => list.filter((s) => s.kind === k).length;
  const parts = [];
  if (n("box")) parts.push(plural(n("box"), "of yours", "of yours"));
  if (n("pred")) parts.push(`${n("pred")} sam3`);
  if (n("exem")) parts.push(plural(n("exem"), "exemplar", "exemplars"));
  return parts.join(", ");
}

/** Replace the selection: one box becomes the single selection (with its
    handles), more become `multi`. */
function setSelection(list, what) {
  multi = [];
  sel = null;
  if (list.length === 1) sel = { kind: list[0].kind, i: list[0].i, picked: true };
  else if (list.length > 1) multi = list.map(({ kind, i }) => ({ kind, i }));
  render();
  flash(list.length ? `Selected ${list.length}: ${describe(list)}` : `Nothing to select${what ? `: ${what}` : ""}`);
}

function currentSelection() {
  return multi.length ? [...multi] : sel ? [{ kind: sel.kind, i: sel.i }] : [];
}

function selectWhere(test, what) {
  if (boxesHidden) { flash("Boxes hidden: h shows them"); return; }
  setSelection(selectable().filter(test), what);
}

const selectAll = () => selectWhere(() => true, "no boxes on this image");
const selectExemplars = () => selectWhere((s) => s.kind === "exem", "no exemplars on this image");
const selectPredictions = () => selectWhere((s) => s.kind === "pred", "no sam3 boxes shown");

function selectClass(k) {
  const name = classList()[k];
  if (!name) { flash(`There is no class ${k + 1}`); return; }
  selectWhere((s) => s.kind === "box" && s.b.cls === name, `no ${name} boxes`);
}

// ---------------------------------------------------------------- area select

function toggleMarquee() {
  if (view !== "editor" || !natW) return;
  marqueeArmed = !marqueeArmed;
  marquee = null;
  if (marqueeArmed) draft = null;
  el.viewport.classList.toggle("selecting", marqueeArmed);
  el.areaBtn.classList.toggle("on", marqueeArmed);
  el.areaBtn.setAttribute("aria-pressed", String(marqueeArmed));
  flash(marqueeArmed ? "Drag over the boxes to select (shift adds), esc cancels" : "Area select off");
  render();
}

function disarmMarquee() {
  marqueeArmed = false;
  marquee = null;
  el.viewport.classList.remove("selecting");
  el.areaBtn.classList.remove("on");
  el.areaBtn.setAttribute("aria-pressed", "false");
}

/** Called by pointerEditStart for a press while area select is armed. */
function startMarquee(e, p) {
  marquee = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, button: e.button, add: false };
  render();
}

window.addEventListener("mousemove", (e) => {
  if (!marquee) return;
  const p = toImage(e);
  marquee.x1 = p.x;
  marquee.y1 = p.y;
  render();
});

window.addEventListener("mouseup", (e) => {
  if (!marquee || e.button !== marquee.button) return;
  const m = marquee;
  const x1 = Math.min(m.x0, m.x1), x2 = Math.max(m.x0, m.x1);
  const y1 = Math.min(m.y0, m.y1), y2 = Math.max(m.y0, m.y1);
  disarmMarquee();
  // Boxes that fall within the rectangle - wholly inside it, not merely
  // touched by it, so a sweep across a dense patch takes only what it covers.
  const hits = selectable().filter(({ b }) => b.x1 >= x1 && b.x2 <= x2 && b.y1 >= y1 && b.y2 <= y2);
  const list = e.shiftKey ? currentSelection() : [];
  for (const h of hits) if (!list.some((s) => s.kind === h.kind && s.i === h.i)) list.push(h);
  setSelection(list, "no box lies wholly inside");
});

/** The rectangle, drawn with the boxes: a light blue that is no class's and
    no source's colour, dashed while it is being dragged. */
function renderMarquee() {
  if (!marquee) return;
  const r = rect({ x1: Math.min(marquee.x0, marquee.x1), y1: Math.min(marquee.y0, marquee.y1),
                   x2: Math.max(marquee.x0, marquee.x1), y2: Math.max(marquee.y0, marquee.y1) }, "marquee");
  el.svg.appendChild(r);
}

// ---------------------------------------------------------------- acting on a selection

/** Delete everything selected: your boxes go, sam3 boxes are rejected (hidden
    for this visit, and logged), exemplars are un-picked - their annotation
    stays, as an ordinary box. One undo step brings it all back, un-picked
    exemplars included. */
async function deleteMulti() {
  const before = snapshot();
  const events = [];
  const ops = [];
  const exemIdx = multi.filter((s) => s.kind === "exem").map((s) => s.i).sort((a, b) => a - b);
  const dropped = [];
  for (const i of exemIdx) {
    const e = exems[i];
    if (!(await deleteExemplar(e.id))) break;          // the error is on screen
    const box = { x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, cls: e.cls };
    ops.push({ kind: "drop", id: e.id, box });
    events.push(logEvent("exemplar.drop", { id: e.id, box: nb(box) }));
    dropped.push(i);
  }
  for (const i of dropped.sort((a, b) => b - a)) exems.splice(i, 1);
  let changedBoxes = false;
  for (const i of multi.filter((s) => s.kind === "pred").map((s) => s.i).sort((a, b) => b - a)) {
    const p = preds[i];
    events.push(logEvent("pred.reject", { box: nb(p), cls: p.cls, score: p.score, edited: !!p.edited }));
    preds.splice(i, 1);
  }
  for (const i of multi.filter((s) => s.kind === "box").map((s) => s.i).sort((a, b) => b - a)) {
    const b = boxes[i];
    events.push(logEvent("box.delete", { box: nb(b), cls: b.cls, provenance: b.provenance, score: b.score }));
    boxes.splice(i, 1);
    changedBoxes = true;
  }
  const n = multi.length;
  multi = [];
  sel = null;
  record(`deletion of ${n}`, before, events, ops.length ? { exemplars: ops } : {});
  if (changedBoxes) touch();
  render();
  flash(`Deleted ${n}${dropped.length < exemIdx.length ? " (some exemplars could not be un-picked)" : ""}`);
}

function approveMulti() {
  const idx = multi.filter((s) => s.kind === "pred").map((s) => s.i).sort((a, b) => b - a);
  if (!idx.length) { flash("No sam3 box in the selection"); return; }
  const before = snapshot();
  const events = idx.map((i) => approve(i, true));
  multi = [];
  sel = null;
  record(`approval of ${plural(events.length, "box", "boxes")}`, before, events);
  touch();
  render();
  flash(`Approved ${events.length}`);
}

/** 1-9 with several selected: your boxes among them move to the class. */
function classMulti(name) {
  const own = multi.filter((s) => s.kind === "box").map((s) => boxes[s.i]).filter((b) => b && b.cls !== name);
  if (!own.length) { flash(`New boxes: ${name}`); return; }
  const before = snapshot();
  const events = own.map((b) => {
    const ev = logEvent("box.class", { box: nb(b), from: b.cls, to: name });
    b.cls = name;
    return ev;
  });
  record(`class change of ${plural(own.length, "box", "boxes")} to ${name}`, before, events);
  touch();
  render();
  renderLegend();
  flash(`${plural(own.length, "box", "boxes")} \u2192 ${name}`);
}

// Ctrl+A is "select every box" in the editor, and nothing anywhere else: it
// never selects the page's text - the help, the settings dialog - only the
// text of a field being typed in.
window.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey || (e.key !== "a" && e.key !== "A")) return;
  const t = e.target;
  if (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable) return;
  e.preventDefault();
}, true);

el.areaBtn.addEventListener("click", () => toggleMarquee());

// ---------------------------------------------------------------- stages
//
// Where each image is in the project's workflow. The list is per project
// (settings.json), in order: an image starts in the first stage; f moves the
// open image on to the next, shift f back; any stage can be picked from the
// chip in the header, and the grid moves a selection of images at once.
// The LAST stage is "signed off" - the workflow completed: it gets the ✓ on
// tiles, and the projects page counts it as done. Each stage can carry
// instructions, shown on the stage chip to whoever works on an image.
//
// Each stage has a fixed id; renaming it changes only its name, so nothing
// stored needs rewriting - and a workflow canvas can later connect stages by
// their ids. Removing a stage leaves its images' entries alone: they show in
// the first stage, and come back if a stage with that id is added again.

const DEFAULT_STAGES = [
  { id: "none", name: "No stage", color: "#4a5460", instructions: "" },
  { id: "annotating", name: "Annotating", color: "#8a7fd4", instructions: "" },
  { id: "review", name: "In review", color: "#e0a13a", instructions: "" },
  { id: "signed_off", name: "Signed off", color: "#4bd6a4", instructions: "" },
];

let imageStage = "";          // the open image's stage id

function stageList() {
  return projectPrefs.stages && projectPrefs.stages.length ? projectPrefs.stages : DEFAULT_STAGES;
}
/** A stage by id; an id the project no longer has reads as the first stage,
    as it does on the server. */
function stageOf(id) {
  const list = stageList();
  return list.find((s) => s.id === id) || list[0];
}
/** Signed off: in the last stage of the workflow. */
function isFinal(st) {
  const list = stageList();
  return !!st && st.id === list[list.length - 1].id;
}

// ---------------------------------------------------------------- in the editor

function renderStageChip() {
  const st = stageOf(imageStage);
  el.stageSwatch.style.background = st.color;
  el.stageChipName.textContent = st.name + (isFinal(st) ? " \u2713" : "");
  el.stageChip.classList.toggle("has-notes", !!(st.instructions || "").trim());
  el.stageChip.title = (st.instructions || "").trim()
    ? `${st.name}: ${st.instructions.trim()}\n\nf moves the image on, shift f back, click to choose`
    : "Stage of this image: f moves it on, shift f back, click to choose";
}

/** Move the open image to a stage. Undoable like any edit; the server logs it. */
function setImageStage(id) {
  if (view !== "editor" || !images[idx] || id === stageOf(imageStage).id) return;
  const before = snapshot();
  imageStage = id;
  record(`stage ${stageOf(id).name}`, before, []);
  touch();
  render();
  flash(`Stage: ${stageOf(id).name}`);
}

function stageStep(dir) {
  const list = stageList();
  const i = list.findIndex((s) => s.id === stageOf(imageStage).id);
  const j = clamp(i + dir, 0, list.length - 1);
  if (j === i) {
    flash(dir > 0 ? `${list[i].name} is the last stage` : `${list[i].name} is the first stage`);
    return;
  }
  setImageStage(list[j].id);
}

function renderStageMenu() {
  const frag = document.createDocumentFragment();
  for (const st of stageList()) {
    const b = h("button", "classitem" + (st.id === stageOf(imageStage).id ? " on" : ""));
    b.type = "button";
    b.setAttribute("role", "menuitem");
    const sw = h("i");
    sw.style.background = st.color;
    b.append(h("span", "k", ""), sw, h("span", "n", st.name + (isFinal(st) ? " \u2713" : "")));
    if ((st.instructions || "").trim()) b.title = st.instructions.trim();
    b.addEventListener("click", () => { closeStageMenu(); setImageStage(st.id); });
    frag.appendChild(b);
  }
  const edit = h("button", "classitem edit", "edit stages\u2026");
  edit.type = "button";
  edit.addEventListener("click", () => {
    closeStageMenu();
    settingsTab = "workflow";
    localStorage.setItem(K_TAB, settingsTab);
    toggleKeys();
  });
  frag.appendChild(edit);
  el.stageMenu.replaceChildren(frag);
}
function openStageMenu() {
  renderStageMenu();
  const r = el.stageChip.getBoundingClientRect();
  el.stageMenu.style.left = `${Math.round(Math.min(r.left, innerWidth - 220))}px`;
  el.stageMenu.style.top = `${Math.round(r.bottom + 4)}px`;
  el.stageMenu.hidden = false;
  el.stageChip.setAttribute("aria-expanded", "true");
}
function closeStageMenu() {
  el.stageMenu.hidden = true;
  el.stageChip.setAttribute("aria-expanded", "false");
}
el.stageChip.addEventListener("click", () => (el.stageMenu.hidden ? openStageMenu() : closeStageMenu()));
window.addEventListener("mousedown", (e) => {
  if (!el.stageMenu.hidden && !e.target.closest("#stageMenu, #stageChip")) closeStageMenu();
}, true);
el.stageMenu.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); closeStageMenu(); el.stageChip.focus(); }
});

// ---------------------------------------------------------------- selecting images in the grid
//
// A checkbox on each tile (or ctrl click on the tile); shift click selects the
// run from the last one clicked. "select shown" (ctrl a) selects exactly the
// images the name filter and the stage tab leave on screen - which is how
// images are selected by name and by stage - replacing what was selected, so
// nothing out of sight comes along. Clicked selections outlive filter
// changes; a move says how many selected images are not on screen.

const gridSel = new Set();    // image names
let gridAnchor = -1;          // index into `images` of the last box clicked

function shownImages() {
  const needle = el.search.value.trim().toLowerCase();
  return images.filter((im) => (!needle || im.name.toLowerCase().includes(needle))
    && (filter === "all" || stageOf(im.stage).id === filter) && matchesContent(im));
}

function renderGridSelection() {
  const n = gridSel.size;
  el.selCount.textContent = n ? `${n} selected` : "";
  el.selNone.disabled = !n;
  el.bulkStage.disabled = !n;
  for (const t of el.grid.children) {
    const on = gridSel.has(t.dataset.name);
    t.classList.toggle("selected", on);
    const box = t.querySelector(".tsel");
    if (box) box.setAttribute("aria-checked", String(on));
  }
}

function fillBulkStage() {
  const opts = [new Option("move selected to\u2026", "")];
  for (const st of stageList()) opts.push(new Option(st.name, st.id));
  el.bulkStage.replaceChildren(...opts);
}

function selectShown() {
  gridSel.clear();
  for (const im of shownImages()) gridSel.add(im.name);
  renderGridSelection();
  status(`${gridSel.size} selected`);
}
function deselectAll() {
  gridSel.clear();
  gridAnchor = -1;
  renderGridSelection();
}

el.grid.addEventListener("click", (e) => {
  const t = e.target.closest(".tile");
  if (!t) return;
  const onBox = !!e.target.closest(".tsel");
  if (!onBox && !(e.ctrlKey || e.metaKey)) return;       // a plain click opens the image
  e.preventDefault();
  const i = images.findIndex((im) => im.name === t.dataset.name);
  if (e.shiftKey && gridAnchor >= 0) {
    // The run between the last clicked and this one, among the tiles shown.
    const order = [...el.grid.children].map((c) => c.dataset.name);
    const a = order.indexOf(images[gridAnchor].name), b = order.indexOf(t.dataset.name);
    if (a >= 0 && b >= 0) {
      for (const name of order.slice(Math.min(a, b), Math.max(a, b) + 1)) gridSel.add(name);
    }
  } else if (gridSel.has(t.dataset.name)) {
    gridSel.delete(t.dataset.name);
  } else {
    gridSel.add(t.dataset.name);
  }
  gridAnchor = i;
  renderGridSelection();
});

el.selAllShown.addEventListener("click", selectShown);
el.selNone.addEventListener("click", deselectAll);
el.bulkStage.addEventListener("change", async () => {
  const id = el.bulkStage.value;
  el.bulkStage.value = "";
  if (!id || !gridSel.size) return;
  const st = stageOf(id);
  const names = [...gridSel];
  const shown = new Set(shownImages().map((im) => im.name));
  const hidden = names.filter((n) => !shown.has(n)).length;
  const ask = `Move ${plural(names.length, "image", "images")} to \u201c${st.name}\u201d?`
    + (hidden ? `\n\n${hidden} of them ${hidden === 1 ? "is" : "are"} selected but not shown with the current filter and tab.` : "");
  if ((names.length > 1 || hidden) && !window.confirm(ask)) return;
  try {
    const r = await fetch(BASE + "api/stages?" + new URLSearchParams({ project }), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ images: names, stage: id }),
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const data = await r.json();
    for (const im of images) if (gridSel.has(im.name)) im.stage = id;
    renderGrid();
    status(`${plural(data.moved, "image", "images")} moved to ${st.name}`
      + (data.moved < names.length ? ` (${names.length - data.moved} already there)` : ""));
  } catch (err) {
    status(`Not moved: ${err.message}`, true);
  }
});

// ---------------------------------------------------------------- the Workflow tab in settings

/** Edits go to a copy of the list the project uses, so the defaults become the
    project's own list on the first change. */
function editableStages() {
  if (!projectPrefs.stages || !projectPrefs.stages.length) {
    projectPrefs.stages = DEFAULT_STAGES.map((s) => ({ ...s }));
  }
  return projectPrefs.stages;
}

function stagesChanged() {
  saveProjectSettings();
  fillBulkStage();
  renderStageChip();
  if (view === "dataset") renderGrid();
  scheduleStrip();
}

function stageCounts() {
  const counts = {};
  for (const im of images) {
    const id = stageOf(im.stage).id;
    counts[id] = (counts[id] || 0) + 1;
  }
  return counts;
}

function stageIdFor(name) {
  const base = name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30) || "stage";
  const taken = new Set(stageList().map((s) => s.id));
  let id = /^[a-z0-9]/.test(base) ? base : "s_" + base;
  for (let k = 2; taken.has(id); k++) id = `${base}_${k}`;
  return id;
}

function stageRow(st, i, list, counts) {
  const row = h("div", "keyrow stagerow");
  const color = h("input");
  color.type = "color";
  color.value = st.color;
  color.dataset.f = `stage:${st.id}:color`;
  color.setAttribute("aria-label", `Colour of ${st.name}`);
  color.addEventListener("input", () => { editableStages()[i].color = color.value; renderStageChip(); });
  color.addEventListener("change", () => { editableStages()[i].color = color.value; stagesChanged(); });

  const name = h("input", "field classname");
  name.type = "text";
  name.maxLength = 40;
  name.value = st.name;
  name.dataset.f = `stage:${st.id}:name`;
  name.setAttribute("aria-label", `Name of stage ${i + 1}`);
  name.addEventListener("change", () => {
    const v = name.value.trim();
    const clash = list.some((o, k) => k !== i && o.name.toLowerCase() === v.toLowerCase());
    if (!v || clash) {
      keyStatus(v ? `There is already a stage called ${v}.` : "A stage needs a name.", true);
      name.value = st.name;
      return;
    }
    editableStages()[i].name = v;
    stagesChanged();
  });
  name.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); name.blur(); }
    if (e.key === "Escape") { e.preventDefault(); name.value = st.name; name.blur(); }
  });

  // Instructions: a box that opens a text field under the row.
  const notes = (st.instructions || "").trim();
  const open = openInstructions.has(st.id);
  const note = h("button", "badge notebtn" + (notes ? " has" : "") + (open ? " on" : ""),
                 notes ? "instructions \u270e" : "instructions");
  note.type = "button";
  note.dataset.f = `stage:${st.id}:notes`;
  note.setAttribute("aria-expanded", String(open));
  note.title = notes || "Write what to do in this stage";
  note.addEventListener("click", () => {
    if (openInstructions.has(st.id)) openInstructions.delete(st.id);
    else openInstructions.add(st.id);
    renderKeys();
    if (openInstructions.has(st.id)) focusKey(`stage:${st.id}:text`);
  });

  const n = project ? counts[st.id] || 0 : null;
  const info = h("span", "classid", (i === 0 ? "start \u00b7 " : i === list.length - 1 ? "signed off \u00b7 " : "")
    + (n === null ? "" : plural(n, "image", "images")));

  const actions = h("span", "keyactions");
  const small = (text, label, f, fn) => {
    const b = h("button", "badge", text);
    b.type = "button";
    b.title = label;
    b.setAttribute("aria-label", `${label}: ${st.name}`);
    b.dataset.f = f;
    b.addEventListener("click", fn);
    actions.appendChild(b);
  };
  const move = (by) => {
    const a = editableStages();
    [a[i], a[i + by]] = [a[i + by], a[i]];
    stagesChanged();
  };
  if (i > 0) small("\u2191", "Move up", `stage:${st.id}:up`, () => move(-1));
  if (i < list.length - 1) small("\u2193", "Move down", `stage:${st.id}:down`, () => move(1));
  if (list.length > 1) {
    small("remove", "Remove this stage", `stage:${st.id}:remove`, () => {
      const first = list[i === 0 ? 1 : 0];
      const msg = `Remove \u201c${st.name}\u201d? Its ${plural(n, "image", "images")} will show in `
        + `\u201c${first.name}\u201d.`;
      if (n && !window.confirm(msg)) return;
      editableStages().splice(i, 1);
      if (filter === st.id) filter = "all";
      stagesChanged();
    });
  }
  const wrap = h("span", "chips");
  wrap.append(color, name, note, info);
  row.append(h("span", "classkey", String(i + 1)), wrap, actions);
  if (!open) return row;
  const box = h("div", "stagenotes");
  const ta = h("textarea");
  ta.rows = 4;
  ta.maxLength = 4000;
  ta.value = st.instructions || "";
  ta.placeholder = `What to do in \u201c${st.name}\u201d - shown on the stage chip to whoever works on an image in it`;
  ta.dataset.f = `stage:${st.id}:text`;
  ta.setAttribute("aria-label", `Instructions for ${st.name}`);
  ta.addEventListener("change", () => {
    editableStages()[i].instructions = ta.value.trim();
    stagesChanged();
    keyStatus(`Instructions for ${st.name} saved.`);
  });
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); ta.blur(); }   // keeps what was typed: change saves it
  });
  box.appendChild(ta);
  const frag = document.createDocumentFragment();
  frag.append(row, box);
  return frag;
}

const openInstructions = new Set();   // stage ids whose instructions box is open

function renderWorkflow() {
  const frag = document.createDocumentFragment();
  const sec = h("section", "keys-screen");
  sec.appendChild(h("h3", "", "Stages"));
  if (!project) {
    sec.appendChild(h("p", "keyhint", "Open a project to set its stages."));
  } else {
    sec.appendChild(h("p", "keyhint",
      `The stages of ${project}, in order. An image starts in the first; in the editor f moves `
      + "it to the next and shift f back, and the stage chip in the header picks any. In the grid, "
      + "select images and move them together. The last stage is signed off - the workflow "
      + "completed: the \u2713 on tiles, and the % on the projects page. Instructions show on "
      + "the stage chip. Renaming a stage keeps its images in it."));
    const list = stageList(), counts = stageCounts();
    list.forEach((st, i) => sec.appendChild(stageRow(st, i, list, counts)));

    const add = h("div", "keyrow addclass");
    const input = h("input", "field classname");
    input.type = "text";
    input.maxLength = 40;
    input.placeholder = "new stage name";
    input.dataset.f = "stage:add:name";
    input.setAttribute("aria-label", "Name of a new stage");
    const btn = h("button", "badge", "add stage");
    btn.type = "button";
    btn.dataset.f = "stage:add";
    const go = () => {
      const v = input.value.trim();
      if (!v) return;
      if (stageList().some((s) => s.name.toLowerCase() === v.toLowerCase())) {
        keyStatus(`There is already a stage called ${v}.`, true);
        return;
      }
      const a = editableStages();
      // Before the last stage, so signed off stays the end of the workflow.
      a.splice(Math.max(a.length - 1, 0), 0,
               { id: stageIdFor(v), name: v, color: PALETTE[a.length % PALETTE.length], instructions: "" });
      stagesChanged();
      keyStatus(`Added ${v}.`);
      focusKey("stage:add:name");
    };
    btn.addEventListener("click", go);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
    add.append(input, btn);
    sec.appendChild(add);
  }
  frag.appendChild(sec);
  el.keysList.replaceChildren(frag);
  el.keysChanged.textContent = project ? plural(stageList().length, "stage", "stages") : "";
  el.keysResetAll.disabled = true;
}

// ---------------------------------------------------------------- filtering images by content
//
// Which images the grid shows, by what is in them: how many boxes of yours,
// sam3 boxes, exemplars and open comments (each a from-to range; empty is no
// limit), which classes they have, and which image flags. Each class and each
// flag is a chip with three states - ignored, must have (✓), must not have
// (✗) - and the ticked ones can be required all together or any one of them.
//
// It combines with the name filter and the stage tab: the tab counts, the
// tiles and "select shown" all follow all three. Remembered per project.
// sam3 boxes and exemplars are the selected run's; sam3 boxes are those at or
// above the confidence threshold, as the run proposed them.

const CF_COUNTS = [
  ["boxes", "boxes of yours"],
  ["preds", "sam3 boxes"],
  ["exems", "exemplars"],
  ["comments", "open comments"],
];
const K_CFILTER = (p) => `al.cfilter:${p}`;

function emptyContentFilter() {
  const f = { classes: {}, mode: "all", flags: {}, flagMode: "any" };
  for (const [k] of CF_COUNTS) f[k] = [null, null];
  return f;
}
let cfilter = emptyContentFilter();
let statsStale = false;       // sam3 and exemplar counts are for another run or threshold

function loadContentFilter() {
  cfilter = emptyContentFilter();
  try {
    const saved = JSON.parse(localStorage.getItem(K_CFILTER(project)) || "null");
    if (saved) cfilter = { ...cfilter, ...saved };
  } catch (err) { /* a damaged entry is just no filter */ }
}
function saveContentFilter() {
  if (project) localStorage.setItem(K_CFILTER(project), JSON.stringify(cfilter));
}

/** Class states that still mean something: renamed or removed classes drop out. */
function classStates() {
  const list = classList();
  return Object.entries(cfilter.classes).filter(([n, s]) => list.includes(n) && s);
}

const flagStates = () => Object.entries(cfilter.flags || {}).filter(([, s]) => s);

function contentFilterCount() {
  let n = 0;
  for (const [k] of CF_COUNTS) if (cfilter[k][0] !== null || cfilter[k][1] !== null) n++;
  return n + classStates().length + flagStates().length;
}

function matchesContent(im) {
  for (const [k] of CF_COUNTS) {
    const [lo, hi] = cfilter[k];
    const v = im[k] || 0;
    if (lo !== null && v < lo) return false;
    if (hi !== null && v > hi) return false;
  }
  const cls = im.classes || {};
  const states = classStates();
  if (states.some(([n, s]) => s === "not" && cls[n])) return false;
  const want = states.filter(([, s]) => s === "has").map(([n]) => n);
  if (want.length && !(cfilter.mode === "all" ? want.every((n) => cls[n]) : want.some((n) => cls[n]))) {
    return false;
  }
  const fl = new Set(im.flags || []);
  const fstates = flagStates();
  if (fstates.some(([f, s]) => s === "not" && fl.has(f))) return false;
  const fwant = fstates.filter(([, s]) => s === "has").map(([f]) => f);
  if (fwant.length && !(cfilter.flagMode === "all" ? fwant.every((f) => fl.has(f)) : fwant.some((f) => fl.has(f)))) {
    return false;
  }
  return true;
}

/** What is in an image, for its tile's tooltip. */
function contentSummary(im) {
  const parts = [];
  const cls = Object.entries(im.classes || {});
  parts.push(plural(im.boxes || 0, "box", "boxes")
    + (cls.length ? ` (${cls.map(([n, c]) => `${n} ${c}`).join(", ")})` : ""));
  if (im.preds) parts.push(`${im.preds} sam3`);
  if (im.exems) parts.push(plural(im.exems, "exemplar", "exemplars"));
  if (im.comments) parts.push(plural(im.comments, "open comment", "open comments"));
  if (im.flags && im.flags.length) parts.push("\u2691 " + describeFlags(im.flags, im.flag_note || ""));
  return parts.join(" \u00b7 ");
}

/** The selected run's counts, at the current threshold. Merged into `images`
    by name, so the editor's place in the list is untouched. */
async function refreshImageStats() {
  statsStale = false;
  try {
    const r = await fetch(q("api/images", { min_score: threshold }));
    if (!r.ok) throw new Error(`api/images returned ${r.status}`);
    const fresh = new Map((await r.json()).map((im) => [im.name, im]));
    for (const im of images) {
      const f = fresh.get(im.name);
      if (f) Object.assign(im, f);
    }
  } catch (err) {
    console.warn("image counts not refreshed:", err.message);
  }
  if (view === "dataset") { sortImages(); renderGrid(); }
}

/** After a run switch or a new threshold: now if the grid is on screen,
    otherwise when it is next shown. */
function imageStatsChanged() {
  statsStale = true;
  if (view === "dataset") refreshImageStats();
}

/** The editor keeps the open image's entry current as it is edited. */
function noteImageContents() {
  const im = images[idx];
  if (!im || view !== "editor" || !natW) return;
  const cls = {};
  for (const b of boxes) cls[b.cls] = (cls[b.cls] || 0) + 1;
  im.classes = cls;
  im.exems = exems.length;
  im.comments = comments.filter((c) => !c.resolved).length;
  im.flags = [...imageFlags];
  im.flag_note = flagNote;
}

// ---------------------------------------------------------------- the panel

function renderFilterButton() {
  const n = contentFilterCount();
  el.filterBtn.textContent = n ? `filter (${n})` : "filter";
  el.filterBtn.classList.toggle("on", n > 0);
}

function renderFilterPanel() {
  const frag = document.createDocumentFragment();
  frag.appendChild(h("div", "fp-title", "Show images with"));
  for (const [k, label] of CF_COUNTS) {
    const row = h("div", "fp-row");
    const num = (which, ph) => {
      const i = h("input", "field fp-num");
      i.type = "number";
      i.min = "0";
      i.step = "1";
      i.placeholder = ph;
      i.value = cfilter[k][which] === null ? "" : String(cfilter[k][which]);
      i.dataset.f = `cf:${k}:${which ? "to" : "from"}`;
      i.setAttribute("aria-label", `${label}, ${which ? "at most" : "at least"}`);
      i.addEventListener("input", () => {
        const v = i.value.trim() === "" ? null : Math.max(0, Math.floor(Number(i.value)));
        cfilter[k][which] = Number.isFinite(v) ? v : null;
        contentFilterChanged();
      });
      return i;
    };
    row.append(h("span", "fp-label", label), h("span", "fp-sep", "from"), num(0, "0"),
               h("span", "fp-sep", "to"), num(1, "any"));
    frag.appendChild(row);
  }
  if (!run) frag.appendChild(h("p", "fp-note", "Select a run above to filter by its sam3 boxes and exemplars."));
  else frag.appendChild(h("p", "fp-note", `sam3 boxes and exemplars of ${run}; sam3 boxes at confidence \u2265 ${threshold.toFixed(2)}.`));

  const list = classList();
  const head = h("div", "fp-row fp-classhead");
  head.appendChild(h("span", "fp-label", "classes"));
  const mode = h("button", "badge", cfilter.mode === "all" ? "all of the \u2713" : "any of the \u2713");
  mode.type = "button";
  mode.dataset.f = "cf:mode";
  mode.title = "Whether an image needs every class ticked \u2713, or one of them is enough";
  mode.addEventListener("click", () => {
    cfilter.mode = cfilter.mode === "all" ? "any" : "all";
    contentFilterChanged();
    renderFilterPanel();
  });
  head.appendChild(mode);
  frag.appendChild(head);
  const chips = h("div", "fp-classes");
  if (!list.length) chips.appendChild(h("span", "fp-note", "No classes in this project yet."));
  for (const name of list) {
    const state = cfilter.classes[name] || "";
    const c = h("button", "fp-class" + (state ? " " + state : ""));
    c.type = "button";
    c.dataset.f = `cf:class:${name}`;
    c.title = "click: must have \u2713, again: must not have \u2717, again: either";
    const sw = h("i");
    sw.style.background = classStyle(name).color;
    c.append(h("span", "fp-mark", state === "has" ? "\u2713" : state === "not" ? "\u2717" : ""), sw, name);
    c.setAttribute("aria-pressed", String(!!state));
    c.addEventListener("click", () => {
      const next = { "": "has", has: "not", not: "" }[state];
      if (next) cfilter.classes[name] = next;
      else delete cfilter.classes[name];
      contentFilterChanged();
      renderFilterPanel();
      focusFilter(`cf:class:${name}`);
    });
    chips.appendChild(c);
  }
  frag.appendChild(chips);

  // Image flags: the same three states, no colours.
  const fhead = h("div", "fp-row fp-classhead");
  fhead.appendChild(h("span", "fp-label", "image flags"));
  const fmode = h("button", "badge", cfilter.flagMode === "all" ? "all of the \u2713" : "any of the \u2713");
  fmode.type = "button";
  fmode.dataset.f = "cf:flagmode";
  fmode.title = "Whether an image needs every flag ticked \u2713, or one of them is enough";
  fmode.addEventListener("click", () => {
    cfilter.flagMode = cfilter.flagMode === "all" ? "any" : "all";
    contentFilterChanged();
    renderFilterPanel();
  });
  fhead.appendChild(fmode);
  frag.appendChild(fhead);
  const fchips = h("div", "fp-classes");
  for (const [id, label] of IMAGE_FLAGS) {
    const state = (cfilter.flags || {})[id] || "";
    const c = h("button", "fp-class fp-flag" + (state ? " " + state : ""));
    c.type = "button";
    c.dataset.f = `cf:flag:${id}`;
    c.title = "click: must have \u2713, again: must not have \u2717, again: either";
    c.append(h("span", "fp-mark", state === "has" ? "\u2713" : state === "not" ? "\u2717" : ""), label);
    c.setAttribute("aria-pressed", String(!!state));
    c.addEventListener("click", () => {
      const next = { "": "has", has: "not", not: "" }[state];
      cfilter.flags = cfilter.flags || {};
      if (next) cfilter.flags[id] = next;
      else delete cfilter.flags[id];
      contentFilterChanged();
      renderFilterPanel();
      focusFilter(`cf:flag:${id}`);
    });
    fchips.appendChild(c);
  }
  frag.appendChild(fchips);

  const foot = h("div", "fp-foot");
  const matching = images.filter(matchesContent).length;
  foot.appendChild(h("span", "fp-count", `${matching} of ${plural(images.length, "image", "images")} match`));
  const clear = h("button", "badge", "clear filter");
  clear.type = "button";
  clear.dataset.f = "cf:clear";
  clear.disabled = !contentFilterCount();
  clear.addEventListener("click", () => {
    cfilter = emptyContentFilter();
    contentFilterChanged();
    renderFilterPanel();
  });
  foot.appendChild(clear);
  frag.appendChild(foot);
  el.filterPanel.replaceChildren(frag);
}

function focusFilter(f) {
  const t = el.filterPanel.querySelector(`[data-f="${CSS.escape(f)}"]`);
  if (t) t.focus();
}

function contentFilterChanged() {
  saveContentFilter();
  renderFilterButton();
  renderGrid();
  const count = el.filterPanel.querySelector(".fp-count");
  if (count) count.textContent = `${images.filter(matchesContent).length} of ${plural(images.length, "image", "images")} match`;
  const clear = el.filterPanel.querySelector('[data-f="cf:clear"]');
  if (clear) clear.disabled = !contentFilterCount();
}

function openFilterPanel() {
  renderFilterPanel();
  el.filterPanel.hidden = false;
  el.filterBtn.setAttribute("aria-expanded", "true");
  const r = el.filterBtn.getBoundingClientRect();

  el.filterPanel.style.left = `${Math.round(Math.max(8, Math.min(r.left, innerWidth - el.filterPanel.offsetWidth - 8)))}px`;
}
function closeFilterPanel() {
  el.filterPanel.hidden = true;
  el.filterBtn.setAttribute("aria-expanded", "false");
}
el.filterBtn.addEventListener("click", () => (el.filterPanel.hidden ? openFilterPanel() : closeFilterPanel()));
window.addEventListener("mousedown", (e) => {

}, true);
