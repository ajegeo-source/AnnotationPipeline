/** Which screen is showing: "projects", "dataset" or "editor". The editor's
    key bindings and resize handling only act while this is "editor". */
let view = null;

// ---------------------------------------------------------------- view

let fit = 1, zoom = 1, panX = 0, panY = 0;

const scale = () => fit * zoom;

function applyTransform() {
  el.stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scale()})`;
  scheduleMinimap();
  schedulePins();                    // pins stay on their spot, at screen size
}

function fitToViewport() {
  const vw = el.viewport.clientWidth, vh = el.viewport.clientHeight;
  fit = Math.min(vw / natW, vh / natH);
  zoom = 1;
  panX = (vw - natW * fit) / 2;
  panY = (vh - natH * fit) / 2;
  applyTransform();
  render();   // handles are sized in image units, so they depend on the scale
}

// Wheel zoom and panning are commands (view.zoomIn, view.zoomOut, view.pan),
// dispatched with every other input; see the command table.

let panning = null;

/** Start dragging the image. It moves pan_gain times as far as the pointer:
    above 1 a short flick crosses a large image, below 1 gives fine control at
    high zoom, and at exactly 1 the image stays under the cursor. */
function panStart(e) {
  panning = { x: e.clientX, y: e.clientY, px: panX, py: panY, button: e.button };
  el.viewport.classList.add("panning");
  // "Grabbing" says what is happening; the drawn cursor steps aside until the
  // pointer next moves over the image.
  el.svg.style.cursor = "grabbing";
  overBox = true;
  schedulePointer();
}
window.addEventListener("mousemove", (e) => {
  if (!panning) return;
  const g = prefs.pointer.pan_gain;
  panX = panning.px + (e.clientX - panning.x) * g;
  panY = panning.py + (e.clientY - panning.y) * g;
  applyTransform();
});
window.addEventListener("mouseup", (e) => {
  if (!panning || e.button !== panning.button) return;
  panning = null;
  el.viewport.classList.remove("panning");
  // A box still open wants the drawing cursor back now, not at the next
  // hover - the hover handler stands aside while a box is open.
  if (draft) {
    el.svg.style.cursor = styleOf("cursor").show ? "none" : "crosshair";
    overBox = false;
    schedulePointer();
  }
});

// ---------------------------------------------------------------- geometry

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function normalise(b) {
  if (typeof b.cls !== "string" || !b.cls) b.cls = activeClass || DEFAULT_CLASS_NAME;
  const x1 = Math.min(b.x1, b.x2), x2 = Math.max(b.x1, b.x2);
  const y1 = Math.min(b.y1, b.y2), y2 = Math.max(b.y1, b.y2);
  b.x1 = x1; b.x2 = x2; b.y1 = y1; b.y2 = y2;
  return b;
}

function iou(a, b) {
  const w = Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1);
  const h = Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1);
  if (w <= 0 || h <= 0) return 0;
  const inter = w * h;
  const union = (a.x2 - a.x1) * (a.y2 - a.y1)
              + (b.x2 - b.x1) * (b.y2 - b.y1) - inter;
  return union > 0 ? inter / union : 0;
}

const listOf = (kind) =>
  kind === "pred" ? preds : kind === "exem" ? exems : boxes;
const at = (s) => (s ? listOf(s.kind)[s.i] : null);
const isSel = (kind, i) => (!!sel && sel.kind === kind && sel.i === i) || inMulti(kind, i);
const shownPreds = () => preds.filter((b) => b.score >= threshold);
const fromSam3 = (b) => b.provenance !== PROV_HUMAN;

/** An exemplar has a twin in `boxes` - picking one writes an annotation too -
    so the twin is not drawn. The threshold is tight because the two are the
    same rectangle; a merely overlapping neighbour must stay visible. */
const twinOfExemplar = (b) => exems.some((e) => iou(e, b) >= EXEMPLAR_IOU);

// ---------------------------------------------------------------- hit testing

function toImage(e) {
  const p = el.svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  const m = el.svg.getScreenCTM();
  return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 };
}

/** Every grabbable box, topmost first: yours over sam3, later over earlier. */
function candidates() {
  const out = [];
  if (boxesHidden || peeking) return out;   // what you cannot see, you cannot grab
  for (let i = exems.length - 1; i >= 0; i--) out.push({ kind: "exem", i, b: exems[i] });
  for (let i = boxes.length - 1; i >= 0; i--) {
    if (twinOfExemplar(boxes[i])) continue;
    out.push({ kind: "box", i, b: boxes[i] });
  }
  for (let i = preds.length - 1; i >= 0; i--) {
    if (preds[i].score >= threshold) out.push({ kind: "pred", i, b: preds[i] });
  }
  return out;
}

function cornerAt(b, p, grab) {
  const west  = Math.abs(p.x - b.x1) <= grab;
  const east  = Math.abs(p.x - b.x2) <= grab;
  const north = Math.abs(p.y - b.y1) <= grab;
  const south = Math.abs(p.y - b.y2) <= grab;
  if (north && west) return "nw";
  if (north && east) return "ne";
  if (south && west) return "sw";
  if (south && east) return "se";
  return null;
}

/** Corners beat interiors everywhere, or a corner inside another box would be
    unreachable. The grab radius is in screen px, so it does not shrink as you
    zoom in to place an edge precisely. */
function hitTest(p) {
  const grab = HANDLE_PX / scale();
  const list = candidates();
  for (const c of list) {
    // Exemplars have no corners: the manifest is a picked set, not a canvas.
    // Wrong shape? del it, fix the annotation, pick it again.
    if (c.kind === "exem") continue;
    const mode = cornerAt(normalise(c.b), p, grab);
    if (mode) return { kind: c.kind, i: c.i, mode };
  }
  for (const c of list) {
    const b = c.b;
    if (p.x >= b.x1 && p.x <= b.x2 && p.y >= b.y1 && p.y <= b.y2) {
      return { kind: c.kind, i: c.i, mode: c.kind === "exem" ? "pick" : "move" };
    }
  }
  return null;
}

const CURSOR = {
  move: "move", pick: "pointer",
  nw: "nwse-resize", se: "nwse-resize",
  ne: "nesw-resize", sw: "nesw-resize",
};

// ---------------------------------------------------------------- drag & draw

let draft = null;   // a new box being dragged out
let drag = null;    // an existing box being moved or resized

/** A press of the button bound to "Draw, move and resize boxes" (left by
    default). With a box open in two-click mode, the press finishes it,
    wherever it lands. Otherwise: grab the box or corner under the pointer,
    or start a new box. */
let drawHintShown = false;
function pointerEditStart(e) {
  if (commentPlacing && !(draft && draft.open)) { startCommentDraft(e, toImage(e)); return; }
  if (marqueeArmed) { startMarquee(e, toImage(e)); return; }
  if (peeking) return;
  if (boxesHidden) { flash("Boxes hidden: h shows them"); return; }
  const p = toImage(e);
  if (draft && draft.open) {
    draft.x1 = p.x; draft.y1 = p.y;
    endDraft();
    return;
  }
  const hit = hitTest(p);
  if (hit) {
    // `picked`: chosen by clicking it, as opposed to selected automatically
    // after drawing, pasting or approving (see below).
    sel = { kind: hit.kind, i: hit.i, picked: true };
    multi = [];
    if (hit.mode !== "pick") {
      const b = at(sel);
      drag = {
        kind: hit.kind, i: hit.i, mode: hit.mode, p0: p, button: e.button,
        start: { x1: b.x1, y1: b.y1, x2: b.x2, y2: b.y2 },
        before: snapshot(),          // for undo, if the drag changes anything
      };
    }
    render();
    return;
  }
  // A box you clicked to select: the next press on empty space means "done
  // with that box", not "start another" - it deselects and nothing more, and
  // the press after that draws. A box selected automatically (just drawn,
  // pasted or approved) does not hold up the next box: drawing one after
  // another stays two clicks each.
  if ((sel && sel.picked) || multi.length) {
    sel = null;
    multi = [];
    render();
    return;
  }
  // In two-click mode this press only sets the first corner. The box then
  // follows the pointer with no button held - through pans and zooms - until
  // the next press of this button finishes it, or esc cancels it.
  const open = prefs.pointer.draw !== "drag";
  draft = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, button: e.button, open };
  sel = null;
  if (open && !drawHintShown) {
    drawHintShown = true;
    flash("Click again to finish the box, esc to cancel");
  }
  render();
}

el.svg.addEventListener("mousemove", (e) => {
  if (drag || draft || panning) return;
  const hit = hitTest(toImage(e));
  // Over a box or a corner the system cursor shows what a drag will do; over
  // empty image, the drawn cursor (or the system crosshair, if it is off).
  overBox = !!hit;
  el.svg.style.cursor = hit ? CURSOR[hit.mode] : (styleOf("cursor").show ? "none" : "crosshair");
  schedulePointer();
});
el.svg.addEventListener("mouseleave", () => {
  if (drag || draft || panning) return;
  overBox = false;
  schedulePointer();
});

// On window, not on the svg: a drag that leaves the image should keep tracking.
let lastClient = null;       // where the pointer last was, for followPointer()
window.addEventListener("mousemove", (e) => {
  // While the minimap is being used, an open box waits: its corner should not
  // jump to whatever part of the image the minimap happens to cover.
  if (mmDrag || mmNav || strip.press
      || (draft && draft.open && e.target.closest && e.target.closest(".minimap, .strip, .scanbar"))) return;
  lastClient = { clientX: e.clientX, clientY: e.clientY };
  if (drag) { dragTo(toImage(e)); return; }
  if (draft) {
    const p = toImage(e);
    draft.x1 = p.x; draft.y1 = p.y;
    render();
  }
});

function dragTo(p) {
  const b = at(drag);
  if (!b) { drag = null; return; }
  const s = drag.start;
  const dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
  if (drag.mode === "move") {
    const w = s.x2 - s.x1, h = s.y2 - s.y1;
    const x = clamp(s.x1 + dx, 0, natW - w);
    const y = clamp(s.y1 + dy, 0, natH - h);
    b.x1 = x; b.y1 = y; b.x2 = x + w; b.y2 = y + h;
  } else {
    const west = drag.mode[1] === "w", north = drag.mode[0] === "n";
    b.x1 = west  ? clamp(s.x1 + dx, 0, natW) : s.x1;
    b.x2 = west  ? s.x2 : clamp(s.x2 + dx, 0, natW);
    b.y1 = north ? clamp(s.y1 + dy, 0, natH) : s.y1;
    b.y2 = north ? s.y2 : clamp(s.y2 + dy, 0, natH);
  }
  render();
}

function endDrag() {
  const b = at(drag), s = drag.start;
  if (b) {
    normalise(b);
    if (b.x2 - b.x1 < MIN_BOX || b.y2 - b.y1 < MIN_BOX) Object.assign(b, s);
    const changed = ["x1", "y1", "x2", "y2"].some((k) => Math.abs(b[k] - s[k]) > 0.5);
    if (changed) {
      commentsFollow(drag.kind, s, { x1: b.x1, y1: b.y1, x2: b.x2, y2: b.y2 });
      const kind = drag.mode === "move" ? "move" : "resize";
      if (drag.kind === "pred") {
        // Nothing is written: this only decides which token the box gets if
        // and when it is approved.
        b.edited = true;
        const ev = logEvent("pred.adjust", { kind, from: nb(s), to: nb(b), score: b.score });
        record(`${kind} sam3 box`, drag.before, [ev]);
      } else {
        // An already-approved box that gets nudged is no longer "as is".
        if (b.provenance === PROV_SAM3_ASIS) b.provenance = PROV_SAM3_ADJUSTED;
        const ev = logEvent("box.edit",
                            { kind, from: nb(s), to: nb(b), provenance: b.provenance });
        record(`${kind} box`, drag.before, [ev]);
        touch();
      }
    }
  }
  drag = null;
  render();
}

/** A drawn box always becomes a human annotation. In exemplar mode it is also
    appended to the manifest - and that write goes first, because it is the one
    that can be refused. If the server says no, nothing has been created
    anywhere and the drag simply evaporates. */
async function endDraft() {
  if (draft.comment) { finishCommentDraft(); return; }   // a comment's box, not an annotation
  const x1 = Math.min(draft.x0, draft.x1), x2 = Math.max(draft.x0, draft.x1);
  const y1 = Math.min(draft.y0, draft.y1), y2 = Math.max(draft.y0, draft.y1);
  const picking = mode === "exemplar";
  draft = null;
  if (x2 - x1 < MIN_BOX || y2 - y1 < MIN_BOX) { render(); return; }
  const before = snapshot();

  const box = {
    x1: clamp(x1, 0, natW), y1: clamp(y1, 0, natH),
    x2: clamp(x2, 0, natW), y2: clamp(y2, 0, natH),
  };
  let id = null;
  if (picking) {
    render();                       // clear the draft while the POST is in flight
    id = await postExemplar(box);
    if (id === null) return;
    exems.push({ id, ...box, cls: activeClass });   // as the manifest has it
    sel = { kind: "exem", i: exems.length - 1 };
  }
  boxes.push({ ...box, cls: activeClass, provenance: PROV_HUMAN, quality: "verified", score: 1.0 });
  seenClasses.add(activeClass);
  if (!picking) sel = { kind: "box", i: boxes.length - 1 };
  const events = [logEvent("box.draw", { box: nb(box), cls: activeClass, provenance: PROV_HUMAN })];
  if (picking) {
    events.push(logEvent("exemplar.pick", { id, box: nb(box) }));
    // With its class, so a redo re-picks it as the same class, whatever class
    // is chosen by then.
    record("exemplar pick", before, events, { exemplar: { kind: "pick", id, box: { ...box, cls: activeClass } } });
  } else {
    record("new box", before, events);
  }
  touch();
  render();
}

// Only the button that started a drag ends it, so releasing the pan button
// halfway through never finishes a box. A box in two-click mode ends on no
// release at all: the next press finishes it.
window.addEventListener("mouseup", (e) => {
  if (drag) { if (e.button === drag.button) endDrag(); return; }
  if (draft && !draft.open && e.button === draft.button) endDraft();
});

/** After the view moves while the pointer stays still (a zoom), put the open
    corner of a box, or a box being dragged, back under the pointer. Panning
    needs no help: it moves the pointer, and mousemove does the rest. */
function followPointer() {
  if (!lastClient || !(draft || drag)) return;
  const p = toImage(lastClient);
  if (drag) { dragTo(p); return; }
  draft.x1 = p.x; draft.y1 = p.y;
  render();
}

// ---------------------------------------------------------------- approving

/** Move one prediction into the annotation list.

    The geometry is copied verbatim - whatever is on screen, adjusted or not -
    and the score keeps SAM3's confidence rather than becoming 1.0, so the
    annotation file records at which confidence a human was willing to sign
    off. The prediction leaves `preds` so it cannot be approved twice; the file
    in PREDICTION_DIR is untouched. */
function approve(i, bulk) {
  const p = preds[i];
  if (!p) return null;
  const provenance = p.edited ? PROV_SAM3_ADJUSTED : PROV_SAM3_ASIS;
  // A prediction keeps its class if it is one of the project's; otherwise (the
  // predictor still writes numbers) it takes the class new boxes get.
  const cls = classList().includes(p.cls) ? p.cls : activeClass;
  boxes.push({
    x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2,
    cls,
    provenance,
    quality: "verified",
    score: p.score,
  });
  preds.splice(i, 1);
  return logEvent("pred.approve", { box: nb(p), cls, from_cls: p.cls, score: p.score, provenance, bulk });
}

function approveSelected() {
  if (multi.length) { approveMulti(); return; }
  if (!sel || sel.kind !== "pred") return;
  const before = snapshot();
  const ev = approve(sel.i, false);
  sel = { kind: "box", i: boxes.length - 1 };   // still selected: 1-9 can set its class now
  record("approval", before, [ev]);
  touch();
  render();
}

/** Everything currently above the threshold. Predictions you hid with del are
    already gone from `preds`, so the threshold plus your deletions are exactly
    what this approves. */
function approveShown() {
  const before = snapshot();
  const events = [];
  for (let i = preds.length - 1; i >= 0; i--) {
    if (preds[i].score >= threshold) events.push(approve(i, true));
  }
  if (!events.length) return;
  sel = null;
  record(`approval of ${plural(events.length, "box", "boxes")}`, before, events);
  touch();
  render();
}

/** Delete means something different for each kind of box, which is why it is
    one command: your box is removed, a prediction is rejected, an exemplar is
    un-picked. A rejection only hides the box on screen - predictions are read
    only - but it is now logged, so it counts in any acceptance statistic. */
function deleteSelected() {
  if (multi.length) { deleteMulti(); return; }
  if (!sel) return;
  if (sel.kind === "exem") { dropExemplar(sel.i); return; }
  const before = snapshot();
  if (sel.kind === "pred") {
    const p = preds[sel.i];
    const ev = logEvent("pred.reject", { box: nb(p), cls: p.cls, score: p.score, edited: !!p.edited });
    preds.splice(sel.i, 1);
    record("rejection", before, [ev]);
  } else {
    const b = boxes[sel.i];
    const ev = logEvent("box.delete",
                        { box: nb(b), cls: b.cls, provenance: b.provenance, score: b.score });
    boxes.splice(sel.i, 1);
    record("deletion", before, [ev]);
    touch();
  }
  sel = null;
  render();
}


el.approve.addEventListener("click", () => approveShown());

// ---------------------------------------------------------------- exemplars

function showSet() {
  if (!exemSet || !exemSet.name) { el.exemcount.textContent = ""; return; }
  el.exemcount.textContent = `${exemSet.count} in ${exemSet.name} \u25be`;
}

async function postExemplar(box) {
  try {
    const r = await fetch(q(`api/exemplar/${encodeURIComponent(images[idx].name)}`), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...box, cls: box.cls || activeClass }),
    });
    const body = await r.json();
    if (!r.ok) {
      status(`exemplar refused: ${body.detail || r.status}`, true);
      return null;
    }
    exemSet = { name: body.set, count: body.count };
    showSet();
    return body.id;
  } catch (err) {
    status(`exemplar not saved: ${err.message}`, true);
    return null;
  }
}

/** Remove one exemplar from the run's manifest. True if it is gone. */
async function deleteExemplar(id) {
  try {
    const r = await fetch(q(`api/exemplar/${id}`), { method: "DELETE" });
    if (!r.ok) { status(`exemplar ${id} not removed (${r.status})`, true); return false; }
    const body = await r.json();
    exemSet = { name: body.set, count: body.count };
    showSet();
    return true;
  } catch (err) {
    status(`exemplar ${id} not removed: ${err.message}`, true);
    return false;
  }
}

/** Un-pick. The annotation it created stays behind and reappears in violet -
    it is still a plant somebody verified, it just no longer prompts the run. */
async function dropExemplar(i) {
  const e = exems[i];
  const before = snapshot();
  if (!(await deleteExemplar(e.id))) return;
  exems.splice(i, 1);
  sel = null;
  const box = { x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, cls: e.cls };
  const ev = logEvent("exemplar.drop", { id: e.id, box: nb(box) });
  record("exemplar un-pick", before, [ev], { exemplar: { kind: "drop", id: e.id, box } });
  render();
}

function setMode(next) {
  mode = next;
  el.mode.textContent = mode === "exemplar" ? "picking exemplars" : "annotating";
  el.mode.classList.toggle("mode-on", mode === "exemplar");
  el.viewport.classList.toggle("exemplar", mode === "exemplar");
}

el.mode.addEventListener("click", () => toggleMode());

// ---------------------------------------------------------------- render

function rect(b, cls) {
  const r = document.createElementNS(SVG_NS, "rect");
  r.setAttribute("x", Math.min(b.x1, b.x2));
  r.setAttribute("y", Math.min(b.y1, b.y2));
  r.setAttribute("width", Math.abs(b.x2 - b.x1));
  r.setAttribute("height", Math.abs(b.y2 - b.y1));
  r.setAttribute("class", cls);
  return r;
}

/** Corner squares on the selected box: sized in image units from a screen-px
    constant, so they stay the same size on screen at any zoom. */
function handles(b, color) {
  const s = HANDLE_PX / scale();
  for (const [x, y] of [[b.x1, b.y1], [b.x2, b.y1], [b.x1, b.y2], [b.x2, b.y2]]) {
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("x", x - s / 2);
    r.setAttribute("y", y - s / 2);
    r.setAttribute("width", s);
    r.setAttribute("height", s);
    r.setAttribute("class", "handle");
    r.style.fill = color;
    el.svg.appendChild(r);
  }
}

function render() {
  while (el.svg.firstChild) el.svg.removeChild(el.svg.firstChild);
  if (boxesHidden || peeking) { renderCounts(0); return; }

  // Predictions first, so approved and hand-drawn boxes draw on top of them.
  let shown = 0;
  const predStyle = styleOf("prediction");
  preds.forEach((b, i) => {
    if (b.score < threshold) return;
    shown++;
    el.svg.appendChild(paint(rect(b, "pred"), predStyle, { selected: isSel("pred", i) }));
  });
  boxes.forEach((b, i) => {
    if (twinOfExemplar(b)) return;
    el.svg.appendChild(paint(rect(b, "box"), styleFor("box", b), { selected: isSel("box", i) }));
  });
  const exemStyle = styleOf("exemplar");
  exems.forEach((b, i) => {
    el.svg.appendChild(paint(rect(b, "exem"), exemStyle, { selected: isSel("exem", i) }));
  });
  renderCommentBoxes();
  if (draft && draft.comment) {
    el.svg.appendChild(rect({ x1: draft.x0, y1: draft.y0, x2: draft.x1, y2: draft.y1 }, "cbox draft"));
  } else if (draft) {
    // Drawn in the style of what it will become, dashed while it is a draft.
    el.svg.appendChild(paint(
      rect({ x1: draft.x0, y1: draft.y0, x2: draft.x1, y2: draft.y1 }, "draft"),
      mode === "exemplar" ? exemStyle : classStyle(activeClass), { draft: true }));
  }
  renderMarquee();
  // No handles on an exemplar: it cannot be dragged, and offering a grip that
  // does nothing is worse than offering none.
  const active = at(sel);
  if (active && sel.kind !== "exem") handles(active, styleFor(sel.kind, active).color);

  renderCounts(shown);
}

function renderCounts(shown) {
  scheduleMinimap();                 // the dots follow the boxes
  schedulePins();
  noteImageContents();               // the grid's filter sees edits at once
  renderFlagChip();
  scheduleStrip();                   // and the strip's status bars
  const derived = boxes.filter(fromSam3).length;
  el.boxcount.textContent =
    `${boxes.length} ${boxes.length === 1 ? "box" : "boxes"}`
    + (derived ? ` (${derived} sam3)` : "");
  el.predcount.textContent = preds.length ? `${shown}/${preds.length} sam3` : "";
  el.approve.textContent = shown ? `approve ${shown}` : "approve";
  el.approve.disabled = shown === 0;
  renderStageChip();
}

// ---------------------------------------------------------------- io

function touch() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

/** Returns false if the annotation file was not written, so the caller can
    refuse to navigate away from work that only exists in this tab. */
async function save() {
  if (!dirty) return true;
  const name = images[idx].name;
  clearTimeout(saveTimer);
  dirty = false;
  let r;
  try {
    r = await fetch(q(`api/annotation/${encodeURIComponent(name)}`), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ boxes, stage: stageOf(imageStage).id, flags: imageFlags, flag_note: flagNote }),
    });
  } catch (err) {
    dirty = true;
    status(`${name} not saved: ${err.message}`, true);
    return false;
  }
  if (!r.ok) {
    dirty = true;
    status(`${name} rejected by the server (${r.status}); nothing written`, true);
    return false;
  }
  images[idx].boxes = boxes.length;
  images[idx].stage = stageOf(imageStage).id;
  images[idx].flags = [...imageFlags];
  images[idx].flag_note = flagNote;
  scheduleStrip();                   // its status bar follows the save
  return true;
}

async function load(i) {
  endVisit();                  // the image being left gets its visit logged
  const stripPrev = images[idx] ? idx : -1;
  idx = i;
  const name = images[idx].name;
  const data = await (await fetch(q(`api/annotation/${encodeURIComponent(name)}`))).json();
  natW = data.width; natH = data.height;
  boxes = data.boxes.map(normalise);

  // A prediction that has already been approved is still sitting in
  // PREDICTION_DIR, which is read only - so recognise it by overlap with an
  // existing sam3_* annotation and drop it, rather than drawing the same
  // object twice in two colours.
  const approved = boxes.filter(fromSam3);
  preds = (data.predictions || [])
    .map(normalise)
    .filter((p) => !approved.some((b) => iou(p, b) >= ACCEPTED_IOU));

  exems = (data.exemplars || []).map(normalise);
  imageStage = data.stage;
  imageFlags = data.flags || [];
  flagNote = data.flag_note || "";
  closeFlagMenu();
  const before = seenClasses.size;
  for (const b of boxes) seenClasses.add(b.cls);   // not predictions: "0" is not a class here
  comments = data.comments || [];
  multi = [];
  disarmMarquee();
  closeCommentPopup();
  cancelCommentPlacement();
  if (seenClasses.size !== before) renderLegend();
  sel = null;
  draft = null;
  drag = null;

  el.stage.style.width = natW + "px";
  el.stage.style.height = natH + "px";
  el.svg.setAttribute("viewBox", `0 0 ${natW} ${natH}`);
  mmBase = null;                     // not the last image's picture meanwhile
  startCoverage(name, data.coverage);
  el.photo.src = q(`api/image/${encodeURIComponent(name)}`);

  status(name);
  lastOpened = name;
  document.title = `${name} \u2014 ${project}`;
  el.counter.textContent = `${idx + 1} / ${images.length}`;
  startVisit(name, (data.active_ms || 0) + pendingActive(project, name));
  fitToViewport();
  scanNewImage();              // a scan that is on carries on with this image
  stripFollow(stripPrev);      // the new image slides to the left edge

  const next = images[idx + 1];
  if (next) new Image().src = q(`api/image/${encodeURIComponent(next.name)}`);
}

async function go(i) {
  if (i < 0 || i >= images.length || i === idx) return;
  if (!await save()) return;   // keep the failure on screen
  // replaceState, not a new history entry: a/d through 300 images should not
  // take 300 presses of Back to get to the grid.
  history.replaceState(null, "", hashFor(project, images[i].name));
  return load(i);                    // resolves once the image is there
}

// ---------------------------------------------------------------- event log
//
// Every decision made here is sent to the project's append-only log on the
// server (see the module docstring in app.py). Events queue locally and go out
// in batches; nothing in the editor waits for them.

const newId = () =>
  (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);

const SESSION = newId();            // one per page load: groups a sitting
const EVENT_FLUSH_MS = 3000;
const EVENT_QUEUE_CAP = 5000;       // server gone for hours: drop the oldest

let eventQueue = [];                // [{project, ev}]
let eventsInFlight = [];            // sent, not yet acknowledged
let flushing = null;

/** Box as normalised [x1, y1, x2, y2], like the annotation files: an event
    must still mean something if the image is ever resized. */
const nb = (b) => [b.x1 / natW, b.y1 / natH, b.x2 / natW, b.y2 / natH]
  .map((v) => Math.round(v * 1e6) / 1e6);

/** Queue one event and return its id, which history entries keep so that an
    undo can name exactly the events it reverses. `where` overrides the
    current project/image, for events that outlive the view they describe. */
function logEvent(type, data = {}, where = {}) {
  const p = where.project || project;
  if (!p) return null;
  const ev = {
    id: newId(), type, ct: Date.now(), session: SESSION,
    image: where.image !== undefined ? where.image : (images[idx] ? images[idx].name : null),
    run: run || null,
    data,
  };
  eventQueue.push({ project: p, ev });
  if (eventQueue.length > EVENT_QUEUE_CAP) {
    eventQueue.splice(0, eventQueue.length - EVENT_QUEUE_CAP);
  }
  return ev.id;
}

function byProject(entries) {
  const groups = new Map();
  for (const { project: p, ev } of entries) {
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(ev);
  }
  return groups;
}

/** Send what is queued. A batch the server refuses (4xx) is dropped - sending
    it again would be refused again - while one that never got an answer goes
    back to the front of the queue, in order. */
function flushEvents() {
  if (flushing || !eventQueue.length) return flushing || Promise.resolve();
  eventsInFlight = eventQueue.splice(0, 500);
  flushing = (async () => {
    const retry = [];
    for (const [p, evs] of byProject(eventsInFlight)) {
      try {
        const r = await fetch(BASE + "api/events?" + new URLSearchParams({ project: p }), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ events: evs }),
        });
        if (r.status >= 400 && r.status < 500) {
          console.warn(`event batch refused (${r.status}):`, await r.text());
        } else if (!r.ok) {
          throw new Error(String(r.status));
        }
      } catch (err) {
        for (const ev of evs) retry.push({ project: p, ev });
      }
    }
    eventQueue = retry.concat(eventQueue);
    eventsInFlight = [];
  })().finally(() => { flushing = null; });
  return flushing;
}

setInterval(flushEvents, EVENT_FLUSH_MS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushEvents();
});

/** Last chance on close: sendBeacon survives the page going away, fetch does
    not. Whatever is in flight at that moment may be lost; the queue is not. */
window.addEventListener("pagehide", () => {
  endVisit();
  for (const [p, evs] of byProject(eventQueue)) {
    navigator.sendBeacon(
      BASE + "api/events?" + new URLSearchParams({ project: p }),
      new Blob([JSON.stringify({ events: evs })], { type: "application/json" }));
  }
  eventQueue = [];
});

// ---------------------------------------------------------------- visit timer
//
// Active time, not wall time: a second counts only while the editor is showing,
// the tab is visible, and there has been input within IDLE_MS. Looking at an
// image without touching anything is real work, hence the generous window.

const IDLE_MS = 60_000;
let lastInput = Date.now();
let visit = null;   // {project, image, started, lastTick, active, prior}

for (const t of ["pointerdown", "pointermove", "keydown", "wheel"]) {
  window.addEventListener(t, () => { lastInput = Date.now(); },
                          { capture: true, passive: true });
}

/** Visit time that exists locally but not yet on the server, so reopening an
    image straight away does not show a total missing the last visit. */
function pendingActive(p, name) {
  let ms = 0;
  for (const { project: q2, ev } of eventsInFlight.concat(eventQueue)) {
    if (q2 === p && ev.image === name && ev.type === "image.visit") ms += ev.data.active_ms;
  }
  return ms;
}

function startVisit(name, priorMs) {
  endVisit();
  const t = Date.now();
  visit = { project, image: name, started: t, lastTick: t, active: 0, prior: priorMs || 0 };
  showTimer();
}

function tickVisit() {
  if (!visit) return;
  const t = Date.now(), dt = t - visit.lastTick;
  visit.lastTick = t;
  if (view === "editor" && document.visibilityState === "visible"
      && (t - lastInput < IDLE_MS || scanRunning())) {
    visit.active += Math.min(dt, 2000);   // a throttled timer must not bank a burst
  }
  showTimer();
}

function endVisit() {
  if (!visit) return;
  tickVisit();
  const v = visit;
  visit = null;
  logEvent("image.visit",
           { active_ms: Math.round(v.active), wall_ms: Date.now() - v.started },
           { project: v.project, image: v.image });
}

setInterval(tickVisit, 1000);

function fmtMs(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  const mm = h ? String(m).padStart(2, "0") : String(m);
  return (h ? h + ":" : "") + mm + ":" + String(r).padStart(2, "0");
}

function showTimer() {
  if (!visit) { el.timer.textContent = ""; return; }
  const total = visit.prior + visit.active;
  el.timer.textContent = visit.prior
    ? `${fmtMs(visit.active)} / ${fmtMs(total)}`
    : fmtMs(visit.active);
  el.timer.classList.toggle("idle", Date.now() - lastInput >= IDLE_MS);
}

// ---------------------------------------------------------------- history
//
// Undo and redo per image, for the whole session: come back to an image and
// its history is still there. Each entry keeps the state before and after the
// edit, so undo and redo are both a plain restore - no per-command inverse to
// get wrong. The one edit with a side effect outside this tab is an exemplar
// pick or drop, which writes the run's manifest; those entries replay that
// write too (see exemplarSide).

const HISTORY_CAP = 200;
const histories = new Map();        // project + "\0" + image -> {undo, redo}

function hist() {
  const key = project + "\u0000" + images[idx].name;
  if (!histories.has(key)) histories.set(key, { undo: [], redo: [] });
  return histories.get(key);
}

const clone = (list) => list.map((b) => ({ ...b }));
const snapshot = () =>
  ({ boxes: clone(boxes), preds: clone(preds), exems: clone(exems), stage: imageStage,
     flags: [...imageFlags], flagNote });

function restore(s) {
  boxes = clone(s.boxes);
  preds = clone(s.preds);
  exems = clone(s.exems);
  imageStage = s.stage;
  imageFlags = [...(s.flags || [])];
  flagNote = s.flagNote || "";
  sel = null;
  multi = [];
}

/** Push one finished edit. `before` was taken before the mutation; the state
    right now is the "after". A new edit clears the redo stack, as usual. */
function record(label, before, events, extra = {}) {
  const h = hist();
  const after = snapshot();
  const saves = before.stage !== after.stage
    || String(before.flags) !== String(after.flags) || before.flagNote !== after.flagNote
    || JSON.stringify(before.boxes) !== JSON.stringify(after.boxes);
  h.undo.push({ label, before, after, saves, run,
                events: events.filter(Boolean), ...extra });
  if (h.undo.length > HISTORY_CAP) h.undo.shift();
  h.redo.length = 0;
}

/** Undo and redo run one at a time, even when the key is held: an exemplar
    step waits on the server, and two interleaved restores would corrupt it. */
let historyChain = Promise.resolve();
const queueHistory = (dir) => {
  historyChain = historyChain.then(() => stepHistory(dir), () => stepHistory(dir));
};

async function stepHistory(dir) {
  if (view !== "editor" || !images[idx] || drag || draft) return;
  const h = hist();
  const [from, to] = dir === "undo" ? [h.undo, h.redo] : [h.redo, h.undo];
  const e = from.pop();
  if (!e) { flash(`nothing to ${dir}`); return; }
  if ((e.exemplar || e.exemplars) && !(await exemplarSide(e, dir))) { from.push(e); return; }
  restore(dir === "undo" ? e.before : e.after);
  to.push(e);
  logEvent("history." + dir, { of: e.events, label: e.label });
  if (e.saves) touch();
  render();
  flash(`${dir === "undo" ? "Undid" : "Redid"} ${e.label}`);
}

/** Replay an exemplar entry's manifest write. Undoing a pick or redoing a drop
    removes the exemplar; the other two add it back - under a new id, since the
    server hands out ids, so every entry that mentions the old one is updated.
    A re-added exemplar goes to the END of the pick order. */
async function exemplarSide(e, dir) {
  // One step may hold several exemplar changes (a selection deleted at once);
  // they are replayed in pick order, so re-added exemplars keep their order.
  for (const op of e.exemplars || [e.exemplar]) {
    const add = (op.kind === "pick") === (dir === "redo");
    if (add) {
      const id = await postExemplar(op.box);
      if (id === null) return false;
      retagExemplar(e, op.id, id);
    } else if (!(await deleteExemplar(op.id))) {
      return false;
    }
  }
  return true;
}

function retagExemplar(current, oldId, newId) {
  const h = hist();
  for (const entry of [current, ...h.undo, ...h.redo]) {
    for (const s of [entry.before, entry.after]) {
      for (const x of s.exems) if (x.id === oldId) x.id = newId;
    }
    for (const op of entry.exemplars || (entry.exemplar ? [entry.exemplar] : [])) {
      if (op.id === oldId) op.id = newId;
    }
  }
}

/** Predictions in a snapshot belong to the run that was selected when it was
    taken. Restoring one under another run would show run A's boxes as if
    they were run B's, so a run switch clears every history. */
function clearHistories() {
  histories.clear();
}

// ---------------------------------------------------------------- commands
//
// Every action an input can trigger is a named command with its own default
// inputs - keys, mouse buttons, the wheel. Drawing, panning and zooming are
// commands too, so any click or scroll can be captured, and taking the left
// button or the wheel away from its current job goes through the same "move
// it here" question as a key. What you change is stored as overrides in your
// settings file (see loadSettings); the dispatcher, the help overlay and the
// settings dialog all read the same resolved tables.
//
// `screen`: where it is active - "dataset" (the image grid), "editor", or
//           "project" for both. The project list has no shortcuts: settings
//           are opened from inside a project, where they apply.
// `kind`:   "press" (default) runs once per press;
//           "hold"   runs with true on press and false on release;
//           "drag"   starts a drag with a mouse button, ended by releasing it;
//           "amount" runs once per key press, but a wheel feeds it the scroll
//                    distance of every event instead of whole steps, so a
//                    trackpad zooms smoothly instead of in jumps.
// `scanSafe`: does not interrupt a running scan.
// `scanView`: moves the view by hand, which holds a scan until s. Anything
//           else that is not scanSafe counts as annotating and pauses it.

const SCREENS = { project: "Anywhere in a project", dataset: "Image grid", editor: "Editor" };

const COMMANDS = {
  "keys.open":         { screen: "project", label: "Open settings",
                         keys: ["k"], scanSafe: true, run: () => toggleKeys() },

  "grid.search":       { screen: "dataset", label: "Filter by file name",
                         keys: ["/"], run: () => focusSearch() },
  "grid.selectShown":  { screen: "dataset", label: "Select every image shown (name filter and stage tab)",
                         keys: ["Ctrl+a"], run: () => selectShown() },
  "grid.deselect":     { screen: "dataset", label: "Deselect all images",
                         keys: ["Escape"], run: () => deselectAll() },

  "edit.pointer":      { screen: "editor", group: "Mouse", label: "Draw, move and resize boxes",
                         kind: "drag", keys: ["MouseLeft"], start: (e) => pointerEditStart(e),
                         essential: "boxes cannot be drawn or edited" },
  "view.pan":          { screen: "editor", group: "Mouse", label: "Pan the image",
                         kind: "drag", keys: ["MouseMiddle"], scanView: true, start: (e) => panStart(e) },
  "view.zoomIn":       { screen: "editor", group: "Mouse", label: "Zoom in",
                         kind: "amount", keys: ["WheelUp", "Ctrl+WheelUp", "+", "="],
                         repeat: true, scanView: true, run: (ctx) => zoomStep(1, ctx) },
  "view.zoomOut":      { screen: "editor", group: "Mouse", label: "Zoom out",
                         kind: "amount", keys: ["WheelDown", "Ctrl+WheelDown", "-"],
                         repeat: true, scanView: true, run: (ctx) => zoomStep(-1, ctx) },

  "image.prev":        { screen: "editor", group: "Navigate", label: "Previous image",
                         keys: ["a"], repeat: true, scanSafe: true, run: () => go(idx - 1) },
  "image.next":        { screen: "editor", group: "Navigate", label: "Next image",
                         keys: ["d"], repeat: true, scanSafe: true, run: () => go(idx + 1) },
  "nav.grid":          { screen: "editor", group: "Navigate", label: "Back to the grid",
                         keys: ["g"], run: () => backToGrid() },

// ---------------------------------------------------------------- settings

const POINTER_DEFAULTS = { pan_gain: 1, zoom_speed: 1, draw: "clicks", key_pan: 700 };
const MINIMAP_DEFAULTS = { show: true, size: 220, opacity: 0.85, right: 12, top: 12,
                           min_zoom: 2 };
const SCAN_DEFAULTS = { speed: 130, edge_s: 1, overlap: 0.2, resume_s: 2, next_image: false };
const STRIP_DEFAULTS = { show: true, height: 84 };
const WHEEL_NOTCH = 100;     // px one mouse-wheel notch reports, roughly
const ZOOM_PER_NOTCH = 1.18; // at zoom speed 1: one notch or key press = 18 %

let prefs = { version: 1, bindings: {}, pointer: { ...POINTER_DEFAULTS }, styles: {},
              minimap: { ...MINIMAP_DEFAULTS }, scan: { ...SCAN_DEFAULTS },
              strip: { ...STRIP_DEFAULTS } };
let prefsPath = "";          // where the server keeps them, for display

// ---------------------------------------------------------------- input names

const BUTTONS = ["MouseLeft", "MouseMiddle", "MouseRight", "MouseBack", "MouseForward"];
const MODIFIER_KEYS = ["Control", "Shift", "Alt", "Meta", "AltGraph", "Dead",
                       "CapsLock", "Fn", "OS", "Hyper", "Super"];

/** "key", "click" (left, middle, right), "side" (back, forward) or "wheel". */
function inputClass(input) {
  const last = input.endsWith("+") ? "+" : input.split("+").pop();
  if (last === "MouseBack" || last === "MouseForward") return "side";
  if (BUTTONS.includes(last)) return "click";
  if (last === "WheelUp" || last === "WheelDown") return "wheel";
  return "key";
}
const buttonOf = (input) => BUTTONS.indexOf(input.split("+").pop());

function modsOf(e) {
  const m = [];
  if (e.ctrlKey || e.metaKey) m.push("Ctrl");
  if (e.altKey) m.push("Alt");
  if (e.shiftKey) m.push("Shift");
  return m;
}

/** Canonical name of a key press, or null for a bare modifier.

    Built from e.key, not e.code, so bindings follow the printed key: on a
    Swiss or German keyboard Ctrl+Z is the key labelled Z. Shift is spelled
    out for letters and named keys only; for other characters it is already
    in the character ("?" is Shift+/ on one layout and something else on
    another, and the binding should not care which). Cmd counts as Ctrl. */
function comboOf(e) {
  let k = e.key;
  if (!k || MODIFIER_KEYS.includes(k)) return null;
  const letter = k.length === 1 && k.toLowerCase() !== k.toUpperCase();
  const mods = [];
  if (e.ctrlKey || e.metaKey) mods.push("Ctrl");
  if (e.altKey) mods.push("Alt");
  if (e.shiftKey && (letter || k.length > 1)) mods.push("Shift");
  if (letter) k = k.toLowerCase();
  if (k === " ") k = "Space";
  return mods.concat(k).join("+");
}

function mouseInputOf(e) {
  const name = BUTTONS[e.button];
  return name ? modsOf(e).concat(name).join("+") : null;
}

/** Shift+wheel arrives as horizontal scrolling on some systems. */
function wheelInputOf(e) {
  const d = e.deltaY || e.deltaX;
  if (!d) return null;
  return modsOf(e).concat(d < 0 ? "WheelUp" : "WheelDown").join("+");
}

const KEY_NAMES = {
  Escape: "esc", Delete: "del", Backspace: "backspace", Enter: "enter",
  Space: "space", Tab: "tab", Ctrl: "ctrl", Shift: "shift", Alt: "alt",
  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  PageUp: "page up", PageDown: "page down", Home: "home", End: "end",
  MouseLeft: "left button", MouseMiddle: "middle button", MouseRight: "right button",
  MouseBack: "back button", MouseForward: "forward button",
  WheelUp: "wheel up", WheelDown: "wheel down",
};

/** "+" is both the separator and a key, so a trailing "+" is the key. */
function keyLabel(combo) {
  const parts = combo.endsWith("+")
    ? [...combo.slice(0, -1).split("+").filter(Boolean), "+"]
    : combo.split("+");
  return parts.map((p) => KEY_NAMES[p] || p).join(" ");
}

/** Why `input` cannot run `id`, or null when it can. */
function refusal(id, input) {
  const c = COMMANDS[id];
  const cls = inputClass(input);
  if (c.kind === "drag" && cls !== "click" && cls !== "side") {
    return "dragging needs a mouse button. Press the button you want to drag with.";
  }
  if (c.kind === "hold" && cls === "wheel") {
    return "a wheel cannot be held. Press a key or a mouse button instead.";
  }
  if ((cls === "click" || cls === "wheel") && c.screen !== "editor") {
    return "clicks and the wheel only act on the image, so they can only run editor commands.";
  }
  return null;
}

// ---------------------------------------------------------------- bindings

let tables = {};             // screen -> Map(input -> command id)
let shadowed = [];           // [{id, input, why}]: inputs listed but not active
let boundButtons = new Set();

const defaultsOf = (id) => COMMANDS[id].keys || [];
const isChanged = (id) => Object.prototype.hasOwnProperty.call(prefs.bindings, id);
const keysOf = (id) => (isChanged(id) ? prefs.bindings[id] : defaultsOf(id));
const activeKeys = (id) => keysOf(id).filter((k) => ownerOf(COMMANDS[id].screen, k) === id);

/** The screens an input on `screen` competes with: its own and "project".
    A "project" input competes with every screen. */
const rivals = (screen) => (screen === "project" ? Object.keys(SCREENS) : [screen, "project"]);

function ownerOf(screen, input) {
  for (const s of rivals(screen)) {
    const id = tables[s] && tables[s].get(input);
    if (id) return id;
  }
  return null;
}

/** Resolve defaults plus overrides into one lookup table per screen.

    Commands you changed are placed first. If a later version gives some
    command a default you already use elsewhere, your binding keeps working
    and the default is the one that yields - shown struck through in the
    dialog rather than silently stealing your input. */
function buildTables() {
  tables = Object.fromEntries(Object.keys(SCREENS).map((s) => [s, new Map()]));
  shadowed = [];
  boundButtons = new Set();
  const ids = Object.keys(COMMANDS);
  for (const id of [...ids.filter(isChanged), ...ids.filter((x) => !isChanged(x))]) {
    const { screen } = COMMANDS[id];
    for (const input of keysOf(id)) {
      const why = refusal(id, input);
      if (why) { shadowed.push({ id, input, why }); continue; }
      const by = ownerOf(screen, input);
      if (by) {
        if (by !== id) shadowed.push({ id, input, why: `belongs to \u201c${COMMANDS[by].label}\u201d` });
        continue;
      }
      tables[screen].set(input, id);
      const b = buttonOf(input);
      if (b >= 0) boundButtons.add(b);
    }
  }
}

function commandFor(input) {
  if (view !== "dataset" && view !== "editor") return null;   // the project list
  return tables[view].get(input) || tables.project.get(input) || null;
}

/** Store a command's inputs as an override - or drop the override when the
    list is back to the default, so the file only holds real changes.

    Inputs shown struck through are left out: editing a command must never
    quietly re-activate an input the dialog said was not active. */
function setKeys(id, list) {
  const lost = new Set(shadowed.filter((s) => s.id === id).map((s) => s.input));
  const keys = [...new Set(list)].filter((k) => !lost.has(k));
  const d = defaultsOf(id);
  if (keys.length === d.length && keys.every((k) => d.includes(k))) {
    delete prefs.bindings[id];
  } else {
    prefs.bindings[id] = keys;
  }
}

buildTables();

// ---------------------------------------------------------------- dispatch

const held = new Map();      // physical key or mouse button -> hold command

function release(key) {
  const id = held.get(key);
  if (!id) return;
  held.delete(key);
  COMMANDS[id].run(false);
}

/** Also on blur: a key released while another window has focus never sends
    its keyup here, and a held command would otherwise stay on. */
function releaseAll() {
  for (const key of [...held.keys()]) release(key);
}

/** Clicks and the wheel act on the image only. Everywhere else - buttons,
    lists, the grid - they keep doing what they always do. */
const overImage = (e) => view === "editor" && !!natW && el.viewport.contains(e.target)
  && !(e.target.closest && e.target.closest(".minimap, .scanbar, .pin, .cpop"));

function pointerCtx(e) {
  const r = el.viewport.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

window.addEventListener("keydown", (e) => {
  if (el.keysDialog.open) return;            // the settings dialog owns the keys
  const t = e.target;
  if (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT"
      || t.isContentEditable) return;
  const combo = comboOf(e);
  const id = combo && commandFor(combo);
  if (!id) return;
  e.preventDefault();                        // Ctrl+Z must not reach the browser too
  const cmd = COMMANDS[id];
  if (!cmd.scanSafe) scanTouch(cmd.scanView ? "view" : "annotate");
  if (cmd.kind === "hold") {
    // Tracked by physical key: if Shift is let go before the key itself, the
    // keyup no longer spells the same combo, but it is the same key.
    const key = e.code || e.key;
    if (!held.has(key)) { held.set(key, id); cmd.run(true); }
    return;
  }
  if (e.repeat && !cmd.repeat) return;
  cmd.run();
});

window.addEventListener("keyup", (e) => release(e.code || e.key));
window.addEventListener("blur", releaseAll);

window.addEventListener("mousedown", (e) => {
  swallow = null;                            // a new press: the last one is over
  if (el.keysDialog.open) { captureMouse(e); return; }
  const input = mouseInputOf(e);
  if (!input) return;
  if (inputClass(input) === "click" && !overImage(e)) return;
  const id = commandFor(input);
  if (!id) return;
  e.preventDefault();                        // no text selection, no autoscroll
  e.stopPropagation();
  const cmd = COMMANDS[id];
  if (!cmd.scanSafe) scanTouch(cmd.scanView ? "view" : "annotate");
  if (cmd.kind === "drag") { cmd.start(e); return; }
  if (cmd.kind === "hold") { held.set("button" + e.button, id); cmd.run(true); return; }
  cmd.run(pointerCtx(e));
}, true);

// What follows a press. Held mouse commands end on release. A side button
// that a binding uses must not also make the browser go Back or Forward, and
// a bound right button must not open the context menu over the image.
//
// A press captured in the settings dialog takes its whole aftermath with it -
// release, click, context menu - until the next press. Not by a timer: a fast
// click on "move it here" right after would be eaten too. And never a click
// made with the keyboard (detail 0), which is somebody pressing Enter.
let swallow = null;          // {button, until}: the remains of a captured press
for (const type of ["mouseup", "click", "auxclick", "contextmenu"]) {
  window.addEventListener(type, (e) => {
    if (swallow && e.button === swallow.button && performance.now() < swallow.until
        && !(type === "click" && e.detail === 0)) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    if (type === "mouseup") release("button" + e.button);
    if ((e.button === 3 || e.button === 4) && (boundButtons.has(e.button) || el.keysDialog.open)) {
      e.preventDefault();
    }
    if (type === "contextmenu" && boundButtons.has(2) && overImage(e)) e.preventDefault();
  }, true);
}

let wheelState = { input: null, acc: 0, quietUntil: 0 };
window.addEventListener("wheel", (e) => {
  if (el.keysDialog.open) { captureWheel(e); return; }
  if (!overImage(e)) return;                 // lists and pages scroll as always
  e.preventDefault();                        // the image owns its wheel: no page zoom
  const input = wheelInputOf(e);
  const id = input && commandFor(input);
  if (!id) return;
  const cmd = COMMANDS[id];
  if (!cmd.scanSafe) scanTouch(cmd.scanView ? "view" : "annotate");
  const unit = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1;
  const px = Math.abs(e.deltaY || e.deltaX) * unit;
  if (cmd.kind === "amount") { cmd.run({ amount: px, ...pointerCtx(e) }); return; }
  // A trackpad sends a stream of small deltas where a mouse sends one per
  // notch, so for ordinary commands the distance is summed into steps.
  if (wheelState.input !== input) wheelState = { input, acc: 0, quietUntil: 0 };
  wheelState.acc += px;
  if (wheelState.acc < WHEEL_NOTCH / 2) return;
  wheelState.acc = 0;
  const t = performance.now();
  if (!cmd.repeat && t < wheelState.quietUntil) return;
  wheelState.quietUntil = t + 300;
  cmd.run(pointerCtx(e));
}, { capture: true, passive: false });

// ---------------------------------------------------------------- pointer speeds

/** Zoom by a scroll distance, or by one notch's worth for a key press. The
    distance is turned into a factor continuously - exp, not steps - so a
    trackpad's many small deltas add up to the same zoom as one notch. */
function zoomStep(direction, ctx = {}) {
  const amount = ctx.amount === undefined ? WHEEL_NOTCH : ctx.amount;
  const perPx = Math.log(ZOOM_PER_NOTCH) / WHEEL_NOTCH;
  zoomBy(Math.exp(direction * amount * perPx * prefs.pointer.zoom_speed), ctx.x, ctx.y);
}

// ---------------------------------------------------------------- help

function renderHelp() {
  const frag = document.createDocumentFragment();
  for (const id of Object.keys(COMMANDS)) {
    const c = COMMANDS[id];
    if (c.screen !== "editor" && c.screen !== "project") continue;
    const inputs = [...tables[c.screen]].filter(([, v]) => v === id).map(([k]) => k);
    if (!inputs.length) continue;
    const keys = h("span", "keys");
    inputs.forEach((k, i) => {
      if (i) keys.append(" ");
      keys.appendChild(h("kbd", "", keyLabel(k)));
    });
    frag.append(keys, h("span", "", c.label + (c.kind === "hold" ? " (hold)" : "")));
  }
  el.helpKeys.replaceChildren(frag);
  el.helpMouse.textContent = prefs.pointer.draw === "drag"
    ? "Drawing: drag on empty space for a new box, on a box to move it, on a corner to resize. "
      + "After clicking a box to select it, a click on empty space only deselects it."
    : "Drawing: click on empty space to start a box and click again to finish it (esc cancels). "
      + "Drag a box to move it, a corner to resize it. After clicking a box to select it, a "
      + "click on empty space only deselects it.";
}

const K_HELP = "al.help";
function toggleHelp(force) {
  const show = force !== undefined ? force : el.hint.hidden;
  el.hint.hidden = !show;
  localStorage.setItem(K_HELP, show ? "1" : "0");
}

// ---------------------------------------------------------------- settings dialog
//
// Pointer speeds, then every command with its inputs. + listens for the next
// input of any kind - key, any mouse button, the wheel - until something is
// pressed; only the "cancel" button next to it and Esc are left alone. An
// input that already belongs to another command is not taken without asking.
// Every change is saved at once to the user's own settings file.

const K_TAB = "al.settingsTab";
let settingsTab = ["input", "workflow"].includes(localStorage.getItem(K_TAB))
  ? localStorage.getItem(K_TAB) : "appearance";

let capture = null;          // {id, conflict?: {input, owner}, error?: string}
let swallowKeyUp = null;     // the key that just finished a capture
let escapeHandled = false;   // an Escape that cancelled a capture, not the dialog
let wheelCaptureQuiet = 0;   // the rest of a scroll that was just captured
let keysReturnFocus = null;

function toggleKeys() {
  if (el.keysDialog.open) { el.keysDialog.close(); return; }
  if (view !== "dataset" && view !== "editor") return;   // settings live in a project
  keysReturnFocus = document.activeElement;
  releaseAll();
  capture = null;
  el.keysDialog.showModal();
  drawPointer();                             // the crosshair hides behind a dialog
  renderKeys();
  (settingsTab === "input" ? el.keysFilter : el.setTabs.querySelector('[aria-selected="true"]')).focus();
}

function focusKey(f) {
  if (!f) return;
  const n = el.keysList.querySelector(`[data-f="${CSS.escape(f)}"]`);
  if (n) n.focus();
}

function startCapture(id) {
  capture = { id };
  renderKeys();
  focusKey(`cap:${id}`);
}

function cancelCapture() {
  const id = capture && capture.id;
  capture = null;
  renderKeys();
  focusKey(`add:${id}`);
}

function captureInput(input) {
  const id = capture.id;
  const why = refusal(id, input);
  if (why) {
    capture = { id, error: `Not ${keyLabel(input)}: ${why}` };
    renderKeys();
    focusKey(`cap:${id}`);
    return;
  }
  const owner = ownerOf(COMMANDS[id].screen, input);
  if (owner === id) {
    capture = null;
    renderKeys();
    focusKey(`add:${id}`);
    keyStatus(`${keyLabel(input)} already does this.`);
    return;
  }
  if (owner) {
    capture = { id, conflict: { input, owner } };
    renderKeys();
    focusKey(`take:${id}`);
    return;
  }
  assign(id, input);
}

/** Give `input` to `id`, taking it from `from` first when there is a clash. */
function assign(id, input, from) {
  if (from) {
    setKeys(from, keysOf(from).filter((k) => k !== input));
    buildTables();              // so `input` no longer counts as taken
  }
  setKeys(id, [...keysOf(id), input]);
  capture = null;
  saveSettings();
  focusKey(`add:${id}`);
}

/** While listening, every press of every mouse button is the answer -
    wherever the pointer is, on a button or not - except on "cancel". */
function captureMouse(e) {
  if (!capture || capture.conflict) return;  // clicking around the dialog as usual
  if (e.target.closest && e.target.closest("[data-exempt]")) return;
  const input = mouseInputOf(e);
  if (!input) return;
  e.preventDefault();
  e.stopPropagation();
  swallow = { button: e.button, until: performance.now() + 2000 };
  captureInput(input);
}

function captureWheel(e) {
  const t = performance.now();
  if (t < wheelCaptureQuiet) {               // the tail of a scroll just captured
    e.preventDefault();
    wheelCaptureQuiet = t + 400;
    return;
  }
  if (!capture || capture.conflict) return;  // scrolling the list, as usual
  const input = wheelInputOf(e);
  if (!input) return;
  e.preventDefault();
  e.stopPropagation();
  wheelCaptureQuiet = t + 400;
  captureInput(input);
}

el.keysDialog.addEventListener("keydown", (e) => {
  if (!capture) return;                      // typing in the filter, tabbing
  if (e.key === "Escape") {
    e.preventDefault();
    e.stopPropagation();
    escapeHandled = true;
    setTimeout(() => { escapeHandled = false; });
    cancelCapture();
    return;
  }
  if (capture.conflict) return;              // Tab and Enter work the two buttons
  e.preventDefault();
  e.stopPropagation();
  const combo = comboOf(e);
  if (!combo) return;                        // a modifier alone: wait for the rest
  swallowKeyUp = e.code || e.key;
  captureInput(combo);
}, true);

// The keyup of a captured Space or Enter would otherwise click whatever
// button has focus by then - usually "+", which starts listening again.
el.keysDialog.addEventListener("keyup", (e) => {
  if (swallowKeyUp && (e.code || e.key) === swallowKeyUp) {
    e.preventDefault();
    e.stopPropagation();
    swallowKeyUp = null;
  }
}, true);

el.keysDialog.addEventListener("cancel", (e) => {
  // Escape closes the dialog, except when it is cancelling a capture.
  if (capture || escapeHandled) {
    e.preventDefault();
    if (capture) cancelCapture();
  }
});

el.keysDialog.addEventListener("close", () => {
  capture = null;
  el.keysFilter.value = "";
  schedulePointer();
  if (keysReturnFocus && keysReturnFocus.isConnected) keysReturnFocus.focus();
});

el.keysClose.addEventListener("click", () => el.keysDialog.close());
el.setTabs.addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b || b.dataset.tab === settingsTab) return;
  settingsTab = b.dataset.tab;
  localStorage.setItem(K_TAB, settingsTab);
  capture = null;
  el.keysList.scrollTop = 0;
  renderKeys();
});
el.keysFilter.addEventListener("input", () => { capture = null; renderKeys(); });
el.keysResetAll.addEventListener("click", () => {
  if (settingsTab === "appearance") {
    if (!window.confirm("Reset every box, cursor, crosshair, minimap and image strip setting "
                        + "to the defaults? Class names are kept.")) return;
    prefs.styles = {};
    prefs.minimap = { ...MINIMAP_DEFAULTS };
    prefs.strip = { ...STRIP_DEFAULTS };
    mmBase = null;
    for (const c of projectPrefs.classes) delete c.style;
    saveSettings();
    if (project) saveProjectSettings();
    return;
  }
  if (!window.confirm("Reset every shortcut, the mouse settings and the scan settings to the defaults?")) return;
  prefs.bindings = {};
  prefs.pointer = { ...POINTER_DEFAULTS };
  prefs.scan = { ...SCAN_DEFAULTS };
  capture = null;
  saveSettings();
});
for (const b of document.querySelectorAll(".open-keys")) {
  b.addEventListener("click", () => toggleKeys());
}

function keyMatches(id, needle) {
  if (!needle) return true;
  const c = COMMANDS[id];
  return [c.label, c.group || "", SCREENS[c.screen]]
      .some((s) => s.toLowerCase().includes(needle))
    || keysOf(id).some((k) => keyLabel(k).toLowerCase().includes(needle)
                             || k.toLowerCase() === needle);
}

function changeCount() {
  return Object.keys(prefs.bindings).filter((id) => COMMANDS[id]).length
    + Object.keys(POINTER_DEFAULTS).filter((k) => prefs.pointer[k] !== POINTER_DEFAULTS[k]).length
    + scanChangeCount();
}

function renderKeys() {
  if (!el.keysDialog.open) return;
  const active = document.activeElement && document.activeElement.dataset
    ? document.activeElement.dataset.f : null;
  for (const b of el.setTabs.querySelectorAll(".tab")) {
    b.setAttribute("aria-selected", String(b.dataset.tab === settingsTab));
  }
  el.keysFilter.hidden = settingsTab !== "input";
  if (settingsTab === "workflow") {
    renderWorkflow();
    if (active) focusKey(active);
    return;
  }
  if (settingsTab === "appearance") {
    renderAppearance();
    const n = appearanceChangeCount();
    el.keysChanged.textContent = n ? `${plural(n, "style", "styles")} changed` : "All default styles";
    el.keysResetAll.disabled = !n;
    if (active) focusKey(active);
    return;
  }
  const needle = el.keysFilter.value.trim().toLowerCase();
  const frag = document.createDocumentFragment();

  if (!needle || "mouse pointer speed pan zoom wheel".includes(needle)) {
    frag.appendChild(speedSection());
  }
  if (!needle || "scan scanning speed overlap resume".includes(needle)) {
    frag.appendChild(scanSection());
  }
  for (const [screen, title] of Object.entries(SCREENS)) {
    const ids = Object.keys(COMMANDS)
      .filter((id) => COMMANDS[id].screen === screen && keyMatches(id, needle));
    if (!ids.length) continue;
    const sec = h("section", "keys-screen");
    sec.appendChild(h("h3", "", `Shortcuts: ${title.toLowerCase()}`));
    let group = null;
    for (const id of ids) {
      const g = COMMANDS[id].group;
      if (g && g !== group) sec.appendChild(h("h4", "", (group = g)));
      sec.appendChild(keyRow(id));
    }
    frag.appendChild(sec);
  }
  el.keysList.replaceChildren(frag);
  if (!el.keysList.childElementCount) {
    el.keysList.appendChild(h("p", "empty",
      `No setting or shortcut matches \u201c${el.keysFilter.value.trim()}\u201d.`));
  }

  const n = changeCount();
  el.keysChanged.textContent = n ? `${plural(n, "change", "changes")} from the defaults`
                                 : "All defaults";
  el.keysResetAll.disabled = !n;
  if (active) focusKey(active);
}

function keyRow(id) {
  const c = COMMANDS[id];
  const row = h("div", "keyrow" + (isChanged(id) ? " changed" : ""));

  const label = h("span", "keylabel", c.label);
  if (c.kind === "hold") label.appendChild(h("span", "tag", "while held"));
  if (c.kind === "drag") label.appendChild(h("span", "tag", "drag"));
  if (isChanged(id)) label.appendChild(h("span", "tag changed", "changed"));

  const chips = h("span", "chips");
  for (const input of keysOf(id)) {
    const lost = shadowed.find((s) => s.id === id && s.input === input);
    const chip = h("span", "chip-key" + (lost ? " shadowed" : ""));
    chip.appendChild(h("kbd", "", keyLabel(input)));
    if (lost) chip.title = `Not active: ${keyLabel(input)} ${lost.why}`;
    const x = h("button", "", "\u00d7");
    x.type = "button";
    x.dataset.f = `rm:${id}:${input}`;
    x.setAttribute("aria-label", `Remove ${keyLabel(input)} from ${c.label}`);
    x.addEventListener("click", () => {
      setKeys(id, keysOf(id).filter((k) => k !== input));
      capture = null;
      saveSettings();
      focusKey(`add:${id}`);
    });
    chip.appendChild(x);
    chips.appendChild(chip);
  }
  if (capture && capture.id === id && !capture.conflict) {
    const cap = h("span", "chip-key capturing");
    cap.tabIndex = -1;
    cap.dataset.f = `cap:${id}`;
    cap.appendChild(h("span", "", c.kind === "drag"
      ? "Press the mouse button to drag with\u2026"
      : "Press a key, click any button, or scroll\u2026"));
    const stop = h("button", "", "cancel");
    stop.type = "button";
    stop.dataset.exempt = "";
    stop.addEventListener("click", () => cancelCapture());
    cap.appendChild(stop);
    chips.appendChild(cap);
  } else {
    const add = h("button", "add-key", "+");
    add.type = "button";
    add.dataset.f = `add:${id}`;
    add.title = "Add a shortcut";
    add.setAttribute("aria-label", `Add a shortcut for ${c.label}`);
    add.addEventListener("click", () => startCapture(id));
    chips.appendChild(add);
  }

  const actions = h("span", "keyactions");
  if (isChanged(id)) {
    const d = defaultsOf(id);
    const reset = h("button", "badge", "reset");
    reset.type = "button";
    reset.dataset.f = `reset:${id}`;
    reset.title = d.length ? `Back to the default: ${d.map(keyLabel).join(", ")}`
                           : "Back to the default: no shortcut";
    reset.addEventListener("click", () => {
      delete prefs.bindings[id];
      capture = null;
      saveSettings();
      focusKey(`add:${id}`);
    });
    actions.appendChild(reset);
  }

  row.append(label, chips, actions);
  if (capture && capture.id === id && (capture.conflict || capture.error)) {
    row.appendChild(captureNote(id));
  } else if (c.essential && !activeKeys(id).length) {
    row.appendChild(h("div", "keynote bad", `Nothing is bound, so ${c.essential}.`));
  }
  return row;
}

function captureNote(id) {
  const note = h("div", "keynote");
  if (capture.error) { note.textContent = capture.error; return note; }
  const { input, owner } = capture.conflict;
  const o = COMMANDS[owner];
  const where = o.screen === COMMANDS[id].screen ? "" : ` (${SCREENS[o.screen].toLowerCase()})`;
  const msg = h("span", "msg");
  msg.append(h("kbd", "", keyLabel(input)),
             ` already runs \u201c${o.label}\u201d${where}.`);
  if (o.essential && activeKeys(owner).length === 1) {
    msg.append(` Moving it leaves that with nothing, so ${o.essential} until you give it another.`);
  }
  note.appendChild(msg);
  const take = h("button", "badge", "move it here");
  take.type = "button";
  take.dataset.f = `take:${id}`;
  take.addEventListener("click", () => assign(id, input, owner));
  const keep = h("button", "badge", "cancel");
  keep.type = "button";
  keep.dataset.f = `keep:${id}`;
  keep.addEventListener("click", () => cancelCapture());
  note.append(take, keep);
  return note;
}

const fmtSpeed = (v) => `${Number(v).toFixed(1)}\u00d7`;

function speedSection() {
  const sec = h("section", "keys-screen");
  sec.appendChild(h("h3", "", "Mouse"));
  sec.append(
    speedRow("pan_gain", "Pan speed",
             "How far the image moves when you drag it. At 1\u00d7 it stays under the cursor."),
    speedRow("zoom_speed", "Zoom speed",
             "How much one wheel notch, or one zoom key press, zooms in or out."),
    drawModeRow(),
    keyPanRow());
  return sec;
}

function drawModeRow() {
  const changed = prefs.pointer.draw !== POINTER_DEFAULTS.draw;
  const row = h("div", "keyrow speed" + (changed ? " changed" : ""));
  const lab = h("span", "keylabel");
  lab.append("Drawing a new box",
             h("span", "sub", "Either way, panning and zooming in the middle of a box leave it open."));
  const opts = h("span", "chips");
  for (const [value, text] of [["clicks", "two clicks"], ["drag", "press, drag, release"]]) {
    const l = h("label", "radio");
    const r = h("input");
    r.type = "radio";
    r.name = "drawmode";
    r.value = value;
    r.checked = prefs.pointer.draw === value;
    r.dataset.f = `draw:${value}`;
    r.addEventListener("change", () => {
      prefs.pointer.draw = value;
      draft = null;              // a box half-drawn the other way is abandoned
      saveSettings();
    });
    l.append(r, " " + text);
    opts.appendChild(l);
  }
  row.append(lab, opts, h("span", "keyactions"));
  return row;
}

function speedRow(key, label, hint) {
  const row = h("div", "keyrow speed" + (prefs.pointer[key] !== POINTER_DEFAULTS[key] ? " changed" : ""));
  const lab = h("label", "keylabel");
  lab.htmlFor = `speed-${key}`;
  lab.append(label, h("span", "sub", hint));

  const wrap = h("span", "chips");
  const r = h("input");
  r.type = "range";
  r.id = `speed-${key}`;
  r.min = "0.1";
  r.max = "3";
  r.step = "0.1";
  r.value = String(prefs.pointer[key]);
  r.dataset.f = `speed:${key}`;
  const out = h("output", "speedval", fmtSpeed(prefs.pointer[key]));
  out.htmlFor = r.id;
  // Applied while dragging the slider, so it can be tried on the image right
  // away; saved when the slider is let go.
  r.addEventListener("input", () => {
    prefs.pointer[key] = Math.round(Number(r.value) * 10) / 10;
    out.textContent = fmtSpeed(prefs.pointer[key]);
  });
  r.addEventListener("change", () => saveSettings());
  wrap.append(r, out);

  const actions = h("span", "keyactions");
  if (prefs.pointer[key] !== POINTER_DEFAULTS[key]) {
    const reset = h("button", "badge", "reset");
    reset.type = "button";
    reset.dataset.f = `speedreset:${key}`;
    reset.title = `Back to ${fmtSpeed(POINTER_DEFAULTS[key])}`;
    reset.addEventListener("click", () => {
      prefs.pointer[key] = POINTER_DEFAULTS[key];
      saveSettings();
      focusKey(`speed:${key}`);
    });
    actions.appendChild(reset);
  }
  row.append(lab, wrap, actions);
  return row;
}

function keyStatus(msg, bad) {
  el.keysStatus.textContent = msg;
  el.keysStatus.classList.toggle("bad", !!bad);
}

/** Apply at once, then save. Saves go out one at a time and in order, each
    carrying the state at the moment of the change. */
let settingsSaves = Promise.resolve();
function saveSettings() {
  buildTables();
  renderKeys();
  renderHelp();
  applyAppearance();
  const body = JSON.stringify(prefs);
  settingsSaves = settingsSaves.then(async () => {
    try {
      const r = await fetch(BASE + "api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body,
      });
      if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
      prefsPath = (await r.json()).path || prefsPath;
      keyStatus(`Saved to ${prefsPath}`);
    } catch (err) {
      keyStatus(`Not saved (${err.message}). The change works in this tab until you reload.`, true);
    }
  });
}

async function loadSettings() {
  try {
    const r = await fetch(BASE + "api/settings");
    if (!r.ok) throw new Error(`api/settings returned ${r.status}`);
    const data = await r.json();
    prefs = {
      version: data.version || 1,
      bindings: data.bindings || {},
      pointer: { ...POINTER_DEFAULTS, ...(data.pointer || {}) },
      styles: data.styles || {},
      minimap: { ...MINIMAP_DEFAULTS, ...(data.minimap || {}) },
      scan: { ...SCAN_DEFAULTS, ...(data.scan || {}) },
      strip: { ...STRIP_DEFAULTS, ...(data.strip || {}) },
    };
    prefsPath = data.path || "";
    const msg = data.warning || data.note || (prefsPath ? `Saved to ${prefsPath}` : "");
    keyStatus(msg, !!data.warning);
    if (data.warning) console.warn(data.warning);
  } catch (err) {
    keyStatus(`Using the default settings: ${err.message}`, true);
  }
  buildTables();
  renderHelp();
  applyAppearance();
}

// ---------------------------------------------------------------- appearance
//
// How boxes, the cursor and the crosshair look. Your own boxes are drawn in
// the style of their class; sam3 predictions, approved sam3 boxes and
// exemplars keep a style of their own, so where a box came from stays
// visible whatever the class colours are. Class styles belong to the project
// (class ids mean different things in different projects); everything else
// is personal. Defaults live here; the files hold only what you changed.
//
// All widths are screen pixels: boxes use non-scaling strokes, and the
// cursor and crosshair are drawn in a layer that is not zoomed at all.

const PALETTE = ["#a855f7", "#22c55e", "#f472b6", "#14b8a6",
                 "#818cf8", "#a3e635", "#e879f9", "#94a3b8"];

const STYLE_DEFAULTS = {
  prediction: { color: "#ff2d2d", fill: 0, width: 2, opacity: 1, line: "solid" },
  approved:   { color: "#5cc8ff", fill: 0, width: 2, opacity: 1, line: "dotted" },
  exemplar:   { color: "#ffb01f", fill: 0.1, width: 2, opacity: 1, line: "solid" },
  cursor:     { show: true, color: "#ffffff", width: 1.5, opacity: 1, line: "solid", size: 22 },
  crosshair:  { show: true, color: "#ffffff", width: 1, opacity: 0.5, line: "dashed" },
};
/** A class without a style of its own takes a palette colour by its place in
    the class list, so the first classes are always easy to tell apart. */
function classDefault(name) {
  const i = Math.max(0, classList().indexOf(name));
  return { color: PALETTE[i % PALETTE.length], fill: 0, width: 2, opacity: 1, line: "solid" };
}

const STYLE_KEYS = ["show", "color", "fill", "width", "opacity", "line", "size"];
const sameStyle = (a, b) => STYLE_KEYS.every((k) => a[k] === b[k]);

// The project's classes are NAMES: what the list here says is what the
// annotation files say, with no numbers in between.
let projectPrefs = { version: 2, classes: [] };   // [{name, style?}], in hotkey order
let projectPrefsPath = "";
let seenClasses = new Set();     // class names this project's annotations use
let classCounts = null;          // name -> boxes, fetched when the list is shown
let activeClass = "";            // the class new boxes get
const DEFAULT_CLASS_NAME = "object";   // for a project with no class at all yet
const K_ACTIVE_CLASS = (p) => `al.class:${p}`;

const validClassName = (n) => n.length > 0 && n.length <= 64 && !/[\s\x00-\x1f]/.test(n);
const classEntry = (name) => projectPrefs.classes.find((c) => c.name === name);

function styleOf(key) { return { ...STYLE_DEFAULTS[key], ...(prefs.styles[key] || {}) }; }
function classStyle(name) {
  const e = classEntry(name);
  return e && e.style ? { ...e.style } : classDefault(name);
}
function className(name) { return name; }

/** The classes in order: the project's list first - 1 to 9 pick from it -
    then any class the annotation files use that the list does not have. */
function classList() {
  const defined = projectPrefs.classes.map((c) => c.name);
  const extra = [...seenClasses].filter((n) => !defined.includes(n)).sort();
  return [...defined, ...extra];
}

/** Keep the class new boxes get pointing at a class that exists: the one last
    chosen in this project, else the first on the list. */
function ensureActiveClass() {
  const list = classList();
  if (list.includes(activeClass)) return;
  const stored = project ? localStorage.getItem(K_ACTIVE_CLASS(project)) : null;
  activeClass = list.includes(stored) ? stored : (list[0] || DEFAULT_CLASS_NAME);
}

/** The style a box is drawn with, by where it came from and, for your own
    boxes, by class. */
function styleFor(kind, b) {
  if (kind === "pred") return styleOf("prediction");
  if (kind === "exem") return styleOf("exemplar");
  return fromSam3(b) ? styleOf("approved") : classStyle(b.cls);
}

/** Dash pattern in screen px, scaled with the width so a thick dotted line
    is still dotted rather than a row of touching blobs. */
function dashOf(st) {
  const w = st.width;
  if (st.line === "dashed") return { dash: `${Math.max(4, 3 * w)} ${Math.max(3, 2 * w)}`, cap: "butt" };
  if (st.line === "dotted") return { dash: `1 ${Math.max(6, 4.5 * w)}`, cap: "round" };
  return { dash: "none", cap: "butt" };
}

/** Selection is a wash of the box's own colour; it never touches the
    stroke, which is what says where a box came from. */
const selectedFill = (f) => Math.min(1, Math.max(0.16, f + 0.12));

function paint(r, st, opts = {}) {
  const d = dashOf(opts.draft ? { ...st, line: "dashed" } : st);
  r.style.stroke = st.color;
  r.style.strokeWidth = st.width + "px";
  r.style.strokeOpacity = st.opacity;
  r.style.strokeDasharray = d.dash;
  r.style.strokeLinecap = d.cap;
  r.style.fill = st.color;
  r.style.fillOpacity = opts.draft ? 0 : opts.selected ? selectedFill(st.fill) : st.fill;
  return r;
}

/** Everything that depends on styles, after any of them changes. */
function applyAppearance() {
  el.viewport.classList.toggle("custom-cursor", styleOf("cursor").show);
  render();
  renderLegend();
  drawPointer();
  scheduleMinimap();
  applyStripLayout();
}

// ---------------------------------------------------------------- cursor and crosshair
//
// Drawn in their own layer over the image, in screen pixels, following the
// pointer. Over a box or a corner the system cursor comes back, because its
// move and resize shapes say what a drag there will do; the crosshair lines
// stay. While panning, the system "grabbing" cursor shows instead.

let pointerAt = null;        // {x, y} in viewport px, or null when outside
let overBox = false;
let pointerFrame = 0;
