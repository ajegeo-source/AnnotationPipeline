<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>annotator</title>
<style>
  :root {
    --bg:      #14161a;
    --panel:   #1b1f25;
    --line:    #2b323b;
    --text:    #d9dfe7;
    --dim:     #7c8794;
    --human:   #a855f7;   /* violet     - drawn here, owned by ANNOTATION_DIR */
    --pred:    #ff2d2d;   /* red        - read from PREDICTION_DIR, never written */
    --accept:  #5cc8ff;   /* light blue - a prediction a human approved */
    --exem:    #ffb01f;   /* amber      - picked as a SAM3 prompt */
    --done:    #4bd6a4;
    --pending: #4a5460;
    --started: #8a7fd4;   /* boxes but no sign-off */
    --todo:    #2b323b;
    --cursor:  #ff2d78;   /* "you are here": the open image, in the grid and the strip */
    --mono:    ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Three screens, one page. Only one is ever visible; [hidden] has to win
     over the per-view grid templates below, hence the !important. */
  .view { height: 100%; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .view[hidden] { display: none !important; }
  #datasetView { grid-template-rows: auto auto 1fr; }
  #projectsView { grid-template-rows: auto auto 1fr; }
  #projSearch { width: 240px; }
  .sortctl { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  #editorView  { grid-template-rows: auto 1fr auto; }
  .scroll { overflow: auto; min-height: 0; }

  header {
    display: flex; align-items: center; gap: 18px;
    padding: 0 14px; height: 40px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  /* No item ever breaks inside itself ("5 / 40" on two lines); when a row is
     full, whole items move to a second row instead of running off screen. */
  header { flex-wrap: wrap; height: auto; min-height: 40px; padding: 5px 14px; row-gap: 5px; }
  header > * { flex: none; white-space: nowrap; }
  header > .spacer { flex: 1 1 0; }
  header > .name { flex: 0 1 auto; min-width: 6ch; }
  @media (max-width: 1500px) { header { column-gap: 12px; } }
  .name {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 40vw;
  }
  .counter {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .spacer { flex: 1; }
  .badge {
    font-family: ui-monospace, monospace; font-size: 11px;
    padding: 3px 9px; border: 1px solid var(--line); border-radius: 2px;
    color: var(--dim); letter-spacing: .04em; text-transform: uppercase;
    cursor: pointer; user-select: none; background: none;
  }
  .badge:hover { border-color: var(--dim); }
  .badge.on { color: #0d1114; background: var(--done); border-color: var(--done); }
  .badge:focus-visible { outline: 2px solid var(--human); outline-offset: 2px; }

  .thresh { display: flex; align-items: center; gap: 6px; }
  .thresh label {
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim);
    letter-spacing: .04em; text-transform: uppercase;
  }
  .thresh input {
    width: 62px; padding: 3px 6px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 2px;
    font-family: ui-monospace, monospace; font-size: 11px; text-align: right;
  }
  .thresh input:focus { outline: none; border-color: var(--human); }
  .thresh input.bad { border-color: var(--pred); }
  .thresh .badge.pending { border-color: var(--human); color: var(--human); }
  .predcount {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--pred); font-variant-numeric: tabular-nums;
  }
  .exemcount {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--exem); font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .badge.mode-on {
    color: #0d1114; background: var(--exem); border-color: var(--exem);
  }

  /* The approve button wears the colour of the boxes it produces. */
  .badge.approve { border-color: var(--accept); color: var(--accept); }
  .badge.approve:hover { background: var(--accept); color: #0d1114; }
  .badge:disabled {
    opacity: .35; cursor: default;
    border-color: var(--line); color: var(--dim); background: none;
  }

  .viewport {
    position: relative; overflow: hidden;
    background: #0d0f12; cursor: crosshair;
  }
  .viewport.panning { cursor: grabbing; }
  /* Mode errors are expensive here - a stray exemplar ends up prompting a run -
     so the whole viewport carries the mode, not just a button in the corner. */
  .viewport.exemplar::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 2px solid var(--exem);
  }
  .stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .stage img { display: block; width: 100%; height: 100%; user-select: none; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Hit testing is done in image coordinates against the box list, not by
     asking the DOM what was clicked, so nothing here needs pointer events. */
  .stage rect {
    fill: transparent; stroke-width: 2px; pointer-events: none;
    vector-effect: non-scaling-stroke;
  }
  /* Colour, width, opacity, fill and dash come from the style settings and
     are set inline on each box (see paint()); only the handles' dark rim is
     fixed, so a corner stays visible on a box of any colour. */
  .stage rect.handle { stroke: #0d0f12; stroke-width: 1px; }

  .hint {
    position: absolute; left: 12px; bottom: 12px;
    font-size: 11px; color: var(--dim);
    background: rgba(13,15,18,.88); border: 1px solid var(--line);
    border-radius: 2px; padding: 8px 11px; line-height: 1.5;
    /* Click-through: it sits on top of the image, and a box drawn in the
       bottom-left corner must reach the image, not the help. */
    pointer-events: none;
  }
  .hint[hidden] { display: none; }
  /* Generated from the binding table, so it is always what the keys do. */
  .help-keys { display: grid; grid-template-columns: auto auto; gap: 2px 14px; }
  .help-keys .keys { text-align: right; white-space: nowrap; }
  .hint kbd {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    border: 1px solid var(--line); border-radius: 2px; padding: 0 4px;
  }
  .hint .mouse, .hint .legend {
    margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line);
  }
  .hint b { color: var(--text); font-weight: 500; }

  /* One message at a time, over the image, gone on its own. */
  .toast {
    position: absolute; top: 12px; left: 50%; transform: translate(-50%, -6px);
    padding: 5px 12px; border-radius: 2px; font-size: 12px; pointer-events: none;
    background: rgba(13,15,18,.9); border: 1px solid var(--line); color: var(--text);
    opacity: 0; transition: opacity .15s, transform .15s;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  /* ------------------------------------------------ binding editor */
  dialog.keys {
    width: min(780px, 94vw); max-height: 88vh; padding: 0;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  dialog.keys[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  dialog.keys::backdrop { background: rgba(5, 6, 8, .62); }
  .keys-head, .keys-foot {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  }
  .keys-head { border-bottom: 1px solid var(--line); }
  .keys-foot { border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .keys-head h2 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .keys-head .field { flex: 1; width: auto; min-width: 0; }
  .keys-body { overflow: auto; padding: 0 16px 16px; }
  .keys-body h3 { margin: 18px 0 4px; font-size: 12px; font-weight: 600; }
  .keys-body h4 { margin: 10px 0 2px 8px; font-size: 11px; font-weight: 500; color: var(--dim); }
  .keyrow {
    display: grid; grid-template-columns: minmax(0, 1fr) auto 64px;
    align-items: center; gap: 6px 12px; padding: 5px 8px; border-radius: 2px;
  }
  .keyrow:hover { background: rgba(255, 255, 255, .03); }
  .keylabel { min-width: 0; }
  .keylabel .tag { margin-left: 8px; font-size: 11px; }
  .keylabel .tag.changed { color: var(--human); border-color: var(--human); }
  .chips { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; }
  .chip-key {
    display: inline-flex; align-items: stretch; border: 1px solid var(--line);
    border-radius: 2px; font: 11px/1.8 var(--mono);
  }
  .chip-key kbd { padding: 0 7px; font: inherit; color: var(--text); }
  .chip-key button {
    border: 0; border-left: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--dim); font: inherit; padding: 0 6px;
  }
  .chip-key button:hover, .chip-key button:focus-visible { color: #ff6b6b; }
  .chip-key.shadowed kbd { text-decoration: line-through; color: var(--dim); }
  .chip-key.capturing { padding: 0 9px; color: var(--human); border-color: var(--human); }
  .chip-key.capturing:focus { outline: none; }
  .add-key {
    min-width: 26px; background: none; color: var(--dim); cursor: pointer;
    border: 1px dashed var(--line); border-radius: 2px; font: 12px/1.6 var(--mono);
  }
  .add-key:hover, .add-key:focus-visible { color: var(--text); border-color: var(--dim); }
  .keyactions { display: flex; justify-content: flex-end; }
  .keynote {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font-size: 12px; color: var(--exem); padding: 2px 0 4px;
  }
  .keynote kbd {
    font: 11px/1.8 var(--mono); color: var(--text); padding: 0 6px;
    border: 1px solid var(--line); border-radius: 2px;
  }
  .radio { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px;
           color: var(--dim); cursor: pointer; white-space: nowrap; }
  .radio:has(input:checked) { color: var(--text); }
  .keyhint { margin: 6px 8px 0; font-size: 12px; color: var(--dim); max-width: 64ch; }
  .keylabel .sub { display: block; margin-top: 2px; font-size: 11px; color: var(--dim); }
  .keyrow.speed { padding-top: 7px; padding-bottom: 7px; }
  .keyrow.speed input[type="range"] { width: 200px; accent-color: var(--human); }
  .speedval { min-width: 44px; text-align: right; font: 12px var(--mono);
              font-variant-numeric: tabular-nums; }
  .chip-key.capturing { gap: 8px; }
  .chip-key.capturing span { padding: 0; }
  .keynote.bad { color: #ff6b6b; }
  .keynote .msg { flex: 1 1 300px; }
  .keys-status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keys-status.bad { color: #ff6b6b; white-space: normal; }
  .dialog-spacer { flex: 1; }
  .keys-body .empty { padding: 30px 0; }
  .badge:focus-visible, .chip-key button:focus-visible, .add-key:focus-visible,
  .radio input:focus-visible { outline: 2px solid var(--human); outline-offset: 2px; }

  /* ------------------------------------------------ cursor, crosshair, styles */
  .pointer-layer { position: absolute; inset: 0; width: 100%; height: 100%;
                   pointer-events: none; overflow: visible; }
  .viewport.custom-cursor:not(.panning) { cursor: none; }

  .keys-head .tabs { flex: none; }
  #keysClose { margin-left: auto; }
  .stylerow { padding: 9px 8px 11px; border-radius: 2px; }
  .stylerow + .stylerow { border-top: 1px solid rgba(255, 255, 255, .05); }
  .stylehead { display: flex; align-items: center; gap: 10px; min-height: 36px; }
  .pvwrap { display: inline-flex; flex: none; }
  .preview { display: block; border-radius: 2px; }
  .stylectl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
              margin: 8px 0 0 68px; }
  .stylefield { display: inline-flex; align-items: center; gap: 7px;
                font-size: 12px; color: var(--dim); }
  .stylefield input[type="range"] { width: 96px; accent-color: var(--human); }
  .stylefield input[type="color"] {
    width: 30px; height: 22px; padding: 0; cursor: pointer; background: none;
    border: 1px solid var(--line); border-radius: 2px;
  }
  .stylefield.toggle { color: var(--text); flex-basis: 100%; }
  .stylefield input:focus-visible, .stylefield select:focus-visible {
    outline: 2px solid var(--human); outline-offset: 2px;
  }
  .styleval { min-width: 44px; font: 11px var(--mono); color: var(--text);
              font-variant-numeric: tabular-nums; }
  .classname { width: 220px; }
  .classid { font: 11px var(--mono); color: var(--dim); }
  .legend-item { display: inline-flex; align-items: center; gap: 5px;
                 margin-right: 12px; white-space: nowrap; }

  /* ------------------------------------------------ minimap */
  .minimap {
    position: absolute; top: 12px; right: 12px; z-index: 2; padding: 4px;
    background: rgba(13, 15, 18, .88); border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; user-select: none;
  }
  .minimap[hidden] { display: none; }
  .minimap canvas { display: block; border-radius: 2px; }
  .mm-foot {
    display: flex; justify-content: space-between; gap: 10px; padding: 4px 2px 0;
    font: 11px/1.3 var(--mono); color: var(--text); font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* drawMinimap() sets the footer's width to the picture's; border-box keeps
     its padding inside that width, and the note shrinks with an ellipsis
     rather than push the minimap wider. */
  .mm-foot { box-sizing: border-box; }
  .mm-foot > span { overflow: hidden; text-overflow: ellipsis; }
  #mmZoom { flex: none; }
  #mmNote { min-width: 0; color: var(--dim); }
  #mmNote:empty { display: none; }
  /* The one handle that moves it: its top-right corner. */
  .mm-grip {
    position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; cursor: move;
    background: var(--panel) radial-gradient(circle, var(--dim) 1px, transparent 1.5px) 0 0 / 4px 4px;
    border: 1px solid var(--dim); border-radius: 2px;
  }
  .mm-grip:hover, .minimap.moving .mm-grip { border-color: var(--text); }
  .toast { z-index: 3; }
  .mmtoggle { margin: 4px 8px 6px; }
  .scantoggle { margin: 6px 8px; }
  .speedval { min-width: 64px; }

  /* ------------------------------------------------ image strip */
  .strip {
    position: relative; height: calc(var(--strip-h, 84px) + 14px); overflow: hidden;
    background: var(--bg); border-top: 1px solid var(--line);
    cursor: grab; user-select: none; touch-action: none;
  }
  .strip[hidden] { display: none; }
  .strip.dragging { cursor: grabbing; }
  .strip-track { position: absolute; inset: 0; }
  .stile {
    --c: var(--todo);
    position: absolute; top: 7px; left: 0;
    width: var(--strip-w, 149px); height: var(--strip-h, 84px);
    background: #0d0f12; border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
  }
  .stile.s-progress { --c: var(--started); }
  .stile.s-done     { --c: var(--done); }
  .stile img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .stile .sbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--c); }
  .stile .sidx {
    position: absolute; top: 3px; left: 3px; padding: 0 4px; border-radius: 2px;
    font: 10px/1.5 var(--mono); color: var(--dim); background: rgba(13, 15, 18, .82);
    font-variant-numeric: tabular-nums;
  }
  .strip:not(.dragging) .stile:hover { border-color: var(--dim); }
  /* The image being annotated, in the "you are here" colour. */
  .stile.current { border-color: var(--cursor); box-shadow: 0 0 0 1px var(--cursor); }
  .stile.current .sidx { color: var(--text); }   /* "700 px/s" and "2.0x" line up the same */

  /* Says the scan is on and what it is doing: top-left, clear of the minimap
     (top-right), the toast (top-centre) and the help (bottom-left). */
  /* Top-left: the scan's state, and beside it the small box for how long it
     holds the first and last view - the only part that takes the pointer. */
  .scanbar {
    position: absolute; top: 12px; left: 12px; z-index: 2; pointer-events: none;
    display: flex; align-items: stretch; gap: 6px;
  }
  .scanbar[hidden] { display: none; }
  .scanpill {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    background: rgba(13, 15, 18, .88); border: 1px solid var(--line); border-radius: 2px;
    font: 12px/1.4 var(--mono); color: var(--text); font-variant-numeric: tabular-nums;
    white-space: pre;
  }
  .scanedge {
    pointer-events: auto; display: flex; align-items: center; gap: 5px; padding: 0 8px;
    background: rgba(13, 15, 18, .88); border: 1px solid var(--line); border-radius: 2px;
    font: 12px/1.4 var(--mono); color: var(--dim); white-space: nowrap;
  }
  .scanedge input {
    width: 46px; padding: 1px 4px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 2px;
  }
  .scanedge input:focus { outline: none; border-color: var(--human); }
  /* The speed level, for a moment after it changes: rising bars, lit up to it. */
  .scanlevel {
    position: absolute; top: 44px; left: 12px; z-index: 2; pointer-events: none;
    display: flex; align-items: center; gap: 9px; padding: 6px 10px;
    background: rgba(13, 15, 18, .88); border: 1px solid var(--line); border-radius: 2px;
    font: 12px/1.4 var(--mono); color: var(--text);
  }
  .scanlevel[hidden] { display: none; }
  .scanlevel .bars { display: flex; align-items: flex-end; gap: 3px; height: 17px; }
  .scanlevel .bars i { width: 4px; border-radius: 1px; background: var(--line); }
  .scanlevel .bars i.on { background: var(--done); }
  .scanpill i { width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
  .scanpill[data-state="wait"] i { background: var(--exem); }

  /* ------------------------------------------------ classes, comments */
  .classchip {
    display: inline-flex; align-items: center; gap: 7px; max-width: 220px;
    padding: 2px 9px; border: 1px solid var(--line); border-radius: 2px;
    background: var(--bg); color: var(--text); font: 12px/1.6 var(--mono); cursor: pointer;
  }
  .classchip:hover, .classchip[aria-expanded="true"] { border-color: var(--dim); }
  .classchip i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .classchip span { overflow: hidden; text-overflow: ellipsis; }
  .classmenu {
    position: fixed; z-index: 20; min-width: 200px; max-height: 60vh; overflow: auto; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  }
  .classmenu[hidden] { display: none; }
  .classitem {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 5px 8px; border: 0;
    background: none; color: var(--text); font: 12px/1.5 var(--mono); text-align: left;
    border-radius: 2px; cursor: pointer;
  }
  .classitem:hover, .classitem:focus-visible { background: rgba(255, 255, 255, .06); outline: none; }
  .classitem.on { background: rgba(168, 85, 247, .16); }
  .classitem .k { width: 12px; color: var(--dim); }
  .classitem i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .classitem.edit { color: var(--dim); border-top: 1px solid var(--line); border-radius: 0; margin-top: 4px; }
  .classkey { width: 12px; font: 12px var(--mono); color: var(--dim); text-align: right; }
  .keyrow.addclass { grid-template-columns: auto auto 1fr; margin: 8px 0 0 8px; }

  .pins { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  /* A speech bubble whose bottom-left corner is the point it is about. */
  .pin {
    position: absolute; transform: translate(-1px, -100%); pointer-events: auto;
    min-width: 20px; height: 20px; padding: 0 5px; cursor: pointer;
    font: 600 11px/18px var(--mono); color: #0d1114; background: #f5f5f4;
    border: 1px solid #0d1114; border-radius: 9px 9px 9px 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
  }
  .pin.resolved { background: #8b939e; opacity: .75; }
  .pin.open, .pin:hover { background: var(--exem); }
  /* A comment box's label sits on its top left corner, the box under it. */
  .pin.region { border-radius: 2px 2px 2px 0; }
  .stage rect.cbox {
    fill: rgba(245, 245, 244, .06); stroke: #f5f5f4; stroke-width: 1.5px; stroke-dasharray: 2 4;
    stroke-linecap: round;
  }
  .stage rect.cbox.resolved { stroke: #8b939e; fill: none; }
  .stage rect.cbox.open { stroke: var(--exem); }
  .stage rect.cbox.draft { stroke-dasharray: 6 4; }
  #commentBtn.on { color: #0d1114; background: #f5f5f4; border-color: #f5f5f4; }
  /* Image flags: neutral - notes, not categories. */
  .flagchip { color: var(--dim); }
  .flagchip.on { color: var(--text); border-color: #f5f5f4; }
  .flagchip.on span::before { content: "\2691  "; }
  .flagitem .k { color: var(--text); }
  .flagnote { display: block; width: calc(100% - 12px); margin: 6px 6px 4px; padding: 4px 7px; font: 12px var(--mono); }
  .tile .fl {
    position: absolute; left: 6px; bottom: 6px; padding: 1px 6px; border-radius: 2px;
    font: 11px/1.5 var(--mono); color: #0d1114; background: #f5f5f4;
  }
  .fp-flag { padding-left: 8px; }
  /* ------------------------------------------------ the run's exemplars */
  button.exemcount { background: none; border: 0; padding: 0 2px; font: inherit; cursor: pointer; }
  button.exemcount:hover, button.exemcount[aria-expanded="true"] { text-decoration: underline; }
  .exemcount:empty { display: none; }
  .filterpanel.exempanel { width: 464px; }
  .ex-head { margin: 12px 0 6px; color: var(--dim); font-size: 12px; }
  .ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
  .ex-card {
    position: relative; display: flex; flex-direction: column; gap: 4px; padding: 5px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 2px;
    color: var(--text); cursor: pointer; text-align: left;
  }
  .ex-card:hover, .ex-card:focus-visible { border-color: var(--exem); outline: none; }
  .ex-card img { width: 100%; height: 112px; object-fit: contain; background: #0d0f12; border-radius: 1px; }
  .ex-cap { font: 11px/1.3 var(--mono); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-badge {
    position: absolute; top: 9px; left: 9px; padding: 0 5px; border-radius: 2px;
    font: 600 10px/1.6 var(--mono); color: #0d1114; background: var(--exem);
  }
  .ex-card.unused .ex-badge { color: var(--text); background: rgba(13, 15, 18, .8); border: 1px solid var(--line); }
  .ex-card.unused img { opacity: .6; }
  .pin:focus-visible { outline: 2px solid var(--human); outline-offset: 2px; }
  .cpop {
    position: absolute; z-index: 3; width: 280px; padding: 9px 10px;
    background: rgba(13, 15, 18, .95); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .5); font-size: 12px;
  }
  .cpop[hidden] { display: none; }
  .cpop-meta { color: var(--dim); margin-bottom: 6px; }
  .cpop textarea {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 58px;
    padding: 5px 7px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 2px; font: 12px/1.45 inherit;
  }
  .cpop textarea:focus { outline: none; border-color: var(--human); }
  .cpop-actions { display: flex; gap: 6px; align-items: center; margin-top: 7px; }
  .viewport.placing, .viewport.placing svg { cursor: cell !important; }
  /* Area select: a light blue that is no class's and no source's colour. */
  .stage rect.marquee {
    stroke: #8ecbff; stroke-width: 1.5px; stroke-dasharray: 6 4; fill: rgba(142, 203, 255, .12);
  }
  .viewport.selecting, .viewport.selecting svg { cursor: crosshair !important; }
  #areaBtn.on { color: #0d1114; background: #8ecbff; border-color: #8ecbff; }

  .timer { font-family: var(--mono); font-size: 12px; color: var(--dim);
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .timer.idle { opacity: .45; }
  .viewport.boxes-hidden { cursor: default; }

  .badge.danger { color: #ff6b6b; }
  .badge.danger:disabled { color: var(--line); cursor: default; }
  .picker { background: var(--panel); color: inherit; border: 1px solid var(--line);
            border-radius: 4px; padding: 2px 4px; font: inherit; max-width: 22vw; }
  #runControls { display: inline-flex; align-items: center; gap: 8px; }

  /* ------------------------------------------------ navigation */
  a { color: inherit; }
  .wordmark { font-weight: 600; letter-spacing: .01em; }
  .crumbs { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; min-width: 0; }
  .crumbs a { color: var(--dim); text-decoration: none; }
  .crumbs a:hover { color: var(--text); }
  .crumbs .sep { color: var(--line); }
  .crumbs .here { font-family: var(--mono); font-size: 12px;
                  overflow: hidden; text-overflow: ellipsis; }
  .back {
    font-family: var(--mono); font-size: 12px; color: var(--dim);
    text-decoration: none; white-space: nowrap; padding: 3px 8px 3px 4px;
    border: 1px solid transparent; border-radius: 2px;
    max-width: 18vw; overflow: hidden; text-overflow: ellipsis;
  }
  .back:hover { color: var(--text); border-color: var(--line); }
  a:focus-visible, .tab:focus-visible, .field:focus-visible {
    outline: 2px solid var(--human); outline-offset: 2px;
  }

  /* ------------------------------------------------ project cards */
  .cards {
    display: grid; gap: 16px; padding: 20px;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  }
  .card {
    display: grid; text-decoration: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    overflow: hidden;
  }
  .card:hover { border-color: var(--dim); }
  .card.last { border-color: var(--cursor); }
  /* Three images from the set - first, middle, last - side by side. */
  .cover { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--line); }
  .cover-cell { aspect-ratio: 4 / 3; background: #0d0f12; overflow: hidden; }
  .cover-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { display: grid; gap: 9px; padding: 12px 14px 14px; }
  .card .title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .card h2 {
    margin: 0; font: 600 13px/1.3 var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .total { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums;
                 white-space: nowrap; }
  .tag {
    font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 2px; padding: 0 6px; white-space: nowrap;
  }
  .card.last .tag.last { color: var(--cursor); border-color: var(--cursor); }
  /* The meter: the grid's three states in one bar, same colours, same order. */
  .meter { display: flex; height: 6px; background: var(--todo); border-radius: 1px; overflow: hidden; }
  .meter .d { background: var(--done); }
  .meter .p { background: var(--started); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px;
           color: var(--dim); font-variant-numeric: tabular-nums; }
  .stats .d b { color: var(--done); font-weight: 500; }
  .stats .p b { color: var(--started); font-weight: 500; }
  .stats .t b { color: var(--text); font-weight: 500; }
  .stats b { font-weight: 500; }
  /* ------------------------------------------------ the grid's content filter */
  #filterBtn.on { color: #0d1114; background: #8ecbff; border-color: #8ecbff; }
  .filterpanel {
    position: fixed; z-index: 20; width: 360px; max-height: 70vh; overflow: auto; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .5); font-size: 12px;
  }
  .filterpanel[hidden] { display: none; }
  .fp-title { font-weight: 600; margin-bottom: 8px; }
  .fp-row { display: flex; align-items: center; gap: 7px; margin: 5px 0; }
  .fp-label { flex: 1; color: var(--text); }
  .fp-sep { color: var(--dim); }
  .fp-num { width: 58px; padding: 3px 6px; font: 12px var(--mono); }
  .fp-note { margin: 6px 0 8px; color: var(--dim); line-height: 1.4; }
  .fp-classhead { margin-top: 12px; }
  .fp-classes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .fp-class {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    color: var(--dim); font: 12px/1.5 var(--mono); cursor: pointer;
  }
  .fp-class i { width: 9px; height: 9px; border-radius: 2px; }
  .fp-class .fp-mark { width: 10px; text-align: center; font-weight: 700; }
  .fp-class.has { color: var(--text); border-color: #4bd6a4; }
  .fp-class.has .fp-mark { color: #4bd6a4; }
  .fp-class.not { color: var(--text); border-color: #ff6b6b; text-decoration: line-through; }
  .fp-class.not .fp-mark { color: #ff6b6b; }
  .fp-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px;
             padding-top: 10px; border-top: 1px solid var(--line); }
  .fp-count { color: #8ecbff; font-family: var(--mono); }
  /* A stage in the Workflow tab: number, colour, name, done, count - one line. */
  .keyrow.stagerow { grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; }
  .stagerow .chips { display: flex; flex-wrap: nowrap; justify-content: flex-start; align-items: center; gap: 12px; }
  .stagerow input[type="color"] {
    width: 34px; height: 24px; padding: 1px 2px; border: 1px solid var(--line); border-radius: 2px;
    background: var(--bg); cursor: pointer; flex: none;
  }
  .stagerow .classname { width: 210px; flex: none; }
  .stagerow .stylefield { flex: none; }
  .stagerow .classid { white-space: nowrap; }
  .runs { font-size: 12px; color: var(--dim); overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .runs code { font-family: var(--mono); font-size: 11px; color: var(--text); }

  /* ------------------------------------------------ image grid */
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    background: none; color: var(--dim); font: inherit; cursor: pointer;
    padding: 4px 10px; border: 1px solid transparent; border-radius: 2px;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel); border-color: var(--line); }
  .tab i { width: 8px; height: 8px; border-radius: 1px; background: var(--c); }
  .tab .n { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--dim); }
  .field {
    width: 220px; padding: 4px 8px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 2px; font: inherit;
  }
  .field:focus { outline: none; border-color: var(--human); }
  .sizer { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .sizer input { width: 90px; accent-color: var(--dim); }

  .grid {
    --cell: 190px;
    display: grid; gap: 10px; padding: 14px;
    grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr));
  }
  .tile {
    --c: var(--todo);
    display: block; text-decoration: none; position: relative;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    overflow: hidden;
  }
  /* --c, the stage's colour, is set on each tile. */
  .tile:hover { border-color: var(--dim); }
  .tile.last  { border-color: var(--cursor); box-shadow: 0 0 0 1px var(--cursor); }
  .thumb { position: relative; aspect-ratio: 4 / 3; background: #0d0f12; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.broken .thumb img { visibility: hidden; }
  .tile.broken .thumb::after {
    content: "no preview"; position: absolute; inset: 0;
    display: grid; place-items: center; color: var(--dim); font-size: 12px;
  }
  .tile .bar { height: 3px; background: var(--c); }
  .tile .cap {
    padding: 5px 8px 6px; font: 11px/1.4 var(--mono); color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile:hover .cap { color: var(--text); }
  .tile .idx, .tile .chip {
    position: absolute; top: 6px; font: 11px/1.5 var(--mono); padding: 0 6px;
    border-radius: 2px; background: rgba(13, 15, 18, .82); font-variant-numeric: tabular-nums;
  }
  .tile .idx  { left: 30px; color: var(--dim); }
  .tile .chip { right: 6px; color: var(--text); border: 1px solid var(--c); }
  .tile.done .chip { color: #0d1114; background: var(--c); }
  /* Selecting images: a box on each tile, a wash and a ring on the selected. */
  .tile .tsel {
    position: absolute; top: 6px; left: 6px; z-index: 1; width: 18px; height: 18px;
    border: 1.5px solid rgba(255, 255, 255, .75); border-radius: 3px;
    background: rgba(13, 15, 18, .55); cursor: pointer;
    opacity: .55; transition: opacity .12s;
  }
  .tile:hover .tsel, .tile.selected .tsel, .grid.selecting .tsel { opacity: 1; }
  .tile.selected .tsel { background: #8ecbff; border-color: #8ecbff; }
  .tile.selected .tsel::after {
    content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px;
    border: solid #0d1114; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .tile.selected { border-color: #8ecbff; box-shadow: 0 0 0 1px #8ecbff; }
  .tile.selected .thumb::before {
    content: ""; position: absolute; inset: 0; background: rgba(142, 203, 255, .14); pointer-events: none;
  }
  .gridsel { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; }
  .gridsel .selcount { color: #8ecbff; font: 12px var(--mono); min-width: 0; }
  .gridsel .picker:disabled { opacity: .45; }
  .stagechip span { white-space: nowrap; }
  .stagechip.has-notes span::after { content: " \270e"; color: var(--dim); }
  .notebtn.has { color: var(--text); border-color: var(--dim); }
  .notebtn.on { color: #0d1114; background: #8ecbff; border-color: #8ecbff; }
  .stagenotes { margin: 2px 0 12px 34px; }
  .stagenotes textarea {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 70px; padding: 7px 9px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 2px;
    font: 12px/1.5 inherit;
  }
  .stagenotes textarea:focus { outline: none; border-color: #8ecbff; }
  .empty { color: var(--dim); padding: 40px 20px; text-align: center; }
</style>
</head>
<body>

<!-- ============================================================ projects -->
<section class="view" id="projectsView" hidden>
  <header>
    <span class="wordmark">annotator</span>
    <span class="counter" id="rootPath"></span>
    <span class="spacer"></span>
    <span class="name status"></span>
  </header>
  <div class="toolbar">
    <input id="projSearch" class="field" type="search" placeholder="Filter projects by name"
           autocomplete="off" spellcheck="false" aria-label="Filter projects by name">
    <label class="sortctl">sort <select id="projSort" class="picker" aria-label="Sort projects by"></select></label>
    <button class="badge" id="projSortDir" type="button" aria-label="Sort direction"></button>
  </div>
  <div class="scroll">
    <div class="cards" id="projectCards"></div>
  </div>
</section>

<!-- ============================================================ one project -->
<section class="view" id="datasetView" hidden>
  <header>
    <nav class="crumbs">
      <a href="#/">Projects</a><span class="sep">/</span>
      <span class="here" id="dsTitle"></span>
    </nav>
    <span id="dsRunSlot"></span>
    <span class="spacer"></span>
    <span class="name status"></span>
    <button class="badge open-keys" type="button" title="mouse speeds and shortcuts (k)">settings</button>
  </header>
  <div class="toolbar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Images by stage"></div>
    <span class="gridsel">
      <button class="badge" id="selAllShown" type="button" title="Select every image shown: the name filter and the stage tab decide which (ctrl a)">select shown</button>
      <button class="badge" id="selNone" type="button" title="Deselect all images (esc)" disabled>deselect all</button>
      <span class="selcount" id="selCount" aria-live="polite"></span>
      <select id="bulkStage" class="picker" aria-label="Move the selected images to a stage" disabled></select>
    </span>
    <span class="spacer"></span>
    <label class="sortctl">sort <select id="sortSel" class="picker" aria-label="Sort images by"></select></label>
    <button class="badge" id="sortDir" type="button" aria-label="Sort direction"></button>
    <button class="badge" id="filterBtn" type="button" aria-haspopup="dialog" aria-expanded="false"
            title="Filter images by what is in them: boxes, classes, sam3 boxes, exemplars, comments">filter</button>
    <input id="search" class="field" type="search" placeholder="Filter by file name  ( / )"
           autocomplete="off" spellcheck="false" aria-label="Filter by file name">
    <label class="sizer">Size
      <input id="cellSize" type="range" min="110" max="360" step="10" value="190">
    </label>
  </div>
  <div class="scroll" id="gridScroll">
    <div class="grid" id="grid"></div>
    <p class="empty" id="gridEmpty" hidden></p>
  </div>
</section>

<!-- ============================================================ editor -->
<section class="view" id="editorView" hidden>
<header>
  <a class="back" id="back" href="#/" title="back to the image grid (g)">&lsaquo; <span id="backName"></span></a>
  <span id="edRunSlot">
    <span id="runControls">
      <select id="runSel" class="picker" title="run &mdash; drives predictions and exemplars"></select>
      <button class="badge danger" id="delRun"
              title="delete the selected run and everything in it">&#10005;</button>
    </span>
  </span>
  <span class="name status" id="name">&mdash;</span>
  <span class="counter" id="counter"></span>
  <span class="timer" id="timer"
        title="active time on this image: this visit / all visits. Pauses after a minute without input, or while the tab is hidden."></span>
  <span class="counter" id="boxcount"></span>
  <span class="predcount" id="predcount"></span>
  <button class="exemcount" id="exemcount" type="button" aria-haspopup="dialog" aria-expanded="false"
          title="Show the exemplars of this run, and which the last run used"></button>
  <span class="spacer"></span>
  <button class="badge" id="commentBtn" type="button" title="Comment: on the selected box, or draw a comment box; a click gives a point (c)">comment</button>
  <button class="badge" id="areaBtn" type="button" aria-pressed="false" title="Select the boxes inside a rectangle you drag (v)">select area</button>
  <button class="classchip" id="classChip" type="button" aria-haspopup="menu" aria-expanded="false"><i id="classSwatch"></i><span id="classChipName"></span></button>
  <button class="badge" id="mode"
          title="e &mdash; draw annotations, or pick exemplars for the SAM3 prompt">annotating</button>
  <span class="thresh">
    <label for="thresh">conf &ge;</label>
    <input id="thresh" type="text" inputmode="decimal" value="0.20" size="5">
    <button class="badge" id="applyThresh">apply</button>
    <button class="badge approve" id="approve"
            title="copy every shown sam3 box into your annotations">approve</button>
  </span>
  <button class="classchip flagchip" id="flagChip" type="button" aria-haspopup="menu" aria-expanded="false"><span id="flagChipName">no flags</span></button>
  <button class="classchip stagechip" id="stageChip" type="button" aria-haspopup="menu" aria-expanded="false"><i id="stageSwatch"></i><span id="stageChipName"></span></button>
  <button class="badge open-keys" type="button" title="mouse speeds and shortcuts (k)">settings</button>
</header>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <img id="photo" alt="">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <svg class="pointer-layer" id="pointerLayer" aria-hidden="true">
    <line id="chV" visibility="hidden"></line>
    <line id="chH" visibility="hidden"></line>
    <line id="curV" visibility="hidden"></line>
    <line id="curH" visibility="hidden"></line>
  </svg>
  <div class="scanbar" id="scanBar" hidden>
    <div class="scanpill" id="scanPill" role="status"><i></i><span id="scanText"></span></div>
    <label class="scanedge" title="How long the scan holds the image's first view before it moves, and its last view before it ends">
      hold <input id="scanEdge" type="number" min="0" max="10" step="0.5" aria-label="Seconds to hold the first and last view"> s
    </label>
  </div>
  <div class="scanlevel" id="scanLevel" hidden aria-hidden="true"><span class="bars" id="scanLevelBars"></span><span id="scanLevelName"></span></div>
  <div class="minimap" id="minimap" hidden>
    <canvas id="mmCanvas" aria-label="Minimap: press or drag to move the view"></canvas>
    <div class="mm-foot"><span id="mmZoom"></span><span id="mmNote"></span></div>
    <span class="mm-grip" id="mmGrip" title="Drag to move the minimap"></span>
  </div>
  <div class="pins" id="pins"></div>
  <div class="cpop" id="cpop" hidden role="dialog" aria-label="Comment">
    <div class="cpop-meta" id="cpopMeta"></div>
    <textarea id="cpopText" rows="3" maxlength="4000" placeholder="What is there to say about this spot?"></textarea>
    <div class="cpop-actions">
      <button class="badge" id="cpopSave" type="button">save</button>
      <button class="badge" id="cpopResolve" type="button">resolve</button>
      <button class="badge danger" id="cpopDelete" type="button">delete</button>
      <span class="dialog-spacer"></span>
      <button class="badge" id="cpopClose" type="button">close</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="hint" id="hint">
    <div class="help-keys" id="helpKeys"></div>
    <div class="mouse" id="helpMouse"></div>
    <div class="legend" id="helpLegend"></div>
  </div>
</div>

<div class="strip" id="strip" aria-label="The next images: drag to look ahead, click to open">
  <div class="strip-track" id="stripTrack"></div>
</div>
</section>

<div class="classmenu" id="classMenu" role="menu" hidden></div>
<div class="classmenu" id="stageMenu" role="menu" hidden></div>
<div class="classmenu" id="flagMenu" role="menu" hidden></div>
<div class="filterpanel exempanel" id="exemPanel" role="dialog" aria-label="The run's exemplars" hidden></div>
<div class="filterpanel" id="filterPanel" role="dialog" aria-label="Filter images by content" hidden></div>

<dialog class="keys" id="keysDialog" aria-labelledby="keysTitle">
  <div class="keys-head">
    <h2 id="keysTitle">Settings</h2>
    <div class="tabs" id="setTabs" role="tablist" aria-label="Settings sections">
      <button class="tab" role="tab" type="button" data-tab="appearance">Appearance</button>
      <button class="tab" role="tab" type="button" data-tab="input">Mouse and keys</button>
      <button class="tab" role="tab" type="button" data-tab="workflow">Workflow</button>
    </div>
    <input id="keysFilter" class="field" type="search" autocomplete="off" spellcheck="false"
           placeholder="Filter settings and shortcuts" aria-label="Filter settings and shortcuts">
    <button class="badge" id="keysClose" type="button">done</button>
  </div>
  <div class="keys-body" id="keysList"></div>
  <div class="keys-foot">
    <span class="keys-status" id="keysStatus" role="status" aria-live="polite"></span>
    <span class="dialog-spacer"></span>
    <span id="keysChanged"></span>
    <button class="badge" id="keysResetAll" type="button">reset all</button>
  </div>
</dialog>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";

/** Every request below is made relative to the directory this page was served
    from. Served straight off the node that is "/", so nothing changes; served
    behind the Open OnDemand proxy it is "/node/<host>/<port>/", where an
    absolute "/api/..." would resolve against the dashboard root and 404.
    Derived from location rather than hardcoded, so one file works in both. */
const BASE = window.location.pathname.replace(/[^/]*$/, "");

const HANDLE_PX = 9;       // screen px: corner grab radius, and handle size
const MIN_BOX = 3;         // image px: a drag that ends smaller than this reverts
const ACCEPTED_IOU = 0.5;  // prediction vs. existing sam3_* annotation: see load()
const EXEMPLAR_IOU = 0.9;  // exemplar vs. the annotation it created: near-identical only

// Must match WRITABLE_PROVENANCE in annotator.py. The server rejects the PUT
// outright if anything else turns up, so these are not decorative.
const PROV_HUMAN = "human";
const PROV_SAM3_ASIS = "sam3_asis";
const PROV_SAM3_ADJUSTED = "sam3_adjusted";

/** `project` decides where annotations and flags are read
    and written; `run` decides which predictions and which exemplar manifest
    are shown. They ride on every request rather than living on the server, so
    two tabs can sit on two different datasets at once. */
let project = null;
let run = null;
let projects = [];        // [{name, runs: [{name, modified, predictions}], images}]
let defaultProject = "";  // paths.dataset from the YAML

/** localStorage keys.

    Prefixed because Open OnDemand proxies every app through one origin, so an
    unprefixed "project" key shares a namespace with the dashboard and with
    anything else ever run on a node.

    One key per project rather than one blob: two tabs on two datasets write
    independently, where a blob would need read-modify-write and would lose the
    other tab's choice. */
const K_PROJECT = "al.project";
const K_RUN = (p) => "al.run." + p;

/** Sentinel for the "+ New run" entry. Contains a NUL, which _safe_name on the
    server rejects, so it can never collide with a real run name. */
const NEW_RUN = "\u0000new";

/** Append the current selection to a path. Every api call goes through this. */
const q = (path, extra) => {
  const u = new URLSearchParams();
  if (project) u.set("project", project);
  if (run) u.set("run", run);
  for (const k in (extra || {})) u.set(k, extra[k]);
  return BASE + path + "?" + u.toString();
};

let images = [];        // [{name, boxes, stage}]
let idx = 0;
let boxes = [];         // human-owned, editable, PUT back to ANNOTATION_DIR
let preds = [];         // sam3, read only; edits here live until you approve
let threshold = 0.20;   // applied to preds only; a view filter, not a rerun
let natW = 0, natH = 0;
let exems = [];         // this image's picked exemplars, mirrored from the manifest
let exemSet = null;     // {name, count} for the whole set, kept in step locally
let mode = "annotate";  // or "exemplar": what a freshly drawn box becomes
let sel = null;         // {kind: "box" | "pred" | "exem", i} or null
let dirty = false;
let saveTimer = null;

const el = {
  name: document.getElementById("name"),
  counter: document.getElementById("counter"),
  boxcount: document.getElementById("boxcount"),
  predcount: document.getElementById("predcount"),
  thresh: document.getElementById("thresh"),
  applyThresh: document.getElementById("applyThresh"),
  exemcount: document.getElementById("exemcount"),
  exemPanel: document.getElementById("exemPanel"),
  mode: document.getElementById("mode"),
  approve: document.getElementById("approve"),
  viewport: document.getElementById("viewport"),
  stage: document.getElementById("stage"),
  photo: document.getElementById("photo"),
  svg: document.getElementById("svg"),
  runSel: document.getElementById("runSel"),
  delRun: document.getElementById("delRun"),
  runControls: document.getElementById("runControls"),
  projectsView: document.getElementById("projectsView"),
  datasetView: document.getElementById("datasetView"),
  editorView: document.getElementById("editorView"),
  projectCards: document.getElementById("projectCards"),
  rootPath: document.getElementById("rootPath"),
  dsTitle: document.getElementById("dsTitle"),
  dsRunSlot: document.getElementById("dsRunSlot"),
  edRunSlot: document.getElementById("edRunSlot"),
  back: document.getElementById("back"),
  backName: document.getElementById("backName"),
  tabs: document.getElementById("tabs"),
  search: document.getElementById("search"),
  cellSize: document.getElementById("cellSize"),
  grid: document.getElementById("grid"),
  gridScroll: document.getElementById("gridScroll"),
  gridEmpty: document.getElementById("gridEmpty"),
  timer: document.getElementById("timer"),
  toast: document.getElementById("toast"),
  hint: document.getElementById("hint"),
  helpKeys: document.getElementById("helpKeys"),
  helpMouse: document.getElementById("helpMouse"),
  keysDialog: document.getElementById("keysDialog"),
  keysFilter: document.getElementById("keysFilter"),
  keysList: document.getElementById("keysList"),
  keysStatus: document.getElementById("keysStatus"),
  keysChanged: document.getElementById("keysChanged"),
  keysResetAll: document.getElementById("keysResetAll"),
  keysClose: document.getElementById("keysClose"),
  setTabs: document.getElementById("setTabs"),
  helpLegend: document.getElementById("helpLegend"),
  chV: document.getElementById("chV"),
  chH: document.getElementById("chH"),
  curV: document.getElementById("curV"),
  curH: document.getElementById("curH"),
  minimap: document.getElementById("minimap"),
  mmCanvas: document.getElementById("mmCanvas"),
  mmGrip: document.getElementById("mmGrip"),
  mmZoom: document.getElementById("mmZoom"),
  mmNote: document.getElementById("mmNote"),
  mmFoot: document.querySelector("#minimap .mm-foot"),
  scanPill: document.getElementById("scanPill"),

  stageChip: document.getElementById("stageChip"),
  flagChip: document.getElementById("flagChip"),
  flagChipName: document.getElementById("flagChipName"),
  flagMenu: document.getElementById("flagMenu"),
  commentBtn: document.getElementById("commentBtn"),
  stageSwatch: document.getElementById("stageSwatch"),
  stageChipName: document.getElementById("stageChipName"),
  stageMenu: document.getElementById("stageMenu"),
  selAllShown: document.getElementById("selAllShown"),

  sortSel: document.getElementById("sortSel"),

  projSearch: document.getElementById("projSearch"),
  projSort: document.getElementById("projSort"),
  projSortDir: document.getElementById("projSortDir"),
  filterPanel: document.getElementById("filterPanel"),
  selNone: document.getElementById("selNone"),
  selCount: document.getElementById("selCount"),
  bulkStage: document.getElementById("bulkStage"),
  areaBtn: document.getElementById("areaBtn"),
  classSwatch: document.getElementById("classSwatch"),
  classChipName: document.getElementById("classChipName"),

  pins: document.getElementById("pins"),

  cpopDelete: document.getElementById("cpopDelete"),
  cpopClose: document.getElementById("cpopClose"),
  scanBar: document.getElementById("scanBar"),
  scanEdge: document.getElementById("scanEdge"),
  scanLevel: document.getElementById("scanLevel"),
