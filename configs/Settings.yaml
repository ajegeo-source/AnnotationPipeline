# SAM 3 pasted-exemplar-tile run.
#
# Paths are no longer per-dataset. `root` is the folder every project lives
# under; `dataset` is the one project the SAM 3 script targets on its next run.
# Everything else is derived - see the layout diagram in ConfigSam3.py.
#
# The annotator reads `dataset` only as the entry preselected in its dropdown.
# It can open any project under root, so pointing this at TillerCounter does
# not stop you labelling another dataset.
#
# Anything in this file changes what lands on disk, so the resolved contents are
# copied into run_manifest.json next to the outputs.
#
# Runs made in the annotator keep their own copy of the run sections (run,
# exemplars, strip, inference, dataset, predictions, debug) in
# <project>/runs/<run>/settings.yaml, edited in the run's window there; this
# file is where those start from. Launching from the annotator writes the
# complete config to <run>/config.yaml and starts the SAM 3 script with it.
paths:
  root: $HOME/Datasets/ActiveLearningTestDatasets
  dataset: Project3          # SAM 3's target; must be a folder under root
annotator:
  host: 0.0.0.0
  port: 8000
  require_token: true         # every request needs the token in the link printed
                              # at start-up; the OOD login covers the proxy, not
                              # the node's port. Off only on a machine of your own.
launcher:
  mode: local                 # local: in the annotator's own session (your salloc
                              #   session on the GPU node), at once; the run ends
                              #   when the session does.
                              # slurm: a batch job of its own (below), queued; it
                              #   keeps going without the annotator or the session.
  command: null               # null: the annotator's Python, -m weedloop.predictor.predict
  slurm:
    partition: gpu
    gres: "gpu:1"
    cpus: 4
    mem: 32G
    time: "04:00:00"
    account: null
    extra: []                 # more #SBATCH options, e.g. ["--qos=normal"]
    setup:                    # runs first in the job: what `agrosoft load` and
                              # your session do, which a batch job lacks
      # - source <the Lmod init script under /agrosoft/spack/2026.1/...>
      # - module use <the stack's Core folder (zen3-cuda-eth-ubuntu24)>
      - module load python/3.12.12 cuda/12.9.1
      - source $HOME/envs/SamSeg/bin/activate
      - export HF_HUB_OFFLINE=1     # compute nodes have no internet
run:
  name: BirdTester     # the run subdirectory under <project>/runs/
  overwrite: true
exemplars:
  source: manifest              # "random_gt" needs a gt/ folder in the project
  n: 12
  seed: 0
  pad: 0.25
  tile_max_edge: 1024        # cap a tile's long edge (px)
strip:
  side: auto                  # auto (long edge) | right | bottom
  margin: 8                   # px between tiles
  fill: [114, 114, 114]       # neutral grey for unused strip area
inference:
  prompt_mode: strip          # how every class is prompted:
                              #   strip:    exemplars cut out and pasted beside the
                              #             image - the same ones for every image
                              #   in_image: the exemplars that lie on the image
                              #             itself, where they are (SAM 3's own way);
                              #             an image without any gets the text alone,
                              #             or is skipped for a class with no text
                              #   text:     the text prompt alone, no exemplars
  text_prompt: "crow"           # e.g. "rumex" to combine text + exemplars
  class_name: Rumex            # every prediction is written as this class; one
                              # word, and a class on the project's list in the
                              # annotator, so approving a prediction keeps it.
                              # A manifest run uses only exemplars of this class.
  # Several classes in one run instead of class_name - each prompted on its
  # own (its exemplars, its text), all written to the same predictions:
  # classes:
  #   - {name: rumex, text_prompt: rumex}
  #   - {name: taraxacum, text_prompt: dandelion, n: 8}   # n: its own exemplar count
  conf_threshold: 0.05         # written to disk; the UI filters higher, not this
  max_edge: 2048              # cap the TARGET's long edge before compositing
  fast_prompt_append: true
dataset:
  num_images: null            # null = every image; int = random subset
  image_seed: 0
  image_exts: [".jpg", ".jpeg", ".png", ".tif", ".tiff", ".bmp"]
  gt_class: null              # which class of the gt/ labels to sample from
                              # (random_gt) and draw; 0, "0.0" and names all
                              # work. null = every class
predictions:
  provenance: sam3
  quality: unverified
  save_masks: true            # each prediction's mask, for the annotator to show
                              # (b: boxes, masks or both); <stem>.masks.json
debug:
  save_overlays: 50
  save_composites: 5
  mask_color: [255, 45, 45]
  mask_alpha: 0.45
  mask_edge_alpha: 0.95
  draw_pred_boxes: true
  draw_gt_boxes: false